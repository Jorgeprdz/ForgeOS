<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06101f">
  <meta name="robots" content="noindex">
  <title>ForgeOS</title>
  <meta http-equiv="refresh" content="0; url=./static-preview/forge-alive/?nav=inicio">
  <script>
    /* FORGE_LEGACY_UI_RETIRED: root entry */
    (() => {
      const retireBrowserState = async () => {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(
            registrations
              .filter((registration) => new URL(registration.scope).pathname.startsWith('/ForgeOS/'))
              .map((registration) => registration.unregister()),
          );
        }
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(
            names
              .filter((name) => name === 'static-v7-pages-1' || name === 'runtime-v7-pages-1')
              .map((name) => caches.delete(name)),
          );
        }
      };

      const target = new URL('./static-preview/forge-alive/', window.location.href);
      const requestedNav = new URLSearchParams(window.location.search).get('nav');
      target.searchParams.set('nav', requestedNav || 'inicio');
      target.searchParams.set('v', 'legacy-retired-20260731');

      retireBrowserState().finally(() => window.location.replace(target.href));
    })();
  </script>
</head>
<body>
  <p>Abriendo ForgeOS…</p>
  <p><a href="./static-preview/forge-alive/?nav=inicio&v=legacy-retired-20260731">Continuar</a></p>
</body>
</html>
