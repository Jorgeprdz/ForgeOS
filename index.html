<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5fb">
  <meta name="robots" content="noindex">
  <meta name="forge-ui-surface" content="aura-canonical">
  <title>ForgeOS</title>
  <meta http-equiv="refresh" content="0; url=./static-preview/forge-aura/?route=inicio">
  <script>
    /* FORGE_BETA2_AURA_CANONICAL_CUTOVER_010H */
    (() => {
      const retireBrowserState = async () => {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(
            registrations
              .filter((registration) => new URL(registration.scope).pathname.startsWith('/ForgeOS/'))
              .map((registration) => registration.unregister()),
          );
        }
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(
            names
              .filter((name) => name === 'static-v7-pages-1' || name === 'runtime-v7-pages-1')
              .map((name) => caches.delete(name)),
          );
        }
      };

      const current = new URL(window.location.href);
      const target = new URL('./static-preview/forge-aura/', current);
      for (const [key, value] of current.searchParams) {
        target.searchParams.append(key, value);
      }
      if (!target.searchParams.has('route') && !target.searchParams.has('nav')) {
        target.searchParams.set('route', 'inicio');
      }
      target.searchParams.set('v', 'beta2-aura-cutover-010h');
      target.hash = current.hash;

      retireBrowserState().finally(() => window.location.replace(target.href));
    })();
  </script>
</head>
<body>
  <p>Abriendo Forge Aura…</p>
  <p><a href="./static-preview/forge-aura/?route=inicio&v=beta2-aura-cutover-010h">Continuar</a></p>
</body>
</html>
