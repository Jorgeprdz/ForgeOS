<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >
  <title>FES 06C Productive UI Binding Acceptance</title>
  <style>
    :root {
      --text-secondary: #64748b;
      color-scheme: light dark;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background:
        linear-gradient(
          160deg,
          #0f172a,
          #111827
        );
      color: #f8fafc;
    }

    .phone-shell {
      width: min(100%, 1180px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 20px;
    }

    .assistant-card,
    .primary-card,
    .pipeline-outlet {
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.64);
      padding: 18px;
    }

    .primary-card {
      margin-top: 14px;
    }

    .pipeline-outlet {
      margin-top: 18px;
    }

    dialog {
      width: min(680px, calc(100vw - 32px));
      border: 0;
      border-radius: 22px;
      padding: 0;
    }

    dialog article {
      padding: 18px;
    }

    @media (max-width: 640px) {
      .phone-shell {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="phone-shell">
    <section class="assistant-card">
      <strong>Inicio productivo</strong>
    </section>

    <section class="primary-card">
      <strong>Acción principal</strong>
    </section>

    <section
      class="pipeline-outlet"
      data-fes06c-pipeline-outlet
    >
      <h1>Pipeline de ventas</h1>

      <dialog
        open
        data-prospect-detail-dialog
        data-prospect-id="prospect-001"
      >
        <article>
          <header>
            <strong>Detalle del prospecto</strong>
          </header>
        </article>
      </dialog>
    </section>
  </main>

  <script type="module">
    import "/advisor-os/event-evidence/productive-ui-projection-binding.js";

    const binding =
      globalThis
        .ForgeProductiveUIProjectionBindingFES06B
        .create({
          root: document,
          initialSnapshot:
            globalThis
              .__FES06C_INITIAL_SNAPSHOT__ ??
            null,
        });

    binding.mountHome(
      document.querySelector(
        ".phone-shell",
      ),
    );

    binding.mountPipeline(
      document.querySelector(
        "[data-fes06c-pipeline-outlet]",
      ),
    );

    globalThis.__FES06C_BINDING__ =
      binding;
  </script>
</body>
</html>
