<!doctype html>
<html lang="es-MX">
<head>

  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Roboto, system-ui, sans-serif;
      background: #eef2f6;
      color: #17212b;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      background:
        radial-gradient(circle at top right, rgba(36, 145, 132, .14), transparent 34rem),

    }
    main {
      width: min(980px, 100%);
      margin: 0 auto;
    }
    section[data-harness-quote-surface] {
      padding: 1rem;
      border-radius: 1.5rem;
      background: white;

    h1 { margin: 0 0 1rem; }
    h2 { margin: 0 0 .4rem; }
    p { line-height: 1.5; }
    .harness-existing-button {
      min-height: 3rem;
      padding: 0 .95rem;
      border: 0;
      border-radius: 999px;
      background: #176f65;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }
    .harness-nav-pill {
      position: fixed;
      z-index: 500;
      left: 50%;
      bottom: max(.75rem, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(340px, calc(100vw - 2rem));
      height: 4.5rem;
      border-radius: 999px;
      background: rgba(19, 31, 42, .94);
      box-shadow: 0 12px 38px rgba(0, 0, 0, .3);

  <div class="harness-nav-pill" aria-hidden="true"></div>
  <script type="module" src="./harness.js"></script>
