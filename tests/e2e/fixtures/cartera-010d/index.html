<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CARTERA 010D Browser Acceptance</title>
  <style>
    :root {
      --text-secondary: #5f6368;
      --surface-variant: rgba(20, 25, 35, 0.08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; font-family: system-ui, sans-serif; background: #f4f5f7; color: #16181d; }
    .glass-widget { background: #fff; border: 1px solid rgba(20,25,35,.12); border-radius: 18px; }
    .glass-input, .glass-button { font: inherit; border: 1px solid rgba(20,25,35,.18); border-radius: 12px; padding: 10px 12px; background: #fff; color: inherit; }
    .glass-button { cursor: pointer; font-weight: 750; }
    #fixture-status { position: fixed; top: 4px; right: 6px; font: 10px monospace; opacity: .4; }
    @media (max-width: 600px) { body { padding: 12px; } }
  </style>
</head>

  <div id="fixture-status">booting</div>
  <main id="fixture-root"></main>
