<body>
  <main id="fixture-main" class="aura-cartera" data-fixture-state="loading"></main>

    import {
      applyCarteraDirectoryPresentation016,
      applyCarteraPersonWorkspacePresentation016,
    } from '/docs/static-preview/forge-aura/cartera/cartera-module-v6.js';

    const root = document.querySelector('#fixture-main');
    const projection = Object.freeze({
      relationshipLabel: 'Cliente',
      contacts: {
        sourceState: 'AVAILABLE',
        phone: { value: '+525500001616', state: 'AVAILABLE', source: 'PIPELINE_PROSPECT', consentStatus: 'NOT_ASSERTED' },

        {
          policy_reference: 'policy:synthetic:projection-016',

          status_value: 'ACTIVE',

      policyProjection: { sourceState: 'AVAILABLE', count: 1 },

    function renderDirectory() {
      root.innerHTML = `

          <div class="cartera-directory-list" role="list">
            <button type="button" class="cartera-directory-row" role="listitem" data-directory-reference="person:synthetic:projection-016" data-directory-kind="PERSON">
              <span class="cartera-directory-icon" aria-hidden="true">P</span>
              <span><strong>Alex Ejemplo</strong><small>Cliente</small></span>
              <span class="cartera-kind">PERSON</span>

            <button type="button" class="cartera-directory-row" role="listitem" data-directory-reference="policy:synthetic:projection-016" data-directory-kind="POLICY">

              <span class="cartera-kind">POLICY</span>
            </button>
          </div>
        </section>`;
      applyCarteraDirectoryPresentation016(root);
      root.querySelector('[data-directory-kind="PERSON"]').addEventListener('click', renderPerson);
      root.dataset.fixtureState = 'directory-ready';
    }

    function renderPerson() {
      root.innerHTML = `

          </section>
          <div class="cartera-tabs" role="tablist">
            <button role="tab" aria-selected="true">Resumen</button><button role="tab">Pólizas</button><button role="tab">Relación</button><button role="tab">Historial</button>

          <section class="cartera-section"><h2>Pólizas relacionadas</h2><button type="button" class="cartera-directory-row" data-open-policy="policy:synthetic:projection-016"><span class="cartera-directory-icon">PÓL</span><span><strong>••••••6169</strong><small>product:imagina-ser-65-15-pagos-udi · Activa</small></span></button></section>

        </div>`;
      const workspace = root.querySelector('.cartera-workspace');
      applyCarteraPersonWorkspacePresentation016(workspace, projection);
      root.querySelector('[data-back]').addEventListener('click', renderDirectory);
      root.dataset.fixtureState = 'person-ready';
    }

    renderDirectory();
    window.__CARTERA_PERSON_016_FIXTURE__ = { renderDirectory, renderPerson, projection };

</body>
</html>
