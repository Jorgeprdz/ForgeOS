<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>017C Aura decision acceptance</title><style>body{margin:0;background:#f6f8fb;font-family:Arial,sans-serif}#home{max-width:1180px;margin:auto;padding:20px}</style></head><body><main id="home"></main><output id="result" hidden></output><script>const originalWarn=console.warn;console.warn=(...args)=>{document.body.dataset.warning=args.map(String).join(" ");originalWarn(...args)};addEventListener("error",event=>{document.querySelector("#result").textContent=JSON.stringify({pass:false,error:event.error?.stack||event.message,warning:document.body.dataset.warning});document.documentElement.dataset.acceptance="fail"});addEventListener("unhandledrejection",event=>{document.querySelector("#result").textContent=JSON.stringify({pass:false,error:event.reason?.stack||String(event.reason),warning:document.body.dataset.warning});document.documentElement.dataset.acceptance="fail"});</script><script type="module">
for(const href of ["../../_site/static-preview/forge-aura/aura-tokens.css","../../_site/static-preview/forge-aura/aura-shell.css"]){const link=document.createElement("link");link.rel="stylesheet";link.href=href;document.head.append(link)}
const advisorId="advisor-017c"; const remote={sequence:0,records:new Map(),calls:[],fail:false};
const clone=v=>JSON.parse(JSON.stringify(v));
function receipt(m,s,q){return {receipt_version:"forge.activity_ledger_receipt.v1",status:s,tenant_id:m.tenant_id,event_id:m.event_id,mutation_id:m.mutation_id,server_sequence:q,server_recorded_at:new Date().toISOString(),cursor:String(q)}}
const client={auth:{getUser:async()=>({data:{user:{id:advisorId,email:"advisor@forge.invalid"}},error:null})},async rpc(name,args){remote.calls.push({name,args:clone(args)}); if(remote.fail)return {data:null,error:{code:"NETWORK",message:"offline"}}; if(name==="forge_fes02_append_activity_event"){const m=args.p_mutation;const existing=remote.records.get(m.event_id);if(existing)return {data:{status:"IDEMPOTENT_REPLAY",receipt:receipt(m,"IDEMPOTENT_REPLAY",existing.sequence)},error:null};remote.sequence++;remote.records.set(m.event_id,{record:clone(m.ledger_record),mutation:clone(m),sequence:remote.sequence});return {data:{status:"ACKNOWLEDGED",receipt:receipt(m,"ACKNOWLEDGED",remote.sequence)},error:null}} if(name==="forge_fes02_pull_activity_events"){const cursor=Number(args.p_cursor||0);const values=[...remote.records.values()].filter(x=>x.sequence>cursor);return {data:{changes:values.map(x=>({ledger_record:clone(x.record),receipt:receipt(x.mutation,"ACKNOWLEDGED",x.sequence)})),cursor:String(values.length?values.at(-1).sequence:cursor||remote.sequence||0),has_more:false},error:null}} return {data:null,error:{code:"RPC_UNKNOWN"}}}};
const attention=(id,title)=>({decisionReference:id,humanDecisionRequired:true,title,whyNow:"Existe evidencia reciente que merece tu revisión.",reason:"Forge presenta la evidencia; tú decides.",truthState:"READY",sourceAuthority:"NBA_REASON_WHY",sourceDomain:"COMMERCIAL",subject:{type:"ADVISOR",reference:advisorId},confidence:{value:"HIGH"},limitations:[],asOf:new Date().toISOString(),recommendedHumanAction:{label:"Revisar detalle"},provenance:{decisionProjectionContract:"FCDP-004-001"},state:"READY"});
const items=[attention("rec-primary","Retomar esta oportunidad hoy"),attention("rec-support","Revisar el siguiente compromiso")];
const snapshot={advisorId,generatedAt:new Date().toISOString(),attention:{state:"READY",value:{state:"READY",contractVersion:"FHAO-007-001",items}},priority:{state:"READY",value:{visible:[],inventory:[]}},agenda:{state:"EMPTY",value:{sections:[]}},radar:{state:"READY",value:{focusItems:[]}},mick:{state:"BLOCKED_BY_MISSING_EVIDENCE",value:null}};
const adapter={load:async()=>snapshot,scrub(){},destroy(){}};
const {createHomeModule}=await import("../../_site/static-preview/forge-aura/home/home-module.js?v=017c-browser");
const home=createHomeModule({root:document.querySelector("#home"),client,user:{id:advisorId,email:"advisor@forge.invalid",user_metadata:{full_name:"Asesor Prueba"}},homeAdapterFactory:async()=>adapter,globalState:(m,t)=>{document.body.dataset.notice=m||"";document.body.dataset.noticeType=t||""}}); await home.mount();
window.__FORGE_017C_ACCEPTANCE__={home,remote};
async function waitFor(fn){for(let i=0;i<100;i++){const v=fn();if(v)return v;await new Promise(r=>setTimeout(r,30))}throw new Error("WAIT_TIMEOUT")}
async function choose(intent,expected){const b=await waitFor(()=>document.querySelector(`[data-decision-reference="rec-primary"] [data-home-decision="${intent}"]`));b.click();await waitFor(()=>document.querySelector(`[data-decision-reference="rec-primary"] [data-current-decision="${expected}"]`));}
const mode=new URL(location.href).searchParams;
if(mode.has("inspect")){const current=await waitFor(()=>document.querySelector('[data-decision-reference="rec-primary"] [data-home-decision-control]')?.dataset.currentDecision);document.querySelector("#result").textContent=JSON.stringify({pass:current==="DISMISSED",decision:current,mode:"refresh-inspect",overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth});document.documentElement.dataset.acceptance=current==="DISMISSED"?"pass":"fail";}else if(mode.has("failure")){remote.fail=true;const before=document.querySelector('[data-decision-reference="rec-primary"] [data-home-decision-control]').dataset.currentDecision;document.querySelector('[data-decision-reference="rec-primary"] [data-home-decision="ACCEPT"]').click();const message=await waitFor(()=>document.querySelector('[data-decision-reference="rec-primary"] [data-home-decision-status]').textContent.includes("No pudimos")?document.querySelector('[data-decision-reference="rec-primary"] [data-home-decision-status]').textContent:null);const after=document.querySelector('[data-decision-reference="rec-primary"] [data-home-decision-control]').dataset.currentDecision;document.querySelector("#result").textContent=JSON.stringify({pass:before===after&&message.includes("No pudimos"),before,after,message});document.documentElement.dataset.acceptance=before===after?"pass":"fail";}else{
await choose("ACCEPT","ACCEPTED");await choose("MODIFY","MODIFIED");await choose("DEFER","DEFERRED");await choose("DISMISS","DISMISSED");
const before=remote.records.size;const b=document.querySelector('[data-decision-reference="rec-primary"] [data-home-decision="DISMISS"]');b.click();b.click();await new Promise(r=>setTimeout(r,150));
await home.unmount();await home.mount();const returned=await waitFor(()=>document.querySelector('[data-decision-reference="rec-primary"] [data-home-decision-control]')?.dataset.currentDecision);
const latest=[...remote.records.values()].map(x=>x.record.canonical_event).sort((a,b)=>a.recorded_at.localeCompare(b.recorded_at)).at(-1);
const actionFieldsAbsent=!Object.hasOwn(latest.payload,"activity_executed")&&!Object.hasOwn(latest.payload,"outcome_created");document.querySelector("#result").textContent=JSON.stringify({pass:latest.payload.decision==="DISMISSED"&&remote.records.size===before&&returned==="DISMISSED"&&actionFieldsAbsent,decision:latest.payload.decision,acted:false,outcome:false,actionFieldsAbsent,records:remote.records.size,rpcCalls:remote.calls.length,advisor:latest.tenant_id,moduleReturn:returned,controls:document.querySelectorAll('[data-home-decision-control]').length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth});document.documentElement.dataset.acceptance="pass";}
</script></body></html>
