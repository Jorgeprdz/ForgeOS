  body {
    margin: 0;
    padding: 28px;
    background: #06101f;
    color: #f5f2ff;
    font-family: system-ui, sans-serif;
  }
  h1, h2 { letter-spacing: -.03em; }
  section { margin: 28px 0 48px; }
  .grid {
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
    align-items: start;
  }
  figure {
    margin: 0;
    padding: 12px;
    border: 1px solid #2c3f60;
    border-radius: 24px;
    background: #0d1b31;
  }
  img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 15px;
  }
  figcaption {
    padding: 10px 4px 2px;
    color: #aeb8d0;
  }
  .pass { color: #52e6df; }
  .fail { color: #ff9b7a; }
</style>
</head>
