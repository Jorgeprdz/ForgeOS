name: REP Pipeline Report Provider CI

on:
  push:
    branches:
      - feature/universal-reporting-kernel-foundation
    paths:
      - advisor-os/pipeline/domain/pipeline-transition-read-model.mjs
      - advisor-os/pipeline/reporting/pipeline-report-provider.mjs
      - tests/pipeline-report-provider-test.mjs
      - docs/architecture/reporting/REP-10_PIPELINE_REPORT_PROVIDER.md
      - .github/workflows/pipeline-report-provider-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline-provider:
    name: Pipeline report provider acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify REP-09 closure
        run: |
          grep -Fq             'REP_09_ACTIVITY_REPORT_PROVIDER=CLOSED'             docs/architecture/reporting/REP-09_ACTIVITY_REPORT_PROVIDER_CLOSURE.md

      - name: Verify Activity foundation
        run: node scripts/ci/verify-activity-foundation-freeze.mjs

      - name: Run Pipeline provider tests
        run: |
          node --test             --test-reporter=tap             tests/pipeline-report-provider-test.mjs             | tee REP10_PIPELINE.tap

          grep -Fq '# tests 57' REP10_PIPELINE.tap
          grep -Fq '# pass 57' REP10_PIPELINE.tap
          grep -Fq '# fail 0' REP10_PIPELINE.tap

      - name: Run Pipeline transition regression
        run: node --test tests/pipeline-to-activity-projector-test.mjs

      - name: Run domain provider regressions
        run: |
          node --test tests/activity-report-provider-test.mjs
          node --test tests/portfolio-report-provider-test.mjs
          node --test tests/commissions-report-provider-test.mjs
          node --test tests/performance-report-provider-test.mjs

      - name: Run reporting regressions
        run: |
          node --test tests/report-comparison-engine-test.mjs
          node --test tests/universal-report-aggregation-runtime-test.mjs
          node --test tests/report-provider-runtime-test.mjs
          node --test tests/universal-period-resolver-test.mjs
          node --test tests/universal-reporting-kernel-test.mjs

      - name: Run Performance surface regression
        run: node --test tests/performance-surface-adapter-test.mjs

      - name: Verify repository hygiene
        run: git diff --check

      - name: Build acceptance evidence
        run: |
          mkdir -p artifacts/reporting

          cat > artifacts/reporting/REP10_ACCEPTANCE.txt <<EOF
          REP_10_PIPELINE_REPORT_PROVIDER=IMPLEMENTED
          COMMIT=$GITHUB_SHA
          REMOTE_REP09_CLOSURE=PASS
          REMOTE_ACTIVITY_FREEZE=PASS
          REMOTE_PIPELINE_PROVIDER_TEST=PASS
          REMOTE_PIPELINE_TRANSITION_REGRESSION=PASS
          REMOTE_DOMAIN_PROVIDER_REGRESSION=PASS
          REMOTE_REPORTING_REGRESSION=PASS
          REMOTE_PERFORMANCE_SURFACE_REGRESSION=PASS
          PIPELINE_TRANSITION_READ_AUTHORITY=YES
          PIPELINE_STAGE_MUTATION_AUTHORITY=NO
          CURRENT_STAGE_SNAPSHOT_AUTHORITY=NO
          CONVERSION_RATE_AUTHORITY=NO
          FORECAST_AUTHORITY=NO
          EOF

      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: rep-10-pipeline-report-provider-${{ github.sha }}
          path: artifacts/reporting
          if-no-files-found: error
