name: Verify Public Stage Runtime Delivery

on:
  push:
    branches:
      - fix/pipeline-stage-runtime-cache-authority
    paths:
      - .github/workflows/pages-stage-runtime-public-diagnostic.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pages-stage-runtime-public-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-public-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXPECTED_SHA: a1351fca805ca426fcd2cdacf6d472c34a4c603c
      PUBLIC_BASE_URL: https://jorgeprdz.github.io/ForgeOS
      EXPECTED_ENTRY: app.js?v=ui-m04-shell-008&fix=pipeline-stage-runtime-003
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pipeline-stage-runtime-cache-authority
          fetch-depth: 0

      - name: Observe public deployment once
        shell: bash
        run: |
          set -u
          build_json="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
            "${PUBLIC_BASE_URL}/build-info.json?v=${EXPECTED_SHA}-immediate" || true)"
          deployed_sha="$(node -e 'try{process.stdout.write(String(JSON.parse(process.argv[1]).commitSha||""))}catch{}' "$build_json")"
          page_html="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
            "${PUBLIC_BASE_URL}/static-preview/forge-alive/?nav=pipeline&v=${EXPECTED_SHA}-immediate" || true)"
          script_src="$(printf '%s' "$page_html" | grep -o 'app\.js?v=[^"<]*' | head -n1 || true)"
          export DEPLOYED_SHA="$deployed_sha"
          export SCRIPT_SRC="$script_src"
          export RESULT_STATUS="$([ "$deployed_sha" = "$EXPECTED_SHA" ] && [ "$script_src" = "$EXPECTED_ENTRY" ] && echo PASS || echo FAIL)"
          node - <<'NODE'
          const fs = require('fs');
          const evidence = {
            status: process.env.RESULT_STATUS,
            expectedSha: process.env.EXPECTED_SHA,
            deployedSha: process.env.DEPLOYED_SHA || null,
            expectedEntry: process.env.EXPECTED_ENTRY,
            observedEntry: process.env.SCRIPT_SRC || null,
            verifiedAt: new Date().toISOString(),
            pageUrl: `${process.env.PUBLIC_BASE_URL}/static-preview/forge-alive/?nav=pipeline`,
          };
          fs.mkdirSync('diagnostics', { recursive: true });
          fs.writeFileSync('diagnostics/pages-stage-runtime-a1351fca.json', `${JSON.stringify(evidence, null, 2)}\n`);
          console.log(JSON.stringify(evidence, null, 2));
          NODE

      - name: Record diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name forgeos-pages-diagnostic
          git config user.email actions@users.noreply.github.com
          git add diagnostics/pages-stage-runtime-a1351fca.json
          git commit -m "chore(pages): record stage runtime diagnostic [pages-diagnostic-result]"
          git push origin HEAD:fix/pipeline-stage-runtime-cache-authority

      - name: Enforce public delivery
        shell: bash
        run: |
          node -e "const e=require('./diagnostics/pages-stage-runtime-a1351fca.json'); if(e.status!=='PASS') process.exit(1)"
