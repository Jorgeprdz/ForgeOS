name: Inspect Pages Validator Repair Run

on:
  push:
    branches:
      - fix/pipeline-stage-runtime-cache-authority
    paths:
      - .github/workflows/pages-stage-runtime-public-diagnostic.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect-main-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXPECTED_SHA: 94deee62db7fb5465683a438e0ac2322876ad4e8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pipeline-stage-runtime-cache-authority
          fetch-depth: 0

      - name: Read push workflow runs for repair merge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${EXPECTED_SHA}&event=push&per_page=100" \
            -o /tmp/runs.json
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/runs.json', 'utf8'));
          const runs = (payload.workflow_runs || []).map(run => ({
            id: run.id,
            name: run.name,
            path: run.path,
            status: run.status,
            conclusion: run.conclusion,
            event: run.event,
            headSha: run.head_sha,
            createdAt: run.created_at,
            updatedAt: run.updated_at,
            url: run.html_url,
          }));
          const evidence = {
            expectedSha: process.env.EXPECTED_SHA,
            capturedAt: new Date().toISOString(),
            total: runs.length,
            runs,
          };
          fs.writeFileSync('diagnostics/main-push-runs-94deee62.json', `${JSON.stringify(evidence, null, 2)}\n`);
          console.log(JSON.stringify(evidence, null, 2));
          NODE

      - name: Record workflow inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name forgeos-pages-diagnostic
          git config user.email actions@users.noreply.github.com
          git add diagnostics/main-push-runs-94deee62.json
          git commit -m "chore(pages): record validator repair workflow inventory"
          git push origin HEAD:fix/pipeline-stage-runtime-cache-authority
