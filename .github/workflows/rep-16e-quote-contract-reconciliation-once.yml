name: REP-16E Quote Contract Reconciliation Once

on:
  pull_request:
    branches:
      - promotion/rep-16e-activity-reporting
    paths:
      - .forge/rep-16e-quote-contract-trigger.txt

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promotion/rep-16e-activity-reporting
          fetch-depth: 0
      - name: Reconcile retired Quotes loader assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/manual-quotes-pipeline-stability-test.mjs')
          text = path.read_text()
          replacements = [
              (
                  '    "docs/static-preview/forge-alive-material3/quotes-module-complete.js",',
                  '    "docs/static-preview/forge-alive-material3/quotes-module.js",',
              ),
              (
                  '  assert.match(app, /quotes-module-complete\\.js\\?v=manual-quotes-complete-001/);',
                  '  assert.match(app, /quotes-module\\.js\\?v=quote-calculator-parity-006/);',
              ),
              (
                  '  assert.match(quotesModule, /quotes-result-adapter-complete\\.js\\?v=manual-quotes-complete-001/);',
                  '  assert.match(quotesModule, /quotes-result-adapter\\.js\\?v=quote-calculator-parity-006/);',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one exact match for {old!r}, got {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit reconciled quote contract
        run: |
          git config user.name "ForgeOS Governance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/manual-quotes-pipeline-stability-test.mjs
          git commit -m "REP-16E reconcile current Quotes loader contract"
          git push origin HEAD:promotion/rep-16e-activity-reporting
