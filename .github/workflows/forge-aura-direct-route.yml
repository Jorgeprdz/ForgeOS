name: Forge Aura Direct Route

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/static-preview/forge-aura/index.html'
      - 'docs/static-preview/forge-aura/aura-router-v4.js'
      - 'docs/static-preview/forge-aura/aura-bootstrap-v4-r1.js'
      - 'docs/static-preview/forge-aura/app-v4-r1.js'
      - 'docs/static-preview/forge-aura/activity/activity-points-projection.js'
      - 'docs/daily-points-engine.js'
      - 'docs/platform/productivity/activity-points-authority-adapter.js'
      - 'tests/forge-aura-direct-route.test.mjs'
      - 'tests/forge-aura-pages-import-graph.test.mjs'
      - 'tests/aura-boot-cache-isolation-013.test.mjs'
      - '.github/workflows/forge-aura-direct-route.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/static-preview/forge-aura/index.html'
      - 'docs/static-preview/forge-aura/aura-router-v4.js'
      - 'docs/static-preview/forge-aura/aura-bootstrap-v4-r1.js'
      - 'docs/static-preview/forge-aura/app-v4-r1.js'
      - 'docs/static-preview/forge-aura/activity/activity-points-projection.js'
      - 'docs/daily-points-engine.js'
      - 'docs/platform/productivity/activity-points-authority-adapter.js'
      - 'tests/forge-aura-direct-route.test.mjs'
      - 'tests/forge-aura-pages-import-graph.test.mjs'
      - 'tests/aura-boot-cache-isolation-013.test.mjs'
      - '.github/workflows/forge-aura-direct-route.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-route-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and direct-route contract
        run: |
          node --check docs/static-preview/forge-aura/aura-router-v4.js
          node --check docs/static-preview/forge-aura/aura-bootstrap-v4-r1.js
          node --check docs/static-preview/forge-aura/app-v4-r1.js
          node --input-type=module --check < docs/static-preview/forge-aura/activity/activity-points-projection.js
          node --test tests/forge-aura-direct-route.test.mjs tests/forge-aura-pages-import-graph.test.mjs tests/aura-boot-cache-isolation-013.test.mjs
          git diff --check HEAD^ HEAD || true
