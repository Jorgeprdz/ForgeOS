name: Forge UI Visual Diagnostic

on:
  push:
    branches:
      - fix/material3-productive-intelligence-and-quote-results
    paths:
      - .github/workflows/forge-ui-visual-diagnostic.yml
      - docs/static-preview/forge-alive-material3/**
      - docs/static-preview/forge-alive/forge-alive-auth-entry-067g17b1.*
      - advisor-os/sales-pipeline/**
      - nash/**
      - nash-*.js
      - manager-os/nba/**
      - tools/forge-ui-visual-diagnostic.mjs
      - package.json
      - package-lock.json
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/forge-ui-visual-diagnostic.yml
      - docs/static-preview/forge-alive-material3/**
      - docs/static-preview/forge-alive/forge-alive-auth-entry-067g17b1.*
      - advisor-os/sales-pipeline/**
      - nash/**
      - nash-*.js
      - manager-os/nba/**
      - tools/forge-ui-visual-diagnostic.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      target_url:
        description: URL base de Forge Alive que se va a navegar
        required: false
        default: http://127.0.0.1:4173/docs/static-preview/forge-alive-material3/
        type: string
      quote_fixture_path:
        description: Ruta opcional dentro del repositorio a un PDF o JSON de cotización
        required: false
        default: ""
        type: string
  workflow_run:
    workflows:
      - Deploy ForgeOS to GitHub Pages
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: forge-ui-visual-diagnostic-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  capture:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORGE_DIAGNOSTIC_FIXTURE: ${{ github.event.inputs.quote_fixture_path || '' }}
      FORGE_DIAGNOSTIC_OUTPUT: artifacts/forge-ui-diagnostic

    steps:
      - name: Checkout accepted source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Resolve diagnostic target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "FORGE_DIAGNOSTIC_URL=https://jorgeprdz.github.io/ForgeOS/static-preview/forge-alive/" >> "$GITHUB_ENV"
            echo "FORGE_DIAGNOSTIC_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "FORGE_DIAGNOSTIC_URL=http://127.0.0.1:4173/docs/static-preview/forge-alive-material3/" >> "$GITHUB_ENV"
            echo "FORGE_DIAGNOSTIC_SHA=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"
          else
            target="${{ github.event.inputs.target_url }}"
            if [ -z "$target" ]; then
              target="http://127.0.0.1:4173/docs/static-preview/forge-alive-material3/"
            fi
            echo "FORGE_DIAGNOSTIC_URL=$target" >> "$GITHUB_ENV"
            echo "FORGE_DIAGNOSTIC_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Generate hermetic browser diagnostic configuration
        run: |
          cat > env.js <<'EOF'
          window.__ENV__ = Object.freeze({
            "SUPABASE_URL": "http://127.0.0.1:4173",
            "SUPABASE_KEY": "forge-browser-diagnostic-public-anon-placeholder",
            "DEMO_MODE": "false",
            "ENABLE_TEST_ADVISOR_LOGIN": "false"
          });
          EOF
          mkdir -p functions/v1
          cat > functions/v1/banxico-rates <<'EOF'
          {
            "ok": true,
            "fetchedAt": "2026-08-03T12:00:00.000Z",
            "functionVersion": "FORGE_DIAGNOSTIC_BANXICO_V1",
            "rates": {
              "UDI_MXN": {
                "value": 8.53,
                "asOfDate": "2026-08-03",
                "source": "DIAGNOSTIC_FIXTURE"
              }
            }
          }
          EOF
          grep -F '"SUPABASE_URL": "http://127.0.0.1:4173"' env.js
          grep -F '"functionVersion": "FORGE_DIAGNOSTIC_BANXICO_V1"' functions/v1/banxico-rates

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start repository static server
        shell: bash
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/forge-static.log 2>&1 &
          echo $! > /tmp/forge-static.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:4173/docs/static-preview/forge-alive-material3/ \
              > /dev/null; then
              curl --fail --silent --show-error \
                http://127.0.0.1:4173/functions/v1/banxico-rates \
                | grep -F 'FORGE_DIAGNOSTIC_BANXICO_V1'
              echo "FORGE_LOCAL_SERVER=READY"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/forge-static.log
          echo "FORGE_LOCAL_SERVER=FAILED"
          false

      - name: Wait for Pages propagation
        if: github.event_name == 'workflow_run'
        run: sleep 20

      - name: Capture and enforce browser diagnostic
        shell: bash
        run: |
          set +e
          node tools/forge-ui-visual-diagnostic.mjs 2>&1 | tee /tmp/forge-ui-visual-diagnostic.log
          diagnostic_status=${PIPESTATUS[0]}
          mkdir -p artifacts/forge-ui-diagnostic
          cp /tmp/forge-ui-visual-diagnostic.log artifacts/forge-ui-diagnostic/diagnostic.log
          exit "$diagnostic_status"

      - name: Publish diagnostic summary
        if: always()
        run: |
          if [ -f artifacts/forge-ui-diagnostic/summary.md ]; then
            cat artifacts/forge-ui-diagnostic/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Forge UI visual diagnostic" >> "$GITHUB_STEP_SUMMARY"
            echo "No se pudo generar summary.md. Revisa fatal-error.txt y diagnostic.log en el artifact." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-ui-visual-diagnostic-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
          path: artifacts/forge-ui-diagnostic
          if-no-files-found: error
          retention-days: 14

      - name: Enforce acceptance evidence
        if: always()
        shell: bash
        run: |
          test -f artifacts/forge-ui-diagnostic/manifest.json
          test -f artifacts/forge-ui-diagnostic/summary.md
          test -f artifacts/forge-ui-diagnostic/diagnostic.log
          test -f artifacts/forge-ui-diagnostic/final-visual-closure/combat-click-through.json
          test -f artifacts/forge-ui-diagnostic/final-visual-closure/nash-click-through.json
          test -f artifacts/forge-ui-diagnostic/final-visual-closure/whatsapp-click-through.json
          test -f artifacts/forge-ui-diagnostic/final-visual-closure/workspace-duplication-audit.json
          test ! -f artifacts/forge-ui-diagnostic/fatal-error.txt
          grep -F "FORGE_UI_VISUAL_ACCEPTANCE=PASS" artifacts/forge-ui-diagnostic/diagnostic.log
          grep -F "GOOGLE_AUTH_RECONNECTION_ACCEPTANCE=PASS" artifacts/forge-ui-diagnostic/diagnostic.log
          grep -F "NASH_COMBAT_ACCEPTANCE=PASS" artifacts/forge-ui-diagnostic/diagnostic.log
          grep -F "NBA_REASON_WHY_ACCEPTANCE=PASS" artifacts/forge-ui-diagnostic/diagnostic.log
          grep -F "NASH_COMBAT_BUTTON_CLICKED=PASS" artifacts/forge-ui-diagnostic/diagnostic.log
          grep -F "COMBAT_WHATSAPP_CLICKED=PASS" artifacts/forge-ui-diagnostic/diagnostic.log
          grep -F "PREPARE_MESSAGE_CLICKED=PASS" artifacts/forge-ui-diagnostic/diagnostic.log
          grep -F "NASH_REAPPROVAL_AFTER_EDIT_CLICKED=PASS" artifacts/forge-ui-diagnostic/diagnostic.log
          grep -F "WHATSAPP_EXACT_TEXT_MATCH=PASS" artifacts/forge-ui-diagnostic/diagnostic.log
          grep -F "MAX_SIMULTANEOUS_WORKSPACES=1" artifacts/forge-ui-diagnostic/diagnostic.log
          echo "FORGE_UI_VISUAL_DIAGNOSTIC=PASS"
