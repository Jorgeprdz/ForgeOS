name: Forge UI Visual Diagnostic

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: URL base de Forge Alive que se va a navegar
        required: false
        default: https://jorgeprdz.github.io/ForgeOS/static-preview/forge-alive/
        type: string
      quote_fixture_path:
        description: Ruta opcional dentro del repositorio a un PDF o JSON de cotización
        required: false
        default: ""
        type: string
  workflow_run:
    workflows:
      - Deploy ForgeOS to GitHub Pages
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: forge-ui-visual-diagnostic-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  capture:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORGE_DIAGNOSTIC_URL: >-
        ${{ github.event.inputs.target_url || 'https://jorgeprdz.github.io/ForgeOS/static-preview/forge-alive/' }}
      FORGE_DIAGNOSTIC_SHA: >-
        ${{ github.event.workflow_run.head_sha || github.sha }}
      FORGE_DIAGNOSTIC_FIXTURE: ${{ github.event.inputs.quote_fixture_path || '' }}
      FORGE_DIAGNOSTIC_OUTPUT: artifacts/forge-ui-diagnostic

    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for Pages propagation
        if: github.event_name == 'workflow_run'
        run: sleep 20

      - name: Capture visual diagnostic
        id: diagnostic
        continue-on-error: true
        run: node tools/forge-ui-visual-diagnostic.mjs

      - name: Publish diagnostic summary
        if: always()
        run: |
          if [ -f artifacts/forge-ui-diagnostic/summary.md ]; then
            cat artifacts/forge-ui-diagnostic/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Forge UI visual diagnostic" >> "$GITHUB_STEP_SUMMARY"
            echo "No se pudo generar summary.md. Revisa fatal-error.txt en el artifact." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshot ZIP artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-ui-visual-diagnostic-${{ github.event.workflow_run.head_sha || github.sha }}
          path: artifacts/forge-ui-diagnostic
          if-no-files-found: error
          retention-days: 14

      - name: Enforce diagnostic execution
        if: always()
        run: |
          test -f artifacts/forge-ui-diagnostic/manifest.json
          test -f artifacts/forge-ui-diagnostic/summary.md
          echo "FORGE_UI_VISUAL_DIAGNOSTIC=PASS"
