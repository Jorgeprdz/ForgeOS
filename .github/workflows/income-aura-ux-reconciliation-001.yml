name: Income Aura UX Reconciliation 001

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/static-preview/forge-aura/income/**'
      - 'docs/static-preview/forge-aura/app-v4.js'
      - 'docs/static-preview/forge-aura/app-v4-r1.js'
      - 'docs/static-preview/forge-aura/aura-bootstrap-v4.js'
      - 'docs/static-preview/forge-aura/aura-bootstrap-v4-r1.js'
      - 'docs/static-preview/forge-aura/aura-router-v4.js'
      - 'docs/static-preview/forge-aura/aura-shell.js'
      - 'docs/static-preview/forge-aura/aura-shell.css'
      - 'docs/static-preview/forge-aura/index.html'
      - 'supabase/functions/cartera-pdf-intake/index.ts'
      - 'tests/income-*'
      - 'tests/e2e/income-*'
      - 'tests/fixtures/aura-income-*'
      - 'docs/architecture/source-truth/FORGE_AURA_INCOME_UX_RECONCILIATION_REPORT_001.md'
      - 'docs/evidence/FORGE_AURA_INCOME_UX_RECONCILIATION_ACCEPTANCE_001.md'
      - '.github/workflows/income-aura-ux-reconciliation-001.yml'
  push:
    branches:
      - codex/forge-aura-income-ux-reconciliation-001
    paths:
      - 'docs/static-preview/forge-aura/income/**'
      - 'docs/static-preview/forge-aura/app-v4.js'
      - 'docs/static-preview/forge-aura/app-v4-r1.js'
      - 'docs/static-preview/forge-aura/aura-bootstrap-v4.js'
      - 'docs/static-preview/forge-aura/aura-bootstrap-v4-r1.js'
      - 'docs/static-preview/forge-aura/aura-router-v4.js'
      - 'docs/static-preview/forge-aura/aura-shell.js'
      - 'docs/static-preview/forge-aura/aura-shell.css'
      - 'docs/static-preview/forge-aura/index.html'
      - 'tests/income-*'
      - 'tests/e2e/income-*'
      - 'tests/fixtures/aura-income-*'
      - 'docs/architecture/source-truth/FORGE_AURA_INCOME_UX_RECONCILIATION_REPORT_001.md'
      - 'docs/evidence/FORGE_AURA_INCOME_UX_RECONCILIATION_ACCEPTANCE_001.md'
      - '.github/workflows/income-aura-ux-reconciliation-001.yml'

permissions:
  contents: read

concurrency:
  group: income-aura-ux-reconciliation-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  FORGE_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  FORGE_PAGES_RUNTIME_MODE: 'pages'
  GITHUB_PAGES: 'true'
  DEMO_MODE: 'true'
  ENABLE_TEST_ADVISOR_LOGIN: 'false'
  SUPABASE_URL: ''
  SUPABASE_ANON_KEY: ''

jobs:
  constitutional-contract-scope:
    name: Income constitutional contract and scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact reconciliation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check scoped Aura Income modules
        run: |
          node --check docs/static-preview/forge-aura/income/income-core.mjs
          node --check docs/static-preview/forge-aura/income/income-adapter-pages-v1.mjs
          node --check docs/static-preview/forge-aura/income/income-module.mjs
          node --check docs/static-preview/forge-aura/app-v4.js
          node --check docs/static-preview/forge-aura/app-v4-r1.js
          node --check docs/static-preview/forge-aura/aura-bootstrap-v4-r1.js
          node --check docs/static-preview/forge-aura/aura-router-v4.js
          node --check docs/static-preview/forge-aura/aura-shell.js

      - name: Constitutional and economic presentation contract
        run: node --test tests/income-aura-ux-reconciliation.test.mjs tests/income-owner-isolation.test.mjs

      - name: Scope guard
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then BASE_SHA="$(git merge-base origin/main HEAD)"; fi
          BASE_SHA="$BASE_SHA" node --test tests/income-scope-guard.test.mjs

      - name: Inherited compensation product regressions
        run: |
          node tests/advisor-compensation-stage-070-master-test.mjs
          node tests/advisor-compensation-stage-080-master-test.mjs

      - name: Preserve explicit Pages deployment governance
        run: node --test tests/pages-explicit-deployment-governance.test.mjs

      - name: Prohibited mutation assertions
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "$BASE_SHA" ]; then BASE_SHA="$(git merge-base origin/main HEAD)"; fi
          mapfile -d '' -t changed < <(git -c core.quotepath=false diff --name-only -z "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          forbidden='^(compensation/advisor/engine/|compensation/advisor-development/.*engine|compensation/new-professional/.*rule-data|compensation/advisor/rules/rule-data|supabase/migrations/|supabase/functions/|\.github/workflows/pages\.yml$|docs/static-preview/forge-alive-material3/)'
          allowed_cartera_edge='^supabase/functions/cartera-pdf-intake/index\.ts$'
          edge_changed=0
          for file in "${changed[@]}"; do
            if [[ "$file" =~ ^supabase/functions/ ]]; then
              if [[ ! "$file" =~ $allowed_cartera_edge ]]; then
                echo "INCOME_SCOPE_FORBIDDEN_MUTATION=$file" >&2
                exit 1
              fi
              edge_changed=1
              continue
            fi
            if [[ "$file" =~ $forbidden ]]; then
              echo "INCOME_SCOPE_FORBIDDEN_MUTATION=$file" >&2
              exit 1
            fi
          done
          echo 'COMPENSATION_ENGINE_MUTATION=ZERO'
          echo 'RULE_PACK_MUTATION=ZERO'
          echo 'DATABASE_MUTATION=ZERO'
          echo 'RLS_WEAKENING=ZERO'
          echo 'PIPELINE_MUTATION=ZERO'
          echo 'CARTERA_WRITER_MUTATION=ZERO'
          echo "CARTERA_PDF_INTAKE_EDGE_CHANGED=$edge_changed"
          if [[ "$edge_changed" = '1' ]]; then echo 'CARTERA_PDF_INTAKE_EDGE_SCOPE=BOUNDED_COMPATIBILITY'; fi

  canonical-pages-artifact:
    name: Canonical Pages artifact and import graph
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: constitutional-contract-scope
    steps:
      - name: Checkout exact reconciliation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract canonical Pages build and validation programs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/pages.yml').read_text()
          blocks = re.findall(r"node - <<'EOF'\n(.*?)\n\s+EOF", workflow, re.S)
          if len(blocks) != 3:
              raise SystemExit(f'EXPECTED_3_NODE_BLOCKS_OBSERVED_{len(blocks)}')

          Path('/tmp/generate-env.cjs').write_text(textwrap.dedent(blocks[0]))
          Path('/tmp/build-canonical.cjs').write_text(
              textwrap.dedent(blocks[1]).replace('process.env.GITHUB_SHA', 'process.env.FORGE_BUILD_SHA')
          )
          Path('/tmp/validate-canonical.cjs').write_text(
              textwrap.dedent(blocks[2]).replace('process.env.EXPECTED_COMMIT_SHA', 'process.env.FORGE_BUILD_SHA')
          )
          PY

      - name: Build canonical Pages artifact with production builder
        run: |
          node /tmp/generate-env.cjs
          node scripts/build-advisor-presentation-pages-runtime.mjs
          node /tmp/build-canonical.cjs

      - name: Validate artifact and Income import graph
        run: |
          node scripts/validate-pages-public-config.mjs _site/env.js
          node /tmp/validate-canonical.cjs
          node --test tests/income-pages-import-graph.test.mjs

      - name: Upload canonical artifact diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: income-canonical-pages-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            _site/build-info.json
            _site/production-surface.json
          if-no-files-found: ignore

  responsive-accessibility:
    name: Income responsive accessibility and lifecycle acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: constitutional-contract-scope
    steps:
      - name: Checkout exact reconciliation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run synthetic browser acceptance
        run: npx playwright test --config=playwright.aura-income.config.mjs

      - name: Verify required screenshot evidence exists
        run: |
          test -f test-results/aura-income-ux/desktop-ready.png
          test -f test-results/aura-income-ux/mobile-ready.png
          test -f test-results/aura-income-ux/tablet-ready.png

      - name: Upload Aura Income screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-income-ux-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/aura-income-ux
          if-no-files-found: ignore
