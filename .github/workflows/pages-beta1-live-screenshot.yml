name: Beta 1 Live Pages Screenshot

# Canonical deploy under review: 1ae2c03ddc1063ef25b87339d20456414e8c6f2f
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages-beta1-live-screenshot.yml
      - tools/pages-beta1-live-screenshot.mjs
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pages-beta1-live-screenshot.yml
      - tools/pages-beta1-live-screenshot.mjs
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy ForgeOS to GitHub Pages
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: beta1-live-pages-screenshot-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  capture-live-pages:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FORGE_PAGES_URL: https://jorgeprdz.github.io/ForgeOS/static-preview/forge-alive/
      FORGE_PAGES_EVIDENCE: artifacts/pages-beta1-live
      FORGE_BETA_TEST_EMAIL: ${{ secrets.FORGE_BETA_TEST_EMAIL }}
      FORGE_BETA_TEST_PASSWORD: ${{ secrets.FORGE_BETA_TEST_PASSWORD }}

    steps:
      - name: Checkout screenshot tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify runner Chrome
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          echo "SCREENSHOT_BROWSER=RUNNER_PREINSTALLED_GOOGLE_CHROME"

      - name: Wait for the canonical Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          target="$FORGE_PAGES_URL"
          for attempt in $(seq 1 36); do
            status=$(curl -L -sS -o /tmp/forge-pages.html -w '%{http_code}' "${target}?nav=pipeline&live_probe=$(date +%s)")
            if [ "$status" = "200" ] && grep -q "Forge" /tmp/forge-pages.html; then
              echo "CANONICAL_PAGES_READY=YES"
              exit 0
            fi
            sleep 5
          done
          echo "CANONICAL_PAGES_READY=NO"
          exit 1

      - name: Capture screenshots from canonical live Pages
        run: node tools/pages-beta1-live-screenshot.mjs

      - name: Publish review summary
        if: always()
        run: |
          if [ -f artifacts/pages-beta1-live/summary.md ]; then
            cat artifacts/pages-beta1-live/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No se generó evidencia." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta1-live-pages-screenshots-${{ github.run_id }}
          path: artifacts/pages-beta1-live
          if-no-files-found: error
          retention-days: 14
