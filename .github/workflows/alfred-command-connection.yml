name: Alfred Command OS Reconciliation

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/static-preview/forge-alive-material3/app.js"
      - "docs/static-preview/forge-alive-material3/alfred-command-runtime.js"
      - "docs/static-preview/forge-alive-material3/alfred-command-runtime.css"
      - "docs/static-preview/forge-alive-material3/legacy-ui-retirement.js"
      - "platform/commands/alfred-action-registry.js"
      - "platform/commands/alfred-review-action-packet-browser.js"
      - "scripts/prepare-forge-alive-pages-runtime-closure.mjs"
      - "supabase/functions/alfred-command/**"
      - "tests/alfred-command-*.mjs"
      - "docs/evidence/ALFRED_COMMAND_OS_RECONCILIATION_002.md"
      - ".github/workflows/alfred-command-connection.yml"
      - ".github/workflows/deploy-supabase.yml"
  push:
    branches:
      - main
    paths:
      - "docs/static-preview/forge-alive-material3/app.js"
      - "docs/static-preview/forge-alive-material3/alfred-command-runtime.js"
      - "docs/static-preview/forge-alive-material3/alfred-command-runtime.css"
      - "docs/static-preview/forge-alive-material3/legacy-ui-retirement.js"
      - "platform/commands/alfred-action-registry.js"
      - "platform/commands/alfred-review-action-packet-browser.js"
      - "scripts/prepare-forge-alive-pages-runtime-closure.mjs"
      - "supabase/functions/alfred-command/**"
      - "tests/alfred-command-*.mjs"
      - "docs/evidence/ALFRED_COMMAND_OS_RECONCILIATION_002.md"
      - ".github/workflows/alfred-command-connection.yml"
      - ".github/workflows/deploy-supabase.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Alfred Command OS contracts
        run: |
          node --check docs/static-preview/forge-alive-material3/alfred-command-runtime.js
          node --check platform/commands/alfred-action-registry.js
          node --check platform/commands/alfred-review-action-packet-browser.js
          node --check scripts/prepare-forge-alive-pages-runtime-closure.mjs
          node --check supabase/functions/alfred-command/logic.mjs
          node --check tests/alfred-command-edge-function-test.mjs
          node --check tests/alfred-command-browser-runtime-test.mjs
          node --check tests/alfred-command-os-reconciliation-test.mjs
          node --test tests/alfred-command-edge-function-test.mjs
          node --test tests/alfred-command-browser-runtime-test.mjs
          node --test tests/alfred-command-os-reconciliation-test.mjs
          git diff --check
