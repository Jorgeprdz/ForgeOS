name: QPD Quote Printable Document

on:
  push:
    branches:
      - feature/quote-printable-document-closure
    paths:
      - "advisor-os/quotes/**"
      - "docs/static-preview/quote-printable-runtime/**"
      - "docs/static-preview/forge-alive/forge-quote-printable-entrypoint-qpd06.*"
      - "docs/static-preview/quote-preview-live/forge-accepted-quote-review-snapshot.js"
      - "supabase/migrations/20260730000200_qpd05_printable_quote_versions.sql"
      - ".github/workflows/qpd01-quote-printable-read-model.yml"
  pull_request:
    paths:
      - "advisor-os/quotes/**"
      - "docs/static-preview/quote-printable-runtime/**"
      - "docs/static-preview/forge-alive/forge-quote-printable-entrypoint-qpd06.*"
      - "docs/static-preview/quote-preview-live/forge-accepted-quote-review-snapshot.js"
      - "supabase/migrations/20260730000200_qpd05_printable_quote_versions.sql"
      - ".github/workflows/qpd01-quote-printable-read-model.yml"

permissions:
  contents: read

jobs:
  qpd-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax gate
        run: |
          node --check advisor-os/quotes/printable/quote-printable-read-model.js
          node --check advisor-os/quotes/printable/quote-printable-document-composer.js
          node --check advisor-os/quotes/printable/quote-printable-pdf-generator.js
          node --check advisor-os/quotes/printable/quote-printable-product-profile.js
          node --check advisor-os/quotes/printable/quote-printable-version-repository.js
          node --check advisor-os/quotes/printable/quote-printable-supabase-repository.js
          node --check docs/static-preview/quote-printable-runtime/quote-printable-read-model.js
          node --check docs/static-preview/quote-printable-runtime/quote-printable-document-composer.js
          node --check docs/static-preview/quote-printable-runtime/quote-printable-pdf-generator.js
          node --check docs/static-preview/quote-printable-runtime/quote-printable-product-profile.js
          node --check docs/static-preview/quote-printable-runtime/quote-printable-version-repository.js
          node --check docs/static-preview/quote-printable-runtime/forge-quote-printable-route-controller.js
          node --check docs/static-preview/forge-alive/forge-quote-printable-entrypoint-qpd06.js
          node --check docs/static-preview/quote-preview-live/forge-accepted-quote-review-snapshot.js
          node --check advisor-os/quotes/tests/quote-printable-read-model-master-test.js
          node --check advisor-os/quotes/tests/quote-printable-document-composer-master-test.js
          node --check advisor-os/quotes/tests/quote-printable-pdf-generator-master-test.js
          node --check advisor-os/quotes/tests/quote-printable-product-profile-master-test.js
          node --check advisor-os/quotes/tests/quote-printable-version-repository-master-test.js
          node --check advisor-os/quotes/tests/quote-printable-persistence-migration-security-test.js
          node --check advisor-os/quotes/tests/quote-printable-productive-route-controller-test.js
          node --check advisor-os/quotes/tests/quote-printable-browser-binding-test.js

      - name: QPD-01 canonical read model
        run: node advisor-os/quotes/tests/quote-printable-read-model-master-test.js

      - name: QPD-02 A4 and Letter composer
        run: node advisor-os/quotes/tests/quote-printable-document-composer-master-test.js

      - name: QPD-03 real PDF and download gate
        run: node advisor-os/quotes/tests/quote-printable-pdf-generator-master-test.js

      - name: QPD-04 product-specific quote sections
        run: node advisor-os/quotes/tests/quote-printable-product-profile-master-test.js

      - name: QPD-05 persistence versioning and reopen
        run: node advisor-os/quotes/tests/quote-printable-version-repository-master-test.js

      - name: QPD-05 migration security
        run: node advisor-os/quotes/tests/quote-printable-persistence-migration-security-test.js

      - name: QPD-06 productive route controller
        run: node advisor-os/quotes/tests/quote-printable-productive-route-controller-test.js

      - name: QPD-06 browser binding and responsive safety
        run: node advisor-os/quotes/tests/quote-printable-browser-binding-test.js

      - name: Diff integrity
        run: git diff --check HEAD^1...HEAD
