name: QPD Quote Printable Document

on:
  push:
    branches:
      - feature/quote-printable-document-closure
    paths:
      - "advisor-os/quotes/**"
      - "docs/static-preview/quote-printable-runtime/**"
      - "docs/static-preview/forge-alive/forge-quote-printable-entrypoint-qpd06.*"
      - "docs/static-preview/forge-alive-material3/quote-runtime-printable-closure-m05e00*.*"
      - "docs/static-preview/forge-alive-material3/quote-runtime-vida-mujer-handoff-m05e009.js"
      - "docs/static-preview/forge-alive-material3/app.js"
      - "docs/static-preview/forge-alive-material3/index-quote-calculator-parity.html"
      - "docs/static-preview/quote-preview-live/forge-accepted-quote-review-snapshot.js"
      - "tests/ui-m05e-quote-calculator-restoration-test.mjs"
      - "tests/ui-m05f-live-udi-review-printable-actions-test.mjs"
      - "tests/ui-m05g-printable-design-closure-test.mjs"
      - "tests/ui-m05h-orvi-commercial-document-test.mjs"
      - "tests/ui-m05i-vida-mujer-commercial-document-test.mjs"
      - "tests/e2e/qpd06-browser-acceptance.spec.mjs"
      - "tests/e2e/m05e006-responsiveness.spec.mjs"
      - "tests/e2e/fixtures/qpd06/**"
      - "tests/e2e/fixtures/m05e006/**"
      - "playwright.qpd06.config.mjs"
      - "exchange-rate-cache-engine.js"
      - "tools/forge-local-live-server.cjs"
      - "supabase/migrations/20260730000200_qpd05_printable_quote_versions.sql"
      - ".github/workflows/qpd01-quote-printable-read-model.yml"
  pull_request:
    paths:
      - "advisor-os/quotes/**"
      - "docs/static-preview/quote-printable-runtime/**"
      - "docs/static-preview/forge-alive/forge-quote-printable-entrypoint-qpd06.*"
      - "docs/static-preview/forge-alive-material3/quote-runtime-printable-closure-m05e00*.*"
      - "docs/static-preview/forge-alive-material3/quote-runtime-vida-mujer-handoff-m05e009.js"
      - "docs/static-preview/forge-alive-material3/app.js"
      - "docs/static-preview/forge-alive-material3/index-quote-calculator-parity.html"
      - "docs/static-preview/quote-preview-live/forge-accepted-quote-review-snapshot.js"
      - "tests/ui-m05e-quote-calculator-restoration-test.mjs"
      - "tests/ui-m05f-live-udi-review-printable-actions-test.mjs"
      - "tests/ui-m05g-printable-design-closure-test.mjs"
      - "tests/ui-m05h-orvi-commercial-document-test.mjs"
      - "tests/ui-m05i-vida-mujer-commercial-document-test.mjs"
      - "tests/e2e/qpd06-browser-acceptance.spec.mjs"
      - "tests/e2e/m05e006-responsiveness.spec.mjs"
      - "tests/e2e/fixtures/qpd06/**"
      - "tests/e2e/fixtures/m05e006/**"
      - "playwright.qpd06.config.mjs"
      - "exchange-rate-cache-engine.js"
      - "tools/forge-local-live-server.cjs"
      - "supabase/migrations/20260730000200_qpd05_printable_quote_versions.sql"
      - ".github/workflows/qpd01-quote-printable-read-model.yml"

permissions:
  contents: read

jobs:
  qpd-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax gate
        run: |
          node --check advisor-os/quotes/printable/quote-printable-read-model.js
          node --check advisor-os/quotes/printable/quote-printable-document-composer.js
          node --check advisor-os/quotes/printable/quote-printable-pdf-generator.js
          node --check advisor-os/quotes/printable/quote-printable-product-profile.js
          node --check advisor-os/quotes/printable/quote-printable-version-repository.js
          node --check advisor-os/quotes/printable/quote-printable-supabase-repository.js
          node --check advisor-os/quotes/printable/quote-printable-read-model-m05e005.js
          node --check advisor-os/quotes/printable/quote-printable-document-composer-m05e005.js
          node --check advisor-os/quotes/printable/quote-printable-pdf-generator-m05e005.js
          node --check advisor-os/quotes/printable/quote-printable-product-profile-m05e007.js
          node --check advisor-os/quotes/printable/quote-printable-document-composer-m05e007.js
          node --check advisor-os/quotes/printable/quote-printable-pdf-generator-m05e007.js
          node --check advisor-os/quotes/printable/quote-printable-product-profile-m05e008.js
          node --check advisor-os/quotes/printable/quote-printable-document-composer-m05e008.js
          node --check advisor-os/quotes/printable/quote-printable-document-composer-m05e008-pink.js
          node --check advisor-os/quotes/printable/quote-printable-pdf-generator-m05e008.js
          node --check docs/static-preview/quote-printable-runtime/quote-printable-read-model.js
          node --check docs/static-preview/quote-printable-runtime/quote-printable-document-composer.js
          node --check docs/static-preview/quote-printable-runtime/quote-printable-pdf-generator.js
          node --check docs/static-preview/quote-printable-runtime/quote-printable-product-profile.js
          node --check docs/static-preview/quote-printable-runtime/quote-printable-version-repository.js
          node --check docs/static-preview/quote-printable-runtime/forge-quote-printable-route-controller.js
          node --check docs/static-preview/quote-printable-runtime/quote-printable-read-model-m05e005.js
          node --check docs/static-preview/quote-printable-runtime/quote-printable-document-composer-m05e005.js
          node --check docs/static-preview/quote-printable-runtime/quote-printable-pdf-generator-m05e005.js
          node --check docs/static-preview/quote-printable-runtime/quote-printable-product-profile-m05e007.js
          node --check docs/static-preview/quote-printable-runtime/quote-printable-document-composer-m05e007.js
          node --check docs/static-preview/quote-printable-runtime/quote-printable-pdf-generator-m05e007.js
          node --check docs/static-preview/quote-printable-runtime/quote-printable-product-profile-m05e008.js
          node --check docs/static-preview/quote-printable-runtime/quote-printable-document-composer-m05e008.js
          node --check docs/static-preview/quote-printable-runtime/quote-printable-document-composer-m05e008-pink.js
          node --check docs/static-preview/quote-printable-runtime/quote-printable-pdf-generator-m05e008.js
          node --check docs/static-preview/quote-printable-runtime/forge-quote-printable-route-controller-m05e005.js
          node --check docs/static-preview/quote-printable-runtime/forge-quote-printable-route-controller-m05e007.js
          node --check docs/static-preview/quote-printable-runtime/forge-quote-printable-route-controller-m05e008.js
          node --check docs/static-preview/forge-alive/forge-quote-printable-entrypoint-qpd06.js
          node --check docs/static-preview/forge-alive-material3/quote-runtime-printable-closure-m05e005.js
          node --check docs/static-preview/forge-alive-material3/quote-runtime-printable-closure-m05e006.js
          node --check docs/static-preview/forge-alive-material3/quote-runtime-vida-mujer-handoff-m05e009.js
          node --check docs/static-preview/quote-preview-live/forge-accepted-quote-review-snapshot.js
          node --check advisor-os/quotes/tests/quote-printable-read-model-master-test.js
          node --check advisor-os/quotes/tests/quote-printable-document-composer-master-test.js
          node --check advisor-os/quotes/tests/quote-printable-pdf-generator-master-test.js
          node --check advisor-os/quotes/tests/quote-printable-product-profile-master-test.js
          node --check advisor-os/quotes/tests/quote-printable-version-repository-master-test.js
          node --check advisor-os/quotes/tests/quote-printable-persistence-migration-security-test.js
          node --check advisor-os/quotes/tests/quote-printable-productive-route-controller-test.js
          node --check advisor-os/quotes/tests/quote-printable-browser-binding-test.js
          node --check tests/ui-m05e-quote-calculator-restoration-test.mjs
          node --check tests/ui-m05f-live-udi-review-printable-actions-test.mjs
          node --check tests/ui-m05g-printable-design-closure-test.mjs
          node --check tests/ui-m05h-orvi-commercial-document-test.mjs
          node --check tests/ui-m05i-vida-mujer-commercial-document-test.mjs
          node --check tests/e2e/qpd06-browser-acceptance.spec.mjs
          node --check tests/e2e/m05e006-responsiveness.spec.mjs
          node --check tests/e2e/fixtures/qpd06/harness.js
          node --check playwright.qpd06.config.mjs
          node --check tools/forge-local-live-server.cjs
          node --check exchange-rate-cache-engine.js

      - name: QPD-01 canonical read model
        run: node advisor-os/quotes/tests/quote-printable-read-model-master-test.js

      - name: QPD-02 A4 and Letter composer
        run: node advisor-os/quotes/tests/quote-printable-document-composer-master-test.js

      - name: QPD-03 real PDF and download gate
        run: node advisor-os/quotes/tests/quote-printable-pdf-generator-master-test.js

      - name: QPD-04 product-specific quote sections
        run: node advisor-os/quotes/tests/quote-printable-product-profile-master-test.js

      - name: QPD-05 persistence versioning and reopen
        run: node advisor-os/quotes/tests/quote-printable-version-repository-master-test.js

      - name: QPD-05 migration security
        run: node advisor-os/quotes/tests/quote-printable-persistence-migration-security-test.js

      - name: QPD-06 productive route controller
        run: node advisor-os/quotes/tests/quote-printable-productive-route-controller-test.js

      - name: QPD-06 browser binding and responsive safety
        run: node advisor-os/quotes/tests/quote-printable-browser-binding-test.js

      - name: M05E Product Intelligence restoration
        run: node tests/ui-m05e-quote-calculator-restoration-test.mjs

      - name: M05F live UDI and printable integration
        run: node tests/ui-m05f-live-udi-review-printable-actions-test.mjs

      - name: M05G premium portrait printable closure
        run: node tests/ui-m05g-printable-design-closure-test.mjs

      - name: M05H concise ORVI commercial document
        run: node tests/ui-m05h-orvi-commercial-document-test.mjs

      - name: M05I pink Vida Mujer commercial document
        run: node tests/ui-m05i-vida-mujer-commercial-document-test.mjs

      - name: Diff integrity
        run: git diff --check HEAD^1...HEAD

  qpd-browser-acceptance:
    needs: qpd-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: QPD and M05E-006 Chromium acceptance
        run: npx playwright test --config=playwright.qpd06.config.mjs

      - name: Upload QPD-06 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qpd06-browser-acceptance
          path: |
            artifacts/qpd06-browser
            artifacts/qpd06-playwright-report
            artifacts/qpd06-playwright-results.json
            artifacts/qpd06-playwright-test-results
          if-no-files-found: warn
          retention-days: 14
