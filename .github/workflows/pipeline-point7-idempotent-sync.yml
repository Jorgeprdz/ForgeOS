name: Pipeline Point 7 Idempotent Sync

on:
  push:
    branches:
      - fix/pipeline-persistent-new-referral-cta

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[point7-idempotent]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: fix/pipeline-persistent-new-referral-cta
          fetch-depth: 0

      - name: Make journal synchronization idempotent
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/static-preview/forge-alive-material3/pipeline-context-journal.js')
          text = path.read_text(encoding='utf-8')
          old = '      trigger.textContent = "Bitácora";\n'
          new = '      if (trigger.textContent?.trim() !== "Bitácora") trigger.textContent = "Bitácora";\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one journal label assignment, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          node --check docs/static-preview/forge-alive-material3/pipeline-context-journal.js
          rm -f .point7-idempotent-trigger
          rm -f .github/workflows/pipeline-point7-idempotent-sync.yml

      - name: Commit product correction
        run: |
          git config user.name "forgeos-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(pipeline): make journal synchronization idempotent"
          git push origin HEAD:fix/pipeline-persistent-new-referral-cta
