name: Aura Quotes PDF Capture Ownership 006

on:
  push:
    branches:
      - hotfix/aura-quotes-pdf-capture-ownership-006

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/aura-quotes-pdf-capture-ownership-006
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply capture ownership repair
        run: node tools/apply-aura-quotes-pdf-capture-ownership-006.mjs
      - name: Verify syntax and ownership contract
        run: |
          node --check docs/static-preview/quote-runtime/forge-pdf-browser-parser.js
          node --check docs/static-preview/forge-aura/quotes/quotes-module.js
          node --test tests/aura-quotes-pdf-capture-ownership-hotfix-006.test.mjs
      - name: Verify Quotes productive regressions
        run: |
          node tests/forge-aura-quotes-reconciliation-test.mjs
          node --test tests/aura-quotes-pdf-nohang-hotfix-005.test.mjs
          node manager-os/tests/accepted-quote-review-snapshot-boundary-master-test.js
          node --test tests/imagina-ser-product-dashboard-adapter-test.mjs tests/orvi-product-dashboard-adapter-test.mjs
          node advisor-os/quotes/tests/quote-printable-browser-binding-test.js
          node advisor-os/quotes/tests/quote-printable-productive-route-controller-test.js
          node --test tests/pages-explicit-deployment-governance.test.mjs
      - name: Commit verified hotfix
        shell: bash
        run: |
          rm .github/workflows/aura-quotes-pdf-capture-ownership-006.yml
          rm tools/apply-aura-quotes-pdf-capture-ownership-006.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(quotes): give Aura native PDF capture ownership"
          git push origin HEAD:hotfix/aura-quotes-pdf-capture-ownership-006
