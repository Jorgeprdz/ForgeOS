name: CARTERA Material 3 Productive UI Mount

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - docs/static-preview/forge-alive-material3/cartera-module.js
      - docs/static-preview/forge-alive-material3/cartera-module.css
      - docs/static-preview/forge-alive-material3/forge-navigation-contract.js
      - docs/static-preview/forge-alive-material3/forge-shell.js
      - docs/architecture/source-truth/FORGE_CARTERA_MATERIAL3_PRODUCTIVE_UI_MOUNT_001.md
      - docs/evidence/FORGE_CARTERA_MATERIAL3_PRODUCTIVE_UI_MOUNT_CLOSURE_001.md
      - tests/cartera-material3-productive-ui-mount-test.mjs
      - .github/workflows/cartera-material3-productive-ui-mount.yml

permissions:
  contents: write

jobs:
  productive-ui-mount:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/cartera-material3-productive-ui-mount'
    runs-on: ubuntu-24.04
    env:
      CARTERA_M3_SOURCE_HEAD: e30c355a85befa0b59a4bd0565517fdead4f89b2
      CLOSURE_PATH: docs/evidence/FORGE_CARTERA_MATERIAL3_PRODUCTIVE_UI_MOUNT_CLOSURE_001.md
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify source ancestry and bounded paths
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CARTERA_M3_SOURCE_HEAD" HEAD
          mapfile -t paths < <(git diff --name-only "$CARTERA_M3_SOURCE_HEAD...HEAD")
          [[ ${#paths[@]} -gt 0 ]]
          for path in "${paths[@]}"; do
            case "$path" in
              .github/workflows/cartera-material3-productive-ui-mount.yml|\
              docs/static-preview/forge-alive-material3/cartera-module.js|\
              docs/static-preview/forge-alive-material3/cartera-module.css|\
              docs/static-preview/forge-alive-material3/forge-navigation-contract.js|\
              docs/static-preview/forge-alive-material3/forge-shell.js|\
              docs/architecture/source-truth/FORGE_CARTERA_MATERIAL3_PRODUCTIVE_UI_MOUNT_001.md|\
              docs/evidence/FORGE_CARTERA_MATERIAL3_PRODUCTIVE_UI_MOUNT_CLOSURE_001.md|\
              tests/cartera-material3-productive-ui-mount-test.mjs)
                ;;
              *)
                echo "UNAUTHORIZED_PATH=$path" >&2
                exit 1
                ;;
            esac
          done
          echo 'SOURCE_ANCESTRY=PASS'
          echo 'BOUNDED_PATHS=PASS'

      - name: Syntax gate
        run: |
          node --check docs/static-preview/forge-alive-material3/cartera-module.js
          node --check docs/static-preview/forge-alive-material3/forge-navigation-contract.js
          node --check docs/static-preview/forge-alive-material3/forge-shell.js

      - name: Material 3 mount contract
        run: node --test tests/cartera-material3-productive-ui-mount-test.mjs

      - name: Inherited Cartera UI authority regressions
        run: >-
          node --test
          tests/cartera-100d-productivity-proof-view-test.mjs
          tests/cartera-100abcd-ui-integration-test.mjs

      - name: Persist acceptance closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$CLOSURE_PATH")"
          cat > "$CLOSURE_PATH" <<EOF
          # FORGE CARTERA — MATERIAL 3 PRODUCTIVE UI MOUNT CLOSURE 001

          \`\`\`text
          STATUS=ACCEPTED
          SOURCE_HEAD=$CARTERA_M3_SOURCE_HEAD
          ACCEPTANCE_HEAD=$(git rev-parse HEAD)
          WORKFLOW_RUN=${GITHUB_RUN_ID}
          WORKFLOW_JOB=${GITHUB_JOB}
          SOURCE_ANCESTRY=PASS
          BOUNDED_PATHS=PASS
          SYNTAX_GATE=PASS
          CARTERA_MATERIAL3_ROUTE=PASS
          CARTERA_NAV_BUTTON=PASS
          PUBLIC_QUERY_NAV_CARTERA=PASS
          PRODUCTIVE_AUTH_CLIENT_REUSE=PASS
          CANONICAL_CARTERA_DIRECTORY_REUSE=PASS
          CARTERA_030D_TO_100D_BINDING=PASS
          LOGOUT_SCRUB=PASS
          LATE_RESULT_REJECTION=PASS
          FLOATING_NAV_PRESERVED=YES
          MOBILE_NAV_CLEARANCE=PASS
          DIRECT_DATABASE_WRITE=NO
          POLICY_CREATION=NO
          PERSON_CREATION=NO
          CRM_MUTATION=NO
          CARTERA_MATERIAL3_PRODUCTIVE_UI_MOUNT=PASS
          MERGE_AUTHORIZATION=NOT_GRANTED
          PAGES_DEPLOYMENT=PENDING_CONTROLLED_MERGE
          \`\`\`
          EOF
          if [[ -n "$(git status --porcelain -- "$CLOSURE_PATH")" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$CLOSURE_PATH"
            git commit -m 'docs(cartera): close Material 3 productive UI mount acceptance'
            git push origin HEAD:feature/cartera-material3-productive-ui-mount
          fi
