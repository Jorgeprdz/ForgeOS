name: Pipeline Public Acceptance Visual Fix

on:
  push:
    branches:
      - fix/pipeline-public-acceptance-hotfix
    paths:
      - ".github/.pipeline-public-acceptance-visual-fix-trigger"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'Jorgeprdz'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pipeline-public-acceptance-hotfix
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply accepted compact-stage visual contract
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          hotfix_path = Path('docs/static-preview/forge-alive-material3/pipeline-public-acceptance-hotfix.js')
          hotfix = hotfix_path.read_text()
          old_identity = '''    .pipeline-module .pipeline-module__productive-identity {
              display: grid !important;
              grid-template-columns: minmax(0, 1fr) auto !important;
              grid-auto-flow: row !important;
              align-items: start !important;
              gap: 8px 10px !important;
            }

            .pipeline-module .pipeline-module__productive-name {
              grid-column: 1 !important;
              grid-row: 1 / span 2 !important;
              min-width: 0 !important;
            }
'''
          new_identity = '''    .pipeline-module .pipeline-module__productive-identity {
              position: relative !important;
              display: block !important;
              min-width: 0 !important;
            }

            .pipeline-module .pipeline-module__productive-name {
              width: 100% !important;
              min-width: 0 !important;
            }

            .pipeline-module .pipeline-module__productive-name > strong {
              box-sizing: border-box !important;
              display: block !important;
              width: 100% !important;
              min-width: 0 !important;
              padding-right: 118px !important;
            }
'''
          if old_identity not in hotfix:
              raise SystemExit('HOTFIX_IDENTITY_BLOCK_NOT_FOUND')
          hotfix = hotfix.replace(old_identity, new_identity, 1)

          old_stage = '''    .pipeline-module .pipeline-module__stage-control--compact {
              grid-column: 2 !important;
              grid-row: 1 !important;
              align-self: start !important;
              justify-self: end !important;
              width: auto !important;
              min-width: 0 !important;
              margin: 0 !important;
            }
'''
          new_stage = '''    .pipeline-module .pipeline-module__stage-control--compact {
              position: absolute !important;
              top: 0 !important;
              right: 0 !important;
              z-index: 2 !important;
              width: auto !important;
              min-width: 0 !important;
              margin: 0 !important;
            }
'''
          if old_stage not in hotfix:
              raise SystemExit('HOTFIX_STAGE_BLOCK_NOT_FOUND')
          hotfix = hotfix.replace(old_stage, new_stage, 1)

          old_mobile = '''    @media (max-width: 560px) {
              .pipeline-module .pipeline-module__productive-identity {
                grid-template-columns: minmax(0, 1fr) !important;
              }

              .pipeline-module .pipeline-module__productive-name,
              .pipeline-module .pipeline-module__stage-control--compact {
                grid-column: 1 !important;
                grid-row: auto !important;
              }

              .pipeline-module .pipeline-module__stage-control--compact {
                justify-self: start !important;
              }
            }
'''
          new_mobile = '''    @media (max-width: 560px) {
              .pipeline-module .pipeline-module__productive-identity {
                display: grid !important;
                grid-template-columns: minmax(0, 1fr) !important;
                gap: 8px !important;
              }

              .pipeline-module .pipeline-module__productive-name > strong {
                padding-right: 0 !important;
              }

              .pipeline-module .pipeline-module__stage-control--compact {
                position: static !important;
                justify-self: start !important;
              }
            }
'''
          if old_mobile not in hotfix:
              raise SystemExit('HOTFIX_MOBILE_BLOCK_NOT_FOUND')
          hotfix = hotfix.replace(old_mobile, new_mobile, 1)
          hotfix_path.write_text(hotfix)

          diagnostic_path = Path('tools/forge-ui-visual-diagnostic.mjs')
          diagnostic = diagnostic_path.read_text()
          old_wait = '''      await sampleCard.locator("[data-productive-stage-control]")
                .selectOption("decision");
              await page.locator("[data-productive-prospect-card]").filter({
                hasText: SAMPLE_REFERRAL.fullName,
              }).locator("[data-productive-stage-label]").filter({
                hasText: "En decisión",
              }).waitFor({ state: "visible", timeout: 10_000 });
'''
          new_wait = '''      await sampleCard.locator("[data-productive-stage-control]")
                .selectOption("decision");
              await page.waitForFunction(({ name, status }) => {
                const card = [...document.querySelectorAll("[data-productive-prospect-card]")]
                  .find(element => element.textContent.includes(name));
                return card?.querySelector("[data-productive-stage-control]")?.value === status;
              }, {
                name: SAMPLE_REFERRAL.fullName,
                status: "decision",
              }, { timeout: 10_000 });
'''
          if old_wait not in diagnostic:
              raise SystemExit('DIAGNOSTIC_STAGE_WAIT_NOT_FOUND')
          diagnostic = diagnostic.replace(old_wait, new_wait, 1)

          old_flag = '''      productiveStageLabelVisible:
                visibleCount("[data-productive-stage-label]") > 0,
'''
          new_flag = '''      productiveStageLabelVisible: (() => {
                const compactAuthority =
                  document.documentElement.dataset.pipelineStageAuthority
                    === "pipeline-public-acceptance-hotfix";
                if (compactAuthority) {
                  return visibleCount("[data-productive-stage-control]") > 0
                    && visibleCount("[data-productive-stage-label]") === 0;
                }
                return visibleCount("[data-productive-stage-label]") > 0;
              })(),
'''
          if old_flag not in diagnostic:
              raise SystemExit('DIAGNOSTIC_STAGE_FLAG_NOT_FOUND')
          diagnostic = diagnostic.replace(old_flag, new_flag, 1)
          diagnostic_path.write_text(diagnostic)

          test_path = Path('tests/pipeline-public-acceptance-hotfix-regression.mjs')
          test = test_path.read_text()
          old_assert = '''  const stageBox = await stageControl.boundingBox();
            assert.ok(stageBox && stageBox.height <= 36 && stageBox.width <= 160, "STAGE_CONTROL_NOT_COMPACT");
'''
          new_assert = '''  const stageBox = await stageControl.boundingBox();
            assert.ok(stageBox && stageBox.height <= 36 && stageBox.width <= 160, "STAGE_CONTROL_NOT_COMPACT");
            const nameBox = await firstCard.locator("[data-productive-card-identity] strong").boundingBox();
            assert.ok(nameBox && nameBox.width >= 180, "PRODUCTIVE_NAME_WIDTH_REGRESSION");
'''
          if old_assert not in test:
              raise SystemExit('HOTFIX_TEST_STAGE_ASSERT_NOT_FOUND')
          test_path.write_text(test.replace(old_assert, new_assert, 1))
          PY

          node --check docs/static-preview/forge-alive-material3/pipeline-public-acceptance-hotfix.js
          node --check tools/forge-ui-visual-diagnostic.mjs
          node --check tests/pipeline-public-acceptance-hotfix-regression.mjs

      - name: Commit clean visual closure
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/pipeline-public-acceptance-visual-fix.yml \
            .github/.pipeline-public-acceptance-visual-fix-trigger
          git config user.name "forgeos-visual-closure"
          git config user.email "actions@users.noreply.github.com"
          git add \
            docs/static-preview/forge-alive-material3/pipeline-public-acceptance-hotfix.js \
            tools/forge-ui-visual-diagnostic.mjs \
            tests/pipeline-public-acceptance-hotfix-regression.mjs
          git commit -m "fix(pipeline): align compact stage visual contract"
          git push origin HEAD:fix/pipeline-public-acceptance-hotfix
