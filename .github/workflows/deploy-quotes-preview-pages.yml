name: Deploy Quotes Preview to Pages

on:
  push:
    branches:
      - fix/quote-calculators-product-intelligence-parity
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  statuses: write

concurrency:
  group: quotes-preview-pages
  cancel-in-progress: true

jobs:
  validate-dispatch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preserve locked ORVI
        run: node tests/ui-m05h-orvi-commercial-document-test.mjs

      - name: Validate Vida Mujer Pages landscape closure
        run: node tests/ui-m05k-vida-mujer-pages-landscape-test.mjs

      - name: Dispatch and verify canonical Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
          PAGE_URL: https://jorgeprdz.github.io/ForgeOS/static-preview/forge-alive/index-quote-calculator-parity.html?nav=cotizaciones
        run: |
          set -euo pipefail
          run_id=""

          post_status() {
            local state="$1"
            local description="$2"
            local target_url="${3:-$PAGE_URL}"
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
              -f state="$state" \
              -f context="pages/quotes-preview" \
              -f description="$description" \
              -f target_url="$target_url" >/dev/null
          }

          fail_deploy() {
            local code=$?
            local target="$PAGE_URL"
            local description="GitHub Pages preview deployment failed"
            if [[ -n "$run_id" ]]; then
              target="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
              description="Pages run $run_id failed"
              gh run view "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --log-failed || true
            fi
            post_status failure "$description" "$target"
            exit "$code"
          }

          trap fail_deploy ERR
          post_status pending "Publishing Quotes preview to GitHub Pages"

          printf 'PAGES_DEPLOY_REF=%s\n' "$TARGET_REF"
          printf 'PAGES_DEPLOY_SHA=%s\n' "$TARGET_SHA"

          gh workflow run pages.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TARGET_REF"

          for attempt in $(seq 1 30); do
            run_id="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow pages.yml \
                --branch "$TARGET_REF" \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,headSha,createdAt \
                --jq '.[] | select(.headSha == env.TARGET_SHA) | .databaseId' \
                | head -n 1
            )"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 4
          done

          if [[ -z "$run_id" ]]; then
            echo "BLOCKED=PAGES_RUN_NOT_FOUND"
            exit 1
          fi

          printf 'PAGES_RUN_ID=%s\n' "$run_id"
          gh run watch "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status \
            --interval 10

          post_status success "Quotes preview published to GitHub Pages"
          trap - ERR
          printf 'PAGES_DEPLOYMENT=PASS\n'
          printf 'PAGES_URL=%s\n' "$PAGE_URL"