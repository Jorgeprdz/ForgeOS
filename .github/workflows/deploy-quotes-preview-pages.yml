name: Deploy Quotes Preview to Pages

on:
  push:
    branches:
      - fix/quote-calculators-product-intelligence-parity
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Mark preview deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          PAGE_URL: https://jorgeprdz.github.io/ForgeOS/static-preview/forge-alive/index-quote-calculator-parity.html?nav=cotizaciones
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=pending \
            -f context=pages/quotes-preview \
            -f description="Publishing Quotes preview" \
            -f target_url="$PAGE_URL" >/dev/null

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preserve locked ORVI
        run: node tests/ui-m05h-orvi-commercial-document-test.mjs

      - name: Validate Vida Mujer Pages landscape closure
        run: node tests/ui-m05k-vida-mujer-pages-landscape-test.mjs

      - name: Validate GitHub Pages public configuration
        env:
          DEMO_MODE: ${{ vars.DEMO_MODE || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ "$DEMO_MODE" != "true" ]; then
            if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
              echo "Error: SUPABASE_URL and SUPABASE_ANON_KEY are required"
              exit 1
            fi
          fi
          node -e "if(process.env.DEMO_MODE!=='true'){const u=new URL(process.env.SUPABASE_URL);if(u.hostname!=='rmlxigxysujsuwzgoimv.supabase.co')throw new Error('SUPABASE_URL_PROJECT_REF_MISMATCH')}"

      - name: Generate env.js
        env:
          DEMO_MODE: ${{ vars.DEMO_MODE || 'false' }}
          ENABLE_TEST_ADVISOR_LOGIN: ${{ vars.ENABLE_TEST_ADVISOR_LOGIN || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const env = {
            SUPABASE_URL: process.env.SUPABASE_URL || "",
            SUPABASE_KEY: process.env.SUPABASE_ANON_KEY || "",
            DEMO_MODE: process.env.DEMO_MODE === "true" ? "true" : "false",
            ENABLE_TEST_ADVISOR_LOGIN:
              process.env.ENABLE_TEST_ADVISOR_LOGIN === "true" ? "true" : "false"
          };
          fs.writeFileSync(
            'env.js',
            `window.__ENV__ = Object.freeze(${JSON.stringify(env, null, 2)});\n`,
          );
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate Advisor OS presentation Pages runtime
        run: node scripts/build-advisor-presentation-pages-runtime.mjs

      - name: Build Quotes preview artifact
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/build-quotes-preview-pages.mjs

      - name: Validate generated public configuration
        run: node scripts/validate-pages-public-config.mjs _site/env.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published Quotes preview
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BUILD_INFO_URL: https://jorgeprdz.github.io/ForgeOS/build-info.json
          QUOTES_URL: https://jorgeprdz.github.io/ForgeOS/static-preview/forge-alive/index-quote-calculator-parity.html?nav=cotizaciones
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if node - <<'EOF'
          const expected = process.env.EXPECTED_SHA;
          const cacheBust = Date.now();
          const buildResponse = await fetch(`${process.env.BUILD_INFO_URL}?cb=${cacheBust}`, {
            cache: 'no-store',
          });
          if (!buildResponse.ok) process.exit(1);
          const build = await buildResponse.json();
          if (build.commitSha !== expected) process.exit(1);
          const quoteResponse = await fetch(`${process.env.QUOTES_URL}&cb=${cacheBust}`, {
            cache: 'no-store',
          });
          if (!quoteResponse.ok) process.exit(1);
          const html = await quoteResponse.text();
          if (!html.includes('CALCULADORAS M05E-010')) process.exit(1);
          console.log(`PAGES_PREVIEW_HTTP=PASS sha=${build.commitSha}`);
          EOF
            then
              echo "PAGES_URL=$QUOTES_URL"
              exit 0
            fi
            sleep 5
          done
          echo "PAGES_PREVIEW_HTTP=FAIL"
          exit 1

      - name: Mark preview deployment successful
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          PAGE_URL: https://jorgeprdz.github.io/ForgeOS/static-preview/forge-alive/index-quote-calculator-parity.html?nav=cotizaciones
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=success \
            -f context=pages/quotes-preview \
            -f description="Quotes preview published and verified" \
            -f target_url="$PAGE_URL" >/dev/null

      - name: Mark preview deployment failed
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          ACTIONS_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=failure \
            -f context=pages/quotes-preview \
            -f description="Quotes preview deployment failed" \
            -f target_url="$ACTIONS_URL" >/dev/null
