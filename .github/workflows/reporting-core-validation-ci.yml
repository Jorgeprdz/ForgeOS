name: Reporting Core Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/reporting-core-validation-ci.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor == 'Jorgeprdz'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/rep-16f-pages-mjs-publication
          fetch-depth: 0

      - name: Apply exact Pages mjs publication boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pages.yml')
          text = path.read_text()

          old_extension = """            '.map',
            '.png',"""
          new_extension = """            '.map',
            '.mjs',
            '.png',"""
          if text.count(old_extension) != 1:
              raise SystemExit(
                  f"expected one public extension boundary, got {text.count(old_extension)}"
              )
          text = text.replace(old_extension, new_extension)

          old_validation = """          for (const file of requiredConversationRuntime) {
            assert.ok(fs.existsSync(path.join('_site', file)), `missing governed runtime asset: ${file}`);
          }

          const rootIndex = fs.readFileSync('_site/index.html', 'utf8');"""
          new_validation = """          for (const file of requiredConversationRuntime) {
            assert.ok(fs.existsSync(path.join('_site', file)), `missing governed runtime asset: ${file}`);
          }
          const requiredActivityRuntime = [
            'advisor-os/reporting/infrastructure/fes-activity-report-source-adapter.mjs',
            'advisor-os/reporting/runtime/activity-reporting-runtime.mjs',
            'advisor-os/reporting/runtime/universal-reporting-kernel.mjs',
            'platform/event-evidence/canonical-activity-event-contract.js',
            'platform/event-evidence/activity-ledger-contract.js',
            'platform/event-evidence/activity-ledger-local-store.js',
            'platform/event-evidence/activity-ledger-sync-service.js',
            'platform/event-evidence/activity-ledger-supabase-gateway.js',
            'platform/event-evidence/activity-ledger-browser-runtime.js',
          ];
          for (const file of requiredActivityRuntime) {
            assert.ok(
              fs.existsSync(path.join('_site', file)),
              `missing productive Activity runtime asset: ${file}`,
            );
          }

          const rootIndex = fs.readFileSync('_site/index.html', 'utf8');"""
          if text.count(old_validation) != 1:
              raise SystemExit(
                  f"expected one Pages validation boundary, got {text.count(old_validation)}"
              )
          text = text.replace(old_validation, new_validation)
          path.write_text(text)
          PY

      - name: Validate exact publication contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/pages.yml').read_text()
          assert text.count("'.mjs',") == 1
          for asset in [
              'advisor-os/reporting/infrastructure/fes-activity-report-source-adapter.mjs',
              'advisor-os/reporting/runtime/activity-reporting-runtime.mjs',
              'advisor-os/reporting/runtime/universal-reporting-kernel.mjs',
              'platform/event-evidence/activity-ledger-browser-runtime.js',
          ]:
              assert asset in text, asset
          assert 'requiredActivityRuntime' in text
          print('REP_16F_PAGES_MJS_PUBLIC_EXTENSION=PASS')
          print('REP_16F_PAGES_ACTIVITY_ASSET_ASSERTIONS=PASS')
          PY
          FORGE_PAGES_RUNTIME_MODE=pages node scripts/build-advisor-presentation-pages-runtime.mjs
          test -f docs/advisor-os/reporting/runtime/activity-reporting-runtime.mjs
          test -f docs/platform/event-evidence/activity-ledger-browser-runtime.js
          git reset -q HEAD -- docs/advisor-os docs/platform docs/static-preview/forge-alive-material3/activity-ledger-reporting-bridge.mjs
          rm -rf docs/advisor-os docs/platform
          git checkout -- docs/static-preview/forge-alive-material3/activity-ledger-reporting-bridge.mjs

      - name: Commit clean hotfix and restore CI workflow
        run: |
          git config user.name "ForgeOS Governance Bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout 74706bdeb4f000761a109e08f0a7f4267c8ea494 -- .github/workflows/reporting-core-validation-ci.yml
          git add .github/workflows/pages.yml .github/workflows/reporting-core-validation-ci.yml
          git commit -m "REP-16F publish mjs Activity assets in Pages"
          git push origin HEAD:hotfix/rep-16f-pages-mjs-publication
