name: Manual Quotes and Pipeline Stability

on:
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - service-worker.js
      - docs/static-preview/forge-alive/**
      - docs/static-preview/forge-alive-material3/**
      - supabase/migrations/20260731000200_pipeline_prospect_stage_rpc.sql
      - tests/legacy-ui-retirement-regression.mjs
      - tests/pipeline-stage-rpc-authority-regression.mjs
      - tests/manual-quotes-pipeline-stability-test.mjs
      - tools/manual-ui-stability-check.mjs
      - .github/workflows/manual-ui-stability.yml
      - .github/workflows/pages-public-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-ui-stability-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused UI regressions
        run: >-
          node --test
          tests/ui-m05-material3-quotes-test.mjs
          tests/material3-pipeline-integration-test.mjs
          tests/manual-quotes-pipeline-stability-test.mjs
          tests/legacy-ui-retirement-regression.mjs
          tests/pipeline-stage-rpc-authority-regression.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Vite
        shell: bash
        run: |
          nohup npm run serve:e2e > /tmp/forge-manual-vite.log 2>&1 &
          echo $! > /tmp/forge-manual-vite.pid
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:4173/docs/static-preview/forge-alive-material3/ \
              > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/forge-manual-vite.log
            false
          fi

      - name: Verify stage color and layout stability in Chromium
        run: node tools/manual-ui-stability-check.mjs
