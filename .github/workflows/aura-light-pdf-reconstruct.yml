name: Aura Light PDF Reconstruct

on:
  push:
    branches:
      - governance/forge-aura-light-2026-authority
    paths:
      - '.aura-upload/chunk-*.b64'

permissions:
  contents: write

concurrency:
  group: aura-light-pdf-reconstruct
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for complete chunk set
        id: chunks
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .aura-upload -maxdepth 1 -type f -name 'chunk-*.b64' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -ne 12 ]; then
            echo "Chunk set incomplete: $count/12. Nothing to reconstruct yet."
          fi

      - name: Reconstruct and verify canonical PDF
        if: steps.chunks.outputs.count == '12'
        shell: bash
        run: |
          set -euo pipefail
          target='docs/05-foundation/design-system/Forge_Aura_Light_2026_Sistema_de_Diseno.pdf'
          mkdir -p "$(dirname "$target")"
          cat .aura-upload/chunk-*.b64 | base64 --decode > "$target"
          actual=$(sha256sum "$target" | awk '{print $1}')
          expected='0dbda2ae17d80602c7943bf139015177dbeb340a5edd5d9a5983bd24d5b6672e'
          test "$actual" = "$expected"
          test "$(stat -c%s "$target")" = '509973'
          rm -rf .aura-upload

      - name: Commit reconstructed artifact
        if: steps.chunks.outputs.count == '12'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Forge Governance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/05-foundation/design-system/Forge_Aura_Light_2026_Sistema_de_Diseno.pdf .aura-upload
          if git diff --cached --quiet; then
            echo 'No artifact change to commit.'
            exit 0
          fi
          git commit -m 'docs(design-system): add canonical Aura Light 2026 PDF'
          git push origin HEAD:governance/forge-aura-light-2026-authority
