name: CARTERA 010B Foundation

on:
  push:
    branches:
      - feature/cartera-010b-commercial-person-policy-role-foundation
  pull_request:
    branches:
      - docs/cartera-010a-identity-policy-persistence-scope
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartera-010b-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-persistence-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Source ancestry and bounded path gate
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT=824dc48c74423cb1beb8b85a124d071b88ecf6a1
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          git diff --check "$SOURCE_COMMIT"...HEAD

          mapfile -t changed < <(git diff --name-only "$SOURCE_COMMIT"...HEAD)
          printf 'CHANGED_FILE=%s\n' "${changed[@]}"

          allowed='^(schemas/(commercial-person-v1|commercial-account-v1|policy-v2|policy-role-v1)\.schema\.json|platform/shared-commercial-model/cartera-010b-contract-validator\.js|supabase/migrations/202607310002(00_cartera010b_identity_policy_foundation|10_cartera010b_command_helpers|11_cartera010b_identity_resolution_rpc|12_cartera010b_confirmed_policy_rpc|13_cartera010b_identity_resolution_precedence_hardening|14_cartera010b_conflict_insert_ambiguity_hardening|15_cartera010b_general_policy_role_read_authority)\.sql|scripts/ci/cartera-010b-[A-Za-z0-9._-]+\.(mjs|sql)|tests/cartera-010b-[A-Za-z0-9._-]+\.mjs|docs/architecture/source-truth/FORGE_CARTERA_010B_(PERSISTENCE_FOUNDATION_PROGRESS_001|GOVERNED_COMMAND_RPCS_PROGRESS_002)\.md|docs/evidence/FORGE_CARTERA_010B_REMOTE_ACCEPTANCE_(PREPARATION|CLOSURE)_001\.md|\.github/workflows/cartera-010b-(foundation|remote-acceptance)\.yml)$'

          for path in "${changed[@]}"; do
            if [[ ! "$path" =~ $allowed ]]; then
              echo "UNAUTHORIZED_010B_PATH=$path" >&2
              exit 1
            fi
          done

          echo 'SOURCE_ANCESTRY=PASS'
          echo 'BOUNDED_PATHS=PASS'
          echo 'PRODUCT_UI_DIFF=NONE'

      - name: JavaScript syntax gate
        shell: bash
        run: |
          set -euo pipefail
          node --check platform/shared-commercial-model/cartera-010b-contract-validator.js
          for file in scripts/ci/cartera-010b-*.mjs tests/cartera-010b-*.mjs; do
            node --check "$file"
          done

      - name: Execute complete 010B tests
        run: node --test tests/cartera-010b-*.mjs

      - name: Verify integrated remote closure evidence
        shell: bash
        run: |
          set -euo pipefail
          closure=docs/evidence/FORGE_CARTERA_010B_REMOTE_ACCEPTANCE_CLOSURE_001.md
          test -f "$closure"
          grep -q 'CARTERA_010B_REMOTE_DEPLOYMENT=PASS' "$closure"
          grep -q 'CARTERA_010B_REMOTE_ACCEPTANCE=PASS' "$closure"
          grep -q 'TEST_FIXTURES_ROLLED_BACK=YES' "$closure"
          grep -q 'RESIDUAL_FIXTURES=0' "$closure"

      - name: Emit closure markers
        run: |
          echo 'CARTERA_010B_CONTRACT_VALIDATORS=PASS'
          echo 'CARTERA_010B_PERSISTENCE_FOUNDATION=REPOSITORY_READY'
          echo 'CARTERA_010B_GOVERNED_COMMAND_RPCS=REPOSITORY_READY'
          echo 'CARTERA_010B_REMOTE_DEPLOYMENT=PASS_FROM_ACCEPTED_CLOSURE'
          echo 'CARTERA_010B_REMOTE_ACCEPTANCE=PASS_FROM_ACCEPTED_CLOSURE'
          echo 'CARTERA_010B_COMPLETE=YES'
          echo 'NEXT=CARTERA_010C'
