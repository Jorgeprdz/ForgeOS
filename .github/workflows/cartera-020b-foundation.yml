name: CARTERA 020B Foundation Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartera-020b-foundation-archived-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-accepted-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Verify immutable 020B closure evidence
        shell: bash
        run: |
          set -euo pipefail
          closure=docs/evidence/FORGE_CARTERA_020B_REMOTE_ACCEPTANCE_CLOSURE_001.md
          grep -q 'STATUS=CLOSED_REMOTE_ACCEPTED' "$closure"
          grep -q 'WORKFLOW_RUN=30663283378' "$closure"
          grep -q 'WORKFLOW_JOB=91264294890' "$closure"
          grep -q 'ARTIFACT_ID=8805971667' "$closure"
          grep -q 'ARTIFACT_SHA256=0f9ed05a298712d4dfb8ee3e57a9c5c0a93ed0d36338cb8e79a8c46e92e27df9' "$closure"
          grep -q 'CARTERA_020B_REMOTE_DEPLOYMENT=PASS' "$closure"
          grep -q 'CARTERA_020B_REMOTE_ACCEPTANCE=PASS' "$closure"
          grep -q 'RESIDUAL_FIXTURES=0' "$closure"
          grep -q 'CARTERA_020B_COMPLETE=YES' "$closure"

      - name: Verify remote workflows remain manual only
        shell: bash
        run: |
          set -euo pipefail
          for workflow in \
            .github/workflows/cartera-020b-remote-acceptance.yml \
            .github/workflows/cartera-020b-migration-history-diagnostic.yml \
            .github/workflows/cartera-020b-attempt-contract-diagnostic.yml \
            .github/workflows/cartera-020b-final-inbox-state-diagnostic.yml; do
            grep -q '^  workflow_dispatch:' "$workflow"
            ! grep -qE '^  (push|pull_request):' "$workflow"
          done
          echo 'REMOTE_WORKFLOWS=MANUAL_ONLY'
          echo 'SUPABASE_REMOTE_MUTATION=NONE'

      - name: Emit archived closure markers
        run: |
          echo 'CARTERA_020B_COMPLETE=YES'
          echo 'CARTERA_020B_GATE=ARCHIVED_MANUAL_ONLY'
          echo 'NEXT=CARTERA_020C_IDENTITY_AND_POLICY_CONFIRMATION_REVIEW'
