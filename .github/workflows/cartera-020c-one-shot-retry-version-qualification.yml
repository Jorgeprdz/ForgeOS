name: CARTERA 020C Retired One-Shot Retry Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'WORKFLOW_STATUS=RETIRED'
          echo 'REMOTE_MUTATION=IMPOSSIBLE'
          echo 'CARTERA_020C_COMPLETE=YES'
