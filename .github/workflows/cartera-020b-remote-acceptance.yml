name: CARTERA 020B Remote Acceptance

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Type YES:CARTERA_020B_REMOTE_MUTATION
        required: true
        type: string
      expected_source_head:
        description: Exact accepted 020B implementation head
        required: true
        type: string
      expected_acceptance_head:
        description: Exact remote-acceptance branch head to execute
        required: true
        type: string
      project_ref:
        description: Exact Supabase project ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cartera-020b-remote-acceptance
  cancel-in-progress: false

jobs:
  remote-deployment-and-acceptance:
    if: github.repository == 'Jorgeprdz/ForgeOS'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
      CARTERA_020B_REMOTE_MUTATION_AUTHORIZED: ${{ inputs.authorization }}
      CARTERA_020B_EXPECTED_SOURCE_HEAD: ${{ inputs.expected_source_head }}
      CARTERA_020B_EXPECTED_ACCEPTANCE_HEAD: ${{ inputs.expected_acceptance_head }}
      CARTERA_020B_ACCEPTANCE_BRANCH: feature/cartera-020b-remote-acceptance

    steps:
      - name: Checkout exact authorized acceptance head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_acceptance_head }}
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Authorization, source and bounded-path gate
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT=95d03f220670239fc7c2af9ab5799bb21406cbd0
          test "$CARTERA_020B_REMOTE_MUTATION_AUTHORIZED" = 'YES:CARTERA_020B_REMOTE_MUTATION'
          test "$CARTERA_020B_EXPECTED_SOURCE_HEAD" = "$SOURCE_COMMIT"
          test "$SUPABASE_PROJECT_REF" = 'rmlxigxysujsuwzgoimv'
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$(git rev-parse HEAD)" = "$CARTERA_020B_EXPECTED_ACCEPTANCE_HEAD"
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          git diff --check "$SOURCE_COMMIT"...HEAD

          mapfile -t changed < <(git diff --name-only "$SOURCE_COMMIT"...HEAD)
          printf 'CHANGED_FILE=%s\n' "${changed[@]}"
          allowed='^(\.github/workflows/cartera-020b-remote-(gate|acceptance)\.yml|docs/evidence/FORGE_CARTERA_020B_REMOTE_ACCEPTANCE_(PREPARATION|CLOSURE)_001\.md|scripts/ci/cartera-020b-(github-actions-remote-acceptance|conflict-ambiguity-hardening-deploy|migration-history-diagnostic)\.mjs|scripts/ci/cartera-020b-remote-acceptance\.sql|supabase/migrations/2026073100022(7_cartera020b_packet_replay_hardening|8_cartera020b_conflict_insert_ambiguity_hardening)\.sql|tests/cartera-020b-(packet-replay-hardening|conflict-ambiguity-hardening|remote-acceptance-harness|migration-history-reconciliation)-test\.mjs)$'
          for path in "${changed[@]}"; do
            if [[ ! "$path" =~ $allowed ]]; then
              echo "UNAUTHORIZED_020B_REMOTE_PATH=$path" >&2
              exit 1
            fi
          done

          mkdir -p artifacts/cartera-020b-remote-acceptance
          echo 'REMOTE_AUTHORIZATION=PASS'
          echo 'SOURCE_ANCESTRY=PASS'
          echo 'BOUNDED_REMOTE_PATHS=PASS'
          echo 'PRODUCT_UI_DIFF=NONE'

      - name: Repository and harness gate
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/ci/cartera-020b-github-actions-remote-acceptance.mjs
          node --check scripts/ci/cartera-020b-conflict-ambiguity-hardening-deploy.mjs
          node --check tests/cartera-020b-packet-replay-hardening-test.mjs
          node --check tests/cartera-020b-conflict-ambiguity-hardening-test.mjs
          node --check tests/cartera-020b-remote-acceptance-harness-test.mjs
          node --test tests/cartera-020b-*.mjs

      - name: Apply and verify conflict insert ambiguity hardening
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/cartera-020b-conflict-ambiguity-hardening-deploy.mjs \
            | tee artifacts/cartera-020b-remote-acceptance/conflict-ambiguity-hardening-output.log
          grep -q 'CARTERA020B_CONFLICT_INSERT_AMBIGUITY_HARDENING=PASS' \
            artifacts/cartera-020b-remote-acceptance/conflict-ambiguity-hardening-output.log

      - name: Deploy and execute remote acceptance
        shell: bash
        run: |
          set -euo pipefail
          CARTERA_020B_ACTUAL_ACCEPTANCE_HEAD="$(git rev-parse HEAD)" \
            node scripts/ci/cartera-020b-github-actions-remote-acceptance.mjs \
            | tee artifacts/cartera-020b-remote-acceptance/workflow-output.log

      - name: Verify explicit acceptance markers
        shell: bash
        run: |
          set -euo pipefail
          log=artifacts/cartera-020b-remote-acceptance/workflow-output.log
          grep -q 'CARTERA_020B_REMOTE_DEPLOYMENT=PASS' "$log"
          grep -q 'CARTERA_020B_TRANSACTIONAL_ACCEPTANCE=PASS' "$log"
          grep -q 'PARALLEL_WORKER_CLAIM_SERIALIZATION=PASS' "$log"
          grep -q 'PACKET_TO_CONFIRMATION_HANDOFF=PASS' "$log"
          grep -q 'RLS_CROSS_ADVISOR=PASS' "$log"
          grep -q 'DIRECT_WRITES=BLOCKED' "$log"
          grep -q 'TEST_FIXTURES_ROLLED_BACK=YES' "$log"
          grep -q 'CONCURRENCY_FIXTURES_CLEANED=YES' "$log"
          grep -q 'RESIDUAL_FIXTURES=0' "$log"
          grep -q 'CARTERA_020B_REMOTE_ACCEPTANCE=PASS' "$log"

      - name: Upload remote acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartera-020b-remote-acceptance
          path: artifacts/cartera-020b-remote-acceptance
          if-no-files-found: error
          retention-days: 30
