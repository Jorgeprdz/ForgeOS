name: One Shot M05X Cache Key

on:
  push:
    branches:
      - fix/vida-mujer-pdf-main-thread
    paths:
      - .github/workflows/one-shot-m05x-cache-key.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/one-shot-m05x-cache-key.yml

permissions:
  contents: write

jobs:
  update-cache-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vida-mujer-pdf-main-thread
      - name: Bump Material 3 app cache key
        shell: bash
        run: |
          set -euo pipefail
          sed -i \
            's#./app.js?v=ui-m05w-printable-modal-layer-001&rep=16e-002#./app.js?v=ui-m05x-quote-intake-ready-001\&rep=16e-002#' \
            docs/static-preview/forge-alive-material3/index.html
          grep -F 'ui-m05x-quote-intake-ready-001&rep=16e-002' \
            docs/static-preview/forge-alive-material3/index.html
          rm .github/workflows/one-shot-m05x-cache-key.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): bust cache for quote intake readiness"
          git push origin HEAD:fix/vida-mujer-pdf-main-thread
