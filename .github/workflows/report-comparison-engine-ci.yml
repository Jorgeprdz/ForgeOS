name: REP Comparison and Baseline CI

on:
  push:
    branches:
      - feature/universal-reporting-kernel-foundation
    paths:
      - advisor-os/reporting/domain/report-comparison-definition.mjs
      - advisor-os/reporting/runtime/report-comparison-engine.mjs
      - tests/report-comparison-engine-test.mjs
      - docs/architecture/reporting/REP-05_COMPARISON_AND_BASELINE_ENGINE.md
      - .github/workflows/report-comparison-engine-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparison:
    name: Comparison and baseline engine acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify REP-04 closure
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq \
            'REP_04_UNIVERSAL_REPORT_MODEL_AND_AGGREGATION_RUNTIME=CLOSED' \
            docs/architecture/reporting/REP-04_UNIVERSAL_REPORT_MODEL_AND_AGGREGATION_RUNTIME_CLOSURE.md

      - name: Verify Activity foundation
        shell: bash
        run: |
          set -Eeuo pipefail
          node \
            scripts/ci/verify-activity-foundation-freeze.mjs \
            | tee REP05_ACTIVITY_FREEZE.txt

      - name: Run comparison engine tests
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test \
            --test-reporter=tap \
            tests/report-comparison-engine-test.mjs \
            | tee REP05_COMPARISON.tap

          grep -Fq '# tests 40' REP05_COMPARISON.tap
          grep -Fq '# pass 40' REP05_COMPARISON.tap
          grep -Fq '# fail 0' REP05_COMPARISON.tap

      - name: Run aggregation regression
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test \
            --test-reporter=tap \
            tests/universal-report-aggregation-runtime-test.mjs \
            | tee REP05_AGGREGATION.tap

          grep -Fq '# tests 41' REP05_AGGREGATION.tap
          grep -Fq '# pass 41' REP05_AGGREGATION.tap
          grep -Fq '# fail 0' REP05_AGGREGATION.tap

      - name: Run provider regression
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test \
            --test-reporter=tap \
            tests/report-provider-runtime-test.mjs \
            | tee REP05_PROVIDER.tap

          grep -Fq '# tests 40' REP05_PROVIDER.tap
          grep -Fq '# pass 40' REP05_PROVIDER.tap
          grep -Fq '# fail 0' REP05_PROVIDER.tap

      - name: Run resolver regression
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test \
            --test-reporter=tap \
            tests/universal-period-resolver-test.mjs \
            | tee REP05_RESOLVER.tap

          grep -Fq '# tests 46' REP05_RESOLVER.tap
          grep -Fq '# pass 46' REP05_RESOLVER.tap
          grep -Fq '# fail 0' REP05_RESOLVER.tap

      - name: Run kernel regression
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test \
            --test-reporter=tap \
            tests/universal-reporting-kernel-test.mjs \
            | tee REP05_KERNEL.tap

          grep -Fq '# tests 25' REP05_KERNEL.tap
          grep -Fq '# pass 25' REP05_KERNEL.tap
          grep -Fq '# fail 0' REP05_KERNEL.tap

      - name: Run Performance surface regression
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test \
            --test-reporter=tap \
            tests/performance-surface-adapter-test.mjs \
            | tee REP05_PERFORMANCE.tap

          grep -Fq '# tests 20' REP05_PERFORMANCE.tap
          grep -Fq '# pass 20' REP05_PERFORMANCE.tap
          grep -Fq '# fail 0' REP05_PERFORMANCE.tap

      - name: Verify repository hygiene
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check

      - name: Build acceptance evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/reporting

          printf '%s\n' \
            'REP_05_COMPARISON_AND_BASELINE_ENGINE=IMPLEMENTED' \
            "COMMIT=$GITHUB_SHA" \
            'REMOTE_REP04_CLOSURE=PASS' \
            'REMOTE_ACTIVITY_FREEZE=PASS' \
            'REMOTE_COMPARISON_TEST=PASS' \
            'REMOTE_AGGREGATION_REGRESSION=PASS' \
            'REMOTE_PROVIDER_REGRESSION=PASS' \
            'REMOTE_RESOLVER_REGRESSION=PASS' \
            'REMOTE_KERNEL_REGRESSION=PASS' \
            'REMOTE_PERFORMANCE_REGRESSION=PASS' \
            'COMPARISON_ENGINE_SCHEMA=report-comparison-engine.v1' \
            'COMPARISON_AUTHORITY=YES' \
            'FAVORABILITY_AUTHORITY=NO' \
            'RANKING_AUTHORITY=NO' \
            'HUMAN_WORTH_AUTHORITY=NO' \
            'PRODUCTIVE_UI_MUTATION=NO' \
            'REMOTE_DATABASE_MUTATION=NO' \
            > artifacts/reporting/REP05_ACCEPTANCE.txt

          cp \
            REP05_ACTIVITY_FREEZE.txt \
            REP05_COMPARISON.tap \
            REP05_AGGREGATION.tap \
            REP05_PROVIDER.tap \
            REP05_RESOLVER.tap \
            REP05_KERNEL.tap \
            REP05_PERFORMANCE.tap \
            artifacts/reporting/

      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: rep-05-comparison-baseline-${{ github.sha }}
          path: artifacts/reporting
          if-no-files-found: error
          retention-days: 60
