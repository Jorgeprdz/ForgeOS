name: One Shot M05T Cache Key

on:
  push:
    branches:
      - fix/vida-mujer-pdf-main-thread
    paths:
      - .github/workflows/one-shot-m05t-cache-key.yml

permissions:
  contents: write

jobs:
  update-cache-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vida-mujer-pdf-main-thread
      - name: Bump Material 3 app cache key
        shell: bash
        run: |
          set -euo pipefail
          sed -i \
            's#./app.js?v=ui-m05m-print-actions-eager-001&rep=16e-002#./app.js?v=ui-m05t-vida-mujer-coalesced-001\&rep=16e-002#' \
            docs/static-preview/forge-alive-material3/index.html
          grep -F 'ui-m05t-vida-mujer-coalesced-001&rep=16e-002' \
            docs/static-preview/forge-alive-material3/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/static-preview/forge-alive-material3/index.html
          git commit -m "fix(ui): bust cache for M05T visual scheduler"
          git push origin HEAD:fix/vida-mujer-pdf-main-thread
