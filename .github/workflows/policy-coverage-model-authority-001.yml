name: Policy Coverage Model Authority 001

on:
  pull_request:
    paths:
      - 'schemas/policy-v2-coverage.schema.json'
      - 'platform/policy-intelligence/policy-coverage-contract.js'
      - 'supabase/migrations/20260808000100_policy_coverage_canonical_extension.sql'
      - 'supabase/migrations/20260808000110_policy_coverage_read_after_write_versioning_hotfix.sql'
      - 'tests/fixtures/policy-coverage-multi-benefit.synthetic.json'
      - 'tests/policy-coverage-model-authority.test.mjs'
      - 'tests/policy-coverage-read-after-write-versioning-hotfix.test.mjs'
      - 'docs/architecture/source-truth/FORGE_CARTERA_POLICY_COVERAGE_MODEL_AUTHORITY_001.md'
      - 'docs/architecture/source-truth/FORGE_POLICY_COVERAGE_READ_AFTER_WRITE_VERSIONING_HOTFIX_001.md'
      - 'docs/evidence/FORGE_CARTERA_POLICY_COVERAGE_MODEL_ACCEPTANCE_001.md'
      - '.github/workflows/policy-coverage-model-authority-001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-coverage-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Targeted Policy Coverage authority and versioning hotfix tests
        run: >-
          node --test
          tests/policy-coverage-model-authority.test.mjs
          tests/policy-coverage-read-after-write-versioning-hotfix.test.mjs
      - name: Inherited Policy and Cartera 010/020 regressions
        run: >-
          node --test
          tests/cartera-010b-contract-foundation-test.mjs
          tests/cartera-010b-precedence-hardening-test.mjs
          tests/cartera-010b-general-role-read-authority-test.mjs
          tests/cartera-020c-persistent-confirmation-orchestration-contract-test.mjs
