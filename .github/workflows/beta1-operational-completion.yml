name: Beta 1 Operational Completion

on:
  pull_request:
    paths:
      - "docs/static-preview/forge-alive-material3/pipeline-bulk-import-mount.*"
      - "docs/static-preview/forge-alive-material3/cartera-document-intake.js"
      - "docs/static-preview/forge-alive-material3/cartera-module.js"
      - "docs/static-preview/forge-alive-material3/whatsapp-ai-composer.js"
      - "docs/static-preview/forge-alive-material3/pipeline-stage-filter-authority.js"
      - "scripts/prepare-cartera-policy-entry-pages-runtime.mjs"
      - "scripts/build-advisor-presentation-pages-runtime.mjs"
      - "supabase/functions/whatsapp-draft/**"
      - "supabase/functions/cartera-pdf-intake/**"
      - "tests/beta1-operational-completion-test.mjs"
      - ".github/workflows/beta1-operational-completion.yml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Beta 1 contract tests
        run: |
          node tests/pipeline-bulk-import-mount-test.mjs
          node tests/beta1-operational-completion-test.mjs
      - name: Validate browser JavaScript syntax
        run: |
          for file in \
            docs/static-preview/forge-alive-material3/pipeline-bulk-import-mount.js \
            docs/static-preview/forge-alive-material3/cartera-document-intake.js \
            docs/static-preview/forge-alive-material3/cartera-module.js \
            docs/static-preview/forge-alive-material3/whatsapp-ai-composer.js \
            docs/static-preview/forge-alive-material3/pipeline-stage-filter-authority.js \
            scripts/prepare-cartera-policy-entry-pages-runtime.mjs; do
            node --check "$file"
          done
      - name: Reject browser secrets and duplicate message authority
        run: |
          ! grep -RIE 'AIza[0-9A-Za-z_-]{20,}|GEMINI_API_KEY\s*=' docs/static-preview/forge-alive-material3
          grep -q 'installsClickInterceptor: false' docs/static-preview/forge-alive-material3/whatsapp-ai-composer.js
          grep -q 'rawPipelineForwardedToProvider: false' docs/static-preview/forge-alive-material3/whatsapp-ai-composer.js
          ! grep -qE 'whatsapp-draft|FUNCTION_URL|fetch[[:space:]]*\(' docs/static-preview/forge-alive-material3/whatsapp-ai-composer.js
          grep -q 'exactDraftHumanApprovalGate' docs/static-preview/forge-alive-material3/pipeline-module.js
          grep -q 'automaticSendPerformed: false' docs/static-preview/forge-alive-material3/pipeline-productive-intelligence-adapter.js
          grep -q 'persisted: false' supabase/functions/cartera-pdf-intake/index.ts
          grep -q 'automaticPolicyCreation: false' supabase/functions/cartera-pdf-intake/index.ts
      - name: Validate responsive and accessibility contracts
        run: |
          grep -q 'safe-area-inset-bottom' docs/static-preview/forge-alive-material3/pipeline-bulk-import-mount.css
          grep -q 'aria-modal=\"true\"' docs/static-preview/forge-alive-material3/pipeline-module.js
          grep -q 'data-cartera-policy-dropzone' docs/static-preview/forge-alive-material3/cartera-document-intake.js
          grep -q 'data-cartera-policy-dialog' docs/static-preview/forge-alive-material3/cartera-document-intake.js
          grep -q 'accept=\"application/pdf,.pdf\"' docs/static-preview/forge-alive-material3/cartera-document-intake.js
          grep -q 'safe-area-inset-bottom' docs/static-preview/forge-alive-material3/cartera-document-intake.js
