name: Retire Legacy UI Source Rewrite

on:
  push:
    branches:
      - chore/retire-all-legacy-forge-ui

permissions:
  contents: write

concurrency:
  group: retire-legacy-ui-source-rewrite
  cancel-in-progress: true

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/retire-all-legacy-forge-ui
          fetch-depth: 0

      - name: Relocate productive authorities and remove legacy runtime references
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          canonical = Path('docs/static-preview/forge-alive-material3')
          retired = Path('docs/static-preview/forge-alive')

          for name in (
              'forge-alive-public-config-067g17a1.js',
              'forge-alive-auth-entry-067g17b1.js',
              'forge-alive-auth-entry-067g17b1.css',
          ):
              source = retired / name
              target = canonical / name
              if not source.exists():
                  raise SystemExit(f'MISSING_PRODUCTIVE_AUTHORITY:{source}')
              shutil.copyfile(source, target)

          def replace(path, old, new, count=None):
              file = Path(path)
              text = file.read_text()
              observed = text.count(old)
              if observed == 0:
                  if new in text:
                      return
                  raise SystemExit(f'REWRITE_BOUNDARY_MISSING:{path}:{old[:80]}')
              if count is not None and observed != count:
                  raise SystemExit(f'REWRITE_COUNT_MISMATCH:{path}:{observed}!={count}')
              file.write_text(text.replace(old, new))

          replace(
              canonical / 'early-auth-bootstrap.js',
              "const legacyBase = new URL(sourceLayout ? '../forge-alive/' : '../forge-alive-runtime/', import.meta.url);",
              "const moduleBase = new URL('./', import.meta.url);",
              1,
          )
          replace(canonical / 'early-auth-bootstrap.js', "legacyBase);", "moduleBase);", 2)

          replace(
              canonical / 'app.js',
              '''const legacyBase = new URL(
            sourceLayout ? "../forge-alive/" : "../forge-alive-runtime/",
            import.meta.url,
          );
          ''',
              '',
              1,
          )
          replace(canonical / 'app.js', 'legacyBase', 'moduleBase', 3)

          replace(
              canonical / 'pipeline-module.js',
              '''const legacyRuntimeBase = new URL(
            import.meta.url.includes("/docs/static-preview/")
              ? "../forge-alive/"
              : "../forge-alive-runtime/",
            import.meta.url,
          );''',
              'const moduleBase = new URL("./", import.meta.url);',
              1,
          )
          replace(canonical / 'pipeline-module.js', 'legacyRuntimeBase', 'moduleBase', 1)

          manifest = canonical / 'manifest.json'
          if manifest.exists():
              text = manifest.read_text()
              text = text.replace('../forge-alive/?nav=inicio', './?nav=inicio')
              text = text.replace('../forge-alive/', './')
              manifest.write_text(text)

          forbidden = ('forge-alive-runtime', '../forge-alive/')
          for name in ('app.js', 'early-auth-bootstrap.js', 'pipeline-module.js'):
              text = (canonical / name).read_text()
              for token in forbidden:
                  if token in text:
                      raise SystemExit(f'LEGACY_RUNTIME_REFERENCE_REMAINS:{name}:{token}')
          PY

      - name: Commit deterministic rewrite
        run: |
          if git diff --quiet; then
            echo 'SOURCE_REWRITE_ALREADY_APPLIED=PASS'
            exit 0
          fi
          git config user.name forgeos-ci
          git config user.email actions@users.noreply.github.com
          git add docs/static-preview/forge-alive-material3
          git commit -m 'refactor(ui): detach production from legacy Forge runtime'
          git push origin HEAD:chore/retire-all-legacy-forge-ui
