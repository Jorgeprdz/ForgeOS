name: Pipeline Real Interaction Regression

on:
  pull_request:
    branches: [main]
    paths:
      - docs/static-preview/forge-alive-material3/**
      - advisor-os/sales-pipeline/**
      - supabase/migrations/20260731000100_pipeline_prospect_journal.sql
      - tests/pipeline-real-interaction-regression.mjs
      - tests/pipeline-prospect-admin-regression.mjs
      - tests/pipeline-action-identity-regression.mjs
      - tests/pipeline-context-journal-regression.mjs
      - tests/pipeline-public-acceptance-hotfix-regression.mjs
      - tests/pipeline-filter-count-authority-regression.mjs
      - tests/pipeline-card-density-stage-authority-regression.mjs
      - tests/prospect-journal-service-contract-test.mjs
      - tools/forge-ui-visual-diagnostic.mjs
      - scripts/apply-pipeline-card-density-stage-authority.py
      - .github/workflows/pipeline-real-interaction.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-density-stage-authority:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/pipeline-card-density-stage-authority'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply product hotfix
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-pipeline-card-density-stage-authority.py
          node --check docs/static-preview/forge-alive-material3/pipeline-module.js
          node --check docs/static-preview/forge-alive-material3/pipeline-public-acceptance-hotfix.js
          node --check tests/pipeline-card-density-stage-authority-regression.mjs
      - name: Commit product files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "forgeos-pipeline-closure"
          git config user.email "actions@users.noreply.github.com"
          git add \
            docs/static-preview/forge-alive-material3/app.js \
            docs/static-preview/forge-alive-material3/pipeline-module.js \
            docs/static-preview/forge-alive-material3/pipeline-public-acceptance-hotfix.js \
            tests/pipeline-card-density-stage-authority-regression.mjs
          if git diff --cached --quiet; then
            echo "PIPELINE_DENSITY_STAGE_AUTHORITY_ALREADY_APPLIED=PASS"
            exit 0
          fi
          git commit -m "fix(pipeline): compact cards and unify stage authority"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify journal persistence contract
        run: node --test tests/prospect-journal-service-contract-test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Start Vite
        shell: bash
        run: |
          nohup npm run serve:e2e > /tmp/forge-pipeline-vite.log 2>&1 &
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/docs/static-preview/forge-alive-material3/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/forge-pipeline-vite.log
            false
          fi
      - name: Verify stage persistence
        run: timeout 120s node tests/pipeline-real-interaction-regression.mjs
      - name: Verify prospect administration
        run: timeout 120s node tests/pipeline-prospect-admin-regression.mjs
      - name: Verify action identity
        run: timeout 120s node tests/pipeline-action-identity-regression.mjs
      - name: Verify context journal
        run: timeout 120s node tests/pipeline-context-journal-regression.mjs
      - name: Verify public acceptance hotfix
        run: timeout 120s node tests/pipeline-public-acceptance-hotfix-regression.mjs
      - name: Verify combined filter totals
        run: timeout 120s node tests/pipeline-filter-count-authority-regression.mjs
      - name: Verify mobile density and single stage authority
        run: timeout 120s node tests/pipeline-card-density-stage-authority-regression.mjs
