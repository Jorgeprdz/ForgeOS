name: Forge 012 Transport Assembler

on:
  push:
    branches:
      - fix/forge-beta2-real-user-stabilization-012
    paths:
      - '.forge012/**'
      - '.github/workflows/forge012-transport.yml'

permissions:
  contents: write

jobs:
  assemble-exact-tested-patch:
    if: github.ref_name == 'fix/forge-beta2-real-user-stabilization-012'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact transport commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 3
          ref: fix/forge-beta2-real-user-stabilization-012

      - name: Guard exact production ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/forge-beta2-real-user-stabilization-012"
          git merge-base --is-ancestor c04cef2e426bf95a431bbb54983831e54386724f HEAD
          test -f .forge012/patch.gz.part00
          test -f .forge012/patch.gz.part01
          test -f .forge012/patch.gz.part02

      - name: Reassemble and verify patch transport
        shell: bash
        run: |
          set -euo pipefail
          cat .forge012/patch.gz.part00 .forge012/patch.gz.part01 .forge012/patch.gz.part02 > /tmp/forge012.patch.gz
          echo '928c24dd5fda2ecaa6f597998c093de2b701baac0f3f3581d0c2a8eca1dcbe57  /tmp/forge012.patch.gz' | sha256sum -c -
          gzip -dc /tmp/forge012.patch.gz > /tmp/forge012.patch
          git apply --check -p0 /tmp/forge012.patch
          git apply -p0 /tmp/forge012.patch

      - name: Install final governed phase files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/migrations tests .github/workflows
          mv .forge012/migration.sql supabase/migrations/20260810001200_cartera020b_targeted_interactive_claim_012.sql
          mv .forge012/phase.test.mjs tests/forge-beta2-real-user-stabilization-012.test.mjs
          mv .forge012/phase.workflow.yml .github/workflows/forge-beta2-real-user-stabilization-012.yml

      - name: Verify exact Git blob identities
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            expected="$1"; file="$2"
            actual="$(git hash-object "$file")"
            printf '%s  %s\n' "$actual" "$file"
            test "$actual" = "$expected"
          }
          check_blob 55b0023a1578aa3a2a61c7677737e065932822e0 docs/static-preview/forge-aura/cartera/cartera-adapter-pages-v1.js
          check_blob 9da6de55ef781eac45bed4458520d48a9748f619 docs/static-preview/forge-aura/cartera/cartera-adapter-pages-v10.js
          check_blob 0f26d828fb97f12690e7b237fbdeae38b85b3e04 docs/static-preview/forge-aura/cartera/cartera-core.js
          check_blob 8a8c75be494c69615614de67eb20bfbac4bea0d1 docs/static-preview/forge-aura/cartera/cartera-module.js
          check_blob 0ce0ca6a9092d27fb63258bc3d5cfe32bc972064 docs/static-preview/forge-aura/pipeline/pipeline-adapter-pages-v4.js
          check_blob c1401559f093a90e294b32001a181f8c94456f82 docs/static-preview/forge-aura/pipeline/pipeline-conversation-workspace.js
          check_blob 59c1b567a01ebfbe2168740a2427bd9f12856422 docs/static-preview/forge-aura/pipeline/pipeline-journal-aura-011e.js
          check_blob 9499bc1960aa9b03235db01fd631e4b9051572cf docs/static-preview/forge-aura/pipeline/pipeline.css
          check_blob 4e1bb3e42b6d8a4606e1b6c8854d054ea09972c2 nash/pipeline-nash-draft-orchestrator.js
          check_blob 2a8b9644064bbf617a1ca4565d3cc07cf2e32426 supabase/migrations/20260810001200_cartera020b_targeted_interactive_claim_012.sql
          check_blob d9456872ab753de29852aafc1d6ccece69461055 tests/forge-beta2-real-user-stabilization-012.test.mjs
          check_blob 69ed6452caae7f48e5d7c88e6fc3eef118dfd8a8 .github/workflows/forge-beta2-real-user-stabilization-012.yml

      - name: Syntax gate
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/static-preview/forge-aura/cartera/cartera-adapter-pages-v1.js
          node --check docs/static-preview/forge-aura/cartera/cartera-adapter-pages-v10.js
          node --check docs/static-preview/forge-aura/cartera/cartera-core.js
          node --check docs/static-preview/forge-aura/cartera/cartera-module.js
          node --check docs/static-preview/forge-aura/pipeline/pipeline-adapter-pages-v4.js
          node --check docs/static-preview/forge-aura/pipeline/pipeline-conversation-workspace.js
          node --check docs/static-preview/forge-aura/pipeline/pipeline-journal-aura-011e.js
          node --check nash/pipeline-nash-draft-orchestrator.js

      - name: Phase 012 focused 33-test gate
        run: node tests/forge-beta2-real-user-stabilization-012.test.mjs

      - name: Remove transport-only material
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .forge012
          rm .github/workflows/forge012-transport.yml
          git diff --check

      - name: Commit exact final phase tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: stabilize Forge beta real-user failures 012'
          git push origin HEAD:fix/forge-beta2-real-user-stabilization-012
