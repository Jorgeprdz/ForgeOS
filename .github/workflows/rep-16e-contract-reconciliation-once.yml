name: REP-16E Contract Reconciliation Once

on:
  pull_request:
    branches:
      - promotion/rep-16e-activity-reporting
    paths:
      - .forge/rep-16e-contract-reconciliation-trigger.txt

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promotion/rep-16e-activity-reporting
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile exact retired contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tests/material3-pipeline-integration-test.mjs'): [
                  (
                      '    "Pipeline",\n    "Cotizaciones",',
                      '    "Pipeline",\n    "Actividad",\n    "Cotizaciones",',
                  ),
              ],
              Path('tests/pipeline-card-density-stage-authority-regression.mjs'): [
                  (
                      'app.js?v=ui-m04-shell-008&fix=pipeline-stage-runtime-003',
                      'app.js?v=ui-m05m-print-actions-eager-001&rep=16e-002',
                  ),
              ],
              Path('.github/workflows/forge-ui-visual-diagnostic.yml'): [
                  (
                      'nohup npm run serve:e2e > /tmp/forge-vite.log 2>&1 &',
                      'nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/forge-vite.log 2>&1 &',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one exact match for {old!r}, got {count}')
                  text = text.replace(old, new)
              path.write_text(text)

          Path('.github/workflows/rep-16e-contract-reconciliation-once.yml').unlink()
          PY
      - name: Commit reconciled contracts
        run: |
          git config user.name "ForgeOS Governance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/material3-pipeline-integration-test.mjs \
            tests/pipeline-card-density-stage-authority-regression.mjs \
            .github/workflows/forge-ui-visual-diagnostic.yml \
            .github/workflows/rep-16e-contract-reconciliation-once.yml
          git commit -m "REP-16E reconcile Activity navigation and static visual gate"
          git push origin HEAD:promotion/rep-16e-activity-reporting
