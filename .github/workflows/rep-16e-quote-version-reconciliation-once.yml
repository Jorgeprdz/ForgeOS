name: REP-16E Quote Version Reconciliation Once

on:
  pull_request:
    branches:
      - promotion/rep-16e-activity-reporting
    paths:
      - .forge/rep-16e-quote-version-trigger.txt

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promotion/rep-16e-activity-reporting
          fetch-depth: 0
      - name: Reconcile exact adapter version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/manual-quotes-pipeline-stability-test.mjs')
          text = path.read_text()
          old = 'quotes-result-adapter\\.js\\?v=quote-calculator-parity-006'
          new = 'quotes-result-adapter\\.js\\?v=quote-calculator-parity-001'
          if text.count(old) != 1:
              raise SystemExit(f'expected one exact match, got {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit exact adapter version
        run: |
          git config user.name "ForgeOS Governance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/manual-quotes-pipeline-stability-test.mjs
          git commit -m "REP-16E align current Quotes adapter version"
          git push origin HEAD:promotion/rep-16e-activity-reporting
