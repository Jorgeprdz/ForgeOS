name: Apply Pipeline Stage Runtime Cache Authority

on:
  push:
    branches:
      - fix/pipeline-stage-runtime-cache-authority
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pipeline-stage-runtime-cache-authority
          fetch-depth: 0

      - name: Apply fresh runtime entry contract
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_version(path, old, new):
              target = Path(path)
              text = target.read_text()
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: old marker count={text.count(old)}")
              target.write_text(text.replace(old, new, 1))

          replace_version(
              "docs/static-preview/forge-alive-material3/index.html",
              '<script type="module" src="./app.js?v=ui-m04-shell-007&fix=pipeline-mobile-interaction-001"></script>',
              '<script type="module" src="./app.js?v=ui-m04-shell-008&fix=pipeline-stage-runtime-003"></script>',
          )
          replace_version(
              "docs/static-preview/forge-alive-material3/app.js",
              'import { createPipelineModule } from "./pipeline-module.js?v=ui-m06-pipeline-011";',
              'import { createPipelineModule } from "./pipeline-module.js?v=ui-m06-pipeline-012";',
          )
          replace_version(
              "docs/static-preview/forge-alive-material3/app.js",
              'import "./pipeline-public-acceptance-hotfix.js?v=pipeline-public-acceptance-002";',
              'import "./pipeline-public-acceptance-hotfix.js?v=pipeline-public-acceptance-003";',
          )

          test_path = Path("tests/pipeline-card-density-stage-authority-regression.mjs")
          test = test_path.read_text()
          contract_marker = "const runtimeEntryContract = Object.freeze({"
          if contract_marker not in test:
              import_marker = 'import { chromium } from "@playwright/test";\n'
              if test.count(import_marker) != 1:
                  raise SystemExit(f"runtime test import marker count={test.count(import_marker)}")
              contract = "\n".join([
                  'import { readFile } from "node:fs/promises";',
                  '',
                  'const runtimeEntryContract = Object.freeze({',
                  '  appEntry: "app.js?v=ui-m04-shell-008&fix=pipeline-stage-runtime-003",',
                  '  pipelineModule: "pipeline-module.js?v=ui-m06-pipeline-012",',
                  '  stageHotfix: "pipeline-public-acceptance-hotfix.js?v=pipeline-public-acceptance-003",',
                  '});',
                  'const [entryHtml, appSource] = await Promise.all([',
                  '  readFile("docs/static-preview/forge-alive-material3/index.html", "utf8"),',
                  '  readFile("docs/static-preview/forge-alive-material3/app.js", "utf8"),',
                  ']);',
                  'assert.match(entryHtml, new RegExp(runtimeEntryContract.appEntry.replace(/[.?+&]/g, "\\\\$&")));',
                  'assert.match(appSource, new RegExp(runtimeEntryContract.pipelineModule.replace(/[.?+&]/g, "\\\\$&")));',
                  'assert.match(appSource, new RegExp(runtimeEntryContract.stageHotfix.replace(/[.?+&]/g, "\\\\$&")));',
                  '',
              ])
              test = test.replace(import_marker, import_marker + contract, 1)
              test_path.write_text(test)
          PY

          node --check docs/static-preview/forge-alive-material3/app.js
          node --check tests/pipeline-card-density-stage-authority-regression.mjs

      - name: Commit fresh runtime entry
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Runtime entry already current"
            exit 0
          fi
          git config user.name "forgeos-pipeline-hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add \
            docs/static-preview/forge-alive-material3/index.html \
            docs/static-preview/forge-alive-material3/app.js \
            tests/pipeline-card-density-stage-authority-regression.mjs
          git commit -m "fix(pipeline): force fresh stage runtime entry"
          git push origin HEAD:fix/pipeline-stage-runtime-cache-authority
