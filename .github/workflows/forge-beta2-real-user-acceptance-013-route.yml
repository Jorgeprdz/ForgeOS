name: Forge Beta2 Real User Acceptance 013 Route Lifecycle

on:
  push:
    branches:
      - fix/forge-beta2-real-user-acceptance-interpretation-recovery-013
    paths:
      - 'docs/static-preview/forge-aura/app-v4-r1.js'
      - 'docs/static-preview/forge-aura/aura-router-v4.js'
      - 'docs/static-preview/forge-aura/aura-auth-v4.js'
      - 'docs/static-preview/forge-aura/aura-shell.js'
      - 'docs/static-preview/forge-aura/recomposition/**'
      - 'docs/static-preview/forge-aura/pipeline/**'
      - 'scripts/build-advisor-presentation-pages-runtime.mjs'
      - 'scripts/prepare-aura-home-pages-authorities.mjs'
      - 'tests/forge-beta2-real-user-acceptance-013-route-lifecycle.test.mjs'
      - 'tests/e2e/forge-beta2-013-route-lifecycle.spec.mjs'
      - 'playwright.013-route.config.mjs'
      - '.github/workflows/forge-beta2-real-user-acceptance-013-route.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-beta2-013-route-lifecycle
  cancel-in-progress: true

jobs:
  route-lifecycle:
    if: github.repository == 'Jorgeprdz/ForgeOS'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: 067g17a1-remote-acceptance
    env:
      SUPABASE_PROJECT_REF: rmlxigxysujsuwzgoimv
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout exact 013 revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax and lifecycle contracts
        run: |
          node --check docs/static-preview/forge-aura/app-v4-r1.js
          node --check docs/static-preview/forge-aura/aura-router-v4.js
          node --check tests/forge-beta2-real-user-acceptance-013-route-lifecycle.test.mjs
          node --test tests/forge-beta2-real-user-acceptance-013-route-lifecycle.test.mjs

      - name: Prepare productive Pages runtime graph
        run: |
          set -euo pipefail
          node scripts/build-advisor-presentation-pages-runtime.mjs
          test -f docs/static-preview/forge-alive-material3/home-authorities/repo/advisor-os/next-action/agenda-read-model.js
          test -f docs/static-preview/forge-alive/home-authorities/repo/advisor-os/next-action/agenda-read-model.js
          echo 'PRODUCTIVE_PAGES_RUNTIME_PREPARATION=PASS'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare one-run governed acceptance credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/forge013-route"
          admin_token="$(openssl rand -hex 32)"
          password_a="$(openssl rand -base64 36 | tr -d '\n' | tr '/+' '_-')Aa1!"
          password_b="$(openssl rand -base64 36 | tr -d '\n' | tr '/+' '_-')Bb2!"
          printf '%s' "$admin_token" > "$RUNNER_TEMP/forge013-route/admin-token"
          printf '%s' "$password_a" > "$RUNNER_TEMP/forge013-route/a-password"
          printf '%s' "$password_b" > "$RUNNER_TEMP/forge013-route/b-password"
          chmod 600 "$RUNNER_TEMP/forge013-route/"*
          echo "::add-mask::$admin_token"
          echo "::add-mask::$password_a"
          echo "::add-mask::$password_b"
          echo '013_ROUTE_ONE_RUN_CREDENTIALS=PREPARED'

      - name: Reuse existing 005C acceptance control plane
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          admin_token="$(cat "$RUNNER_TEMP/forge013-route/admin-token")"
          password_a="$(cat "$RUNNER_TEMP/forge013-route/a-password")"
          password_b="$(cat "$RUNNER_TEMP/forge013-route/b-password")"
          supabase secrets set \
            FORGE_ACCEPTANCE_ADMIN_TOKEN="$admin_token" \
            FORGE_ACCEPTANCE_A_PASSWORD="$password_a" \
            FORGE_ACCEPTANCE_B_PASSWORD="$password_b" \
            --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy forge-acceptance-admin --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          echo 'ACCEPTANCE_CONTROL_PLANE_REUSED=YES'

      - name: Open synthetic A/B acceptance window
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/forge-beta2-013-route
          admin_token="$(cat "$RUNNER_TEMP/forge013-route/admin-token")"
          curl --fail --silent --show-error -X POST \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/forge-acceptance-admin" \
            -H 'Content-Type: application/json' \
            -H "x-forge-acceptance-admin-token: $admin_token" \
            --data '{"action":"PROVISION"}' > artifacts/forge-beta2-013-route/provision.json
          node -e "const p=require('./artifacts/forge-beta2-013-route/provision.json');if(p.ok!==true||p.accountsOpened!==2)throw Error('PROVISION_FAILED')"
          echo '013_ROUTE_ACCEPTANCE_WINDOW=OPEN'

      - name: Authenticated browser route stress
        shell: bash
        run: |
          set -euo pipefail
          export FORGE_ACCEPTANCE_A_PASSWORD="$(cat "$RUNNER_TEMP/forge013-route/a-password")"
          npx playwright test tests/e2e/forge-beta2-013-route-lifecycle.spec.mjs --config=playwright.013-route.config.mjs

      - name: Seal synthetic acceptance identities
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          admin_token="$(cat "$RUNNER_TEMP/forge013-route/admin-token")"
          curl --fail --silent --show-error -X POST \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/forge-acceptance-admin" \
            -H 'Content-Type: application/json' \
            -H "x-forge-acceptance-admin-token: $admin_token" \
            --data '{"action":"SEAL"}' > artifacts/forge-beta2-013-route/seal.json
          node -e "const p=require('./artifacts/forge-beta2-013-route/seal.json');if(p.ok!==true||p.accountsSealed!==2)throw Error('SEAL_FAILED')"
          echo '013_ROUTE_ACCEPTANCE_WINDOW=SEALED'

      - name: Upload route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-beta2-013-route-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/forge-beta2-013-route/
            artifacts/forge-beta2-013-route-playwright.json
            artifacts/forge-beta2-013-route-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Constitutional markers
        if: success()
        run: |
          echo 'PRODUCTIVE_PAGES_RUNTIME_PREPARATION=PASS'
          echo 'ROUTER_RELOAD_USED=NO'
          echo 'FIFTY_TRANSITIONS_TESTED=YES'
          echo 'BACK_FORWARD_TESTED=YES'
          echo 'RAPID_NAVIGATION_TESTED=YES'
          echo 'ROUTE_EVENTUAL_SETTLEMENT=PASS'
