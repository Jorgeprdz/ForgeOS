name: Forge Aura Productive Entrypoint 011B

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/static-preview/forge-aura/index.html'
      - 'docs/static-preview/forge-aura/recomposition/pipeline-consumer-bridge-011b.js'
      - 'docs/static-preview/forge-aura/cartera/cartera-relational-011b.css'
      - 'tests/forge-aura-production-entrypoint-011b.test.mjs'
      - 'tests/e2e/forge-aura-production-entrypoint-011b.spec.mjs'
      - 'tests/aura011b-playwright.config.mjs'
      - '.github/workflows/forge-aura-production-entrypoint-011b.yml'

permissions:
  contents: read

concurrency:
  group: forge-aura-production-entrypoint-011b-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  constitutional-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Enforce narrow 011B production-entrypoint diff
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          git diff --name-only "$base...HEAD" | tee /tmp/changed.txt
          while IFS= read -r file; do
            case "$file" in
              docs/static-preview/forge-aura/index.html|\
              docs/static-preview/forge-aura/recomposition/pipeline-consumer-bridge-011b.js|\
              docs/static-preview/forge-aura/cartera/cartera-relational-011b.css|\
              tests/forge-aura-production-entrypoint-011b.test.mjs|\
              tests/e2e/forge-aura-production-entrypoint-011b.spec.mjs|\
              tests/aura011b-playwright.config.mjs|\
              .github/workflows/forge-aura-production-entrypoint-011b.yml)
                ;;
              *) echo "011B_BOUNDARY_VIOLATION=$file"; exit 1 ;;
            esac
          done < /tmp/changed.txt
          if grep -Eq '^(supabase/|nash/|advisor-os/|manager-os/|platform/)' /tmp/changed.txt; then
            echo '011B_PRODUCTIVE_AUTHORITY_MUTATION=DETECTED'
            exit 1
          fi
          git diff --check "$base...HEAD"
          echo 'CONSTITUTIONAL_GATE_011B=PASS'
          echo 'SCHEMA_MUTATION=0'
          echo 'RLS_MUTATION=0'
          echo 'NASH_AUTHORITY_MUTATION=0'
          echo 'AUTO_MESSAGE_SEND=0'

  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.EXPECTED_HEAD }}' }
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Syntax checks
        run: |
          node --check docs/static-preview/forge-aura/recomposition/pipeline-consumer-bridge-011b.js
          node --check tests/forge-aura-production-entrypoint-011b.test.mjs
          node --check tests/e2e/forge-aura-production-entrypoint-011b.spec.mjs
          node --check tests/aura011b-playwright.config.mjs
      - name: Productive entrypoint contract
        run: node --test tests/forge-aura-production-entrypoint-011b.test.mjs

  browser-e2e:
    runs-on: ubuntu-latest
    needs: [static-contracts]
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.EXPECTED_HEAD }}' }
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=tests/aura011b-playwright.config.mjs
      - name: Upload 011B visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: forge-aura-011b-visual-evidence
          path: artifacts/011b/screenshots
          if-no-files-found: error
      - name: Emit 011B browser gates
        run: |
          echo 'PRODUCTIVE_PIPELINE_CONVERSATION_WORKSPACE=PASS'
          echo 'WHATSAPP_DIRECT_BYPASS=BLOCKED'
          echo 'CARTERA_SINGLE_RELATIONSHIP_CARD=PASS'
          echo 'SECOND_POLICY_BOX=ABSENT'

  FINAL_ROBOCOP_011B:
    runs-on: ubuntu-latest
    needs: [constitutional-gate, static-contracts, browser-e2e]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.EXPECTED_HEAD }}' }
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Final 011B gate
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.constitutional-gate.result }}' = 'success'
          test '${{ needs.static-contracts.result }}' = 'success'
          test '${{ needs.browser-e2e.result }}' = 'success'
          echo 'FINAL_ROBOCOP_011B=PASS'
          echo 'READY_FOR_HUMAN_MERGE_AND_DEPLOY_AUTHORIZATION=YES'
