name: WhatsApp Context Humanizer

on:
  pull_request:
    paths:
      - 'platform/communications/whatsapp-context-humanizer.js'
      - 'tests/whatsapp-context-humanizer-test.mjs'
      - 'docs/roadmaps/FORGE_WHATSAPP_CONTEXT_HUMANIZER_FIX_001.md'
      - '.github/workflows/whatsapp-context-humanizer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check platform/communications/whatsapp-context-humanizer.js
      - name: Contract acceptance
        run: node tests/whatsapp-context-humanizer-test.mjs
      - name: P0 static boundaries
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E "fetch\(|supabase\.|\.insert\(|\.update\(|\.delete\(" platform/communications/whatsapp-context-humanizer.js
          grep -q 'WHATSAPP_CONTEXT_VERSION' platform/communications/whatsapp-context-humanizer.js
          grep -q 'validateHumanizedMessage' platform/communications/whatsapp-context-humanizer.js
          echo 'WSP_P0_CORE_CONTRACT=PASS'
