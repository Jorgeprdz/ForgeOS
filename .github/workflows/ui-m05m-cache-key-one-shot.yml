name: UI M05M Cache Key One Shot

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  apply-cache-key:
    if: >-
      github.repository == 'Jorgeprdz/ForgeOS' &&
      github.event.pull_request.head.ref == 'fix/material3-print-actions-eager-mount' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/material3-print-actions-eager-mount
          fetch-depth: 0

      - name: Force fresh Material 3 bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/static-preview/forge-alive-material3/index.html')
          text = path.read_text(encoding='utf-8')
          old = './app.js?v=ui-m05l-shell-route-first-001'
          new = './app.js?v=ui-m05m-print-actions-eager-001'
          if text.count(old) != 1:
              raise SystemExit(f'UNEXPECTED_APP_CACHE_KEY_COUNT:{text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/ui-m05m-cache-key-one-shot.yml
          node tests/ui-m05m-print-actions-eager-mount-test.mjs
          git diff --check

      - name: Commit bounded cache refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'forge-ui-hotfix'
          git config user.email 'forge-ui-hotfix@users.noreply.github.com'
          git add docs/static-preview/forge-alive-material3/index.html
          git rm .github/workflows/ui-m05m-cache-key-one-shot.yml
          git commit -m 'fix(ui): force fresh M05M printable actions bootstrap'
          git push origin HEAD:fix/material3-print-actions-eager-mount
