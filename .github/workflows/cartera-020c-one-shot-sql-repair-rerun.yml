name: CARTERA 020C One-Shot SQL Repair and Rerun

on:
  pull_request:
    branches:
      - main
    types:
      - opened
    paths:
      - docs/evidence/CARTERA_020C_REMOTE_REPAIR_RERUN_AUTHORIZATION_20260731T1733-0600.md

permissions:
  contents: write

concurrency:
  group: cartera-020c-one-shot-sql-repair-rerun
  cancel-in-progress: false

jobs:
  repair-commit-deploy-and-accept:
    if: >-
      github.repository == 'Jorgeprdz/ForgeOS' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.event.pull_request.head.ref == 'run/cartera-020c-remote-repair-rerun-20260731-1733' &&
      github.event.pull_request.head.sha == 'ca41329355eea1428db62313369a335541e3e871' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARTERA_020C_REMOTE_MUTATION_AUTHORIZED: YES:CARTERA_020C_REMOTE_MUTATION
      CARTERA_020C_EXPECTED_SOURCE_HEAD: 0daaccd556659b997f2086e12b09481281d1b019
      CARTERA_020C_EXPECTED_ACCEPTANCE_HEAD: 0075a54ed1886811a9dd4b295128bdab0a69eccb
      CARTERA_020C_ACCEPTANCE_BRANCH: feature/cartera-020c-remote-acceptance
      SUPABASE_PROJECT_REF: rmlxigxysujsuwzgoimv
      AUTHORIZATION_MARKER: docs/evidence/CARTERA_020C_REMOTE_REPAIR_RERUN_AUTHORIZATION_20260731T1733-0600.md
      AUTHORIZED_LAUNCH_HEAD: ca41329355eea1428db62313369a335541e3e871

    steps:
      - name: Checkout exact repair authorization
        uses: actions/checkout@v4
        with:
          ref: ca41329355eea1428db62313369a335541e3e871
          fetch-depth: 0

      - name: Validate exact repair authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_HEAD_REF" = 'run/cartera-020c-remote-repair-rerun-20260731-1733'
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_LAUNCH_HEAD"
          test -f "$AUTHORIZATION_MARKER"
          grep -qx 'USER_AUTHORIZATION=REPAIR_AND_RERUN_CARTERA_020C_REMOTE_ACCEPTANCE' "$AUTHORIZATION_MARKER"
          grep -qx 'FAILED_RUN=30673019382' "$AUTHORIZATION_MARKER"
          grep -qx 'FAILED_JOB=91294524865' "$AUTHORIZATION_MARKER"
          grep -qx 'FAILED_MIGRATION=20260731000233' "$AUTHORIZATION_MARKER"
          grep -qx 'FAILURE=CARTERA020C_PLPGSQL_RESERVED_IDENTIFIER_AUTHORIZATION' "$AUTHORIZATION_MARKER"
          grep -qx 'ACCEPTANCE_HEAD=0075a54ed1886811a9dd4b295128bdab0a69eccb' "$AUTHORIZATION_MARKER"
          test "$(git diff --name-only HEAD^ HEAD)" = "$AUTHORIZATION_MARKER"
          echo 'ONE_SHOT_REPAIR_AUTHORIZATION=PASS'

      - name: Checkout exact accepted remote branch
        uses: actions/checkout@v4
        with:
          ref: feature/cartera-020c-remote-acceptance
          fetch-depth: 0

      - name: Apply bounded PostgreSQL identifier repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '0075a54ed1886811a9dd4b295128bdab0a69eccb'
          python - <<'PY'
          from pathlib import Path
          import re

          sql_paths = [
              Path('supabase/migrations/20260731000233_cartera020c_prepare_identity_orchestration_rpc.sql'),
              Path('supabase/migrations/20260731000234_cartera020c_attach_policy_confirmation_rpc.sql'),
              Path('supabase/migrations/20260731000238_cartera020c_authorization_digest_hardening.sql'),
          ]

          def replace_bare_identifier(text, old='authorization', new='authorization_payload'):
              out = []
              index = 0
              in_single = False
              replacements = 0
              length = len(text)
              while index < length:
                  if not in_single and text.startswith('--', index):
                      end = text.find('\n', index)
                      if end == -1:
                          out.append(text[index:])
                          break
                      out.append(text[index:end + 1])
                      index = end + 1
                      continue
                  char = text[index]
                  if char == "'":
                      if in_single and index + 1 < length and text[index + 1] == "'":
                          out.append("''")
                          index += 2
                          continue
                      in_single = not in_single
                      out.append(char)
                      index += 1
                      continue
                  if not in_single and text.startswith(old, index):
                      before = text[index - 1] if index else ''
                      after_index = index + len(old)
                      after = text[after_index] if after_index < length else ''
                      if not (before.isalnum() or before == '_') and not (after.isalnum() or after == '_'):
                          out.append(new)
                          index = after_index
                          replacements += 1
                          continue
                  out.append(char)
                  index += 1
              return ''.join(out), replacements

          expected_counts = {
              sql_paths[0]: 12,
              sql_paths[1]: 12,
              sql_paths[2]: 4,
          }
          for path in sql_paths:
              original = path.read_text(encoding='utf-8')
              repaired, count = replace_bare_identifier(original)
              if count != expected_counts[path]:
                  raise SystemExit(f'UNEXPECTED_AUTHORIZATION_IDENTIFIER_COUNT:{path}:{count}')
              if re.search(r'(?m)^\s*authorization\s+jsonb\b', repaired):
                  raise SystemExit(f'RESERVED_IDENTIFIER_REMAINS:{path}')
              path.write_text(repaired, encoding='utf-8')
              print(f'REPAIRED_IDENTIFIER_COUNT={path}:{count}')

          workflow_paths = [
              Path('.github/workflows/cartera-020c-remote-gate.yml'),
              Path('.github/workflows/cartera-020c-remote-acceptance.yml'),
          ]
          old = r'supabase/migrations/20260731000238_cartera020c_authorization_digest_hardening\.sql'
          new = r'supabase/migrations/202607310002(33_cartera020c_prepare_identity_orchestration_rpc|34_cartera020c_attach_policy_confirmation_rpc|38_cartera020c_authorization_digest_hardening)\.sql'
          for path in workflow_paths:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'UNEXPECTED_ALLOWED_PATH_PATTERN:{path}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          test_path = Path('tests/cartera-020c-authorization-digest-hardening-test.mjs')
          text = test_path.read_text(encoding='utf-8')
          marker = "test('PL/pgSQL orchestration migrations avoid reserved authorization identifiers'"
          if marker not in text:
              text += """

          test('PL/pgSQL orchestration migrations avoid reserved authorization identifiers', () => {
            const paths = [
              '../supabase/migrations/20260731000233_cartera020c_prepare_identity_orchestration_rpc.sql',
              '../supabase/migrations/20260731000234_cartera020c_attach_policy_confirmation_rpc.sql',
              '../supabase/migrations/20260731000238_cartera020c_authorization_digest_hardening.sql',
            ];
            for (const path of paths) {
              const sql = readFileSync(new URL(path, import.meta.url), 'utf8');
              assert.doesNotMatch(sql, /^\\s*authorization\\s+jsonb\\b/m);
              assert.doesNotMatch(sql, /^\\s*authorization\\s*:=/m);
              assert.match(sql, /authorization_payload/);
            }
          });
          """
              test_path.write_text(text, encoding='utf-8')
          PY

          mapfile -t changed < <(git diff --name-only)
          printf 'REPAIR_CHANGED_FILE=%s\n' "${changed[@]}"
          expected=$'.github/workflows/cartera-020c-remote-acceptance.yml\n.github/workflows/cartera-020c-remote-gate.yml\nsupabase/migrations/20260731000233_cartera020c_prepare_identity_orchestration_rpc.sql\nsupabase/migrations/20260731000234_cartera020c_attach_policy_confirmation_rpc.sql\nsupabase/migrations/20260731000238_cartera020c_authorization_digest_hardening.sql\ntests/cartera-020c-authorization-digest-hardening-test.mjs'
          test "$(printf '%s\n' "${changed[@]}" | sort)" = "$expected"
          git diff --check
          echo 'BOUNDED_SQL_REPAIR=PASS'

      - name: Commit repaired acceptance head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'forge-cartera-remote-acceptance'
          git config user.email 'forge-cartera-remote-acceptance@users.noreply.github.com'
          git add \
            .github/workflows/cartera-020c-remote-acceptance.yml \
            .github/workflows/cartera-020c-remote-gate.yml \
            supabase/migrations/20260731000233_cartera020c_prepare_identity_orchestration_rpc.sql \
            supabase/migrations/20260731000234_cartera020c_attach_policy_confirmation_rpc.sql \
            supabase/migrations/20260731000238_cartera020c_authorization_digest_hardening.sql \
            tests/cartera-020c-authorization-digest-hardening-test.mjs
          git commit -m 'fix(cartera): repair PL/pgSQL authorization identifiers'
          git push origin HEAD:feature/cartera-020c-remote-acceptance
          repaired_head="$(git rev-parse HEAD)"
          echo "CARTERA_020C_EXPECTED_ACCEPTANCE_HEAD=$repaired_head" >> "$GITHUB_ENV"
          echo "REPAIRED_ACCEPTANCE_HEAD=$repaired_head" >> "$GITHUB_ENV"
          echo "REPAIRED_ACCEPTANCE_HEAD=$repaired_head"

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Repository and repaired SQL gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REPAIRED_ACCEPTANCE_HEAD"
          git merge-base --is-ancestor "$CARTERA_020C_EXPECTED_SOURCE_HEAD" HEAD
          node --check advisor-os/cartera/persistent-confirmation-orchestration-service.js
          node --check scripts/ci/cartera-020c-github-actions-remote-acceptance.mjs
          node --check tests/cartera-020c-authorization-digest-hardening-test.mjs
          node --check tests/cartera-020c-remote-acceptance-harness-test.mjs
          node --test tests/cartera-020c-*.mjs
          ! grep -nE '^\s*authorization\s+jsonb\b' \
            supabase/migrations/2026073100023{3,4,8}_*.sql
          echo 'PLPGSQL_RESERVED_IDENTIFIER_REPAIR=PASS'

      - name: Deploy repaired migrations and execute remote acceptance
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          mkdir -p artifacts/cartera-020c-remote-acceptance
          GITHUB_SHA="$REPAIRED_ACCEPTANCE_HEAD" \
            node scripts/ci/cartera-020c-github-actions-remote-acceptance.mjs \
            | tee artifacts/cartera-020c-remote-acceptance/workflow-output.log

      - name: Verify explicit acceptance markers
        shell: bash
        run: |
          set -euo pipefail
          log=artifacts/cartera-020c-remote-acceptance/workflow-output.log
          grep -q 'CARTERA_020C_REMOTE_DEPLOYMENT=PASS' "$log"
          grep -q 'AUTHORIZATION_DIGEST_COMPATIBILITY=PASS' "$log"
          grep -q 'CARTERA_020C_TRANSACTIONAL_ACCEPTANCE=PASS' "$log"
          grep -q 'AUTHORIZATION_DIGEST_BINDING=PASS' "$log"
          grep -q 'IDENTITY_ORDERED_EXECUTION=PASS' "$log"
          grep -q 'IDENTITY_READ_AFTER_WRITE=PASS' "$log"
          grep -q 'POLICY_READ_AFTER_WRITE=PASS' "$log"
          grep -q 'CHANGED_INPUT_CONFLICT=PASS' "$log"
          grep -q 'RETRY_GOVERNANCE=PASS' "$log"
          grep -q 'PARALLEL_STATE_VERSION_SERIALIZATION=PASS' "$log"
          grep -q 'RLS_CROSS_ADVISOR=PASS' "$log"
          grep -q 'DIRECT_WRITES=BLOCKED' "$log"
          grep -q 'SANITIZED_STATUS=PASS' "$log"
          grep -q 'TEST_FIXTURES_ROLLED_BACK=YES' "$log"
          grep -q 'CONCURRENCY_FIXTURES_CLEANED=YES' "$log"
          grep -q 'RESIDUAL_FIXTURES=0' "$log"
          grep -q 'CARTERA_020C_REMOTE_ACCEPTANCE=PASS' "$log"

      - name: Upload repaired remote acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartera-020c-remote-acceptance-repaired
          path: artifacts/cartera-020c-remote-acceptance
          if-no-files-found: warn
          retention-days: 30
