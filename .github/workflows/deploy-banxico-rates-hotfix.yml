name: Deploy Banxico Rates Hotfix

on:
  push:
    branches:
      - fix/quote-calculators-product-intelligence-parity
    paths:
      - "supabase/functions/banxico-rates/**"
      - "tests/banxico-rates-edge-function-test.mjs"
      - ".github/workflows/deploy-banxico-rates-hotfix.yml"

permissions:
  contents: read

jobs:
  deploy-banxico-rates:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: rmlxigxysujsuwzgoimv

    steps:
      - name: Checkout authorized branch
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Edge Function contract
        run: node tests/banxico-rates-edge-function-test.mjs

      - name: Deploy public read-only Banxico function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy banxico-rates \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --debug

      - name: Verify deployment and secret readiness
        run: |
          ENDPOINT="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/banxico-rates"
          STATUS="$(curl -sS -o response.json -w '%{http_code}' --max-time 30 "$ENDPOINT" || true)"
          echo "HTTP_STATUS=$STATUS"
          cat response.json || true

          node - "$STATUS" <<'NODE'
          const fs = require('fs');
          const status = Number(process.argv[2]);
          const payload = JSON.parse(fs.readFileSync('response.json', 'utf8'));

          if (status === 200 && payload?.ok === true) {
            console.log('BANXICO_RATES_REMOTE=READY');
            console.log(`UDI_MXN=${payload.rates?.UDI_MXN?.value}`);
            console.log(`UDI_DATE=${payload.rates?.UDI_MXN?.date}`);
            process.exit(0);
          }

          if (status === 500 && payload?.code === 'BANXICO_TOKEN_NOT_CONFIGURED') {
            console.log('BANXICO_RATES_REMOTE=DEPLOYED_SECRET_PENDING');
            process.exit(0);
          }

          throw new Error(`BANXICO_RATES_REMOTE_INVALID: ${status} ${JSON.stringify(payload)}`);
          NODE
