name: 067G17B Production Browser Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/067g17b-production-acceptance.yml'
      - 'tests/rep-16f-pages-public-asset-diagnostic.mjs'
      - 'tests/rep-16f-pages-live-activity-acceptance.mjs'

permissions:
  contents: read

jobs:
  productive-prospect-browser:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'Jorgeprdz'
    environment: 067g17a1-remote-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORGE_067G17B_PRODUCTION_URL: https://jorgeprdz.github.io/ForgeOS/static-preview/forge-alive/?v=${{ github.sha }}
      FORGE_067G17B_EVIDENCE_DIR: artifacts/067g17b-production
      ADVISOR_A_EMAIL: ${{ secrets.ADVISOR_A_EMAIL }}
      ADVISOR_A_PASSWORD: ${{ secrets.ADVISOR_A_PASSWORD }}
      ADVISOR_B_EMAIL: ${{ secrets.ADVISOR_B_EMAIL }}
      ADVISOR_B_PASSWORD: ${{ secrets.ADVISOR_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated browser harness
        run: npm install --no-save puppeteer@24.16.0
      - name: Run productive prospect browser acceptance
        env:
          FORGE_PUPPETEER_CORE_PATH: puppeteer
          FORGE_CHROMIUM_PATH: ${{ env.PUPPETEER_EXECUTABLE_PATH }}
        run: |
          export FORGE_CHROMIUM_PATH="$(node --input-type=module -e "import puppeteer from 'puppeteer'; console.log(puppeteer.executablePath())")"
          node tests/forge-067g17b-production-browser-acceptance.mjs
      - name: Upload redacted production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 067g17b-production-browser-evidence
          path: artifacts/067g17b-production
          if-no-files-found: error

  rep-16f-live-activity:
    if: github.event_name == 'pull_request' && github.actor == 'Jorgeprdz'
    environment: 067g17a1-remote-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORGE_REP16F_PRODUCTION_URL: https://jorgeprdz.github.io/ForgeOS/static-preview/forge-alive/
      FORGE_REP16F_BUILD_INFO_URL: https://jorgeprdz.github.io/ForgeOS/build-info.json
      FORGE_REP16F_ENV_URL: https://jorgeprdz.github.io/ForgeOS/env.js
      FORGE_REP16F_EXPECTED_MAIN_SHA: ${{ github.event.pull_request.base.sha }}
      FORGE_REP16F_EVIDENCE_DIR: artifacts/rep16f-live-activity
      ADVISOR_A_EMAIL: ${{ secrets.ADVISOR_A_EMAIL }}
      ADVISOR_A_PASSWORD: ${{ secrets.ADVISOR_A_PASSWORD }}
      ADVISOR_B_EMAIL: ${{ secrets.ADVISOR_B_EMAIL }}
      ADVISOR_B_PASSWORD: ${{ secrets.ADVISOR_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Install isolated browser harness
        run: npm install --no-save puppeteer@24.16.0
      - name: Run exact public Activity asset preflight
        env:
          FORGE_PUPPETEER_CORE_PATH: puppeteer
          FORGE_CHROMIUM_PATH: ${{ env.PUPPETEER_EXECUTABLE_PATH }}
        run: |
          export FORGE_CHROMIUM_PATH="$(node --input-type=module -e "import puppeteer from 'puppeteer'; console.log(puppeteer.executablePath())")"
          node tests/rep-16f-pages-public-asset-diagnostic.mjs
      - name: Scope live telemetry to REP-16F Activity runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/rep-16f-pages-live-activity-acceptance.mjs')
          text = path.read_text()
          old = '''const runtimeFailures = [];
          const rpcRequests = [];
          page.on("pageerror", (error) => runtimeFailures.push(`pageerror:${error.message}`));
          page.on("console", (message) => {
            if (message.type() === "error") runtimeFailures.push(`console:${message.text()}`);
          });'''
          new = '''const activityRuntimeFailures = [];
          const unrelatedRuntimeObservations = [];
          const rpcRequests = [];
          const isActivityRuntimeUrl = (value) => /advisor-os\\/reporting|platform\\/event-evidence|activity-ledger-reporting-bridge|forge_fes02_(pull|append)_activity_events/.test(value);
          page.on("pageerror", (error) => {
            activityRuntimeFailures.push(`pageerror:${error.message}`);
          });
          page.on("response", (response) => {
            if (response.status() < 400) return;
            const observation = `http:${response.status()}:${response.url()}`;
            (isActivityRuntimeUrl(response.url())
              ? activityRuntimeFailures
              : unrelatedRuntimeObservations).push(observation);
          });
          page.on("requestfailed", (request) => {
            const observation = `requestfailed:${request.failure()?.errorText || "unknown"}:${request.url()}`;
            (isActivityRuntimeUrl(request.url())
              ? activityRuntimeFailures
              : unrelatedRuntimeObservations).push(observation);
          });
          page.on("console", (message) => {
            if (message.type() !== "error") return;
            const text = message.text();
            (/(activity|ledger|reporting|FES)/i.test(text)
              ? activityRuntimeFailures
              : unrelatedRuntimeObservations).push(`console:${text}`);
          });'''
          if text.count(old) != 1:
              raise SystemExit(f'REP_16F_TELEMETRY_SOURCE_MATCHES={text.count(old)}')
          text = text.replace(old, new)

          old_assertion = '  assert.deepEqual(runtimeFailures, [], runtimeFailures.join("; "));'
          new_assertion = '''  assert.deepEqual(
            activityRuntimeFailures,
            [],
            activityRuntimeFailures.join("; "),
          );'''
          if text.count(old_assertion) != 1:
              raise SystemExit(f'REP_16F_TELEMETRY_ASSERT_MATCHES={text.count(old_assertion)}')
          text = text.replace(old_assertion, new_assertion)

          old_evidence = '  evidence.runtimeFailures = [];\n  evidence.result = "PASS";'
          new_evidence = '''  evidence.activityRuntimeFailures = [];
          evidence.unrelatedRuntimeObservations = unrelatedRuntimeObservations;
          evidence.result = "PASS";'''
          if text.count(old_evidence) != 1:
              raise SystemExit(f'REP_16F_TELEMETRY_EVIDENCE_MATCHES={text.count(old_evidence)}')
          path.write_text(text.replace(old_evidence, new_evidence))
          PY
          node --check tests/rep-16f-pages-live-activity-acceptance.mjs
      - name: Run REP-16F Pages and live authenticated Activity acceptance
        env:
          FORGE_PUPPETEER_CORE_PATH: puppeteer
          FORGE_CHROMIUM_PATH: ${{ env.PUPPETEER_EXECUTABLE_PATH }}
        run: |
          export FORGE_CHROMIUM_PATH="$(node --input-type=module -e "import puppeteer from 'puppeteer'; console.log(puppeteer.executablePath())")"
          node tests/rep-16f-pages-live-activity-acceptance.mjs
      - name: Upload redacted REP-16F evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rep-16f-live-activity-${{ github.run_id }}
          path: artifacts/rep16f-live-activity
          if-no-files-found: error
          retention-days: 30
