name: FES Event Evidence CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nfast-09-timeline-to-conversation-brief-projection
    paths:
      - ".github/workflows/fes-event-evidence-ci.yml"
      - "platform/event-evidence/**"
      - "advisor-os/activity/**"
      - "advisor-os/event-evidence/**"
      - "advisor-os/performance/**"
      - "advisor-os/sales-pipeline/**"
      - "docs/static-preview/forge-alive/forge-alive-pipeline-view-067g16a.js"
      - "tests/fes-*-test.mjs"
      - "tests/e2e/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"

permissions:
  contents: read

jobs:
  event-evidence:
    name: Native Linux Event Evidence acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run Event Evidence regression
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/event-evidence
          test_files="$(
            find tests -maxdepth 1 -type f \
              -name 'fes-*-test.mjs' \
              ! -name '*-browser-test.mjs' \
              | sort
          )"
          test -n "$test_files"
          node --test --test-reporter=tap $test_files \
            | tee artifacts/event-evidence/regression.tap

      - name: Run Playwright preflight
        run: npm run test:e2e:preflight

      - name: Run Productive UI browser acceptance
        run: npm run test:e2e:fes06c

      - name: Run FES 08 productive browser acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          npx vite --host 0.0.0.0 --port 4174 --strictPort > artifacts/event-evidence/fes08-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4174/tests/fixtures/fes-08-productive-pipeline-browser.html >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4174/tests/fixtures/fes-08-productive-pipeline-browser.html >/dev/null
          FORGE_E2E_BASE_URL=http://127.0.0.1:4174 \
            node --test tests/fes-08-productive-pipeline-browser-test.mjs

      - name: Run FES 07C isolated browser acceptance
        run: npm run test:e2e:fes07c

      - name: Upload acceptance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: fes-event-evidence-ci
          path: |
            artifacts/event-evidence
            artifacts/playwright-report
            artifacts/playwright-test-results
            artifacts/fes03-playwright-results.json
            artifacts/fes06c-playwright-report
            artifacts/fes06c-playwright-test-results
            artifacts/fes06c-playwright-results.json
            artifacts/fes07c-playwright-report
            artifacts/fes07c-playwright-test-results
            artifacts/fes07c-playwright-results.json
          if-no-files-found: error
          retention-days: 30
