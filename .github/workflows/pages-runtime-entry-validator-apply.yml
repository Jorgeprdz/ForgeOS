name: Apply Pages Runtime Entry Validator Repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages-runtime-entry-validator-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace brittle app version assertion
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/pages.yml')
          text = path.read_text()
          old = '          assert.match(index, /app\\.js\\?v=ui-m04-shell-007/);\n'
          new = '''          assert.match(
            index,
            /<script type="module" src="\\.\\/app\\.js\\?v=[^"]+"><\\/script>/,
            'missing versioned Forge Alive app entry',
          );
'''
          if text.count(old) != 1:
              raise SystemExit(f'OLD_PAGES_APP_ASSERTION_MATCHES={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          grep -F 'missing versioned Forge Alive app entry' .github/workflows/pages.yml
          ! grep -F 'app\.js\?v=ui-m04-shell-007' .github/workflows/pages.yml

      - name: Commit repair and retire applicator
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pages-runtime-entry-validator-apply.yml
          git config user.name forgeos-pages-repair
          git config user.email actions@users.noreply.github.com
          git add .github/workflows/pages.yml .github/workflows/pages-runtime-entry-validator-apply.yml
          git commit -m "fix(pages): validate versioned runtime entry without stale pin"
          git push origin HEAD:main
