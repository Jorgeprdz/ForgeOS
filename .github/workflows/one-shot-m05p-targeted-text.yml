name: One Shot M05P Targeted Text

on:
  push:
    branches:
      - fix/vida-mujer-pdf-main-thread
    paths:
      - .github/workflows/one-shot-m05p-targeted-text.yml

permissions:
  contents: write

jobs:
  repair-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vida-mujer-pdf-main-thread
      - name: Replace full-document text scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/ui-m05p-real-vida-mujer-pdf.spec.mjs')
          text = path.read_text()
          old = '  const bodyText = await page.locator("body").innerText();\n'
          new = '''  const projectionText = await projection.textContent({ timeout: 5_000 })
    .catch(() => "");
  const printableText = await printableCard.textContent({ timeout: 5_000 })
    .catch(() => "");
  const bodyText = `${projectionText}\n${printableText}`;
'''
          if old not in text:
              raise SystemExit('M05P_FULL_DOCUMENT_TEXT_SCAN_NOT_FOUND')
          path.write_text(text.replace(old, new, 1))
          PY
          grep -F 'const projectionText = await projection.textContent' \
            tests/e2e/ui-m05p-real-vida-mujer-pdf.spec.mjs
          ! grep -F 'page.locator("body").innerText()' \
            tests/e2e/ui-m05p-real-vida-mujer-pdf.spec.mjs
          rm .github/workflows/one-shot-m05p-targeted-text.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(ui): avoid full-document scan in real PDF acceptance"
          git push origin HEAD:fix/vida-mujer-pdf-main-thread
