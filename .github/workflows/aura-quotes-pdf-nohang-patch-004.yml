name: Aura Quotes PDF No-Hang Patch 004

on:
  push:
    branches:
      - hotfix/aura-quotes-pdf-nohang-004

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/aura-quotes-pdf-nohang-004
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch bounded waits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          calc_path = Path('docs/static-preview/quote-runtime/forge-quote-calculators.js')
          calc = calc_path.read_text()
          anchor = '''const DEFAULT_RETIREMENT_UDI_GROWTH_RATE = 0.045;

async function browserUnavailableRateProvider() {
  return null;
}
'''
          replacement = '''const DEFAULT_RETIREMENT_UDI_GROWTH_RATE = 0.045;
const UDI_RATE_PROVIDER_TIMEOUT_MS = 5000;

async function awaitRateProviderWithTimeout(rateProvider, timeoutMs = UDI_RATE_PROVIDER_TIMEOUT_MS) {
  const boundedTimeout = Number.isFinite(Number(timeoutMs))
    ? Math.max(1, Number(timeoutMs))
    : UDI_RATE_PROVIDER_TIMEOUT_MS;
  let timer = null;
  try {
    return await Promise.race([
      Promise.resolve().then(() => rateProvider()),
      new Promise((resolve) => {
        timer = globalThis.setTimeout(() => resolve(null), boundedTimeout);
      })
    ]);
  } finally {
    if (timer !== null) globalThis.clearTimeout(timer);
  }
}

async function browserUnavailableRateProvider() {
  return null;
}
'''
          if anchor not in calc:
              raise SystemExit('CALCULATOR_TIMEOUT_ANCHOR_NOT_FOUND')
          calc = calc.replace(anchor, replacement, 1)

          anchor = '''export async function getVerifiedUdiRateMetadata({
  rateProvider = browserUnavailableRateProvider
} = {}) {
  try {
    const cache = await rateProvider();
'''
          replacement = '''export async function getVerifiedUdiRateMetadata({
  rateProvider = browserUnavailableRateProvider,
  timeoutMs = UDI_RATE_PROVIDER_TIMEOUT_MS
} = {}) {
  try {
    const cache = await awaitRateProviderWithTimeout(rateProvider, timeoutMs);
'''
          if anchor not in calc:
              raise SystemExit('CALCULATOR_PROVIDER_ANCHOR_NOT_FOUND')
          calc_path.write_text(calc.replace(anchor, replacement, 1))

          adapter_path = Path('docs/static-preview/forge-aura/quotes/quotes-adapter.js')
          adapter = adapter_path.read_text()
          anchor = '''const PRODUCT_LABELS = Object.freeze({
  imagina_ser: "Imagina Ser",
  vida_mujer: "Vida Mujer",
  segubeca: "SeguBeca",
  orvi: "ORVI",
  alfa_medical_flex: "Alfa Medical Flex",
});
'''
          replacement = '''const PRODUCT_LABELS = Object.freeze({
  imagina_ser: "Imagina Ser",
  vida_mujer: "Vida Mujer",
  segubeca: "SeguBeca",
  orvi: "ORVI",
  alfa_medical_flex: "Alfa Medical Flex",
});

const QUOTE_PARSE_TIMEOUT_MS = 62000;
const QUOTE_CALCULATION_TIMEOUT_MS = 15000;

async function withQuoteTimeout(promise, timeoutMs, message) {
  let timer = null;
  try {
    return await Promise.race([
      Promise.resolve(promise),
      new Promise((_, reject) => {
        timer = globalThis.setTimeout(() => reject(new Error(message)), timeoutMs);
      })
    ]);
  } finally {
    if (timer !== null) globalThis.clearTimeout(timer);
  }
}

function actionableQuoteLoadError(error) {
  const message = error?.message || String(error);
  if (/prima anual no está disponible|plazo de pagos no está disponible|paquete no contiene nativeResult|paquete no contiene context/i.test(message)) {
    return new Error("Este PDF no contiene una cotización calculable. Si es una póliza emitida o un documento de Cartera, cárgalo en Cartera.");
  }
  return error instanceof Error ? error : new Error(message);
}
'''
          if anchor not in adapter:
              raise SystemExit('ADAPTER_HELPER_ANCHOR_NOT_FOUND')
          adapter = adapter.replace(anchor, replacement, 1)

          anchor = '''  async function loadFile(file) {
    clear();
    if (!file) throw new Error("Selecciona una cotización para continuar.");
    let candidate;
    if (file.type === "application/pdf" || /\\.pdf$/i.test(file.name || "")) {
      candidate = await parsePdfFileToAcceptedQuotePacket(file);
    } else {
      const raw = await file.text();
      candidate = JSON.parse(raw);
    }
    packet = validatePacket(candidate);
    calculation = await calculateAcceptedQuote(packet);
    viewModel = buildViewModel(packet, calculation);
    return Object.freeze({ packet, calculation, viewModel });
  }
'''
          replacement = '''  async function loadFile(file) {
    clear();
    if (!file) throw new Error("Selecciona una cotización para continuar.");
    try {
      let candidate;
      if (file.type === "application/pdf" || /\\.pdf$/i.test(file.name || "")) {
        candidate = await withQuoteTimeout(
          parsePdfFileToAcceptedQuotePacket(file),
          QUOTE_PARSE_TIMEOUT_MS,
          "El PDF tardó demasiado en procesarse. Intenta nuevamente con el archivo original."
        );
      } else {
        const raw = await file.text();
        candidate = JSON.parse(raw);
      }
      packet = validatePacket(candidate);
      calculation = await withQuoteTimeout(
        calculateAcceptedQuote(packet),
        QUOTE_CALCULATION_TIMEOUT_MS,
        "El cálculo de la cotización tardó demasiado. Forge detuvo la espera para no dejar la pantalla cargando indefinidamente."
      );
      viewModel = buildViewModel(packet, calculation);
      return Object.freeze({ packet, calculation, viewModel });
    } catch (error) {
      throw actionableQuoteLoadError(error);
    }
  }
'''
          if anchor not in adapter:
              raise SystemExit('ADAPTER_LOADFILE_ANCHOR_NOT_FOUND')
          adapter_path.write_text(adapter.replace(anchor, replacement, 1))

          Path('tests/aura-quotes-pdf-nohang-hotfix-004.test.mjs').write_text(r'''import assert from "node:assert/strict";
import { readFile } from "node:fs/promises";
import { test } from "node:test";
import { getVerifiedUdiRateMetadata } from "../docs/static-preview/quote-runtime/forge-quote-calculators.js";

const adapter = await readFile(new URL("../docs/static-preview/forge-aura/quotes/quotes-adapter.js", import.meta.url), "utf8");
const calculators = await readFile(new URL("../docs/static-preview/quote-runtime/forge-quote-calculators.js", import.meta.url), "utf8");

test("UDI provider is bounded even when it never settles", async () => {
  const started = Date.now();
  const metadata = await getVerifiedUdiRateMetadata({ rateProvider: () => new Promise(() => {}), timeoutMs: 25 });
  assert.equal(metadata.status, "BLOCKED_NO_VERIFIED_UDI_RATE");
  assert.equal(metadata.currentUdiValue, null);
  assert.ok(Date.now() - started < 500);
});

test("Aura Quotes cannot wait forever on parse or calculation", () => {
  assert.match(adapter, /QUOTE_PARSE_TIMEOUT_MS = 62000/);
  assert.match(adapter, /QUOTE_CALCULATION_TIMEOUT_MS = 15000/);
  assert.match(adapter, /parsePdfFileToAcceptedQuotePacket\(file\)/);
  assert.match(adapter, /calculateAcceptedQuote\(packet\)/);
  assert.match(adapter, /no dejar la pantalla cargando indefinidamente/);
});

test("non-calculable documents exit with a Cartera hint", () => {
  assert.match(adapter, /Este PDF no contiene una cotización calculable/);
  assert.match(adapter, /póliza emitida o un documento de Cartera/);
});

test("verified UDI lookup has a default watchdog", () => {
  assert.match(calculators, /UDI_RATE_PROVIDER_TIMEOUT_MS = 5000/);
  assert.match(calculators, /awaitRateProviderWithTimeout\(rateProvider, timeoutMs\)/);
});
''')
          PY
      - name: Verify repaired boundaries
        run: |
          node --check docs/static-preview/forge-aura/quotes/quotes-adapter.js
          node --check docs/static-preview/quote-runtime/forge-quote-calculators.js
          node --test tests/aura-quotes-pdf-nohang-hotfix-004.test.mjs
          node tests/forge-aura-quotes-reconciliation-test.mjs
          node manager-os/tests/accepted-quote-review-snapshot-boundary-master-test.js
          node --test tests/imagina-ser-product-dashboard-adapter-test.mjs tests/orvi-product-dashboard-adapter-test.mjs
          node advisor-os/quotes/tests/quote-printable-browser-binding-test.js
          node advisor-os/quotes/tests/quote-printable-productive-route-controller-test.js
          node manager-os/tests/sales-presentation-review-packet-engine-master-test.js
          node manager-os/tests/sales-presentation-existing-assembly-contract-e2e-master-test.js
          node --test tests/pages-explicit-deployment-governance.test.mjs
      - name: Commit verified hotfix
        shell: bash
        run: |
          rm .github/workflows/aura-quotes-pdf-nohang-patch-004.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(quotes): bound PDF and UDI waits"
          git push origin HEAD:hotfix/aura-quotes-pdf-nohang-004
