name: Home Monthly Goal Editor

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/static-preview/forge-alive-material3/home-module.js"
      - "docs/static-preview/forge-alive-material3/home-monthly-goal-editor.js"
      - "tests/home-monthly-goal-editor-test.mjs"
      - ".github/workflows/home-monthly-goal-editor.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        run: |
          node --check docs/static-preview/forge-alive-material3/home-module.js
          node --check docs/static-preview/forge-alive-material3/home-monthly-goal-editor.js

      - name: Validate monthly goal editor contract
        run: node tests/home-monthly-goal-editor-test.mjs
