name: UI M05R Quote Bridge Composition

on:
  push:
    branches:
      - test/vida-mujer-real-pdf-visual-acceptance
    paths:
      - .github/workflows/ui-m05r-quote-bridge-composition.yml
      - docs/static-preview/forge-alive-material3/app.js
      - docs/static-preview/forge-alive-material3/quote-runtime-bridge-composition-m05r001.js
      - tests/ui-m05r-quote-bridge-composition-test.mjs
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ui-m05r-quote-bridge-composition.yml
      - docs/static-preview/forge-alive-material3/app.js
      - docs/static-preview/forge-alive-material3/quote-runtime-bridge-composition-m05r001.js
      - tests/ui-m05r-quote-bridge-composition-test.mjs

permissions:
  contents: read

jobs:
  bridge-composition-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Enforce serialized bridge composition
        run: node tests/ui-m05r-quote-bridge-composition-test.mjs
