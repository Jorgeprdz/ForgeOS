name: Observe Canonical Pages Deployment

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed main SHA to observe
        required: true
        type: string

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: pages-deploy-observer
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Locate, wait and verify explicit Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REPOSITORY: ${{ github.repository }}
          OBSERVER_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAGE_URL: https://jorgeprdz.github.io/ForgeOS/static-preview/forge-alive/?nav=cotizaciones
          BUILD_INFO_URL: https://jorgeprdz.github.io/ForgeOS/build-info.json
          APP_JS_URL: https://jorgeprdz.github.io/ForgeOS/static-preview/forge-alive/app.js
        run: |
          set -euo pipefail
          pages_run_id=""

          post_status() {
            local state="$1"
            local description="$2"
            local target_url="${3:-$OBSERVER_RUN_URL}"
            gh api --method POST \
              "repos/$REPOSITORY/statuses/$EXPECTED_SHA" \
              -f state="$state" \
              -f context="pages/canonical" \
              -f description="$description" \
              -f target_url="$target_url" >/dev/null
          }

          fail_observer() {
            local code=$?
            local target="$OBSERVER_RUN_URL"
            local description="Canonical Pages deployment failed"
            if [[ -n "$pages_run_id" ]]; then
              target="https://github.com/$REPOSITORY/actions/runs/$pages_run_id"
              description="Canonical Pages run $pages_run_id failed"
            fi
            post_status failure "$description" "$target"
            exit "$code"
          }

          trap fail_observer ERR
          post_status pending "Waiting for explicit canonical Pages deployment"

          for attempt in $(seq 1 60); do
            pages_run_id="$(
              gh run list \
                --repo "$REPOSITORY" \
                --workflow pages.yml \
                --branch main \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,headSha \
                --jq '.[] | select(.headSha == env.EXPECTED_SHA) | .databaseId' \
                | head -n 1
            )"
            if [[ -n "$pages_run_id" ]]; then
              break
            fi
            sleep 3
          done

          if [[ -z "$pages_run_id" ]]; then
            echo "BLOCKED=EXPLICIT_PAGES_RUN_NOT_FOUND"
            exit 1
          fi

          echo "PAGES_RUN_ID=$pages_run_id"
          gh run watch "$pages_run_id" \
            --repo "$REPOSITORY" \
            --exit-status \
            --interval 10

          for attempt in $(seq 1 48); do
            if node - <<'NODE'
          const expected = process.env.EXPECTED_SHA;
          const cb = `${Date.now()}-${Math.random()}`;
          const options = {
            cache: 'no-store',
            headers: { 'cache-control': 'no-cache' },
          };

          const buildResponse = await fetch(`${process.env.BUILD_INFO_URL}?cb=${cb}`, options);
          if (!buildResponse.ok) process.exit(1);
          const build = await buildResponse.json();
          if (build.commitSha !== expected) process.exit(1);

          const pageResponse = await fetch(`${process.env.PAGE_URL}&cb=${cb}`, options);
          if (!pageResponse.ok) process.exit(1);
          const pageHtml = await pageResponse.text();
          if (!pageHtml.includes('Forge Alive')) process.exit(1);

          const appResponse = await fetch(`${process.env.APP_JS_URL}?cb=${cb}`, options);
          if (!appResponse.ok) process.exit(1);
          const appJs = await appResponse.text();
          for (const required of [
            'quote-runtime-pages-rate-fetch-bridge-m05e010.js',
            'quote-runtime-vida-mujer-handoff-m05e009.js',
            'quote-runtime-vida-mujer-visual-m05e010.js',
            'quote-runtime-printable-closure-m05e006.js',
            'pipeline-google-calendar.js',
          ]) {
            if (!appJs.includes(required)) process.exit(1);
          }

          console.log(`PAGES_CANONICAL_HTTP=PASS sha=${build.commitSha}`);
          NODE
            then
              post_status success \
                "Canonical Forge Alive published and verified" \
                "$PAGE_URL"
              trap - ERR
              echo "PAGES_CANONICAL=PASS"
              echo "PAGES_SHA=$EXPECTED_SHA"
              echo "PAGES_URL=$PAGE_URL"
              exit 0
            fi
            sleep 5
          done

          echo "PAGES_CANONICAL=FAIL_STALE_OR_MISSING"
          exit 1
