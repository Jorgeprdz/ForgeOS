name: UI-M03 Clean Rewrite Playwright

on:
  push:
    branches:
      - feature/ui-material3-runtime-migration
    paths:
      - "docs/static-preview/forge-alive-material3/**"
      - "docs/architecture/source-truth/UI_M03_*"
      - "docs/evidence/UI_M03_CLEAN_HOME_*"
      - "docs/evidence/ui-m03-clean-home-*"
      - "tests/ui-m03-clean-home-rewrite-test.mjs"
      - "tests/ui-m03-image-comparator-test.mjs"
      - "tests/e2e/ui-m03-clean-home-rewrite.spec.mjs"
      - "tools/ui-m03-image-comparator.cjs"
      - "tools/ui-m03-capture-and-compare.cjs"
      - "scripts/serve-ui-m03-clean-home.mjs"
      - "playwright.ui-m03-clean.config.mjs"
      - ".github/workflows/ui-m03-clean-home-rewrite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run clean Home contracts
        run: |
          node --test \
            tests/ui-m03-governance-ratification-test.mjs \
            tests/ui-m03-clean-home-rewrite-test.mjs \
            tests/ui-m03-image-comparator-test.mjs \
            2>&1 | tee docs/evidence/ui-m03-clean-home-rewrite-actions.tap

      - name: Capture five authoritative profiles
        run: |
          npx playwright test \
            --config=playwright.ui-m03-clean.config.mjs

      - name: Verify screenshots
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const root = 'artifacts/ui-m03-clean/screenshots';
          const profiles = [
            'mobile-390x844',
            'tablet-portrait-800x1280',
            'tablet-landscape-1100x800',
            'desktop-1440x900',
            'desktop-wide-1920x1080',
          ];
          const expected = profiles.flatMap(id => [
            `${id}-viewport.png`,
            `${id}-full.png`,
            `${id}-alfred-open.png`,
          ]);
          for (const name of expected) {
            if (!fs.existsSync(`${root}/${name}`)) {
              throw new Error(`MISSING_SCREENSHOT=${name}`);
            }
          }
          const actual = fs.readdirSync(root).filter(name => name.endsWith('.png'));
          if (actual.length !== 15) {
            throw new Error(`SCREENSHOT_COUNT=${actual.length}`);
          }
          console.log('AUTHORITATIVE_SCREENSHOT_COUNT=15');
          EOF

      - name: Upload visual review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-m03-clean-home-${{ github.sha }}
          path: artifacts/ui-m03-clean
          if-no-files-found: error
          retention-days: 14
