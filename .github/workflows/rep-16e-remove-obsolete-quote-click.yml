name: REP-16E Remove Obsolete Quote Click

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rep-16e-remove-obsolete-quote-click.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promotion/rep-16e-activity-clean-main
          fetch-depth: 1

      - name: Remove obsolete quote evidence click
        run: python3 .forge/rep16e_remove_obsolete_quote_click.py

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if grep -Fxq PASS .forge/rep16e_remove_obsolete_quote_click.status; then
            rm .github/workflows/rep-16e-remove-obsolete-quote-click.yml
            rm .forge/rep16e_remove_obsolete_quote_click.py
            rm .forge/rep16e_remove_obsolete_quote_click.status
            git add tools/forge-ui-visual-diagnostic.mjs \
              .github/workflows/rep-16e-remove-obsolete-quote-click.yml \
              .forge/rep16e_remove_obsolete_quote_click.py
            git commit -m "REP-16E remove obsolete quote evidence click"
          else
            git add .forge/rep16e_remove_obsolete_quote_click.status
            git commit -m "REP-16E record obsolete quote click removal failure"
          fi

          git push origin HEAD:promotion/rep-16e-activity-clean-main
