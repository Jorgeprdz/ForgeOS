name: Aura Cartera PDF Real Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/static-preview/forge-aura/cartera/**'
      - 'docs/static-preview/forge-aura/app-v4.js'
      - 'docs/static-preview/forge-aura/aura-bootstrap-v4.js'
      - 'docs/static-preview/forge-aura/index.html'
      - 'supabase/functions/cartera-pdf-intake/**'
      - 'tests/e2e/aura-cartera-pdf-spanish-date-regression.spec.mjs'
      - 'tests/fixtures/aura-cartera-pdf-spanish-date-regression.html'
      - 'tests/aura-cartera-pdf-review-date-ui-008.test.mjs'
      - 'tests/cartera-pdf-semantic-normalization-012.test.mjs'
      - 'tests/cartera-pdf-semantic-reconciliation-012-red.test.mjs'
      - 'tests/cartera-pdf-regression-playwright.config.mjs'
      - 'tests/income-pages-import-graph.test.mjs'
      - '.github/workflows/aura-cartera-pdf-real-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-cartera-pdf-real-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pdf-upload-regression:
    name: Upload PDF and prove semantic review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check semantic browser modules
        run: |
          node --check docs/static-preview/forge-aura/cartera/cartera-semantic-v1.js
          node --check docs/static-preview/forge-aura/cartera/cartera-adapter-pages-v7.js
          node --check docs/static-preview/forge-aura/cartera/cartera-adapter-pages-v8.js
          node --check docs/static-preview/forge-aura/cartera/cartera-module-v4.js
          node --check docs/static-preview/forge-aura/cartera/cartera-coverage-adapter.js
          node --check docs/static-preview/forge-aura/app-v4.js
      - name: Prove semantic and civil-date contracts
        run: |
          node --test \
            tests/cartera-pdf-semantic-reconciliation-012-red.test.mjs \
            tests/cartera-pdf-semantic-normalization-012.test.mjs \
            tests/aura-cartera-pdf-review-date-ui-008.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Upload synthetic Imagina Ser PDF through productive input
        run: npx playwright test --config tests/cartera-pdf-regression-playwright.config.mjs
      - name: Upload visual and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-cartera-pdf-semantic-012-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/aura-cartera-pdf-regression
          if-no-files-found: warn
          retention-days: 30
