name: CRS 08 Materialize Candidate

on:
  pull_request:
    branches:
      - main
    paths:
      - '.crs08-payload/**'
      - '.github/workflows/crs-08-bootstrap.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'Jorgeprdz/ForgeOS' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Materialize governed CRS 08 package
        run: |
          set -euo pipefail
          cat .crs08-payload/part-* | base64 --decode > /tmp/crs08-final.tar.gz
          tar -xzf /tmp/crs08-final.tar.gz
          rm -rf .crs08-payload
          rm -f .github/workflows/crs-08-bootstrap.yml
          node --check platform/shared-commercial-model/crs-08-unified-person-timeline-contract.js
          node --check platform/shared-commercial-model/crs-08-unified-person-timeline-adapters.js
          node --check advisor-os/timeline/crs-08-unified-person-timeline-service.js
          node --check scripts/ci/crs-08-remote-read-model-inventory.mjs
          node --test \
            tests/crs-08-unified-person-timeline-contract-test.mjs \
            tests/crs-08-unified-person-timeline-adapters-test.mjs \
            tests/crs-08-unified-person-timeline-service-test.mjs \
            tests/crs-08-remote-read-model-inventory-test.mjs
      - name: Commit exact candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(crs-08): materialize unified person Timeline candidate"
          git push origin HEAD:${{ github.head_ref }}
