name: CRS 06E Remote Application Authority

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/20260801000598_crs06_pgcrypto_digest_compatibility.sql"
      - "supabase/migrations/20260801000599_crs06_application_dependency_compatibility.sql"
      - "supabase/migrations/20260801000601_crs06_application_integrity_grant_hardening.sql"
      - "supabase/migrations/20260801000602_crs06_application_rpc_lifecycle_hardening.sql"
      - "supabase/migrations/20260801000603_crs06_pgcrypto_digest_schema_hardening.sql"
      - "supabase/migrations/20260801000604_crs06_internal_function_grant_hardening.sql"
      - "scripts/ci/crs-06e-pgcrypto-compatibility-deploy.mjs"
      - "scripts/ci/crs-06e-remote-application-authority.mjs"
      - "tests/crs-06e-remote-application-authority-test.mjs"
      - "docs/evidence/FORGE_CRS_06E_REMOTE_APPLICATION_AUTHORITY_PREPARATION_001.md"
      - ".github/workflows/crs-06e-remote-application-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crs-06e-remote-application-authority
  cancel-in-progress: false

jobs:
  deploy-and-accept:
    if: >-
      github.repository == 'Jorgeprdz/ForgeOS' &&
      (github.event_name == 'workflow_dispatch' ||
       github.head_ref == 'deploy/crs-06e-remote-application-authority')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: rmlxigxysujsuwzgoimv
      ACCEPTANCE_BRANCH: deploy/crs-06e-remote-application-authority

    steps:
      - name: Checkout exact acceptance head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Authorization, secret and bounded-path gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$SUPABASE_PROJECT_REF" = "rmlxigxysujsuwzgoimv"
          git fetch origin main --depth=1
          git diff --check origin/main...HEAD

          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          printf 'CHANGED_FILE=%s\n' "${changed[@]}"
          allowed='^(\.github/workflows/crs-06e-remote-application-authority\.yml|docs/evidence/FORGE_CRS_06E_REMOTE_APPLICATION_AUTHORITY_(PREPARATION|CLOSURE)_001\.md|scripts/ci/crs-06e-(pgcrypto-compatibility-deploy|remote-application-authority)\.mjs|supabase/migrations/20260801000(598_crs06_pgcrypto_digest_compatibility|599_crs06_application_dependency_compatibility|601_crs06_application_integrity_grant_hardening|602_crs06_application_rpc_lifecycle_hardening|603_crs06_pgcrypto_digest_schema_hardening|604_crs06_internal_function_grant_hardening)\.sql|tests/crs-06e-remote-application-authority-test\.mjs)$'
          for path in "${changed[@]}"; do
            if [[ ! "$path" =~ $allowed ]]; then
              echo "CRS_06E_UNAUTHORIZED_PATH=$path" >&2
              exit 1
            fi
          done

          mkdir -p artifacts/crs-06e-remote-application-authority
          echo 'CRS_06E_OWNER_AUTHORIZATION=PASS'
          echo 'CRS_06E_BOUNDED_PATHS=PASS'
          echo 'PRODUCT_UI_MUTATION=NO'
          echo 'PAGES_DEPLOYMENT=NO'

      - name: Syntax and repository acceptance
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/ci/crs-06e-pgcrypto-compatibility-deploy.mjs
          node --check scripts/ci/crs-06e-remote-application-authority.mjs
          node --check tests/crs-06e-remote-application-authority-test.mjs
          node --test tests/crs-06e-remote-application-authority-test.mjs
          node --test tests/crs-06-application-signature-authority-contract-test.mjs
          node --test tests/crs-06-application-signature-authority-service-test.mjs
          node --test tests/crs-06-application-signature-migration-security-test.mjs
          node --test tests/crs-02-domain-link-envelope-contract-test.mjs
          node --test tests/crs-05-quote-person-convergence-contract-test.mjs
          node --test tests/cartera-001b-quote-lifecycle-event-contract-test.mjs
          node --test tests/cartera-010b-governed-command-rpc-test.mjs

      - name: Prepare bounded pgcrypto compatibility
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/crs-06e-pgcrypto-compatibility-deploy.mjs prepare \
            | tee artifacts/crs-06e-remote-application-authority/pgcrypto-prepare.log
          grep -q 'CRS_06E_PGCRYPTO_COMPATIBILITY_PREPARED=PASS' \
            artifacts/crs-06e-remote-application-authority/pgcrypto-prepare.log
          grep -q 'CRS_06E_INTERNAL_FUNCTION_GRANT_HARDENING=PASS' \
            artifacts/crs-06e-remote-application-authority/pgcrypto-prepare.log

      - name: Deploy and execute rollback-clean remote acceptance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/crs-06e-remote-application-authority.mjs \
            | tee artifacts/crs-06e-remote-application-authority/workflow-output.log

      - name: Retire pgcrypto compatibility bridge
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/crs-06e-pgcrypto-compatibility-deploy.mjs retire \
            | tee artifacts/crs-06e-remote-application-authority/pgcrypto-retire.log
          grep -q 'CRS_06E_PGCRYPTO_COMPATIBILITY_RETIRED=PASS' \
            artifacts/crs-06e-remote-application-authority/pgcrypto-retire.log

      - name: Verify explicit closure markers
        shell: bash
        run: |
          set -euo pipefail
          log=artifacts/crs-06e-remote-application-authority/workflow-output.log
          grep -q 'CRS_06E_REMOTE_SUPABASE_DEPLOYMENT=PASS' "$log"
          grep -q 'CRS_06E_REMOTE_RLS_ACCEPTANCE=PASS' "$log"
          grep -q 'CRS_06E_REMOTE_RPC_ACCEPTANCE=PASS' "$log"
          grep -q 'CRS_06E_CHANGED_INPUT_CONFLICT=PASS' "$log"
          grep -q 'CRS_06E_CROSS_ADVISOR_ISOLATION=PASS' "$log"
          grep -q 'CRS_06E_POLICY_BOUNDARY=PASS' "$log"
          grep -q 'TEST_FIXTURES_ROLLED_BACK=YES' "$log"
          grep -q 'RESIDUAL_FIXTURES=0' "$log"
          grep -q 'CRS_06E_REMOTE_APPLICATION_AUTHORITY=PASS' "$log"
          grep -q 'CRS_06E_PGCRYPTO_COMPATIBILITY_RETIRED=PASS' \
            artifacts/crs-06e-remote-application-authority/pgcrypto-retire.log

      - name: Upload remote acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crs-06e-remote-application-authority
          path: artifacts/crs-06e-remote-application-authority
          if-no-files-found: error
          retention-days: 30
