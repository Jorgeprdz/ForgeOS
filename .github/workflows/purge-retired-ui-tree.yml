name: Purge Retired UI Tree

on:
  push:
    branches:
      - chore/retire-all-legacy-forge-ui

permissions:
  contents: write

concurrency:
  group: purge-retired-ui-tree
  cancel-in-progress: true

jobs:
  purge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/retire-all-legacy-forge-ui
          fetch-depth: 0

      - name: Move productive quote engine and delete retired UI trees
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil
          import subprocess

          retired = Path('docs/static-preview/forge-alive')
          engine = Path('docs/static-preview/quote-engine')
          source_html = retired / 'nueva-cotizacion/index.html'
          source_entrypoint = retired / 'forge-sales-presentation-entrypoint-r16j0.js'
          target_html = engine / 'nueva-cotizacion/index.html'
          target_entrypoint = engine / 'forge-sales-presentation-entrypoint-r16j0.js'

          if not source_html.exists() or not source_entrypoint.exists():
              raise SystemExit('QUOTE_ENGINE_SOURCE_BOUNDARY_MISSING')

          target_html.parent.mkdir(parents=True, exist_ok=True)
          engine.mkdir(parents=True, exist_ok=True)
          html = source_html.read_text()
          html = html.replace(
              '<title>Nueva cotización · Forge Alive</title>',
              '<title>Motor de cotización · ForgeOS</title>',
          )
          html = re.sub(
              r'\n<nav\s+class="bottom-nav forge-mobile-nav-r16c5j"[\s\S]*?</nav>\s*',
              '\n',
              html,
              count=1,
          )
          html = re.sub(
              r'\s*<script defer src="\.\./forge-alive-mobile-nav-r16c5j\.js[^>]*></script>',
              '',
              html,
              count=1,
          )
          if 'forge-mobile-nav-r16c5j' in html:
              raise SystemExit('QUOTE_ENGINE_MOBILE_UI_REMAINS')
          target_html.write_text(html)
          shutil.copyfile(source_entrypoint, target_entrypoint)

          replacements = {
              'docs/static-preview/forge-alive/nueva-cotizacion/index.html':
                  'docs/static-preview/quote-engine/nueva-cotizacion/index.html',
              'docs/static-preview/forge-alive/forge-sales-presentation-entrypoint-r16j0.js':
                  'docs/static-preview/quote-engine/forge-sales-presentation-entrypoint-r16j0.js',
              '../forge-alive/nueva-cotizacion/index.html':
                  '../quote-engine/nueva-cotizacion/index.html',
              'docs/static-preview/forge-alive/forge-alive-public-config-067g17a1.js':
                  'docs/static-preview/forge-alive-material3/forge-alive-public-config-067g17a1.js',
              'docs/static-preview/forge-alive/forge-alive-auth-entry-067g17b1.js':
                  'docs/static-preview/forge-alive-material3/forge-alive-auth-entry-067g17b1.js',
              'docs/static-preview/forge-alive/forge-alive-auth-entry-067g17b1.css':
                  'docs/static-preview/forge-alive-material3/forge-alive-auth-entry-067g17b1.css',
              "const quoteEngineSource = 'docs/static-preview/forge-alive/nueva-cotizacion/index.html';":
                  "const quoteEngineSource = 'docs/static-preview/quote-engine/nueva-cotizacion/index.html';",
          }

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for name in filter(None, tracked):
              path = Path(name)
              if not path.is_file():
                  continue
              try:
                  text = path.read_text()
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)

          for directory in (
              retired,
              Path('docs/10-gui'),
              Path('docs/static-preview/templates'),
              Path('docs/quote-preview-live'),
          ):
              shutil.rmtree(directory, ignore_errors=True)

          preview_runtime = Path('docs/static-preview/quote-preview-live')
          if preview_runtime.exists():
              for html_file in preview_runtime.rglob('*.html'):
                  html_file.unlink()

          if retired.exists():
              raise SystemExit('RETIRED_FORGE_ALIVE_TREE_REMAINS')
          if not target_html.exists() or not target_entrypoint.exists():
              raise SystemExit('ISOLATED_QUOTE_ENGINE_MISSING')
          PY

      - name: Commit purge
        run: |
          if git diff --quiet; then
            echo 'RETIRED_UI_TREE_ALREADY_PURGED=PASS'
            exit 0
          fi
          git config user.name forgeos-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'chore(ui): purge retired ForgeOS UI source trees'
          git push origin HEAD:chore/retire-all-legacy-forge-ui
