name: CARTERA 020C Remote Dispatcher

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cartera-020c-remote-dispatch.yml
  workflow_dispatch:
    inputs:
      authorization:
        description: Type YES:CARTERA_020C_REMOTE_MUTATION
        required: true
        type: string
      expected_source_head:
        description: Exact accepted 020C repository head
        required: true
        type: string
      expected_acceptance_head:
        description: Exact frozen remote-acceptance head
        required: true
        type: string
      project_ref:
        description: Exact Supabase project ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cartera-020c-remote-dispatch
  cancel-in-progress: false

jobs:
  dispatcher-contract-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify dispatcher is pinned and non-mutating on pull requests
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/cartera-020c-remote-dispatch.yml
          grep -q '^  workflow_dispatch:' "$workflow"
          grep -q "github.event_name == 'workflow_dispatch'" "$workflow"
          grep -q 'YES:CARTERA_020C_REMOTE_MUTATION' "$workflow"
          grep -q '0daaccd556659b997f2086e12b09481281d1b019' "$workflow"
          grep -q '0075a54ed1886811a9dd4b295128bdab0a69eccb' "$workflow"
          grep -q 'rmlxigxysujsuwzgoimv' "$workflow"
          grep -q 'cancel-in-progress: false' "$workflow"
          grep -q 'SUPABASE_ACCESS_TOKEN:.*secrets.SUPABASE_ACCESS_TOKEN' "$workflow"
          echo 'DEFAULT_BRANCH_DISPATCHER_CONTRACT=PASS'
          echo 'PULL_REQUEST_REMOTE_MUTATION=IMPOSSIBLE'

  remote-deployment-and-acceptance:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Jorgeprdz/ForgeOS'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARTERA_020C_REMOTE_MUTATION_AUTHORIZED: ${{ inputs.authorization }}
      CARTERA_020C_EXPECTED_SOURCE_HEAD: ${{ inputs.expected_source_head }}
      CARTERA_020C_EXPECTED_ACCEPTANCE_HEAD: ${{ inputs.expected_acceptance_head }}
      CARTERA_020C_ACCEPTANCE_BRANCH: feature/cartera-020c-remote-acceptance
      SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}

    steps:
      - name: Validate exact dispatch inputs before checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$CARTERA_020C_REMOTE_MUTATION_AUTHORIZED" = 'YES:CARTERA_020C_REMOTE_MUTATION'
          test "$CARTERA_020C_EXPECTED_SOURCE_HEAD" = '0daaccd556659b997f2086e12b09481281d1b019'
          test "$CARTERA_020C_EXPECTED_ACCEPTANCE_HEAD" = '0075a54ed1886811a9dd4b295128bdab0a69eccb'
          test "$SUPABASE_PROJECT_REF" = 'rmlxigxysujsuwzgoimv'
          echo 'PINNED_DISPATCH_INPUTS=PASS'

      - name: Checkout exact frozen acceptance head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_acceptance_head }}
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify ancestry, branch membership and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CARTERA_020C_EXPECTED_ACCEPTANCE_HEAD"
          git merge-base --is-ancestor "$CARTERA_020C_EXPECTED_SOURCE_HEAD" HEAD
          git branch -r --contains HEAD | grep -q 'origin/feature/cartera-020c-remote-acceptance'
          git diff --check "$CARTERA_020C_EXPECTED_SOURCE_HEAD"...HEAD
          mapfile -t changed < <(git diff --name-only "$CARTERA_020C_EXPECTED_SOURCE_HEAD"...HEAD)
          allowed='^(\.github/workflows/cartera-020c-remote-(gate|acceptance)\.yml|advisor-os/cartera/persistent-confirmation-orchestration-service\.js|docs/evidence/FORGE_CARTERA_020C_REMOTE_ACCEPTANCE_(PREPARATION|CLOSURE)_001\.md|scripts/ci/cartera-020c-(github-actions-remote-acceptance\.mjs|remote-acceptance\.sql)|supabase/migrations/20260731000238_cartera020c_authorization_digest_hardening\.sql|tests/cartera-020c-(authorization-digest-hardening|remote-acceptance-harness)-test\.mjs)$'
          for path in "${changed[@]}"; do
            if [[ ! "$path" =~ $allowed ]]; then
              echo "UNAUTHORIZED_020C_REMOTE_PATH=$path" >&2
              exit 1
            fi
          done
          echo 'PINNED_ACCEPTANCE_HEAD=PASS'
          echo 'SOURCE_ANCESTRY=PASS'
          echo 'BOUNDED_REMOTE_PATHS=PASS'

      - name: Repository and harness gate
        shell: bash
        run: |
          set -euo pipefail
          node --check advisor-os/cartera/persistent-confirmation-orchestration-service.js
          node --check scripts/ci/cartera-020c-github-actions-remote-acceptance.mjs
          node --check tests/cartera-020c-authorization-digest-hardening-test.mjs
          node --check tests/cartera-020c-remote-acceptance-harness-test.mjs
          node --test tests/cartera-020c-*.mjs

      - name: Deploy and execute remote acceptance
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          mkdir -p artifacts/cartera-020c-remote-acceptance
          GITHUB_SHA="$(git rev-parse HEAD)" \
            node scripts/ci/cartera-020c-github-actions-remote-acceptance.mjs \
            | tee artifacts/cartera-020c-remote-acceptance/workflow-output.log

      - name: Verify explicit acceptance markers
        shell: bash
        run: |
          set -euo pipefail
          log=artifacts/cartera-020c-remote-acceptance/workflow-output.log
          grep -q 'CARTERA_020C_REMOTE_DEPLOYMENT=PASS' "$log"
          grep -q 'AUTHORIZATION_DIGEST_COMPATIBILITY=PASS' "$log"
          grep -q 'CARTERA_020C_TRANSACTIONAL_ACCEPTANCE=PASS' "$log"
          grep -q 'AUTHORIZATION_DIGEST_BINDING=PASS' "$log"
          grep -q 'IDENTITY_ORDERED_EXECUTION=PASS' "$log"
          grep -q 'IDENTITY_READ_AFTER_WRITE=PASS' "$log"
          grep -q 'POLICY_READ_AFTER_WRITE=PASS' "$log"
          grep -q 'CHANGED_INPUT_CONFLICT=PASS' "$log"
          grep -q 'RETRY_GOVERNANCE=PASS' "$log"
          grep -q 'PARALLEL_STATE_VERSION_SERIALIZATION=PASS' "$log"
          grep -q 'RLS_CROSS_ADVISOR=PASS' "$log"
          grep -q 'DIRECT_WRITES=BLOCKED' "$log"
          grep -q 'SANITIZED_STATUS=PASS' "$log"
          grep -q 'TEST_FIXTURES_ROLLED_BACK=YES' "$log"
          grep -q 'CONCURRENCY_FIXTURES_CLEANED=YES' "$log"
          grep -q 'RESIDUAL_FIXTURES=0' "$log"
          grep -q 'CARTERA_020C_REMOTE_ACCEPTANCE=PASS' "$log"

      - name: Upload remote acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartera-020c-remote-acceptance
          path: artifacts/cartera-020c-remote-acceptance
          if-no-files-found: error
          retention-days: 30
