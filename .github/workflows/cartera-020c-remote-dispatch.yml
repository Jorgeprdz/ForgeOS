name: CARTERA 020C Closed Remote Acceptance Verifier

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartera-020c-closed-remote-verifier
  cancel-in-progress: true

jobs:
  verify-accepted-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout closed acceptance head
        uses: actions/checkout@v4
        with:
          ref: e7982dd263a4f2e894569bc4821edf94bfa1a9da
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify immutable accepted closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'e7982dd263a4f2e894569bc4821edf94bfa1a9da'
          git merge-base --is-ancestor 0daaccd556659b997f2086e12b09481281d1b019 HEAD
          node --test tests/cartera-020c-*.mjs
          closure=docs/evidence/FORGE_CARTERA_020C_REMOTE_ACCEPTANCE_CLOSURE_001.md
          grep -q 'WORKFLOW_RUN=30675286681' "$closure"
          grep -q 'WORKFLOW_JOB=91301111909' "$closure"
          grep -q 'ARTIFACT_ID=8810199540' "$closure"
          grep -q 'ARTIFACT_SHA256=b396f1b95338a4f280c63eb4cd10ff799481b57aceb3194d2947e979c4d8e1f4' "$closure"
          grep -q 'CARTERA_020C_COMPLETE=YES' "$closure"
          echo 'REMOTE_ACCEPTANCE_ALREADY_CLOSED=YES'
          echo 'REMOTE_MUTATION=NONE'
          echo 'ACCOUNT_MUTATION=NOT_AUTHORIZED'
          echo 'CARTERA_020C_COMPLETE=YES'
