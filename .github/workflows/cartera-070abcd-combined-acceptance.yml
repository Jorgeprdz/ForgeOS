name: CARTERA 070A + 070B + 070C + 070D Combined Acceptance

on:
  pull_request:
    types: [opened]
    branches:
      - feature/cartera-060abcd-relationship-growth-intelligence

permissions:
  contents: write

jobs:
  combined-delivery:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/cartera-070abcd-relational-activation' &&
      github.event.pull_request.base.ref == 'feature/cartera-060abcd-relationship-growth-intelligence'
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: rmlxigxysujsuwzgoimv
      CARTERA_070ABCD_REMOTE_MUTATION_AUTHORIZED: YES:CARTERA_070ABCD_REMOTE_MUTATION
      CARTERA_070ABCD_EXPECTED_SOURCE_HEAD: 07e37653c1199e47f4440d1a535ef6ed3a182985
      CARTERA_070ABCD_ACCEPTANCE_BRANCH: feature/cartera-070abcd-relational-activation
    steps:
      - name: Checkout exact combined branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize complete 070A–070D delivery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cartera-070abcd-remote-acceptance
          echo 'CARTERA_070ABCD_WORKFLOW=STARTED' > artifacts/cartera-070abcd-remote-acceptance/bootstrap.log
          shopt -s nullglob
          fragments=(.forge-bootstrap/cartera070.bundle.*.b64)
          if (( ${#fragments[@]} != 5 )); then
            echo "CARTERA_070ABCD_FRAGMENT_COUNT=${#fragments[@]}"
            exit 1
          fi
          printf '%s\n' "${fragments[@]}" | sort > /tmp/cartera070-fragments
          while IFS= read -r fragment; do cat "$fragment"; done < /tmp/cartera070-fragments \
            | base64 --decode > /tmp/cartera070-bundle.tar.gz
          tar -xzf /tmp/cartera070-bundle.tar.gz
          rm -rf .forge-bootstrap
          node scripts/ci/cartera-070abcd-materialize-app.mjs
          test -f supabase/migrations/20260801000300_cartera070_relational_activation_helpers.sql
          test -f supabase/migrations/20260801000301_cartera070_relational_activation_read.sql
          test -f scripts/ci/cartera-070abcd-combined-acceptance.sh
          test -f advisor-os/cartera/cartera-070d-relational-activation-enhancement.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(cartera): materialize combined 070A through 070D delivery'
          git push origin HEAD:feature/cartera-070abcd-relational-activation
          echo "CARTERA_070ABCD_ACCEPTANCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo 'CARTERA_070ABCD_DELIVERY=MATERIALIZED'

      - name: Execute combined gates and remote acceptance
        run: bash scripts/ci/cartera-070abcd-combined-acceptance.sh

      - name: Upload combined evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartera-070abcd-combined-remote-acceptance
          path: artifacts/cartera-070abcd-remote-acceptance
          if-no-files-found: error
          retention-days: 30
