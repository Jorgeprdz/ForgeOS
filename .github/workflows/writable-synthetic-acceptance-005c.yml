name: Governed Writable Synthetic Acceptance 005C

on:
  workflow_call:
    inputs:
      run_id:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional sanitized evidence run identifier
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: writable-synthetic-acceptance-005c
  cancel-in-progress: false

jobs:
  governed-acceptance:
    if: github.repository == 'Jorgeprdz/ForgeOS' && github.actor == 'Jorgeprdz'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: 067g17a1-remote-acceptance
    env:
      SUPABASE_PROJECT_REF: rmlxigxysujsuwzgoimv
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      FORGE_005C_EVIDENCE_DIR: artifacts/writable-synthetic-acceptance-005c
    steps:
      - name: Checkout exact selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight 005C contracts
        run: |
          set -euo pipefail
          node --check scripts/deploy-governed-writable-synthetic-acceptance-005c.mjs
          node --check scripts/forge-writable-synthetic-acceptance-005c.mjs
          node --check scripts/verify-writable-synthetic-acceptance-005c-sealed.mjs
          node --check scripts/finalize-writable-synthetic-acceptance-005c.mjs
          node --test tests/writable-synthetic-acceptance-005c.test.mjs tests/login-integrated-demo-tenants-test.mjs

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate one-run control-plane credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/forge005c"
          admin_token="$(openssl rand -hex 32)"
          password_a="$(openssl rand -base64 36 | tr -d '\n' | tr '/+' '_-')Aa1!"
          password_b="$(openssl rand -base64 36 | tr -d '\n' | tr '/+' '_-')Bb2!"
          printf '%s' "$admin_token" > "$RUNNER_TEMP/forge005c/admin-token"
          printf '%s' "$password_a" > "$RUNNER_TEMP/forge005c/a-password"
          printf '%s' "$password_b" > "$RUNNER_TEMP/forge005c/b-password"
          chmod 600 "$RUNNER_TEMP/forge005c/"*
          echo "::add-mask::$admin_token"
          echo "::add-mask::$password_a"
          echo "::add-mask::$password_b"
          echo '005C_ONE_RUN_CREDENTIALS=PREPARED'

      - name: Apply exact additive 005C lifecycle migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/deploy-governed-writable-synthetic-acceptance-005c.mjs

      - name: Configure and deploy acceptance control plane
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          admin_token="$(cat "$RUNNER_TEMP/forge005c/admin-token")"
          password_a="$(cat "$RUNNER_TEMP/forge005c/a-password")"
          password_b="$(cat "$RUNNER_TEMP/forge005c/b-password")"
          supabase secrets set \
            FORGE_ACCEPTANCE_ADMIN_TOKEN="$admin_token" \
            FORGE_ACCEPTANCE_A_PASSWORD="$password_a" \
            FORGE_ACCEPTANCE_B_PASSWORD="$password_b" \
            --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy forge-acceptance-admin --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          echo '005C_CONTROL_PLANE_DEPLOYED=YES'

      - name: Capture public-demo state before acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FORGE_005C_EVIDENCE_DIR"
          admin_token="$(cat "$RUNNER_TEMP/forge005c/admin-token")"
          curl --fail --silent --show-error -X POST \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/forge-acceptance-admin" \
            -H 'Content-Type: application/json' \
            -H "x-forge-acceptance-admin-token: $admin_token" \
            --data '{"action":"STATUS"}' > "$FORGE_005C_EVIDENCE_DIR/status-before.json"
          node -e "const p=require('./$FORGE_005C_EVIDENCE_DIR/status-before.json');if(p.ok!==true)throw Error('STATUS_BEFORE_FAILED')"

      - name: Provision and open dedicated acceptance identities
        shell: bash
        run: |
          set -euo pipefail
          admin_token="$(cat "$RUNNER_TEMP/forge005c/admin-token")"
          curl --fail --silent --show-error -X POST \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/forge-acceptance-admin" \
            -H 'Content-Type: application/json' \
            -H "x-forge-acceptance-admin-token: $admin_token" \
            --data '{"action":"PROVISION"}' > "$FORGE_005C_EVIDENCE_DIR/provision.json"
          node -e "const p=require('./$FORGE_005C_EVIDENCE_DIR/provision.json');if(p.ok!==true||p.accountsOpened!==2)throw Error('PROVISION_FAILED')"
          curl --fail --silent --show-error -X POST \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/forge-acceptance-admin" \
            -H 'Content-Type: application/json' \
            -H "x-forge-acceptance-admin-token: $admin_token" \
            --data '{"action":"STATUS"}' > "$FORGE_005C_EVIDENCE_DIR/status-open.json"
          echo '005C_ACCEPTANCE_WINDOW=OPEN'

      - name: Execute authenticated 005C data plane
        shell: bash
        run: |
          set -euo pipefail
          export FORGE_ACCEPTANCE_A_PASSWORD="$(cat "$RUNNER_TEMP/forge005c/a-password")"
          export FORGE_ACCEPTANCE_B_PASSWORD="$(cat "$RUNNER_TEMP/forge005c/b-password")"
          export FORGE_005C_DATA_EVIDENCE="$FORGE_005C_EVIDENCE_DIR/data-plane-report.json"
          node scripts/forge-writable-synthetic-acceptance-005c.mjs | tee "$FORGE_005C_EVIDENCE_DIR/data-plane-output.log"

      - name: Seal dedicated acceptance identities
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          admin_token="$(cat "$RUNNER_TEMP/forge005c/admin-token")"
          curl --fail --silent --show-error -X POST \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/forge-acceptance-admin" \
            -H 'Content-Type: application/json' \
            -H "x-forge-acceptance-admin-token: $admin_token" \
            --data '{"action":"SEAL"}' > "$FORGE_005C_EVIDENCE_DIR/seal.json"
          node -e "const p=require('./$FORGE_005C_EVIDENCE_DIR/seal.json');if(p.ok!==true||p.accountsSealed!==2)throw Error('SEAL_FAILED')"
          curl --fail --silent --show-error -X POST \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/forge-acceptance-admin" \
            -H 'Content-Type: application/json' \
            -H "x-forge-acceptance-admin-token: $admin_token" \
            --data '{"action":"STATUS"}' > "$FORGE_005C_EVIDENCE_DIR/status-after.json"
          echo '005C_ACCEPTANCE_WINDOW=SEALED'

      - name: Verify one-run credentials invalid after seal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export FORGE_ACCEPTANCE_A_PASSWORD="$(cat "$RUNNER_TEMP/forge005c/a-password")"
          export FORGE_ACCEPTANCE_B_PASSWORD="$(cat "$RUNNER_TEMP/forge005c/b-password")"
          node scripts/verify-writable-synthetic-acceptance-005c-sealed.mjs

      - name: Finalize AA-01 through AA-10 evidence
        if: always()
        run: node scripts/finalize-writable-synthetic-acceptance-005c.mjs

      - name: Upload sanitized 005C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writable-synthetic-acceptance-005c-${{ github.sha }}-${{ inputs.run_id || github.run_id }}
          path: artifacts/writable-synthetic-acceptance-005c/
          if-no-files-found: error
          retention-days: 30
