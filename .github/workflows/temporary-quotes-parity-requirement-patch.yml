name: One-shot Quotes Parity Requirement Patch

on:
  push:
    branches:
      - chore/retire-all-legacy-forge-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/retire-all-legacy-forge-ui
          fetch-depth: 0

      - name: Stop requiring retired parity loader
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/build-quotes-preview-pages.mjs')
          source = path.read_text()
          retired = '  "static-preview/forge-alive/index-quote-calculator-parity.html",\n'
          if source.count(retired) != 1:
              raise SystemExit(f'RETIRED_PARITY_REQUIREMENT_COUNT={source.count(retired)}')
          source = source.replace(retired, '', 1)
          if 'index-quote-calculator-parity.html' in source:
              raise SystemExit('RETIRED_PARITY_LOADER_STILL_REFERENCED')
          path.write_text(source)
          PY

          node --check scripts/build-quotes-preview-pages.mjs
          git diff --check

      - name: Commit source correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-quotes-preview-pages.mjs
          git commit -m "fix: stop requiring retired quote parity loader"
          git push origin HEAD:chore/retire-all-legacy-forge-ui