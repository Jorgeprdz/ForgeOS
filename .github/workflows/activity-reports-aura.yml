name: Activity Confirmation and Mail Evidence

on:
  pull_request:
    paths:
      - 'docs/static-preview/forge-aura/activity/**'
      - 'platform/mail-evidence/**'
      - 'supabase/functions/mail-evidence-connect/**'
      - 'supabase/migrations/20260807000100_activity_confirmation_mail_evidence.sql'
      - 'supabase/migrations/20260807000110_activity_mail_oauth_connections.sql'
      - 'scripts/deploy-activity-mail-evidence.mjs'
      - 'tests/mail-evidence-engine.test.mjs'
      - 'tests/mail-evidence-oauth-broker-contract.test.mjs'
      - 'tests/activity-daily-confirmation-contract.test.mjs'
      - 'tests/activity-confirmation-migration-contract.test.mjs'
      - 'tests/activity-mail-evidence-deployment-contract.test.mjs'
      - 'tests/activity-playwright.config.mjs'
      - 'tests/e2e/activity-daily-confirmation.spec.mjs'
      - '.github/workflows/activity-reports-aura.yml'
      - '.github/workflows/activity-mail-evidence-deployment.yml'
  push:
    branches:
      - 'codex/activity-confirmation-mail-evidence-001'

permissions:
  contents: read

jobs:
  scope-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope guard against integrated Activity PASS
        shell: bash
        run: |
          set -euo pipefail
          BASE=9e2cb417fc37193e61254355684636c0f434c38b
          git cat-file -e "$BASE^{commit}"
          git diff --name-only "$BASE" HEAD > /tmp/changed.txt
          cat /tmp/changed.txt
          if grep -E '^docs/static-preview/forge-aura/pipeline/|^docs/static-preview/forge-aura/aura-auth|^docs/static-preview/forge-aura/.*login' /tmp/changed.txt; then
            echo 'Forbidden Pipeline/Login mutation detected' >&2
            exit 1
          fi
          grep -Ev '^(docs/static-preview/forge-aura/activity/activity-module\.js$|docs/static-preview/forge-aura/activity/activity-daily-confirmation\.js$|docs/static-preview/forge-aura/activity/activity-mail-connection\.js$|platform/mail-evidence/|supabase/functions/mail-evidence-connect/|supabase/migrations/20260807000100_activity_confirmation_mail_evidence\.sql$|supabase/migrations/20260807000110_activity_mail_oauth_connections\.sql$|scripts/deploy-activity-mail-evidence\.mjs$|tests/mail-evidence-engine\.test\.mjs$|tests/mail-evidence-oauth-broker-contract\.test\.mjs$|tests/activity-daily-confirmation-contract\.test\.mjs$|tests/activity-confirmation-migration-contract\.test\.mjs$|tests/activity-mail-evidence-deployment-contract\.test\.mjs$|tests/activity-playwright\.config\.mjs$|tests/e2e/activity-daily-confirmation\.spec\.mjs$|\.github/workflows/activity-reports-aura\.yml$|\.github/workflows/activity-mail-evidence-deployment\.yml$)' /tmp/changed.txt > /tmp/outside.txt || true
          cat /tmp/outside.txt
          test ! -s /tmp/outside.txt
      - name: Activity and mail evidence contract tests
        run: >-
          node --test
          tests/activity-aura-scope-contract.test.mjs
          tests/activity-aura-points-authority.test.mjs
          tests/mail-evidence-engine.test.mjs
          tests/mail-evidence-oauth-broker-contract.test.mjs
          tests/activity-daily-confirmation-contract.test.mjs
          tests/activity-confirmation-migration-contract.test.mjs
          tests/activity-mail-evidence-deployment-contract.test.mjs

  oauth-readiness:
    name: OAuth secret readiness (presence only)
    runs-on: ubuntu-latest
    needs: scope-and-contract
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      FORGE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.FORGE_GOOGLE_OAUTH_CLIENT_ID }}
      FORGE_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.FORGE_GOOGLE_OAUTH_CLIENT_SECRET }}
      FORGE_MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.FORGE_MICROSOFT_OAUTH_CLIENT_ID }}
      FORGE_MICROSOFT_OAUTH_CLIENT_SECRET: ${{ secrets.FORGE_MICROSOFT_OAUTH_CLIENT_SECRET }}
      FORGE_MAIL_TOKEN_ENCRYPTION_SECRET: ${{ secrets.FORGE_MAIL_TOKEN_ENCRYPTION_SECRET }}
      SUPABASE_PROJECT_REF: rmlxigxysujsuwzgoimv
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Report configured secret names only
        shell: bash
        run: |
          set -euo pipefail
          check_env() {
            local name="$1"
            if [ -n "${!name:-}" ]; then printf 'GITHUB_%s=CONFIGURED\n' "$name"; else printf 'GITHUB_%s=MISSING\n' "$name"; fi
          }
          check_env SUPABASE_ACCESS_TOKEN
          check_env SUPABASE_ANON_KEY
          check_env FORGE_GOOGLE_OAUTH_CLIENT_ID
          check_env FORGE_GOOGLE_OAUTH_CLIENT_SECRET
          check_env FORGE_MICROSOFT_OAUTH_CLIENT_ID
          check_env FORGE_MICROSOFT_OAUTH_CLIENT_SECRET
          check_env FORGE_MAIL_TOKEN_ENCRYPTION_SECRET

          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" > /tmp/supabase-secret-names.txt
            check_remote() {
              local name="$1"
              if grep -q "$name" /tmp/supabase-secret-names.txt; then printf 'SUPABASE_%s=CONFIGURED\n' "$name"; else printf 'SUPABASE_%s=MISSING\n' "$name"; fi
            }
            check_remote FORGE_GOOGLE_OAUTH_CLIENT_ID
            check_remote FORGE_GOOGLE_OAUTH_CLIENT_SECRET
            check_remote FORGE_MICROSOFT_OAUTH_CLIENT_ID
            check_remote FORGE_MICROSOFT_OAUTH_CLIENT_SECRET
            check_remote FORGE_MAIL_TOKEN_ENCRYPTION_SECRET
            check_remote FORGE_APP_ORIGIN
            check_remote FORGE_MAIL_OAUTH_CALLBACK_URL
            check_remote FORGE_MAIL_OAUTH_RETURN_URL
            rm -f /tmp/supabase-secret-names.txt
          fi
          echo 'READINESS_CHECK=COMPLETE_VALUES_NEVER_PRINTED'

  browser-acceptance:
    name: Activity confirmation responsive acceptance
    runs-on: ubuntu-latest
    needs: scope-and-contract
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Activity browser acceptance
        run: npx playwright test --config tests/activity-playwright.config.mjs
      - name: Upload Activity screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-confirmation-mail-evidence-${{ github.sha }}
          path: test-results/activity-aura-ux-reconciliation
          if-no-files-found: warn
          retention-days: 30
