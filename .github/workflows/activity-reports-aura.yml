name: Activity 25pt Productivity Cockpit

on:
  pull_request:
    paths:
      - 'docs/static-preview/forge-aura/activity/**'
      - 'docs/static-preview/forge-aura/aura-tokens.css'
      - 'tests/activity-aura-points-authority.test.mjs'
      - 'tests/activity-aura-scope-contract.test.mjs'
      - 'tests/activity-daily-confirmation-contract.test.mjs'
      - 'tests/activity-fes-point-suggestions.test.mjs'
      - 'tests/activity-playwright.config.mjs'
      - 'tests/e2e/activity-aura-ux-reconciliation.spec.mjs'
      - 'tests/e2e/activity-aura-points-boundaries.spec.mjs'
      - 'tests/e2e/activity-capture-directory-ux.spec.mjs'
      - 'tests/e2e/activity-daily-confirmation.spec.mjs'
      - 'tests/e2e/activity-fes-point-suggestions.spec.mjs'
      - 'docs/architecture/source-truth/FORGE_AURA_ACTIVITY_25PT_PRODUCTIVITY_COCKPIT_RECONCILIATION_REPORT_001.md'
      - '.github/workflows/activity-reports-aura.yml'
  push:
    branches:
      - 'codex/forge-aura-activity-25pt-productivity-cockpit-001'

permissions:
  contents: read

jobs:
  scope-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Activity phase scope guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only origin/main...HEAD > /tmp/changed.txt
          cat /tmp/changed.txt
          if grep -E '^docs/static-preview/forge-aura/pipeline/|^docs/static-preview/forge-aura/aura-auth|^docs/static-preview/forge-aura/.*login|^supabase/|^platform/productivity/|^daily-points-engine\.js$' /tmp/changed.txt; then
            echo 'Forbidden Activity phase mutation detected' >&2
            exit 1
          fi
          grep -Ev '^(docs/static-preview/forge-aura/activity/.*|docs/static-preview/forge-aura/aura-tokens\.css|tests/activity-aura-points-authority\.test\.mjs|tests/activity-aura-scope-contract\.test\.mjs|tests/activity-daily-confirmation-contract\.test\.mjs|tests/activity-fes-point-suggestions\.test\.mjs|tests/activity-playwright\.config\.mjs|tests/e2e/activity-aura-ux-reconciliation\.spec\.mjs|tests/e2e/activity-aura-points-boundaries\.spec\.mjs|tests/e2e/activity-capture-directory-ux\.spec\.mjs|tests/e2e/activity-daily-confirmation\.spec\.mjs|tests/e2e/activity-fes-point-suggestions\.spec\.mjs|docs/architecture/source-truth/FORGE_AURA_ACTIVITY_25PT_PRODUCTIVITY_COCKPIT_RECONCILIATION_REPORT_001\.md|\.github/workflows/activity-reports-aura\.yml)$' /tmp/changed.txt > /tmp/outside.txt || true
          cat /tmp/outside.txt
          test ! -s /tmp/outside.txt
      - name: Syntax, authority, tenant and Pages contracts
        run: |
          node --input-type=module --check < docs/static-preview/forge-aura/activity/activity-module.js
          node --input-type=module --check < docs/static-preview/forge-aura/activity/activity-daily-confirmation.js
          node --input-type=module --check < docs/static-preview/forge-aura/activity/activity-points-projection.js
          node --input-type=module --check < docs/static-preview/forge-aura/activity/activity-capture-directory-ux.js
          node --test \
            tests/activity-aura-points-authority.test.mjs \
            tests/activity-aura-scope-contract.test.mjs \
            tests/activity-daily-confirmation-contract.test.mjs \
            tests/activity-fes-point-suggestions.test.mjs \
            tests/fes-02a-activity-ledger-migration-security-test.mjs \
            tests/forge-aura-pages-import-graph.test.mjs

  browser-acceptance:
    name: Activity cockpit browser acceptance
    runs-on: ubuntu-latest
    needs: scope-and-contract
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Activity browser acceptance
        run: npx playwright test --config tests/activity-playwright.config.mjs
      - name: Upload Activity screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-25pt-cockpit-${{ github.sha }}
          path: test-results/activity-aura-ux-reconciliation
          if-no-files-found: warn
          retention-days: 30
