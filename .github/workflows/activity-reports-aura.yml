name: Activity Reports Aura Reconciliation

on:
  pull_request:
    paths:
      - 'docs/static-preview/forge-aura/activity/**'
      - 'docs/static-preview/forge-aura/app-v4.js'
      - 'docs/static-preview/forge-aura/aura-router-v4.js'
      - 'docs/static-preview/forge-aura/aura-shell.js'
      - 'tests/activity-aura-scope-contract.test.mjs'
      - 'docs/architecture/source-truth/FORGE_AURA_ACTIVITY_REPORTS_UX_RECONCILIATION_REPORT_001.md'
      - 'docs/evidence/FORGE_AURA_ACTIVITY_REPORTS_ACCEPTANCE_001.md'
      - '.github/workflows/activity-reports-aura.yml'
  push:
    branches:
      - 'codex/forge-aura-activity-reports-ux-reconciliation-001-corrected'

jobs:
  scope-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope guard against Pipeline PASS
        shell: bash
        run: |
          set -euo pipefail
          BASE=d986de0f660cab8ed4da6b6e32873a17af378fa8
          git cat-file -e "$BASE^{commit}"
          git diff --name-only "$BASE" HEAD > /tmp/changed.txt
          cat /tmp/changed.txt
          if grep -E '^docs/static-preview/forge-aura/pipeline/|^docs/static-preview/forge-aura/aura-auth|^docs/static-preview/forge-aura/.*login' /tmp/changed.txt; then
            echo 'Forbidden Pipeline/Login mutation detected' >&2
            exit 1
          fi
          if grep -Ev '^(docs/static-preview/forge-aura/activity/|docs/static-preview/forge-aura/app-v4\.js$|docs/static-preview/forge-aura/aura-router-v4\.js$|docs/static-preview/forge-aura/aura-shell\.js$|tests/activity-aura-scope-contract\.test\.mjs$|docs/architecture/source-truth/FORGE_AURA_ACTIVITY_REPORTS_UX_RECONCILIATION_REPORT_001\.md$|docs/evidence/FORGE_AURA_ACTIVITY_REPORTS_ACCEPTANCE_001\.md$|\.github/workflows/activity-reports-aura\.yml$)' /tmp/changed.txt | tee /tmp/outside.txt
          test ! -s /tmp/outside.txt
      - name: Contract tests
        run: node --test tests/activity-aura-scope-contract.test.mjs
