name: Activity Confirmation and Mail Evidence

on:
  pull_request:
    paths:
      - 'docs/static-preview/forge-aura/activity/**'
      - 'platform/mail-evidence/**'
      - 'supabase/functions/mail-evidence-connect/**'
      - 'supabase/migrations/20260807000100_activity_confirmation_mail_evidence.sql'
      - 'supabase/migrations/20260807000110_activity_mail_oauth_connections.sql'
      - 'tests/mail-evidence-engine.test.mjs'
      - 'tests/mail-evidence-oauth-broker-contract.test.mjs'
      - 'tests/activity-daily-confirmation-contract.test.mjs'
      - 'tests/activity-confirmation-migration-contract.test.mjs'
      - 'tests/activity-playwright.config.mjs'
      - 'tests/e2e/activity-daily-confirmation.spec.mjs'
      - '.github/workflows/activity-reports-aura.yml'
  push:
    branches:
      - 'codex/activity-confirmation-mail-evidence-001'

permissions:
  contents: read

jobs:
  scope-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope guard against integrated Activity PASS
        shell: bash
        run: |
          set -euo pipefail
          BASE=9e2cb417fc37193e61254355684636c0f434c38b
          git cat-file -e "$BASE^{commit}"
          git diff --name-only "$BASE" HEAD > /tmp/changed.txt
          cat /tmp/changed.txt
          if grep -E '^docs/static-preview/forge-aura/pipeline/|^docs/static-preview/forge-aura/aura-auth|^docs/static-preview/forge-aura/.*login' /tmp/changed.txt; then
            echo 'Forbidden Pipeline/Login mutation detected' >&2
            exit 1
          fi
          grep -Ev '^(docs/static-preview/forge-aura/activity/activity-module\.js$|docs/static-preview/forge-aura/activity/activity-daily-confirmation\.js$|docs/static-preview/forge-aura/activity/activity-mail-connection\.js$|platform/mail-evidence/|supabase/functions/mail-evidence-connect/|supabase/migrations/20260807000100_activity_confirmation_mail_evidence\.sql$|supabase/migrations/20260807000110_activity_mail_oauth_connections\.sql$|tests/mail-evidence-engine\.test\.mjs$|tests/mail-evidence-oauth-broker-contract\.test\.mjs$|tests/activity-daily-confirmation-contract\.test\.mjs$|tests/activity-confirmation-migration-contract\.test\.mjs$|tests/activity-playwright\.config\.mjs$|tests/e2e/activity-daily-confirmation\.spec\.mjs$|\.github/workflows/activity-reports-aura\.yml$)' /tmp/changed.txt > /tmp/outside.txt || true
          cat /tmp/outside.txt
          test ! -s /tmp/outside.txt
      - name: Activity and mail evidence contract tests
        run: >-
          node --test
          tests/activity-aura-scope-contract.test.mjs
          tests/activity-aura-points-authority.test.mjs
          tests/mail-evidence-engine.test.mjs
          tests/mail-evidence-oauth-broker-contract.test.mjs
          tests/activity-daily-confirmation-contract.test.mjs
          tests/activity-confirmation-migration-contract.test.mjs

  oauth-readiness:
    name: OAuth secret readiness (presence only)
    runs-on: ubuntu-latest
    needs: scope-and-contract
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      FORGE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.FORGE_GOOGLE_OAUTH_CLIENT_ID }}
      FORGE_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.FORGE_GOOGLE_OAUTH_CLIENT_SECRET }}
      FORGE_MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.FORGE_MICROSOFT_OAUTH_CLIENT_ID }}
      FORGE_MICROSOFT_OAUTH_CLIENT_SECRET: ${{ secrets.FORGE_MICROSOFT_OAUTH_CLIENT_SECRET }}
      FORGE_MAIL_TOKEN_ENCRYPTION_SECRET: ${{ secrets.FORGE_MAIL_TOKEN_ENCRYPTION_SECRET }}
    steps:
      - name: Report configured secret names only
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local name="$1"
            if [ -n "${!name:-}" ]; then
              printf '%s=CONFIGURED\n' "$name"
            else
              printf '%s=MISSING\n' "$name"
            fi
          }
          check SUPABASE_ACCESS_TOKEN
          check SUPABASE_ANON_KEY
          check FORGE_GOOGLE_OAUTH_CLIENT_ID
          check FORGE_GOOGLE_OAUTH_CLIENT_SECRET
          check FORGE_MICROSOFT_OAUTH_CLIENT_ID
          check FORGE_MICROSOFT_OAUTH_CLIENT_SECRET
          check FORGE_MAIL_TOKEN_ENCRYPTION_SECRET
          echo 'READINESS_CHECK=COMPLETE_VALUES_NEVER_PRINTED'

  browser-acceptance:
    name: Activity confirmation responsive acceptance
    runs-on: ubuntu-latest
    needs: scope-and-contract
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Activity browser acceptance
        run: npx playwright test --config tests/activity-playwright.config.mjs
      - name: Upload Activity screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-confirmation-mail-evidence-${{ github.sha }}
          path: test-results/activity-aura-ux-reconciliation
          if-no-files-found: warn
          retention-days: 30
