name: Activity FES Point Suggestions

on:
  pull_request:
    paths:
      - 'docs/static-preview/forge-alive-material3/activity-ledger-reporting-bridge.mjs'
      - 'docs/static-preview/forge-alive-material3/activity-reports-productivity-runtime.js'
      - 'docs/static-preview/forge-aura/activity/activity-daily-confirmation.js'
      - 'tests/activity-fes-point-suggestions.test.mjs'
      - 'tests/activity-playwright.config.mjs'
      - 'tests/e2e/activity-fes-point-suggestions.spec.mjs'
      - '.github/workflows/activity-reports-aura.yml'
  push:
    branches:
      - 'codex/activity-fes-point-suggestions-001'

permissions:
  contents: read

jobs:
  scope-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope guard against Activity confirmation PASS
        shell: bash
        run: |
          set -euo pipefail
          BASE=c66de0f1a3475d3846f51999eb458e35dbadec55
          git cat-file -e "$BASE^{commit}"
          git diff --name-only "$BASE" HEAD > /tmp/changed.txt
          cat /tmp/changed.txt
          if grep -E '^docs/static-preview/forge-aura/pipeline/|^docs/static-preview/forge-aura/aura-auth|^docs/static-preview/forge-aura/.*login|^supabase/' /tmp/changed.txt; then
            echo 'Forbidden Pipeline/Login/Supabase mutation detected' >&2
            exit 1
          fi
          grep -Ev '^(docs/static-preview/forge-alive-material3/activity-ledger-reporting-bridge\.mjs$|docs/static-preview/forge-alive-material3/activity-reports-productivity-runtime\.js$|docs/static-preview/forge-aura/activity/activity-daily-confirmation\.js$|tests/activity-fes-point-suggestions\.test\.mjs$|tests/activity-playwright\.config\.mjs$|tests/e2e/activity-fes-point-suggestions\.spec\.mjs$|\.github/workflows/activity-reports-aura\.yml$)' /tmp/changed.txt > /tmp/outside.txt || true
          cat /tmp/outside.txt
          test ! -s /tmp/outside.txt
      - name: Syntax and focused contracts
        run: |
          node --check docs/static-preview/forge-alive-material3/activity-ledger-reporting-bridge.mjs
          node --check docs/static-preview/forge-alive-material3/activity-reports-productivity-runtime.js
          node --input-type=module --check < docs/static-preview/forge-aura/activity/activity-daily-confirmation.js
          node --test \
            tests/activity-fes-point-suggestions.test.mjs \
            tests/activity-daily-confirmation-contract.test.mjs \
            tests/activity-aura-points-authority.test.mjs

  browser-acceptance:
    name: Activity FES suggestion browser regression
    runs-on: ubuntu-latest
    needs: scope-and-contract
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Activity browser acceptance
        run: npx playwright test --config tests/activity-playwright.config.mjs
      - name: Upload Activity screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-fes-point-suggestions-${{ github.sha }}
          path: test-results/activity-aura-ux-reconciliation
          if-no-files-found: warn
          retention-days: 30
