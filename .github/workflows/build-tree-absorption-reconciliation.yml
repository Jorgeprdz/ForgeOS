              'docs/architecture/source-truth/FORGE_UNIFIED_TREE_MISSING_MODULES_BACKFILL_065E.md',
              'docs/evidence/FORGE_UNIFIED_TREE_MISSING_MODULES_BACKFILL_065E.md',
              'docs/evidence/FORGE_UNIFIED_TREE_MISSING_MODULES_BACKFILL_CERTIFICATE_065E.md',
              'docs/evidence/forge-unified-tree-missing-modules-backfill-audit-065e.json',
              'docs/evidence/FORGE_ROADMAP_HOLD_PARKED_PENDING_REGISTER_065E1.md',
              'docs/evidence/forge-roadmap-hold-parked-pending-register-audit-065e1.json',
              'tools/termux/forge_065e_unified_build_tree_missing_modules_backfill.sh',
              'tools/termux/forge_065e1_roadmap_hold_parked_pending_register.sh',
          ]
          for target in targets:
              path = Path(target)
              path.write_text('\n'.join(line.rstrip() for line in path.read_text(encoding='utf-8').splitlines()) + '\n', encoding='utf-8')

          required = {
              'FORGE_MASTER_BUILD_TREE.md': ['Referral Engine / Referidos', 'OPERATIONALLY ABSORBED', 'Bitacora / Notes System', 'PARTIALLY ABSORBED'],
              'docs/architecture/source-truth/FORGE_UNIFIED_BUILD_TREE_001.md': ['ADVISOR_OS_SALES_PIPELINE', 'ACTIVITY / FES', 'CARTERA'],
              'docs/roadmap/FORGE_ROADMAP_LOCK_001.md': ['ABSORBED CAPABILITIES', 'NOTES_SYSTEM_REMAINDER_SCOPE'],
          }
          for path, needles in required.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise RuntimeError(f'REQUIRED_ANNOTATION_MISSING:{path}:{needle}')

          json.loads(Path('docs/evidence/forge-unified-tree-missing-modules-backfill-audit-065e.json').read_text(encoding='utf-8'))
          json.loads(Path('docs/evidence/forge-roadmap-hold-parked-pending-register-audit-065e1.json').read_text(encoding='utf-8'))
          PY

          bash -n tools/termux/forge_065e_unified_build_tree_missing_modules_backfill.sh
          bash -n tools/termux/forge_065e1_roadmap_hold_parked_pending_register.sh
          git diff --check

      - name: Commit reconciled build tree
        shell: bash
        run: |
          rm -f .github/workflows/build-tree-absorption-reconciliation.yml
          git config user.name "Forge Governance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add FORGE_MASTER_BUILD_TREE.md \
            docs/architecture/source-truth/FORGE_UNIFIED_BUILD_TREE_001.md \
            docs/roadmap/FORGE_ROADMAP_LOCK_001.md \
            docs/architecture/source-truth/FORGE_UNIFIED_TREE_MISSING_MODULES_BACKFILL_065E.md \
            docs/evidence/FORGE_UNIFIED_TREE_MISSING_MODULES_BACKFILL_065E.md \
            docs/evidence/FORGE_UNIFIED_TREE_MISSING_MODULES_BACKFILL_CERTIFICATE_065E.md \
            docs/evidence/forge-unified-tree-missing-modules-backfill-audit-065e.json \
            docs/evidence/FORGE_ROADMAP_HOLD_PARKED_PENDING_REGISTER_065E1.md \
            docs/evidence/forge-roadmap-hold-parked-pending-register-audit-065e1.json \
            tools/termux/forge_065e_unified_build_tree_missing_modules_backfill.sh \
            tools/termux/forge_065e1_roadmap_hold_parked_pending_register.sh \
            .github/workflows/build-tree-absorption-reconciliation.yml
          git diff --cached --check
          git commit -m "docs(governance): annotate absorbed build-tree capabilities"
          git push origin HEAD:governance/build-tree-absorbed-capabilities-reconciliation
