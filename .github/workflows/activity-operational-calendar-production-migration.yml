name: Activity Operational Calendar Production Migration

on:
  push:
    branches:
      - feature/activity-calendar-production-live-acceptance-001
    paths:
      - "supabase/migrations/20260805000100_activity_operational_calendar_authority.sql"
      - "scripts/deploy-activity-operational-calendar-migration.mjs"
      - "platform/operational-calendar/**"
      - "tests/activity-foundational-operational-calendar-*"
      - ".github/workflows/activity-operational-calendar-production-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-operational-calendar-production-migration
  cancel-in-progress: false

jobs:
  deploy-operational-calendar:
    if: github.actor == 'Jorgeprdz' && github.ref_name == 'feature/activity-calendar-production-live-acceptance-001'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: rmlxigxysujsuwzgoimv
      ACCEPTED_ACTIVITY_UI_BASE: bafe9e331bb26671b8528f6b942ac2e8b7b368df
    steps:
      - name: Checkout authorized successor branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify authorization, ancestry and exact migration boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$SUPABASE_PROJECT_REF" = "rmlxigxysujsuwzgoimv"
          test "$GITHUB_REF_NAME" = "feature/activity-calendar-production-live-acceptance-001"
          git merge-base --is-ancestor "$ACCEPTED_ACTIVITY_UI_BASE" HEAD
          test -f supabase/migrations/20260805000100_activity_operational_calendar_authority.sql
          test -f scripts/deploy-activity-operational-calendar-migration.mjs
          node --check scripts/deploy-activity-operational-calendar-migration.mjs
          if grep -Eiq "DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]" \
            supabase/migrations/20260805000100_activity_operational_calendar_authority.sql; then
            echo "Destructive SQL rejected"
            exit 1
          fi
          grep -Eiq "force row level security" \
            supabase/migrations/20260805000100_activity_operational_calendar_authority.sql
          grep -Eiq "auth\.uid\(\)" \
            supabase/migrations/20260805000100_activity_operational_calendar_authority.sql
          ! grep -Eiq "America/Mexico_City|MONDAY.*TUESDAY.*WEDNESDAY.*THURSDAY.*FRIDAY" \
            scripts/deploy-activity-operational-calendar-migration.mjs

      - name: Re-run foundational calendar authority tests
        run: |
          node tests/activity-foundational-operational-calendar-test.mjs

      - name: Apply and verify exactly migration 20260805000100
        run: node scripts/deploy-activity-operational-calendar-migration.mjs

      - name: Publish redacted production evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR=artifacts/activity-operational-calendar-migration
          LEDGER="$EVIDENCE_DIR/ledger.jsonl"
          mkdir -p "$EVIDENCE_DIR"
          if [ ! -s "$LEDGER" ]; then
            printf '%s\n' '{"name":"workflow_preflight","status":"FAIL","detail":"LEDGER_NOT_CREATED"}' > "$LEDGER"
          fi

          git fetch origin supabase-evidence
          rm -rf /tmp/activity-calendar-supabase-evidence
          git worktree add /tmp/activity-calendar-supabase-evidence origin/supabase-evidence
          mkdir -p /tmp/activity-calendar-supabase-evidence/deployments
          cp "$LEDGER" \
            /tmp/activity-calendar-supabase-evidence/deployments/20260805000100-activity-operational-calendar-ledger.jsonl

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const entries = readFileSync(
            'artifacts/activity-operational-calendar-migration/ledger.jsonl',
            'utf8',
          ).trim().split('\n').filter(Boolean).map(line => JSON.parse(line));
          const migrationState = entries.some(entry => entry.name === 'migration_applied')
            ? 'migration_applied'
            : 'migration_already_satisfied';
          const required = [
            'predeployment_inventory',
            migrationState,
            'postdeployment_security_inventory',
            'production_configuration_inventory',
            'migration_history',
          ];
          const accepted = entries.length > 0
            && entries.every(entry => entry.status === 'PASS')
            && required.every(name => entries.some(entry => entry.name === name && entry.status === 'PASS'));
          const configuration = entries.find(entry => entry.name === 'production_configuration_inventory');
          const result = {
            status: accepted ? 'PASS' : 'FAIL',
            migrationVersion: '20260805000100',
            migrationName: 'activity_operational_calendar_authority',
            projectRef: 'rmlxigxysujsuwzgoimv',
            sourceSha: process.env.GITHUB_SHA,
            workflowRunId: process.env.GITHUB_RUN_ID,
            verifiedAt: new Date().toISOString(),
            productionConfiguration: configuration ? {
              profileCount: configuration.profileCount,
              overrideCount: configuration.overrideCount,
              timeOffCount: configuration.timeOffCount,
              inventedSeedData: configuration.inventedSeedData,
            } : null,
            checks: entries.map(({ name, status, state, detail, failedChecks }) => ({
              name,
              status,
              ...(state ? { state } : {}),
              ...(detail ? { detail } : {}),
              ...(failedChecks ? { failedChecks } : {}),
            })),
          };
          writeFileSync(
            '/tmp/activity-calendar-supabase-evidence/deployments/activity-operational-calendar-latest.json',
            `${JSON.stringify(result, null, 2)}\n`,
          );
          NODE

          cd /tmp/activity-calendar-supabase-evidence
          git config user.name "forgeos-supabase-deploy"
          git config user.email "actions@users.noreply.github.com"
          git add \
            deployments/activity-operational-calendar-latest.json \
            deployments/20260805000100-activity-operational-calendar-ledger.jsonl
          if git diff --cached --quiet; then
            echo "Evidence already current"
          else
            git commit -m "evidence(supabase): report Activity calendar migration ${GITHUB_SHA}"
            git push origin HEAD:supabase-evidence
          fi

      - name: Upload redacted deployment ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-operational-calendar-production-ledger
          path: artifacts/activity-operational-calendar-migration/ledger.jsonl
          if-no-files-found: error
          retention-days: 30
