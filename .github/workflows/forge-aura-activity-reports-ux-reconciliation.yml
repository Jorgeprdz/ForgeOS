name: Forge Aura Activity Reports UX Reconciliation

on:
  push:
    branches:
      - codex/forge-aura-activity-reports-ux-reconciliation-001
  pull_request:
    paths:
      - "docs/static-preview/forge-aura/activity/**"
      - "docs/static-preview/forge-aura/app-v4.js"
      - "docs/static-preview/forge-aura/aura-bootstrap-v4.js"
      - "docs/static-preview/forge-aura/aura-router-v4.js"
      - "docs/static-preview/forge-aura/aura-shell.js"
      - "platform/event-evidence/canonical-activity-event-contract.js"
      - "platform/operational-calendar/**"
      - "platform/productivity/activity-*.js"
      - "platform/productivity/activity-*.mjs"
      - "platform/productivity/policies/FORGE_ACTIVITY_COACHING_POLICY_V1.json"
      - "supabase/migrations/20260805000100_activity_operational_calendar_authority.sql"
      - "tests/activity-foundational-*"
      - "tests/forge-aura-activity-reports-ux-reconciliation.test.mjs"
      - "docs/architecture/source-truth/FORGE_AURA_ACTIVITY_REPORTS_UX_RECONCILIATION_REPORT_001.md"
      - "docs/evidence/FORGE_AURA_ACTIVITY_REPORTS_ACCEPTANCE_001.md"
      - ".github/workflows/forge-aura-activity-reports-ux-reconciliation.yml"

permissions:
  contents: read

jobs:
  activity-reports-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --check docs/static-preview/forge-aura/activity/activity-module.js
          node --check docs/static-preview/forge-aura/activity/activity-view.js
          node --check docs/static-preview/forge-aura/activity/activity-capture-adapter.js
          node --check docs/static-preview/forge-aura/activity/activity-periods.js
          node --check docs/static-preview/forge-aura/activity/activity-runtime-adapter.js
          node --check docs/static-preview/forge-aura/activity/activity-tip-presenter.js
          node --check docs/static-preview/forge-aura/app-v4.js
          node --check docs/static-preview/forge-aura/aura-router-v4.js
          node --check docs/static-preview/forge-aura/aura-shell.js
      - name: Activity and Reports UX contract
        env:
          TZ: America/Mexico_City
        run: node --test tests/forge-aura-activity-reports-ux-reconciliation.test.mjs
      - name: Foundational authorities
        run: |
          node tests/activity-foundational-operational-calendar-test.mjs
          node tests/activity-foundational-fes-taxonomy-test.mjs
          node tests/activity-foundational-productivity-conversion-test.mjs
          node tests/activity-foundational-points-adapter-test.mjs
      - name: Pipeline locked PASS regression
        run: |
          bash scripts/test-forge-aura-pipeline.sh
          node --test tests/forge-aura-pipeline-contract.test.mjs
          node --test tests/forge-aura-ux-behavior-directive-lock.test.mjs
      - name: Scope and safety guard
        shell: bash
        env:
          PIPELINE_PASS_SHA: d986de0f660cab8ed4da6b6e32873a17af378fa8
        run: |
          set -euo pipefail
          git diff --name-only "$PIPELINE_PASS_SHA"...HEAD > /tmp/activity-changed.txt
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/forge-aura-activity-reports-ux-reconciliation.yml|\
              docs/static-preview/forge-aura/activity/*|\
              docs/static-preview/forge-aura/app-v4.js|\
              docs/static-preview/forge-aura/aura-bootstrap-v4.js|\
              docs/static-preview/forge-aura/aura-router-v4.js|\
              docs/static-preview/forge-aura/aura-shell.js|\
              platform/event-evidence/canonical-activity-event-contract.js|\
              platform/operational-calendar/*|\
              platform/productivity/activity-conversion-read-model.js|\
              platform/productivity/activity-points-authority-adapter.mjs|\
              platform/productivity/activity-coaching-policy.js|\
              platform/productivity/activity-coaching-intelligence.js|\
              platform/productivity/policies/FORGE_ACTIVITY_COACHING_POLICY_V1.json|\
              supabase/migrations/20260805000100_activity_operational_calendar_authority.sql|\
              tests/activity-foundational-fes-taxonomy-test.mjs|\
              tests/activity-foundational-operational-calendar-rls-test.sql|\
              tests/activity-foundational-operational-calendar-test.mjs|\
              tests/activity-foundational-points-adapter-test.mjs|\
              tests/activity-foundational-productivity-conversion-test.mjs|\
              tests/forge-aura-activity-reports-ux-reconciliation.test.mjs|\
              docs/architecture/source-truth/FORGE_AURA_ACTIVITY_REPORTS_UX_RECONCILIATION_REPORT_001.md|\
              docs/evidence/FORGE_AURA_ACTIVITY_REPORTS_ACCEPTANCE_001.md) ;;
              *) echo "OUT_OF_SCOPE_FILE=$file" >&2; exit 1 ;;
            esac
          done < /tmp/activity-changed.txt
          if grep -E '^docs/static-preview/forge-aura/pipeline/' /tmp/activity-changed.txt; then
            echo "PIPELINE_MUTATION_FORBIDDEN" >&2
            exit 1
          fi
          if grep -E '^docs/static-preview/forge-aura/.*login' /tmp/activity-changed.txt; then
            echo "LOGIN_MUTATION_FORBIDDEN" >&2
            exit 1
          fi
          ! grep -RInE 'type="range"|name="subjectId"|fakeData|Math\.random\(' docs/static-preview/forge-aura/activity
          ! grep -RInE 'changeStage\(|sendMessage|createTask|calendar\.insert' docs/static-preview/forge-aura/activity
          ledger_matches="$(grep -RIl 'create table.*activity.*ledger' platform supabase 2>/dev/null || true)"
          unexpected_ledgers="$(printf '%s\n' "$ledger_matches" | grep -v '20260726000100_fes02_activity_event_ledger.sql' || true)"
          test -z "$unexpected_ledgers"

  operational-calendar-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute additive migration and RLS acceptance
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: forge_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --set=ON_ERROR_STOP=1 --file=tests/activity-foundational-operational-calendar-rls-test.sql
