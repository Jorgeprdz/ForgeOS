name: Home Live Dashboard

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/static-preview/forge-alive-material3/home-live-dashboard.js'
      - 'docs/static-preview/forge-alive-material3/home-live-dashboard-active-runtime.js'
      - 'docs/static-preview/forge-alive-material3/home-live-dashboard-route-gate.js'
      - 'docs/static-preview/forge-alive-material3/home-opportunity-authority-entry.js'
      - 'docs/static-preview/forge-alive-material3/home-live-dashboard.css'
      - 'docs/static-preview/forge-alive-material3/legacy-ui-retirement.js'
      - 'tests/home-live-dashboard-test.mjs'
      - 'tests/e2e/home-live-dashboard.spec.mjs'
      - 'tests/e2e/fixtures/home-live-dashboard/**'
      - 'playwright.home-live-dashboard.config.mjs'
      - '.github/workflows/home-live-dashboard.yml'

permissions:
  contents: read

concurrency:
  group: home-live-dashboard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  home-live-one-pass:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax and focused contracts
        run: |
          node --check docs/static-preview/forge-alive-material3/home-live-dashboard.js
          node --check docs/static-preview/forge-alive-material3/home-live-dashboard-active-runtime.js
          node --check docs/static-preview/forge-alive-material3/home-live-dashboard-route-gate.js
          node --check docs/static-preview/forge-alive-material3/home-opportunity-authority-entry.js
          node --check tests/home-live-dashboard-test.mjs
          node --check tests/e2e/home-live-dashboard.spec.mjs
          node --check playwright.home-live-dashboard.config.mjs
          node --test tests/home-live-dashboard-test.mjs
          git diff --check

      - name: Preserve productive authorities
        run: |
          node tests/productive-smart-widget-orchestrator-master-test.mjs
          node tests/smart-widgets-home-productive-mount-test.mjs
          node --test tests/authenticated-session-controls-test.mjs
          node --test tests/material3-pipeline-integration-test.mjs
          node tests/forge-067g17b-pipeline-productive-source-test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser acceptance
        run: npx playwright test --config=playwright.home-live-dashboard.config.mjs

      - name: Safety and truth boundary
        shell: bash
        run: |
          set -euo pipefail
          runtime='docs/static-preview/forge-alive-material3/home-live-dashboard-active-runtime.js'
          gate='docs/static-preview/forge-alive-material3/home-live-dashboard-route-gate.js'
          entry='docs/static-preview/forge-alive-material3/home-opportunity-authority-entry.js'
          legacy='docs/static-preview/forge-alive-material3/legacy-ui-retirement.js'
          ! grep -E '\.(insert|update|delete|upsert)\(' "$runtime"
          ! grep -E 'client\.rpc|supabase\.rpc|\.from\(' "$runtime"
          ! grep -E '\bimport[[:space:]]*(\(|\{)' "$runtime"
          ! grep -E '^import "\.\/home-live-dashboard' "$legacy"
          ! grep -E 'Lariza|Octavio|María|72%|65%|40%|Math\.random|opportunityScore' "$runtime"
          grep -q 'PRODUCTIVE_PIPELINE_AND_TIMELINE' "$runtime"
          grep -q 'pipeline-productive-intelligence-adapter.js?v=home-live-dashboard-003' "$entry"
          grep -q 'home-live-dashboard-route-gate.js?v=home-live-dashboard-005' "$legacy"
          grep -q 'home-live-dashboard-active-runtime.js?v=home-live-dashboard-006' "$gate"
          grep -q 'root.dataset.moduleActive !== "false"' "$gate"
          grep -q 'attributeFilter: \["data-productive-home-state", "data-smart-widget-stack-state"\]' "$runtime"
          grep -q 'display: none !important' docs/static-preview/forge-alive-material3/home-live-dashboard.css
