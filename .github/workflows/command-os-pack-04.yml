name: Command OS Pack 04

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-execution-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax
        run: |
          node --check platform/commands/command-registry.js
          node --check platform/commands/command-parser-engine.js
          node --check platform/commands/command-execution-engine.js
          node --check platform/commands/command-controller.js

      - name: Registry and execution contracts
        run: node --test tests/command-os-pack-04-test.mjs

      - name: Diff integrity
        run: git diff --check
