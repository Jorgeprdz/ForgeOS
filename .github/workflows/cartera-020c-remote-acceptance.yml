name: CARTERA 020C Remote Acceptance

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Type YES:CARTERA_020C_REMOTE_MUTATION
        required: true
        type: string
      expected_source_head:
        description: Exact accepted 020C repository head
        required: true
        type: string
      expected_acceptance_head:
        description: Exact remote-acceptance head to execute
        required: true
        type: string
      project_ref:
        description: Exact Supabase project ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cartera-020c-remote-acceptance
  cancel-in-progress: false

jobs:
  remote-deployment-and-acceptance:
    if: github.repository == 'Jorgeprdz/ForgeOS'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
      CARTERA_020C_REMOTE_MUTATION_AUTHORIZED: ${{ inputs.authorization }}
      CARTERA_020C_EXPECTED_SOURCE_HEAD: ${{ inputs.expected_source_head }}
      CARTERA_020C_EXPECTED_ACCEPTANCE_HEAD: ${{ inputs.expected_acceptance_head }}
      CARTERA_020C_ACCEPTANCE_BRANCH: feature/cartera-020c-remote-acceptance

    steps:
      - name: Checkout exact authorized acceptance head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_acceptance_head }}
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authorization and source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$CARTERA_020C_REMOTE_MUTATION_AUTHORIZED" = 'YES:CARTERA_020C_REMOTE_MUTATION'
          test "$CARTERA_020C_EXPECTED_SOURCE_HEAD" = '0daaccd556659b997f2086e12b09481281d1b019'
          test "$SUPABASE_PROJECT_REF" = 'rmlxigxysujsuwzgoimv'
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$(git rev-parse HEAD)" = "$CARTERA_020C_EXPECTED_ACCEPTANCE_HEAD"
          git merge-base --is-ancestor "$CARTERA_020C_EXPECTED_SOURCE_HEAD" HEAD
          git diff --check "$CARTERA_020C_EXPECTED_SOURCE_HEAD"...HEAD
          mkdir -p artifacts/cartera-020c-remote-acceptance
          echo 'REMOTE_AUTHORIZATION=PASS'
          echo 'SOURCE_ANCESTRY=PASS'
          echo 'PRODUCT_UI_DIFF=NONE'
          echo 'ACCOUNT_MUTATION=NOT_AUTHORIZED'

      - name: Repository acceptance suite
        shell: bash
        run: |
          set -euo pipefail
          node --check advisor-os/cartera/persistent-confirmation-orchestration-service.js
          node --check scripts/ci/cartera-020c-github-actions-remote-acceptance.mjs
          node --check scripts/ci/cartera-020c-conflict-ambiguity-hardening-deploy.mjs
          node --check scripts/ci/cartera-020c-conflict-constraint-name-hardening-deploy.mjs
          node --check scripts/ci/cartera-020c-conflict-persistence-hardening-deploy.mjs
          node --test tests/cartera-020c-*.mjs

      - name: Apply and verify additive remote hardenings
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/cartera-020c-conflict-ambiguity-hardening-deploy.mjs \
            | tee artifacts/cartera-020c-remote-acceptance/conflict-ambiguity-hardening-output.log
          node scripts/ci/cartera-020c-conflict-constraint-name-hardening-deploy.mjs \
            | tee artifacts/cartera-020c-remote-acceptance/conflict-constraint-name-hardening-output.log
          node scripts/ci/cartera-020c-conflict-persistence-hardening-deploy.mjs \
            | tee artifacts/cartera-020c-remote-acceptance/conflict-persistence-hardening-output.log
          grep -q 'CARTERA020C_CONFLICT_INSERT_AMBIGUITY_HARDENING=PASS' artifacts/cartera-020c-remote-acceptance/conflict-ambiguity-hardening-output.log
          grep -q 'CARTERA020C_CONFLICT_CONSTRAINT_NAME_HARDENING=PASS' artifacts/cartera-020c-remote-acceptance/conflict-constraint-name-hardening-output.log
          grep -q 'CARTERA020C_CONFLICT_PERSISTENCE_RECEIPT_HARDENING=PASS' artifacts/cartera-020c-remote-acceptance/conflict-persistence-hardening-output.log

      - name: Deploy base migrations and execute complete acceptance
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$(git rev-parse HEAD)" \
            node scripts/ci/cartera-020c-github-actions-remote-acceptance.mjs \
            | tee artifacts/cartera-020c-remote-acceptance/workflow-output.log

      - name: Verify explicit acceptance markers
        shell: bash
        run: |
          set -euo pipefail
          log=artifacts/cartera-020c-remote-acceptance/workflow-output.log
          for marker in \
            CARTERA_020C_REMOTE_DEPLOYMENT=PASS \
            AUTHORIZATION_DIGEST_COMPATIBILITY=PASS \
            CARTERA_020C_TRANSACTIONAL_ACCEPTANCE=PASS \
            AUTHORIZATION_DIGEST_BINDING=PASS \
            IDENTITY_ORDERED_EXECUTION=PASS \
            IDENTITY_READ_AFTER_WRITE=PASS \
            POLICY_READ_AFTER_WRITE=PASS \
            CHANGED_INPUT_CONFLICT=PASS \
            RETRY_GOVERNANCE=PASS \
            PARALLEL_STATE_VERSION_SERIALIZATION=PASS \
            RLS_CROSS_ADVISOR=PASS \
            DIRECT_WRITES=BLOCKED \
            SANITIZED_STATUS=PASS \
            TEST_FIXTURES_ROLLED_BACK=YES \
            CONCURRENCY_FIXTURES_CLEANED=YES \
            RESIDUAL_FIXTURES=0 \
            CARTERA_020C_REMOTE_ACCEPTANCE=PASS; do
            grep -q "$marker" "$log"
          done

      - name: Upload remote acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartera-020c-remote-acceptance
          path: artifacts/cartera-020c-remote-acceptance
          if-no-files-found: error
          retention-days: 30
