name: Canonical Pages Artifact Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pages.yml'
      - '.github/workflows/aura-pages-dispatch.yml'
      - '.github/workflows/pages-public-acceptance.yml'
      - '.github/workflows/pages-deploy-observer.yml'
      - '.github/workflows/canonical-pages-artifact-validation.yml'
      - '.github/workflows/segubeca-pages-authority-asset.yml'
      - 'tests/pages-explicit-deployment-governance.test.mjs'
      - 'tests/segubeca-pages-authority-asset-test.mjs'
      - 'index.html'
      - 'service-worker.js'
      - 'docs/static-preview/forge-alive-material3/**'
      - 'docs/static-preview/forge-alive/**'
      - 'docs/static-preview/quote-engine/**'
      - 'docs/static-preview/quote-runtime/**'
      - 'advisor-os/**'
      - 'scripts/build-advisor-presentation-pages-runtime*.mjs'
      - 'scripts/prepare-mick-goal-gap-pages-runtime.mjs'
      - 'scripts/prepare-material3-runtime-fail-closed.mjs'
      - 'scripts/validate-pages-public-config.mjs'

permissions:
  contents: read

concurrency:
  group: canonical-pages-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORGE_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
      FORGE_PAGES_RUNTIME_MODE: 'pages'
      FORGE_CARTERA_PAGES_RUNTIME_MODE: 'pages'
      GITHUB_PAGES: 'true'
      DEMO_MODE: 'true'
      ENABLE_TEST_ADVISOR_LOGIN: 'false'
      SUPABASE_URL: ''
      SUPABASE_ANON_KEY: ''
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate explicit Pages deployment governance
        run: node --test tests/pages-explicit-deployment-governance.test.mjs

      - name: Extract canonical build and validation programs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/pages.yml').read_text()
          blocks = re.findall(r"node - <<'EOF'\n(.*?)\n\s+EOF", workflow, re.S)
          if len(blocks) != 3:
              raise SystemExit(f'EXPECTED_3_NODE_BLOCKS_OBSERVED_{len(blocks)}')

          env_program = textwrap.dedent(blocks[0])
          build_program = textwrap.dedent(blocks[1]).replace(
              'process.env.GITHUB_SHA',
              'process.env.FORGE_BUILD_SHA',
          )
          validation_program = textwrap.dedent(blocks[2]).replace(
              'process.env.EXPECTED_COMMIT_SHA',
              'process.env.FORGE_BUILD_SHA',
          )

          Path('/tmp/generate-env.cjs').write_text(env_program)
          Path('/tmp/build-canonical.cjs').write_text(build_program)
          Path('/tmp/validate-canonical.cjs').write_text(validation_program)
          PY

      - name: Generate validation environment
        run: node /tmp/generate-env.cjs

      - name: Generate productive Pages runtimes
        run: node scripts/build-advisor-presentation-pages-runtime.mjs

      - name: Build canonical-only artifact
        run: node /tmp/build-canonical.cjs

      - name: Complete canonical Pages runtime closure
        run: |
          node scripts/prepare-forge-alive-pages-runtime-closure.mjs _site
          node scripts/prepare-segubeca-pages-runtime.mjs _site

      - name: Validate canonical-only artifact and static module graph
        env:
          EXPECTED_DEMO_MODE: 'true'
          FORGE_SKIP_PAGES_RUNTIME_PREPARATION: 'true'
        run: |
          node /tmp/validate-canonical.cjs
          node scripts/validate-pages-public-config.mjs _site/env.js
