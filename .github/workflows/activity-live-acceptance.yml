name: Activity Production Calendar and Live Acceptance

on:
  push:
    branches:
      - feature/activity-live-acceptance-001
    paths:
      - "scripts/deploy-activity-operational-calendar-production.mjs"
      - "supabase/migrations/20260805000100_activity_operational_calendar_authority.sql"
      - "docs/static-preview/forge-aura/**"
      - "platform/operational-calendar/**"
      - "platform/productivity/**"
      - "platform/event-evidence/**"
      - "tests/activity-*.mjs"
      - ".github/workflows/activity-live-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: activity-live-acceptance
  cancel-in-progress: false

jobs:
  migrate-and-validate:
    if: github.actor == 'Jorgeprdz' && github.ref_name == 'feature/activity-live-acceptance-001'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: rmlxigxysujsuwzgoimv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact authorized source and migration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$SUPABASE_PROJECT_REF" = "rmlxigxysujsuwzgoimv"
          test -f supabase/migrations/20260805000100_activity_operational_calendar_authority.sql
          test -f scripts/deploy-activity-operational-calendar-production.mjs
          node --check scripts/deploy-activity-operational-calendar-production.mjs
          if grep -Eiq "DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]" \
            supabase/migrations/20260805000100_activity_operational_calendar_authority.sql; then
            echo "Destructive SQL rejected"
            exit 1
          fi
          grep -Eq "force row level security" supabase/migrations/20260805000100_activity_operational_calendar_authority.sql
          grep -Eq "OPCAL_APPEND_ONLY_MUTATION_DENIED" supabase/migrations/20260805000100_activity_operational_calendar_authority.sql
      - name: Run foundational and UI regressions
        run: |
          node tests/activity-foundational-operational-calendar-test.mjs
          node tests/activity-foundational-fes-taxonomy-test.mjs
          node tests/activity-foundational-productivity-conversion-test.mjs
          node tests/activity-foundational-points-adapter-test.mjs
          node --test tests/activity-aura-productive-ui-test.mjs
      - name: Apply exact migration and validate production authority
        run: node scripts/deploy-activity-operational-calendar-production.mjs
      - name: Upload redacted migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-calendar-production-ledger
          path: artifacts/activity-calendar-production/ledger.jsonl
          if-no-files-found: error
          retention-days: 30

  publish-and-smoke:
    needs: migrate-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ACCEPTANCE_BRANCH: feature/activity-live-acceptance-001
      PUBLIC_BASE: https://jorgeprdz.github.io/ForgeOS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Re-run Activity route acceptance before publication
        run: node --test tests/activity-aura-productive-ui-test.mjs

      - name: Verify branch-published assets
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/static-preview/forge-aura/auth-v4.html
          test -f docs/static-preview/forge-aura/app-v4.js
          test -f docs/static-preview/forge-aura/activity/activity-module.js
          test -f docs/static-preview/forge-aura/activity/activity.css
          test -f docs/static-preview/forge-aura/env.js
          grep -q 'actividad' docs/static-preview/forge-aura/aura-router-v4.js
          grep -q 'createActivityModule' docs/static-preview/forge-aura/app-v4.js
          grep -q 'DEMO_MODE' docs/static-preview/forge-aura/env.js
          if grep -Eq 'DEMO_MODE:[[:space:]]*"true"|ENABLE_TEST_ADVISOR_LOGIN:[[:space:]]*"true"' docs/static-preview/forge-aura/env.js; then
            echo "Non-productive environment flag rejected"
            exit 1
          fi

      - name: Point GitHub Pages to the authorized acceptance branch
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY/pages"
          payload=$(printf '{"source":{"branch":"%s","path":"/docs"}}' "$ACCEPTANCE_BRANCH")
          code=$(curl --silent --show-error --output /tmp/pages-update.json --write-out '%{http_code}' \
            --request PUT \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            --data "$payload")
          if [[ "$code" != "204" && "$code" != "200" ]]; then
            cat /tmp/pages-update.json
            echo "PAGES_SOURCE_UPDATE_HTTP=$code"
            exit 1
          fi
          echo "PAGES_SOURCE_BRANCH=$ACCEPTANCE_BRANCH"
          echo "PAGES_SOURCE_PATH=/docs"

      - name: Request and wait for Pages branch build
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY/pages/builds"
          code=$(curl --silent --show-error --output /tmp/pages-request.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$api")
          if [[ "$code" != "201" && "$code" != "202" ]]; then
            cat /tmp/pages-request.json
            echo "PAGES_BUILD_REQUEST_HTTP=$code"
            exit 1
          fi

          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/pages/builds/latest" > /tmp/pages-latest.json
            state=$(node -e "const v=require('/tmp/pages-latest.json'); process.stdout.write(String(v.status || 'unknown'))")
            commit=$(node -e "const v=require('/tmp/pages-latest.json'); process.stdout.write(String(v.commit || ''))")
            echo "PAGES_BUILD_ATTEMPT=$attempt STATUS=$state COMMIT=$commit"
            if [[ "$state" == "built" ]]; then
              test "$commit" = "$GITHUB_SHA"
              echo "PAGES_BUILD=PASS"
              exit 0
            fi
            if [[ "$state" == "errored" ]]; then
              cat /tmp/pages-latest.json
              exit 1
            fi
            sleep 5
          done
          echo "PAGES_BUILD_TIMEOUT"
          exit 1

      - name: Public Activity asset smoke test
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            "static-preview/forge-aura/auth-v4.html?route=actividad&v=$GITHUB_SHA" \
            "static-preview/forge-aura/app-v4.js?v=$GITHUB_SHA" \
            "static-preview/forge-aura/aura-router-v4.js?v=$GITHUB_SHA" \
            "static-preview/forge-aura/activity/activity-module.js?v=$GITHUB_SHA" \
            "static-preview/forge-aura/activity/activity.css?v=$GITHUB_SHA"; do
            curl --fail --location --retry 8 --retry-delay 4 --max-time 30 \
              "$PUBLIC_BASE/$path" -o /tmp/activity-live-asset
            test -s /tmp/activity-live-asset
          done
          curl --fail --location --retry 8 --retry-delay 4 --max-time 30 \
            "$PUBLIC_BASE/static-preview/forge-aura/aura-router-v4.js?v=$GITHUB_SHA" \
            | grep -q 'actividad'
          curl --fail --location --retry 8 --retry-delay 4 --max-time 30 \
            "$PUBLIC_BASE/static-preview/forge-aura/app-v4.js?v=$GITHUB_SHA" \
            | grep -q 'createActivityModule'
          echo "ACTIVITY_LIVE_PAGES_ASSETS=PASS"
          echo "ACTIVITY_LIVE_URL=$PUBLIC_BASE/static-preview/forge-aura/auth-v4.html?route=actividad&v=$GITHUB_SHA"
