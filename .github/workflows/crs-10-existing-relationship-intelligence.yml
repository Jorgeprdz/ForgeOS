name: CRS 10 Existing Relationship Intelligence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "platform/shared-commercial-model/crs-10-relationship-intelligence-contract.js"
      - "advisor-os/person-workspace/crs-10-existing-relationship-intelligence-service.js"
      - "docs/static-preview/forge-alive-material3/person-intelligence-module.js"
      - "docs/static-preview/forge-alive-material3/person-intelligence-module.css"
      - "docs/static-preview/forge-alive-material3/person-workspace-entry-bridge.js"
      - "docs/static-preview/forge-alive-material3/person-workspace-entry-bridge.css"
      - "scripts/prepare-forge-alive-pages-runtime-closure.mjs"
      - "tests/pages-public-demo-runtime-closure-test.mjs"
      - "tests/crs-10-*.mjs"
      - "tests/e2e/crs-10-*.mjs"
      - "tests/e2e/fixtures/crs10-relationship-intelligence/**"
      - "playwright.crs10.config.mjs"
      - "docs/architecture/source-truth/FORGE_CRS_10_EXISTING_RELATIONSHIP_INTELLIGENCE_001.md"
      - "docs/evidence/FORGE_CRS_10_*.md"
      - ".github/workflows/crs-09-productive-person-workspace.yml"
      - ".github/workflows/crs-10-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crs10-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract-service-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bounded paths
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          git diff --name-only "origin/${BASE_REF}...HEAD" > /tmp/crs10-paths
          if grep -Ev '^(platform/shared-commercial-model/crs-10-relationship-intelligence-contract\.js|advisor-os/person-workspace/crs-10-existing-relationship-intelligence-service\.js|docs/static-preview/forge-alive-material3/person-intelligence-module\.(js|css)|docs/static-preview/forge-alive-material3/person-workspace-entry-bridge\.(js|css)|scripts/prepare-forge-alive-pages-runtime-closure\.mjs|tests/pages-public-demo-runtime-closure-test\.mjs|tests/crs-10-[^/]+\.mjs|tests/e2e/crs-10-[^/]+\.mjs|tests/e2e/fixtures/crs10-relationship-intelligence/[^/]+|playwright\.crs10\.config\.mjs|docs/architecture/source-truth/FORGE_CRS_10_EXISTING_RELATIONSHIP_INTELLIGENCE_001\.md|docs/evidence/FORGE_CRS_10_[^/]+\.md|\.github/workflows/crs-09-productive-person-workspace\.yml|\.github/workflows/crs-10-[^/]+\.yml)$' /tmp/crs10-paths; then
            echo "CRS10_BOUNDED_PATHS=FAIL"
            cat /tmp/crs10-paths
            exit 1
          fi
          echo "CRS10_BOUNDED_PATHS=PASS"

      - name: Syntax and targeted tests
        run: |
          set -euo pipefail
          node --check platform/shared-commercial-model/crs-10-relationship-intelligence-contract.js
          node --check advisor-os/person-workspace/crs-10-existing-relationship-intelligence-service.js
          node --check docs/static-preview/forge-alive-material3/person-intelligence-module.js
          node --check docs/static-preview/forge-alive-material3/person-workspace-entry-bridge.js
          node --check scripts/prepare-forge-alive-pages-runtime-closure.mjs
          node --check playwright.crs10.config.mjs
          node --check tests/e2e/crs-10-relationship-intelligence-visual.spec.mjs
          node --test \
            tests/crs-10-relationship-intelligence-contract-test.mjs \
            tests/crs-10-existing-relationship-intelligence-service-test.mjs \
            tests/crs-10-person-intelligence-ui-test.mjs \
            tests/crs-09-person-workspace-contract-test.mjs \
            tests/crs-09-person-workspace-service-test.mjs \
            tests/crs-09-person-workspace-ui-test.mjs \
            tests/crs-09-person-workspace-entry-bridge-test.mjs \
            tests/pages-public-demo-runtime-closure-test.mjs

      - name: Preserve accepted Cartera 040 to 100 intelligence
        run: |
          set -euo pipefail
          mapfile -t inherited < <(find tests -maxdepth 1 -type f \( \
            -name 'cartera-040*.mjs' -o \
            -name 'cartera-050*.mjs' -o \
            -name 'cartera-060*.mjs' -o \
            -name 'cartera-070*.mjs' -o \
            -name 'cartera-080*.mjs' -o \
            -name 'cartera-090*.mjs' -o \
            -name 'cartera-100*.mjs' \
          \) | sort)
          test "${#inherited[@]}" -ge 20
          node --test "${inherited[@]}"

      - name: Preserve CRS 03 to 09 convergence
        run: |
          set -euo pipefail
          mapfile -t crs < <(find tests -maxdepth 1 -type f -name 'crs-0[3-9]-*.mjs' | sort)
          test "${#crs[@]}" -ge 15
          node --test "${crs[@]}"

      - name: Composition authority boundaries
        run: |
          set -euo pipefail
          test ! -e supabase/migrations/20260801001000_crs10_relationship_intelligence.sql
          ! grep -Eq '\.(insert|update|delete|upsert|rpc)\s*\(' docs/static-preview/forge-alive-material3/person-intelligence-module.js
          ! grep -Eq '(localStorage|sessionStorage|indexedDB)' docs/static-preview/forge-alive-material3/person-intelligence-module.js
          ! grep -Eq '(registerRouteModule|history\.pushState)' docs/static-preview/forge-alive-material3/person-intelligence-module.js
          ! grep -Eq '\.(recordObservation|recordAcceptedRecommendation|recordCompletedAction|recordAdvisorFeedback|recordGenericProof|handoffConfirmedPayment|prepareActionReview|preparePipelineReview|prepareRelationshipReview)\s*\(' advisor-os/person-workspace/crs-10-existing-relationship-intelligence-service.js
          grep -q 'existingCarteraIntelligenceReused: true' platform/shared-commercial-model/crs-10-relationship-intelligence-contract.js
          grep -q 'secondScoreEngine: false' platform/shared-commercial-model/crs-10-relationship-intelligence-contract.js
          grep -q 'PRODUCTIVITY_PROOF: "ADVISOR"' platform/shared-commercial-model/crs-10-relationship-intelligence-contract.js
          grep -q 'No atribuida a' advisor-os/person-workspace/crs-10-existing-relationship-intelligence-service.js
          grep -q 'generation !== state.generation' docs/static-preview/forge-alive-material3/person-intelligence-module.js
          grep -q 'forge:auth-state-changed' docs/static-preview/forge-alive-material3/person-intelligence-module.js
          grep -q 'forge:person-workspace-mounted' docs/static-preview/forge-alive-material3/person-workspace-entry-bridge.js
          grep -q 'transition-property: box-shadow, opacity' docs/static-preview/forge-alive-material3/person-workspace-entry-bridge.css
          echo "CRS10_COMPOSITION_BOUNDARIES=PASS"

  responsive-visual-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact candidate
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Mobile tablet and desktop acceptance
        run: npx playwright test --config=playwright.crs10.config.mjs

      - name: Upload exact-head visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crs10-relationship-intelligence-visual-${{ github.sha }}
          path: |
            artifacts/crs10-screenshots/*.png
            artifacts/crs10-playwright-results.json
            artifacts/crs10-playwright-test-results/**
          if-no-files-found: error
          retention-days: 30
