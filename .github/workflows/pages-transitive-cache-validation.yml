name: Pages Transitive Asset Cache Validation

on:
  pull_request:
    paths:
      - "docs/static-preview/forge-alive-material3/cartera-policy-entry-route-gate.js"
      - "scripts/build-advisor-presentation-pages-runtime.mjs"
      - "scripts/build-advisor-presentation-pages-runtime-base.mjs"
      - "scripts/prepare-cartera-canonical-pages-runtime.mjs"
      - "scripts/forge-pages-transitive-cache-versioning.mjs"
      - "tests/pages-transitive-asset-cache-invalidation-test.mjs"
      - ".github/workflows/pages-transitive-cache-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run contract
        run: node tests/pages-transitive-asset-cache-invalidation-test.mjs
      - name: Generate Pages runtime with simulated build SHA
        env:
          FORGE_BUILD_SHA: 0123456789abcdef0123456789abcdef01234567
          FORGE_PAGES_RUNTIME_MODE: pages
          FORGE_CARTERA_PAGES_RUNTIME_MODE: pages
        run: node scripts/build-advisor-presentation-pages-runtime.mjs
      - name: Verify generated Home and Cartera asset graphs
        env:
          EXPECTED_SHA: 0123456789abcdef0123456789abcdef01234567
        run: |
          node - <<'EOF'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const root = 'docs/static-preview/forge-alive-material3';
          const read = file => fs.readFileSync(`${root}/${file}`, 'utf8');
          const sha = process.env.EXPECTED_SHA;
          const carteraRuntime = `${root}/cartera-runtime-${sha}`;

          assert.match(read('app.js'), new RegExp(`home-module\\.js\\?v=${sha}`));
          assert.match(read('home-module.js'), new RegExp(`home-productive-orchestrator\\.js\\?v=${sha}`));
          assert.match(read('home-productive-orchestrator.js'), new RegExp(`activity-ledger-reporting-bridge\\.js\\?v=${sha}`));
          assert.match(read('home-productive-orchestrator.js'), new RegExp(`smart-widget-productive-home-adapter\\.js\\?v=${sha}`));
          assert.match(read('home-productive-orchestrator.js'), new RegExp(`smart-widget-productive-home-adapter\\.css\\?v=${sha}`));
          assert.match(read('smart-widget-productive-home-adapter.js'), new RegExp(`advisor-forecast-runtime-acceptance\\.js\\?v=${sha}`));

          assert.match(read('forge-shell.js'), new RegExp(`cartera-module\\.js\\?v=${sha}`));
          assert.match(read('cartera-module.js'), new RegExp(`cartera-policy-entry-route-gate\\.js\\?v=${sha}`));
          assert.doesNotMatch(read('cartera-module.js'), /cartera-document-intake\.js\?v=beta1-repair-001/);
          assert.match(read('cartera-module.js'), new RegExp(`\\./cartera-runtime-${sha}/`));

          const gate = read('cartera-policy-entry-route-gate.js');
          assert.match(gate, /\[data-forge-cartera-module\]/);
          assert.match(gate, /MutationObserver/);
          assert.match(gate, /import\(intakeUrl\)/);
          assert.match(gate, /cartera-document-intake\.js\?v=/);

          assert.ok(fs.existsSync(`${carteraRuntime}/supabase-runtime.js`));
          assert.ok(fs.existsSync(`${carteraRuntime}/memory-manager.js`));
          assert.ok(fs.existsSync(`${carteraRuntime}/state-manager.js`));
          assert.ok(fs.existsSync(`${carteraRuntime}/cartera.js`));
          assert.ok(fs.existsSync(`${carteraRuntime}/advisor-os/cartera/cartera-030d-policy-payment-calendar-enhancement.js`));
          assert.ok(fs.existsSync(`${carteraRuntime}/advisor-os/cartera/cartera-100d-productivity-proof-enhancement.js`));

          const manifest = JSON.parse(fs.readFileSync(`${carteraRuntime}/manifest.json`, 'utf8'));
          assert.equal(manifest.contractId, 'CARTERA_CANONICAL_PAGES_RUNTIME_V1');
          assert.equal(manifest.buildSha, sha);
          assert.ok(manifest.files.length >= 40);

          console.log('PAGES_TRANSITIVE_HOME_ASSET_GRAPH=PASS');
          console.log('PAGES_CANONICAL_CARTERA_ASSET_GRAPH=PASS');
          console.log('PAGES_CARTERA_POLICY_ENTRY_ROUTE_GATE=PASS');
          EOF
