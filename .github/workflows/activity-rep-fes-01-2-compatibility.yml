name: Activity REP FES-01.2 Compatibility

on:
  pull_request:
    paths:
      - 'advisor-os/reporting/domain/activity-event-authority-mapping.mjs'
      - 'tests/activity-fes-01-2-reporting-compatibility.test.mjs'
      - '.github/workflows/activity-rep-fes-01-2-compatibility.yml'
  push:
    branches:
      - 'codex/activity-rep-fes-01-2-compatibility'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope guard against FES-01.2 prerequisite
        shell: bash
        run: |
          set -euo pipefail
          BASE=be454fe1b6283855049ab99ab09aa28137dc7c7c
          git diff --name-only "$BASE" HEAD > /tmp/changed.txt
          cat /tmp/changed.txt
          grep -Ev '^(advisor-os/reporting/domain/activity-event-authority-mapping\.mjs$|tests/activity-fes-01-2-reporting-compatibility\.test\.mjs$|\.github/workflows/activity-rep-fes-01-2-compatibility\.yml$)' /tmp/changed.txt > /tmp/outside.txt || true
          cat /tmp/outside.txt
          test ! -s /tmp/outside.txt
      - name: Focused compatibility tests
        run: node --test tests/activity-fes-01-2-reporting-compatibility.test.mjs tests/rep-16d-productive-activity-delivery-test.mjs
