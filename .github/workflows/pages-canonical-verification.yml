name: Verify Canonical Forge Alive Pages

on:
  workflow_run:
    workflows:
      - Deploy ForgeOS to GitHub Pages
    types:
      - completed

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Publish deployment result
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          PAGES_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          PAGE_URL: https://jorgeprdz.github.io/ForgeOS/static-preview/forge-alive/?nav=cotizaciones
          BUILD_INFO_URL: https://jorgeprdz.github.io/ForgeOS/build-info.json
          APP_JS_URL: https://jorgeprdz.github.io/ForgeOS/static-preview/forge-alive/app.js
          QPD_JS_URL: https://jorgeprdz.github.io/ForgeOS/static-preview/quote-printable-entry/forge-quote-printable-entrypoint-qpd06.js
          QPD_CSS_URL: https://jorgeprdz.github.io/ForgeOS/static-preview/quote-printable-entry/forge-quote-printable-entrypoint-qpd06.css
          PRINTABLE_READ_MODEL_URL: https://jorgeprdz.github.io/ForgeOS/advisor-os/quotes/printable/quote-printable-read-model-m05e005.js
          QUOTE_LIFECYCLE_URL: https://jorgeprdz.github.io/ForgeOS/platform/event-evidence/quote-lifecycle-supabase-service.js
          CLOSURE_MANIFEST_URL: https://jorgeprdz.github.io/ForgeOS/forge-alive-pages-runtime-closure.json
        run: |
          set -euo pipefail

          post_status() {
            local state="$1"
            local description="$2"
            local target_url="${3:-$PAGE_URL}"
            gh api --method POST \
              "repos/$REPOSITORY/statuses/$EXPECTED_SHA" \
              -f state="$state" \
              -f context="pages/canonical" \
              -f description="$description" \
              -f target_url="$target_url" >/dev/null
          }

          if [[ "$PAGES_CONCLUSION" != "success" ]]; then
            post_status failure "Canonical Pages workflow failed" "$RUN_URL"
            echo "PAGES_CANONICAL=FAIL_WORKFLOW"
            exit 1
          fi

          post_status pending "Verifying canonical Forge Alive deployment"

          for attempt in $(seq 1 48); do
            if node - <<'NODE'
          const expected = process.env.EXPECTED_SHA;
          const cb = `${Date.now()}-${Math.random()}`;
          const options = {
            cache: 'no-store',
            headers: { 'cache-control': 'no-cache' },
          };

          async function text(url, marker) {
            const response = await fetch(`${url}${url.includes('?') ? '&' : '?'}cb=${cb}`, options);
            if (!response.ok) process.exit(1);
            const body = await response.text();
            if (marker && !body.includes(marker)) process.exit(1);
            return body;
          }

          const buildResponse = await fetch(`${process.env.BUILD_INFO_URL}?cb=${cb}`, options);
          if (!buildResponse.ok) process.exit(1);
          const build = await buildResponse.json();
          if (build.commitSha !== expected) process.exit(1);

          const pageHtml = await text(process.env.PAGE_URL, 'Forge Alive');
          if (!pageHtml.includes('data-forge-application')) process.exit(1);

          const appJs = await text(process.env.APP_JS_URL);
          for (const required of [
            'quote-runtime-pages-rate-fetch-bridge-m05e010.js',
            'quote-runtime-vida-mujer-handoff-m05e009.js',
            'quote-runtime-vida-mujer-visual-m05e010.js',
            'quote-runtime-printable-closure-m05e006.js',
            'pipeline-google-calendar.js',
          ]) {
            if (!appJs.includes(required)) process.exit(1);
          }

          await text(
            process.env.QPD_JS_URL,
            'QPD06_PRODUCTIVE_ROUTE_BINDING_V1',
          );
          await text(
            process.env.QPD_CSS_URL,
            'data-forge-qpd06-actions',
          );
          await text(
            process.env.PRINTABLE_READ_MODEL_URL,
            'M05E005_OPTIONAL_CLIENT_READ_MODEL_V1',
          );
          await text(
            process.env.QUOTE_LIFECYCLE_URL,
            'ForgeQuoteLifecycleSupabaseServiceCartera001B',
          );

          const manifestResponse = await fetch(
            `${process.env.CLOSURE_MANIFEST_URL}?cb=${cb}`,
            options,
          );
          if (!manifestResponse.ok) process.exit(1);
          const manifest = await manifestResponse.json();
          if (manifest.contractId !== 'FORGE_ALIVE_PAGES_RUNTIME_CLOSURE_V1') {
            process.exit(1);
          }
          for (const required of [
            'advisor-os/quotes/printable/quote-printable-read-model-m05e005.js',
            'platform/event-evidence/quote-lifecycle-supabase-service.js',
            'static-preview/quote-printable-entry/forge-quote-printable-entrypoint-qpd06.js',
          ]) {
            if (!manifest.requiredPublishedFiles?.includes(required)) process.exit(1);
          }

          console.log(`PAGES_CANONICAL_HTTP=PASS sha=${build.commitSha}`);
          console.log(`PAGES_RUNTIME_CLOSURE=PASS files=${manifest.runtimeFiles.length}`);
          NODE
            then
              post_status success "Canonical Forge Alive runtime closure verified"
              echo "PAGES_CANONICAL=PASS"
              echo "PAGES_SHA=$EXPECTED_SHA"
              echo "PAGES_URL=$PAGE_URL"
              exit 0
            fi
            sleep 5
          done

          post_status failure "Canonical Pages runtime closure incomplete" "$RUN_URL"
          echo "PAGES_CANONICAL=FAIL_STALE_OR_MISSING_RUNTIME"
          exit 1