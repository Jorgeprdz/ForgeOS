name: Cartera Existing Asset Discovery Sync

on:
  push:
    branches:
      - docs/cartera-relationship-intelligence-roadmap

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/cartera-relationship-intelligence-roadmap
          fetch-depth: 0

      - name: Register discovery in roadmap authorities
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('docs/architecture/source-truth/FORGE_CARTERA_RELATIONSHIP_INTELLIGENCE_ROADMAP_001.md'),
              Path('docs/roadmap/FORGE_ROADMAP_LOCK_001.md'),
              Path('FORGE_MASTER_BUILD_TREE.md'),
              Path('docs/architecture/source-truth/FORGE_UNIFIED_BUILD_TREE_001.md'),
          ]

          marker = '<!-- BEGIN FORGEOS:CARTERA_EXISTING_ASSET_DISCOVERY_001 -->'
          block = r'''

<!-- BEGIN FORGEOS:CARTERA_EXISTING_ASSET_DISCOVERY_001 -->
# Cartera Existing Asset Discovery 001

Status: `CLOSED / DOCUMENTATION_ONLY / NO_RUNTIME_MUTATION`

Canonical discovery:

- `docs/architecture/source-truth/FORGE_CARTERA_EXISTING_ASSET_DISCOVERY_001.md`

## Repository decision

- `CARTERA_000A_EXISTING_ASSET_DISCOVERY`: CLOSED.
- Productive Prospect identity, duplicate checks, Supabase persistence and Prospect Timeline are reusable authorities.
- Quote PDF extraction, deterministic calculation, human confirmation and accepted-review snapshot are reusable, but the quote-to-prospect durable bridge is missing.
- Seventy-seven Policy Operations assets already exist across intake, queue, sequential batch, staging, OCR, parsing, human review, policy detail, policy timeline, renewals and tasks.
- Policy Operations workflow structures must be reconciled and hardened; they must not be rebuilt wholesale.
- Client CRM 065B, Opportunity Pipeline 066B and Policy Read Model 068B remain local/static preview shims, not production sources.
- Automatic policy approval, policy PII in localStorage, in-memory policy storage, mutable legacy policy timeline deletion and quarantined IndexedDB Cartera persistence are forbidden to promote.
- Relationship engines remain candidate signal libraries subject to ADR-011 evidence, freshness, uncertainty, consent and non-manipulation rules.
- Conservation remains architecture-only; no Conservation runtime or validated formulas were found.
- Compensation Rule Pack infrastructure is reusable, but a policy-payment commission Rule Pack family and payment-to-compensation adapter are still required.
- No domain-specific Gmail payment-detection runtime was found.
- Candy Crush relational activation remains to be built; Alfred review packets and Mi Día projections are reusable surfaces.

## Missing canonical construction

1. Durable Quote-to-Prospect Timeline bridge and Quote history projection.
2. Canonical Policy repository, policy-party model, document evidence model and real Cartera read model.
3. Governed Policy Intake Candidate, parser registry, authenticated staging and identity-resolution review.
4. Payment Obligation Ledger, policy-year calculator, payment confirmation and correction events.
5. Canonical Relationship Graph and governed relationship-signal adapter.
6. Future Radar and separate Conservation runtime/adapters.
7. Advisor-confirmed Pipeline opportunity bridge for second sale and relationship growth.
8. Candy Crush relational action producer.
9. Connected-email payment evidence matcher.
10. Policy commission Rule Pack family and official-statement reconciliation.
11. Productivity proof and attribution metrics.

## Immediate authorized implementation

`CARTERA_001_PIPELINE_QUOTE_PERSON_TIMELINE_CONTINUITY` remains `NEXT`.

It must reuse the productive prospect UUID, accepted Quote confirmation, Prospect Timeline service/RPC and Prospect Detail projection before introducing any new authority.

Roadmap presence or engine file existence is not implementation proof. Every promoted asset requires contract reconciliation, tests, evidence and closure.
<!-- END FORGEOS:CARTERA_EXISTING_ASSET_DISCOVERY_001 -->
'''

          for path in files:
              text = path.read_text(encoding='utf-8')
              if marker not in text:
                  path.write_text(text.rstrip() + block + '\n', encoding='utf-8')
          PY

          rm -f .github/workflows/cartera-existing-asset-discovery-sync.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/source-truth/FORGE_CARTERA_RELATIONSHIP_INTELLIGENCE_ROADMAP_001.md \
                  docs/roadmap/FORGE_ROADMAP_LOCK_001.md \
                  FORGE_MASTER_BUILD_TREE.md \
                  docs/architecture/source-truth/FORGE_UNIFIED_BUILD_TREE_001.md \
                  .github/workflows/cartera-existing-asset-discovery-sync.yml
          git commit -m "docs(cartera): register existing asset discovery"
          git push origin HEAD:docs/cartera-relationship-intelligence-roadmap
