name: Forge Beta2 Real User Acceptance 013 RU08 Reproduction

on:
  push:
    branches:
      - fix/forge-beta2-real-user-acceptance-interpretation-recovery-013
    paths:
      - 'docs/static-preview/forge-aura/pipeline/pipeline-journal-aura-011e.js'
      - 'tests/e2e/forge-beta2-013-ru08-reproduction.spec.mjs'
      - 'playwright.013.config.mjs'
      - '.github/workflows/forge-beta2-real-user-acceptance-013-ru08-repro.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-beta2-013-ru08-reproduction
  cancel-in-progress: false

jobs:
  ru08-reproduction:
    if: github.repository == 'Jorgeprdz/ForgeOS'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: 067g17a1-remote-acceptance
    env:
      SUPABASE_PROJECT_REF: rmlxigxysujsuwzgoimv
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout exact 013 revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare one-run governed acceptance credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/forge013"
          admin_token="$(openssl rand -hex 32)"
          password_a="$(openssl rand -base64 36 | tr -d '\n' | tr '/+' '_-')Aa1!"
          password_b="$(openssl rand -base64 36 | tr -d '\n' | tr '/+' '_-')Bb2!"
          printf '%s' "$admin_token" > "$RUNNER_TEMP/forge013/admin-token"
          printf '%s' "$password_a" > "$RUNNER_TEMP/forge013/a-password"
          printf '%s' "$password_b" > "$RUNNER_TEMP/forge013/b-password"
          chmod 600 "$RUNNER_TEMP/forge013/"*
          echo "::add-mask::$admin_token"
          echo "::add-mask::$password_a"
          echo "::add-mask::$password_b"
          echo '013_RU08_ONE_RUN_CREDENTIALS=PREPARED'

      - name: Reconfigure existing 005C acceptance control plane
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          admin_token="$(cat "$RUNNER_TEMP/forge013/admin-token")"
          password_a="$(cat "$RUNNER_TEMP/forge013/a-password")"
          password_b="$(cat "$RUNNER_TEMP/forge013/b-password")"
          supabase secrets set \
            FORGE_ACCEPTANCE_ADMIN_TOKEN="$admin_token" \
            FORGE_ACCEPTANCE_A_PASSWORD="$password_a" \
            FORGE_ACCEPTANCE_B_PASSWORD="$password_b" \
            --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy forge-acceptance-admin \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt
          echo 'ACCEPTANCE_CONTROL_PLANE_REUSED=YES'
          echo 'SECOND_ACCEPTANCE_AUTHORITY_CREATED=NO'

      - name: Provision and open synthetic A/B acceptance window
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/forge-beta2-013-ru08
          admin_token="$(cat "$RUNNER_TEMP/forge013/admin-token")"
          curl --fail --silent --show-error -X POST \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/forge-acceptance-admin" \
            -H 'Content-Type: application/json' \
            -H "x-forge-acceptance-admin-token: $admin_token" \
            --data '{"action":"PROVISION"}' > artifacts/forge-beta2-013-ru08/provision.json
          node -e "const p=require('./artifacts/forge-beta2-013-ru08/provision.json');if(p.ok!==true||p.accountsOpened!==2)throw Error('PROVISION_FAILED')"
          echo '013_RU08_ACCEPTANCE_WINDOW=OPEN'

      - name: Reproduce RU08 through productive RLS and real Aura browser
        shell: bash
        run: |
          set -euo pipefail
          export FORGE_ACCEPTANCE_A_PASSWORD="$(cat "$RUNNER_TEMP/forge013/a-password")"
          export FORGE_ACCEPTANCE_B_PASSWORD="$(cat "$RUNNER_TEMP/forge013/b-password")"
          npx playwright test \
            tests/e2e/forge-beta2-013-ru08-reproduction.spec.mjs \
            --config=playwright.013.config.mjs

      - name: Seal synthetic acceptance identities
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          admin_token="$(cat "$RUNNER_TEMP/forge013/admin-token")"
          curl --fail --silent --show-error -X POST \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/forge-acceptance-admin" \
            -H 'Content-Type: application/json' \
            -H "x-forge-acceptance-admin-token: $admin_token" \
            --data '{"action":"SEAL"}' > artifacts/forge-beta2-013-ru08/seal.json
          node -e "const p=require('./artifacts/forge-beta2-013-ru08/seal.json');if(p.ok!==true||p.accountsSealed!==2)throw Error('SEAL_FAILED')"
          echo '013_RU08_ACCEPTANCE_WINDOW=SEALED'

      - name: Upload RU08 reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-beta2-013-ru08-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/forge-beta2-013-ru08/
            artifacts/forge-beta2-013-ru08-playwright.json
            artifacts/forge-beta2-013-ru08-results/
          if-no-files-found: warn
          retention-days: 30