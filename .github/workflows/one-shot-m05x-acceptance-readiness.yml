name: One Shot M05X Acceptance Readiness

on:
  push:
    branches:
      - fix/vida-mujer-pdf-main-thread
    paths:
      - .github/workflows/one-shot-m05x-acceptance-readiness.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/one-shot-m05x-acceptance-readiness.yml

permissions:
  contents: write

jobs:
  update-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vida-mujer-pdf-main-thread
      - name: Require ready intake and client-specific PDF filename
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/ui-m05p-real-vida-mujer-pdf.spec.mjs')
          text = path.read_text()
          old_upload = '''  await expect(fileInput).toBeAttached({ timeout: 15_000 });
  await screenshot(page, testInfo.project.name, "01-before-upload");
  await fileInput.setInputFiles(fixturePath);
'''
          new_upload = '''  await expect(fileInput).toBeAttached({ timeout: 15_000 });
  await expect(page.locator("html")).toHaveAttribute(
    "data-quote-intake-readiness",
    "ready",
    { timeout: 25_000 },
  );
  await expect(fileInput).toBeEnabled({ timeout: 25_000 });
  await screenshot(page, testInfo.project.name, "01-before-upload");
  await fileInput.setInputFiles(fixturePath);
'''
          if old_upload not in text:
              raise SystemExit('M05P_UPLOAD_ANCHOR_NOT_FOUND')
          text = text.replace(old_upload, new_upload, 1)

          old_download = '''  const downloaded = await downloadEvent;
  const downloadedPath = path.join(
'''
          new_download = '''  const downloaded = await downloadEvent;
  expect(downloaded.suggestedFilename()).toMatch(/alejandra-moleres/i);
  const downloadedPath = path.join(
'''
          if old_download not in text:
              raise SystemExit('M05P_DOWNLOAD_ANCHOR_NOT_FOUND')
          text = text.replace(old_download, new_download, 1)
          path.write_text(text)
          PY
          grep -F 'data-quote-intake-readiness' \
            tests/e2e/ui-m05p-real-vida-mujer-pdf.spec.mjs
          grep -F 'suggestedFilename()).toMatch(/alejandra-moleres/i)' \
            tests/e2e/ui-m05p-real-vida-mujer-pdf.spec.mjs
          rm .github/workflows/one-shot-m05x-acceptance-readiness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(ui): wait for quote intake readiness in M05P"
          git push origin HEAD:fix/vida-mujer-pdf-main-thread
