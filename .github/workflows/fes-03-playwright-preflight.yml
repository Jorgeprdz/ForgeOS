name: FES 03 Playwright Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nfast-09-timeline-to-conversation-brief-projection
    paths:
      - ".github/workflows/fes-03-playwright-preflight.yml"
      - ".gitignore"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - "tests/e2e/**"
      - "docs/architecture/source-truth/FES_03_PLAYWRIGHT_E2E_STANDARD_001.md"
      - "docs/roadmap/FES_03_TIMELINE_AND_PROJECTION_RUNTIME_SCOPE_001.md"

permissions:
  contents: read

jobs:
  preflight:
    name: Native Linux Playwright preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify Playwright and container alignment
        run: |
          node -e '
            const manifest = require("./package.json");
            const version =
              manifest.devDependencies["@playwright/test"];
            if (version !== "1.61.1") {
              throw new Error(
                `PLAYWRIGHT_VERSION_MISMATCH:${version}`
              );
            }
            console.log(
              `PLAYWRIGHT_PROJECT_VERSION=${version}`
            );
          '
          npx playwright --version
          npx vite --version

      - name: Run FES 03 Playwright preflight
        run: npm run test:e2e:preflight

      - name: Upload Playwright evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: fes-03-playwright-preflight-evidence
          path: |
            artifacts/playwright-report
            artifacts/playwright-test-results
            artifacts/fes03-playwright-results.json
          if-no-files-found: error
          retention-days: 30
