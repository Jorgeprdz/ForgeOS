name: Activity Aura Live Acceptance Pages

on:
  push:
    branches:
      - feature/activity-calendar-production-live-acceptance-001
    paths:
      - "docs/static-preview/forge-aura/**"
      - "docs/static-preview/forge-alive-material3/activity-ledger-reporting-bridge.mjs"
      - "platform/operational-calendar/**"
      - "platform/productivity/**"
      - "platform/event-evidence/**"
      - "advisor-os/reporting/**"
      - "scripts/build-activity-aura-pages-artifact.mjs"
      - "tests/activity-*.mjs"
      - ".github/workflows/activity-aura-live-acceptance-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == 'Jorgeprdz' && github.ref_name == 'feature/activity-calendar-production-live-acceptance-001'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout authorized live-acceptance branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Aura Activity publication boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/static-preview/forge-aura/auth-v4.html
          test -f docs/static-preview/forge-aura/app-v4.js
          test -f docs/static-preview/forge-aura/aura-router-v4.js
          test -d docs/static-preview/forge-aura/activity
          grep -Eq 'actividad' docs/static-preview/forge-aura/aura-router-v4.js
          grep -Eq 'createActivityModule|activity' docs/static-preview/forge-aura/app-v4.js
          ! grep -RInE \
            'actividad\.js|forge-alive-material3/(activity-module\.js|activity-operational-module\.js|activity-manual-entry\.js|activity-module\.css)' \
            docs/static-preview/forge-aura/activity docs/static-preview/forge-aura/app-v4.js
          grep -Eq 'activity-ledger-reporting-bridge\.mjs' \
            docs/static-preview/forge-aura/activity/activity-runtime-adapter.js
          ! grep -Eq '\.\./\.\./\.\./platform/' \
            docs/static-preview/forge-aura/auth-v4.html
          ! grep -Eq '\.\./\.\./\.\./advisor-os/' \
            docs/static-preview/forge-alive-material3/activity-ledger-reporting-bridge.mjs

      - name: Aura Activity productive UI acceptance
        run: node --test tests/activity-aura-productive-ui-test.mjs

      - name: Calendar self-service repository acceptance
        run: node --test tests/activity-calendar-self-service-repository-test.mjs

      - name: FES 01.2 reporting convergence acceptance
        run: node --test tests/activity-fes12-reporting-convergence-test.mjs

      - name: Foundational operational calendar regression
        run: node tests/activity-foundational-operational-calendar-test.mjs

      - name: Foundational FES taxonomy regression
        run: node tests/activity-foundational-fes-taxonomy-test.mjs

      - name: Foundational conversion regression
        run: node tests/activity-foundational-productivity-conversion-test.mjs

      - name: Foundational points regression
        run: node tests/activity-foundational-points-adapter-test.mjs

      - name: Productive Activity reporting bridge regression
        run: node tests/rep-16d-productive-activity-delivery-test.mjs

      - name: Pipeline regression
        run: node tests/pipeline-public-acceptance-hotfix-regression.mjs

      - name: NBA constitutional regression
        run: node manager-os/tests/nba-reason-why-boundary-contract-master-test.js

      - name: NASH Mick constitutional regression
        run: node manager-os/tests/nash-mick-nba-reconnection-engine-master-test.js

      - name: Build reproducible Pages authority artifact
        env:
          BUILD_SHA: ${{ github.sha }}
        run: node scripts/build-activity-aura-pages-artifact.mjs _site

      - name: Validate generated authority artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/activity-authority-manifest.json
          test -f _site/activity-live-build-info.json
          test -f _site/platform/event-evidence/canonical-activity-event-contract.js
          test -f _site/platform/operational-calendar/operational-calendar-repository.js
          test -f _site/platform/productivity/activity-points-authority-adapter.mjs
          test -f _site/advisor-os/reporting/runtime/activity-reporting-runtime.mjs
          test -f _site/static-preview/forge-aura/activity/activity-calendar-controller.js
          test -f _site/static-preview/forge-aura/activity/activity-metrics-adapter.js
          grep -q '"businessRulesManuallyCopied": false' _site/activity-authority-manifest.json
          grep -q "$GITHUB_SHA" _site/activity-live-build-info.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.actor == 'Jorgeprdz' && github.ref_name == 'feature/activity-calendar-production-live-acceptance-001'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Deploy successor branch to Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    if: github.actor == 'Jorgeprdz' && github.ref_name == 'feature/activity-calendar-production-live-acceptance-001'
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10
    steps:
      - name: Public Activity route and authority smoke test
        shell: bash
        env:
          BASE_URL: https://jorgeprdz.github.io/ForgeOS
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --location \
              "$BASE_URL/activity-live-build-info.json?attempt=$attempt" \
              -o /tmp/build-info.json; then
              if grep -q "$EXPECTED_SHA" /tmp/build-info.json; then
                break
              fi
            fi
            sleep 5
          done
          grep -q "$EXPECTED_SHA" /tmp/build-info.json

          urls=(
            "$BASE_URL/activity-authority-manifest.json"
            "$BASE_URL/static-preview/forge-aura/auth-v4.html?route=actividad&v=$EXPECTED_SHA"
            "$BASE_URL/static-preview/forge-aura/app-v4.js?v=$EXPECTED_SHA"
            "$BASE_URL/static-preview/forge-aura/aura-router-v4.js?v=$EXPECTED_SHA"
            "$BASE_URL/static-preview/forge-aura/activity/activity-module.js?v=$EXPECTED_SHA"
            "$BASE_URL/static-preview/forge-aura/activity/activity-runtime-adapter.js?v=$EXPECTED_SHA"
            "$BASE_URL/static-preview/forge-aura/activity/activity-calendar-controller.js?v=$EXPECTED_SHA"
            "$BASE_URL/static-preview/forge-aura/activity/activity-metrics-adapter.js?v=$EXPECTED_SHA"
            "$BASE_URL/static-preview/forge-alive-material3/activity-ledger-reporting-bridge.mjs?v=$EXPECTED_SHA"
            "$BASE_URL/platform/event-evidence/canonical-activity-event-contract.js?v=$EXPECTED_SHA"
            "$BASE_URL/platform/operational-calendar/operational-calendar-repository.js?v=$EXPECTED_SHA"
            "$BASE_URL/platform/productivity/activity-points-authority-adapter.mjs?v=$EXPECTED_SHA"
            "$BASE_URL/advisor-os/reporting/runtime/activity-reporting-runtime.mjs?v=$EXPECTED_SHA"
          )
          index=0
          for url in "${urls[@]}"; do
            curl --fail --silent --show-error --location "$url" -o "/tmp/asset-$index"
            test -s "/tmp/asset-$index"
            index=$((index + 1))
          done

          grep -Eq 'data-aura-app|app-v4\.js' /tmp/asset-1
          grep -Eq 'actividad|createActivityModule' /tmp/asset-2
          grep -Eq 'actividad' /tmp/asset-3
          grep -Eq 'createActivityCalendarController' /tmp/asset-4
          grep -Eq 'appendAdvisorProfile|appendTimeOff' /tmp/asset-10
          echo "ACTIVITY_AURA_PUBLIC_ROUTE=PASS"
          echo "ACTIVITY_AURA_AUTHORITY_ASSETS=PASS"
          echo "ACTIVITY_AURA_BUILD_SHA=$EXPECTED_SHA"
