name: REP-16E Visual Harness Reconcile

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rep-16e-visual-harness-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promotion/rep-16e-activity-clean-main
          fetch-depth: 1

      - name: Run one-shot reconciler
        run: python3 .forge/rep16e_visual_harness_reconcile.py

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if grep -Fxq PASS .forge/rep16e_reconcile_status.txt; then
            rm .github/workflows/rep-16e-visual-harness-reconcile.yml
            rm .forge/rep16e_visual_harness_reconcile.py
            rm .forge/rep16e_reconcile_status.txt
            git add tools/forge-ui-visual-diagnostic.mjs \
              docs/static-preview/forge-alive-material3/quote-product-intelligence-presenter.js \
              .github/workflows/rep-16e-visual-harness-reconcile.yml \
              .forge/rep16e_visual_harness_reconcile.py
            git commit -m "REP-16E align visual diagnostic with current Quotes presenter"
          else
            git add .forge/rep16e_reconcile_status.txt
            git commit -m "REP-16E record visual harness reconciliation failure"
          fi

          git push origin HEAD:promotion/rep-16e-activity-clean-main
