name: Deploy ForgeOS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GitHub Pages public configuration
        env:
          DEMO_MODE: ${{ vars.DEMO_MODE || 'false' }}
          ENABLE_TEST_ADVISOR_LOGIN: ${{ vars.ENABLE_TEST_ADVISOR_LOGIN || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ "$DEMO_MODE" != "true" ]; then
            if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
              echo "Error: GitHub SUPABASE_URL and SUPABASE_ANON_KEY are required when DEMO_MODE is not 'true'"
              exit 1
            fi
          fi
          node -e "if(process.env.DEMO_MODE!=='true'){const u=new URL(process.env.SUPABASE_URL);if(u.hostname!=='rmlxigxysujsuwzgoimv.supabase.co')throw new Error('SUPABASE_URL_PROJECT_REF_MISMATCH')}"

      - name: Generate env.js
        env:
          DEMO_MODE: ${{ vars.DEMO_MODE || 'false' }}
          ENABLE_TEST_ADVISOR_LOGIN: ${{ vars.ENABLE_TEST_ADVISOR_LOGIN || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const env = {
            SUPABASE_URL: process.env.SUPABASE_URL || '',
            SUPABASE_KEY: process.env.SUPABASE_ANON_KEY || '',
            DEMO_MODE: process.env.DEMO_MODE === 'true' ? 'true' : 'false',
            ENABLE_TEST_ADVISOR_LOGIN: process.env.ENABLE_TEST_ADVISOR_LOGIN === 'true' ? 'true' : 'false',
          };
          fs.writeFileSync('env.js', `window.__ENV__ = Object.freeze(${JSON.stringify(env, null, 2)});\n`);
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate productive Pages runtimes
        run: node scripts/build-advisor-presentation-pages-runtime.mjs

      - name: Build canonical Pages artifact
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');

          const siteDir = '_site';
          const canonicalSource = 'docs/static-preview/forge-alive-material3';
          const canonicalTarget = path.join(siteDir, 'static-preview', 'forge-alive');
          const quoteEngineSource = 'docs/static-preview/forge-alive/nueva-cotizacion/index.html';
          const quoteEngineTarget = path.join(
            siteDir,
            'static-preview',
            'quote-engine',
            'nueva-cotizacion',
            'index.html',
          );
          const quoteRuntimeSource = 'docs/static-preview/quote-preview-live';
          const quoteRuntimeTarget = path.join(siteDir, 'static-preview', 'quote-preview-live');
          const segubecaAuthorityAsset =
            'advisor-os/quotes/products/segubeca/segubeca-calculation-authority.js';
          const segubecaSourceAuthorityImport =
            '../../../advisor-os/quotes/products/segubeca/segubeca-calculation-authority.js';
          const segubecaPublicAuthorityImport =
            '../../advisor-os/quotes/products/segubeca/segubeca-calculation-authority.js';

          fs.rmSync(siteDir, { recursive: true, force: true });
          fs.mkdirSync(siteDir, { recursive: true });

          const trackedFiles = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' })
            .split('\0')
            .filter(Boolean);
          const publicExtensions = new Set([
            '.css', '.html', '.ico', '.jpeg', '.jpg', '.js', '.json',
            '.map', '.png', '.svg', '.txt', '.webmanifest', '.webp',
          ]);
          const publicRootFiles = new Set([
            '.nojekyll', '_redirects', 'index.html', 'manifest.json', 'service-worker.js',
          ]);
          const publicConversationRuntimeFiles = new Set([
            segubecaAuthorityAsset,
            'nash-intent-engine.js',
            'nash-combat-orchestrator.js',
            'nash-next-best-action-engine.js',
            'nash-combat-intelligence-report-engine.js',
            'nash/context-intake/nash-prospect-context-intake-boundary-contract.js',
            'nash/context-intake/nash-prospect-context-intake.js',
            'nash/context-intake/nash-universal-prospect-context-consumer.js',
            'nash/conversation-brief/nash-deterministic-conversation-brief-boundary-contract.js',
            'nash/conversation-brief/nash-provider-request-contract.js',
            'nash/remote-draft-provider-client-boundary.js',
            'nash/pipeline-nash-draft-orchestrator.js',
            'nash/draft-intake/nfast06-draft-safety-boundary.js',
            'nash/draft-intake/nfast06-deterministic-draft-renderer.js',
            'manager-os/nba/nba-reason-why-boundary-contract.js',
            'manager-os/nba/nash-mick-nba-reconnection-engine.js',
          ]);
          const blockedPublicPrefixes = [
            'docs/static-preview/forge-alive/',
            'docs/static-preview/forge-alive-material3/',
            'docs/static-preview/quote-preview-live/',
            'docs/static-preview/templates/',
            'docs/quote-preview-live/',
            'docs/10-gui/',
            'docs/docs/',
          ];
          const blockedPublicFiles = new Set([
            'docs/index.html',
          ]);

          function isPublicFile(file) {
            if (file.startsWith('.github/')) return false;
            if (file.startsWith('docs/evidence/')) return false;
            if (blockedPublicFiles.has(file)) return false;
            if (blockedPublicPrefixes.some(prefix => file.startsWith(prefix))) return false;
            if (file.startsWith('advisor-os/sales-pipeline/')) {
              return publicExtensions.has(path.extname(file).toLowerCase());
            }
            if (publicConversationRuntimeFiles.has(file)) return true;
            if (!file.startsWith('docs/')) return publicRootFiles.has(file);
            if (file.includes('/tests/')) return false;
            if (/(^|\/)([^/]*-)?(master-)?test(s)?\.(js|json)$/i.test(file)) return false;
            if (/\.(pdf|xlsx|zip)$/i.test(file)) return false;
            if (publicRootFiles.has(file)) return true;
            return publicExtensions.has(path.extname(file).toLowerCase());
          }

          for (const file of trackedFiles.filter(isPublicFile)) {
            const publicPath = file.startsWith('docs/') ? file.slice('docs/'.length) : file;
            const target = path.join(siteDir, publicPath);
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.copyFileSync(file, target);
          }

          if (!fs.existsSync(canonicalSource)) {
            throw new Error('canonical ForgeOS source is missing');
          }
          fs.rmSync(canonicalTarget, { recursive: true, force: true });
          fs.cpSync(canonicalSource, canonicalTarget, { recursive: true });

          for (const obsoleteCanonicalArtifact of [
            'index-quote-calculator-parity.html',
            'quotes-module-complete.js',
          ]) {
            fs.rmSync(path.join(canonicalTarget, obsoleteCanonicalArtifact), { force: true });
          }

          if (!fs.existsSync(quoteEngineSource)) {
            throw new Error('Quotes engine source is missing');
          }
          fs.mkdirSync(path.dirname(quoteEngineTarget), { recursive: true });
          const standaloneGuard = [
            '<script data-forge-engine-standalone-guard>',
            'if (window.top === window.self) {',
            '  window.location.replace("../../forge-alive/?nav=cotizaciones");',
            '}',
            '</script>',
          ].join('\n');
          const quoteEngine = fs.readFileSync(quoteEngineSource, 'utf8');
          if (!quoteEngine.includes('<head>')) {
            throw new Error('Quotes engine head boundary is missing');
          }
          fs.writeFileSync(
            quoteEngineTarget,
            quoteEngine.replace('<head>', `<head>\n${standaloneGuard}`),
          );

          function copyRuntimeFiles(sourceDir, targetDir) {
            for (const entry of fs.readdirSync(sourceDir, { withFileTypes: true })) {
              const source = path.join(sourceDir, entry.name);
              const target = path.join(targetDir, entry.name);
              if (entry.isDirectory()) {
                copyRuntimeFiles(source, target);
                continue;
              }
              const extension = path.extname(entry.name).toLowerCase();
              if (!['.js', '.json', '.map'].includes(extension)) continue;
              fs.mkdirSync(path.dirname(target), { recursive: true });
              fs.copyFileSync(source, target);
            }
          }
          fs.rmSync(quoteRuntimeTarget, { recursive: true, force: true });
          copyRuntimeFiles(quoteRuntimeSource, quoteRuntimeTarget);

          const segubecaPublicBindingPath = path.join(
            canonicalTarget,
            'segubeca-productive-ui-binding.js',
          );
          const segubecaPublicBindingSource = fs.readFileSync(
            segubecaPublicBindingPath,
            'utf8',
          );
          const segubecaPublicBinding = segubecaPublicBindingSource.replace(
            segubecaSourceAuthorityImport,
            segubecaPublicAuthorityImport,
          );
          if (segubecaPublicBinding === segubecaPublicBindingSource) {
            throw new Error('SeguBeca public authority import was not rewritten');
          }
          fs.writeFileSync(segubecaPublicBindingPath, segubecaPublicBinding);

          const canonicalIndexPath = path.join(canonicalTarget, 'index.html');
          const canonicalIndex = fs.readFileSync(canonicalIndexPath, 'utf8');
          const versionedCanonicalIndex = canonicalIndex.replace(
            /<script type="module" src="\.\/app\.js\?[^"]+"><\/script>/,
            `<script type="module" src="./app.js?v=${process.env.GITHUB_SHA}"></script>`,
          );
          if (versionedCanonicalIndex === canonicalIndex) {
            throw new Error('canonical ForgeOS app entry was not versioned');
          }
          fs.writeFileSync(canonicalIndexPath, versionedCanonicalIndex);

          for (const file of trackedFiles.filter(file => file.startsWith('docs/') && file.endsWith('.html'))) {
            const target = path.join(siteDir, file.slice('docs/'.length));
            if (!fs.existsSync(target)) continue;
            const html = fs.readFileSync(target, 'utf8')
              .replaceAll('__FORGE_BUILD_SHA__', process.env.GITHUB_SHA);
            fs.writeFileSync(target, html);
          }

          fs.copyFileSync('env.js', path.join(siteDir, 'env.js'));
          fs.writeFileSync(
            path.join(siteDir, 'build-info.json'),
            `${JSON.stringify({
              commitSha: process.env.GITHUB_SHA,
              generatedAt: new Date().toISOString(),
              artifact: 'forge-pages-canonical-only',
            }, null, 2)}\n`,
          );
          fs.writeFileSync(
            path.join(siteDir, 'production-surface.json'),
            `${JSON.stringify({
              canonicalEntry: 'static-preview/forge-alive/index.html',
              quoteEngine: 'static-preview/quote-engine/nueva-cotizacion/index.html',
              retiredRoutes: [
                'static-preview/forge-alive-runtime/',
                'static-preview/templates/',
                'quote-preview-live/',
                '10-gui/',
              ],
            }, null, 2)}\n`,
          );

          console.log('PAGES_CANONICAL_UI_ONLY=PASS');
          EOF
          du -sh _site

      - name: Validate canonical-only Pages artifact
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          node scripts/validate-pages-public-config.mjs _site/env.js
          node - <<'EOF'
          const assert = require('assert');
          const fs = require('fs');
          const path = require('path');

          const canonical = '_site/static-preview/forge-alive';
          const quoteEngine = '_site/static-preview/quote-engine/nueva-cotizacion/index.html';
          const forbiddenPaths = [
            '_site/static-preview/forge-alive-runtime',
            '_site/static-preview/templates',
            '_site/quote-preview-live',
            '_site/10-gui',
            '_site/docs/static-preview',
          ];
          for (const forbiddenPath of forbiddenPaths) {
            assert.equal(
              fs.existsSync(forbiddenPath),
              false,
              `retired UI path was published: ${forbiddenPath}`,
            );
          }

          for (const required of [
            '_site/index.html',
            '_site/service-worker.js',
            '_site/env.js',
            '_site/build-info.json',
            '_site/production-surface.json',
            path.join(canonical, 'index.html'),
            path.join(canonical, 'app.css'),
            path.join(canonical, 'app.js'),
            path.join(canonical, 'quotes-module.js'),
            quoteEngine,
            '_site/static-preview/quote-preview-live/forge-quote-preview-bundle.js',
          ]) {
            assert.ok(fs.existsSync(required), `missing productive artifact: ${required}`);
          }

          assert.equal(
            fs.existsSync(path.join(canonical, 'index-quote-calculator-parity.html')),
            false,
            'obsolete alternate canonical entry was published',
          );
          assert.equal(
            fs.existsSync(path.join(canonical, 'quotes-module-complete.js')),
            false,
            'duplicate Quotes module was published',
          );

          const rootIndex = fs.readFileSync('_site/index.html', 'utf8');
          const canonicalIndex = fs.readFileSync(path.join(canonical, 'index.html'), 'utf8');
          const quotesModule = fs.readFileSync(path.join(canonical, 'quotes-module.js'), 'utf8');
          const engineSource = fs.readFileSync(quoteEngine, 'utf8');
          const serviceWorker = fs.readFileSync('_site/service-worker.js', 'utf8');

          assert.match(rootIndex, /static-preview\/forge-alive/);
          assert.match(serviceWorker, /FORGEOS_LEGACY_SERVICE_WORKER_RETIRED/);
          assert.match(serviceWorker, /self\.registration\.unregister\(\)/);
          assert.doesNotMatch(serviceWorker, /respondWith|importScripts|CACHE_CONFIG/);
          assert.ok(
            canonicalIndex.includes(`app.js?v=${process.env.EXPECTED_COMMIT_SHA}`),
            'canonical app entry is not versioned with the deployed commit',
          );
          assert.doesNotMatch(
            canonicalIndex,
            /Muestra segura · solo lectura|phone-shell|forge-m3-app-shell|forge-desktop-workspace-056y|ui-material3-runtime/,
          );
          assert.match(quotesModule, /quote-engine\/nueva-cotizacion\/index\.html/);
          assert.doesNotMatch(quotesModule, /forge-alive-runtime/);
          assert.match(engineSource, /data-forge-engine-standalone-guard/);
          assert.match(engineSource, /data-forge-module="dedicated-new-quote-static-route"/);

          const forbidden = [];
          function walk(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const absolute = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                walk(absolute);
                continue;
              }
              const relative = path.relative('_site', absolute);
              if (
                /\.(pdf|zip|xlsx)$/i.test(relative)
                || /(^|\/)(golden|goldens)(\/|$)/i.test(relative)
                || /ForgeGemini|Design-Lock/i.test(relative)
              ) {
                forbidden.push(relative);
              }
            }
          }
          walk('_site');
          assert.deepEqual(forbidden, [], `private evidence published: ${forbidden.join(', ')}`);

          const buildInfo = JSON.parse(fs.readFileSync('_site/build-info.json', 'utf8'));
          assert.equal(buildInfo.commitSha, process.env.EXPECTED_COMMIT_SHA);
          assert.equal(buildInfo.artifact, 'forge-pages-canonical-only');

          console.log('PAGES_CANONICAL_UI_ONLY=PASS');
          console.log('PAGES_LEGACY_UI_NOT_PUBLISHED=PASS');
          console.log('PAGES_QUOTE_ENGINE_ISOLATED=PASS');
          console.log('PAGES_LEGACY_SERVICE_WORKER_RETIRED=PASS');
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Wait for Pages deployment lock
        run: sleep 45

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
