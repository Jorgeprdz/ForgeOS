name: Deploy ForgeOS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GitHub Pages public configuration
        env:
          DEMO_MODE: ${{ vars.DEMO_MODE || 'false' }}
          ENABLE_TEST_ADVISOR_LOGIN: ${{ vars.ENABLE_TEST_ADVISOR_LOGIN || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ "$DEMO_MODE" != "true" ]; then
            if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
              echo "Error: GitHub SUPABASE_URL and SUPABASE_ANON_KEY are required when DEMO_MODE is not 'true'"
              exit 1
            fi
          fi
          node -e "if(process.env.DEMO_MODE!=='true'){const u=new URL(process.env.SUPABASE_URL);if(u.hostname!=='rmlxigxysujsuwzgoimv.supabase.co')throw new Error('SUPABASE_URL_PROJECT_REF_MISMATCH')}"

      - name: Generate env.js
        env:
          DEMO_MODE: ${{ vars.DEMO_MODE || 'false' }}
          ENABLE_TEST_ADVISOR_LOGIN: ${{ vars.ENABLE_TEST_ADVISOR_LOGIN || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const isDemo = process.env.DEMO_MODE === 'true';
          const env = {
            SUPABASE_URL: process.env.SUPABASE_URL || "",
            SUPABASE_KEY: process.env.SUPABASE_ANON_KEY || "",
            DEMO_MODE: isDemo ? "true" : "false",
            ENABLE_TEST_ADVISOR_LOGIN: process.env.ENABLE_TEST_ADVISOR_LOGIN === "true" ? "true" : "false"
          };
          console.log(`Generating env.js (DEMO_MODE: ${env.DEMO_MODE}, TEST_ADVISOR_LOGIN: ${env.ENABLE_TEST_ADVISOR_LOGIN})`);
          fs.writeFileSync('env.js', `window.__ENV__ = Object.freeze(${JSON.stringify(env, null, 2)});\n`);
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate Advisor OS presentation Pages runtime
        run: node scripts/build-advisor-presentation-pages-runtime.mjs

      - name: Build Pages artifact directory
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');

          const siteDir = '_site';
          fs.rmSync(siteDir, { recursive: true, force: true });
          fs.mkdirSync(siteDir, { recursive: true });

          const trackedFiles = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' })
            .split('\0')
            .filter(Boolean);

          const publicExtensions = new Set([
            '.css',
            '.html',
            '.ico',
            '.jpeg',
            '.jpg',
            '.js',
            '.json',
            '.map',
            '.png',
            '.svg',
            '.txt',
            '.webmanifest',
            '.webp'
          ]);

          const publicRootFiles = new Set([
            '.nojekyll',
            '_redirects',
            'index.html',
            'manifest.json',
            'service-worker.js'
          ]);
          const publicConversationRuntimeFiles = new Set([
            'nash-intent-engine.js',
            'nash-combat-orchestrator.js',
            'nash-next-best-action-engine.js',
            'nash-combat-intelligence-report-engine.js',
            'nash/context-intake/nash-prospect-context-intake-boundary-contract.js',
            'nash/context-intake/nash-prospect-context-intake.js',
            'nash/context-intake/nash-universal-prospect-context-consumer.js',
            'nash/conversation-brief/nash-deterministic-conversation-brief-boundary-contract.js',
            'nash/conversation-brief/nash-provider-request-contract.js',
            'nash/remote-draft-provider-client-boundary.js',
            'nash/pipeline-nash-draft-orchestrator.js',
            'nash/draft-intake/nfast06-draft-safety-boundary.js',
            'nash/draft-intake/nfast06-deterministic-draft-renderer.js',
            'manager-os/nba/nba-reason-why-boundary-contract.js',
            'manager-os/nba/nash-mick-nba-reconnection-engine.js'
          ]);

          function isPublicFile(file) {
            if (file.startsWith('.github/')) return false;
            if (file.startsWith('docs/evidence/')) return false;
            if (file.startsWith('advisor-os/sales-pipeline/')) {
              return publicExtensions.has(path.extname(file).toLowerCase());
            }
            if (publicConversationRuntimeFiles.has(file)) return true;
            if (!file.startsWith('docs/')) return publicRootFiles.has(file);
            if (file.includes('/tests/')) return false;
            if (/(^|\/)([^/]*-)?(master-)?test(s)?\.(js|json)$/i.test(file)) return false;
            if (/\.(pdf|xlsx|zip)$/i.test(file)) return false;
            if (publicRootFiles.has(file)) return true;
            return publicExtensions.has(path.extname(file).toLowerCase());
          }

          for (const file of trackedFiles.filter(isPublicFile)) {
            const publicPath = file.startsWith('docs/') ? file.slice('docs/'.length) : file;
            const target = path.join(siteDir, publicPath);
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.copyFileSync(file, target);
          }

          const legacyForgeAlivePublished = path.join(
            siteDir,
            'static-preview',
            'forge-alive',
          );
          const legacyForgeAliveRuntimeTarget = path.join(
            siteDir,
            'static-preview',
            'forge-alive-runtime',
          );

          if (!fs.existsSync(legacyForgeAlivePublished)) {
            throw new Error(
              'legacy Forge Alive public runtime was not prepared',
            );
          }

          fs.rmSync(legacyForgeAliveRuntimeTarget, {
            recursive: true,
            force: true,
          });
          fs.cpSync(
            legacyForgeAlivePublished,
            legacyForgeAliveRuntimeTarget,
            { recursive: true },
          );

          const cleanForgeAliveSource = path.join(
            'docs',
            'static-preview',
            'forge-alive-material3',
          );
          const canonicalForgeAliveTarget = path.join(
            siteDir,
            'static-preview',
            'forge-alive',
          );
          fs.rmSync(canonicalForgeAliveTarget, {
            recursive: true,
            force: true,
          });
          fs.mkdirSync(canonicalForgeAliveTarget, {
            recursive: true,
          });
          fs.cpSync(
            cleanForgeAliveSource,
            canonicalForgeAliveTarget,
            { recursive: true },
          );

          const canonicalIndexPath = path.join(canonicalForgeAliveTarget, 'index.html');
          const canonicalIndex = fs.readFileSync(canonicalIndexPath, 'utf8');
          const versionedCanonicalIndex = canonicalIndex.replace(
            /<script type="module" src="\.\/app\.js\?[^"]+"><\/script>/,
            `<script type="module" src="./app.js?v=${process.env.GITHUB_SHA}"></script>`,
          );
          if (versionedCanonicalIndex === canonicalIndex) {
            throw new Error('canonical Forge Alive app entry was not versioned');
          }
          fs.writeFileSync(canonicalIndexPath, versionedCanonicalIndex);

          for (const file of trackedFiles.filter(file => file.startsWith('docs/') && file.endsWith('.html'))) {
            const target = path.join(siteDir, file.slice('docs/'.length));
            if (!fs.existsSync(target)) continue;
            const html = fs.readFileSync(target, 'utf8').replaceAll('__FORGE_BUILD_SHA__', process.env.GITHUB_SHA);
            fs.writeFileSync(target, html);
          }

          fs.copyFileSync('env.js', path.join(siteDir, 'env.js'));
          fs.writeFileSync(
            path.join(siteDir, 'build-info.json'),
            `${JSON.stringify({
              commitSha: process.env.GITHUB_SHA,
              generatedAt: new Date().toISOString(),
              artifact: 'forge-pages',
            }, null, 2)}\n`,
          );
          console.log(`Prepared ${trackedFiles.filter(isPublicFile).length + 1} public file(s) in ${siteDir}`);
          EOF
          du -sh _site

      - name: Validate Pages public configuration artifact
        env:
          EXPECTED_DEMO_MODE: ${{ vars.DEMO_MODE || 'false' }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          node scripts/validate-pages-public-config.mjs _site/env.js
          node - <<'EOF'
          const assert = require('assert');
          const fs = require('fs');
          const path = require('path');

          const canonical = '_site/static-preview/forge-alive';
          const legacyRuntime = '_site/static-preview/forge-alive-runtime';
          const quotesRuntime = path.join(legacyRuntime, 'nueva-cotizacion/index.html');

          assert.ok(
            fs.existsSync(quotesRuntime),
            'missing published Quotes functional runtime',
          );

          for (const rootFile of ['index.html', 'service-worker.js']) {
            assert.ok(
              fs.existsSync(path.join('_site', rootFile)),
              `missing public retirement file: ${rootFile}`,
            );
          }

          const required = [
            'index.html',
            'app.css',
            'app.js',
            'legacy-ui-retirement.js',
            'pipeline-module.js',
            'pipeline-referral-modal.css',
            'quotes-module.js',
            'quotes-module.css',
            'manifest.json',
            'tokens.css',
          ];
          for (const file of required) {
            assert.ok(
              fs.existsSync(path.join(canonical, file)),
              `missing clean Forge Alive artifact: ${file}`,
            );
          }
          const requiredConversationRuntime = [
            'nash-intent-engine.js',
            'nash-combat-orchestrator.js',
            'nash-next-best-action-engine.js',
            'nash-combat-intelligence-report-engine.js',
            'nash/context-intake/nash-prospect-context-intake-boundary-contract.js',
            'nash/context-intake/nash-prospect-context-intake.js',
            'nash/context-intake/nash-universal-prospect-context-consumer.js',
            'nash/conversation-brief/nash-deterministic-conversation-brief-boundary-contract.js',
            'nash/conversation-brief/nash-provider-request-contract.js',
            'nash/remote-draft-provider-client-boundary.js',
            'nash/pipeline-nash-draft-orchestrator.js',
            'nash/draft-intake/nfast06-draft-safety-boundary.js',
            'nash/draft-intake/nfast06-deterministic-draft-renderer.js',
            'manager-os/nba/nba-reason-why-boundary-contract.js',
            'manager-os/nba/nash-mick-nba-reconnection-engine.js',
          ];
          for (const file of requiredConversationRuntime) {
            assert.ok(fs.existsSync(path.join('_site', file)), `missing governed runtime asset: ${file}`);
          }

          const rootIndex = fs.readFileSync('_site/index.html', 'utf8');
          const serviceWorker = fs.readFileSync('_site/service-worker.js', 'utf8');
          const legacyIndex = fs.readFileSync(path.join(legacyRuntime, 'index.html'), 'utf8');
          const index = fs.readFileSync(path.join(canonical, 'index.html'), 'utf8');
          const app = fs.readFileSync(path.join(canonical, 'app.js'), 'utf8');
          const quotesModule = fs.readFileSync(path.join(canonical, 'quotes-module.js'), 'utf8');
          const quotesCss = fs.readFileSync(path.join(canonical, 'quotes-module.css'), 'utf8');
          const pipelineModule = fs.readFileSync(path.join(canonical, 'pipeline-module.js'), 'utf8');
          const workspaceCss = fs.readFileSync(path.join(canonical, 'pipeline-referral-modal.css'), 'utf8');

          assert.match(rootIndex, /FORGE_LEGACY_UI_RETIRED/);
          assert.match(rootIndex, /static-preview\/forge-alive/);
          assert.match(serviceWorker, /FORGEOS_LEGACY_SERVICE_WORKER_RETIRED/);
          assert.match(serviceWorker, /self\.registration\.unregister\(\)/);
          assert.doesNotMatch(serviceWorker, /respondWith|importScripts|CACHE_CONFIG/);
          assert.match(legacyIndex, /FORGE_LEGACY_UI_RETIRED/);
          assert.doesNotMatch(legacyIndex, /Muestra segura · solo lectura|phone-shell|forge-material3-responsive-shell/);

          assert.match(quotesModule, /forge-alive-runtime\/nueva-cotizacion\/index\.html/);
          assert.match(quotesModule, /forge:quote-intake-state-change/);
          assert.match(
            quotesCss,
            /\[data-forge-quotes-runtime-host\]\s*\[hidden\][^{]*\{[^}]*display:\s*none\s*!important/s,
          );
          assert.match(
            quotesCss,
            /\.fq-file-native-105dr\s*\{[^}]*inline-size:\s*1px\s*!important[^}]*opacity:\s*0\s*!important[^}]*clip-path:\s*inset\(50%\)\s*!important/s,
          );
          assert.match(index, /tokens\.css\?v=ui-m03-approved-001/);
          assert.match(index, /app\.css\?v=ui-m03-approved-004/);
          assert.ok(
            index.includes(`app.js?v=${process.env.EXPECTED_COMMIT_SHA}`),
            'canonical app entry does not use the deployed commit SHA',
          );
          assert.match(index, /data-forge-application/);
          assert.doesNotMatch(
            index,
            /Muestra segura · solo lectura|phone-shell|forge-m3-app-shell|forge-desktop-workspace-056y|ui-material3-runtime/,
          );
          assert.match(app, /legacy-ui-retirement\.js\?v=legacy-ui-retirement-001/);
          assert.match(
            pipelineModule,
            /pipeline-referral-modal\.css\?v=ui-m06-referral-004/,
          );
          for (const selector of [
            '.referral-sheet-layer',
            '.referral-sheet',
            '.referral-sheet__body',
            '.referral-sheet__footer',
            '.nash-combat-workspace',
            '.nash-combat-workspace__body',
            '.nash-combat-workspace__footer',
            '.nba-workspace',
          ]) {
            assert.ok(
              workspaceCss.includes(selector),
              `missing productive workspace style: ${selector}`,
            );
          }

          const buildInfo = JSON.parse(
            fs.readFileSync('_site/build-info.json', 'utf8'),
          );
          assert.equal(
            buildInfo.commitSha,
            process.env.EXPECTED_COMMIT_SHA,
          );
          assert.ok(fs.existsSync('_site/env.js'));

          const forbidden = [];
          function walk(directory) {
            for (const entry of fs.readdirSync(directory, {
              withFileTypes: true,
            })) {
              const absolute = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                walk(absolute);
                continue;
              }
              const relative = path.relative('_site', absolute);
              if (
                /\.(pdf|zip|xlsx)$/i.test(relative)
                || /(^|\/)(golden|goldens)(\/|$)/i.test(relative)
                || /ForgeGemini|Design-Lock/i.test(relative)
              ) {
                forbidden.push(relative);
              }
            }
          }
          walk('_site');
          assert.deepEqual(
            forbidden,
            [],
            `private evidence published: ${forbidden.join(', ')}`,
          );

          console.log('PAGES_CLEAN_FORGE_ALIVE_ARTIFACT=PASS');
          console.log('PAGES_LEGACY_UI_RETIRED=PASS');
          console.log('PAGES_LEGACY_SERVICE_WORKER_RETIRED=PASS');
          console.log('PAGES_CANONICAL_RUNTIME_SHA_VERSIONED=PASS');
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Wait for Pages deployment lock
        run: sleep 45

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
