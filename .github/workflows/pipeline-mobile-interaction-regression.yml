name: Pipeline Mobile Interaction Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - docs/static-preview/forge-alive-material3/**
      - tests/pipeline-stage-mutation-authority-test.mjs
      - tools/pipeline-mobile-interaction-regression.mjs
      - .github/workflows/pipeline-mobile-interaction-regression.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-mobile-interaction-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify-mobile-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify stage mutation authority
        run: node --test tests/pipeline-stage-mutation-authority-test.mjs

      - name: Run existing focused Pipeline tests
        run: node --test tests/material3-pipeline-integration-test.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Vite
        shell: bash
        run: |
          nohup npm run serve:e2e > /tmp/forge-pipeline-mobile-vite.log 2>&1 &
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:4173/docs/static-preview/forge-alive-material3/ \
              > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/forge-pipeline-mobile-vite.log
            false
          fi

      - name: Click all Pipeline actions and change prospect state
        run: node tools/pipeline-mobile-interaction-regression.mjs

      - name: Upload interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-mobile-interaction-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/pipeline-mobile-interaction-regression
          if-no-files-found: error
          retention-days: 14
