name: CARTERA 020C One-Shot 00241 Resume V2

on:
  pull_request:
    branches: [main]
    types: [opened]
    paths:
      - docs/evidence/CARTERA_020C_00241_RESUME_V2_AUTHORIZATION_20260731T1810-0600.md

permissions:
  contents: read

concurrency:
  group: cartera-020c-one-shot-00241-resume-v2
  cancel-in-progress: false

jobs:
  harden-and-resume:
    if: >-
      github.repository == 'Jorgeprdz/ForgeOS' &&
      github.event.action == 'opened' &&
      github.event.pull_request.head.ref == 'run/cartera-020c-00241-resume-v2-20260731-1810' &&
      github.event.pull_request.head.sha == 'a7f3e40c25202c7bbd6eddd1435b31ac84a4f183' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARTERA_020C_REMOTE_MUTATION_AUTHORIZED: YES:CARTERA_020C_REMOTE_MUTATION
      CARTERA_020C_EXPECTED_SOURCE_HEAD: 0daaccd556659b997f2086e12b09481281d1b019
      CARTERA_020C_EXPECTED_ACCEPTANCE_HEAD: ecc54132e11cf96004859d2483238fe187857dd6
      CARTERA_020C_ACCEPTANCE_BRANCH: feature/cartera-020c-remote-acceptance
      SUPABASE_PROJECT_REF: rmlxigxysujsuwzgoimv
      AUTHORIZATION_MARKER: docs/evidence/CARTERA_020C_00241_RESUME_V2_AUTHORIZATION_20260731T1810-0600.md

    steps:
      - name: Checkout exact V2 authorization
        uses: actions/checkout@v4
        with:
          ref: a7f3e40c25202c7bbd6eddd1435b31ac84a4f183
          fetch-depth: 0

      - name: Validate exact V2 authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_HEAD_REF" = 'run/cartera-020c-00241-resume-v2-20260731-1810'
          test -f "$AUTHORIZATION_MARKER"
          grep -qx 'USER_AUTHORIZATION=APPLY_00241_AND_RESUME_CARTERA_020C_REMOTE_ACCEPTANCE_V2' "$AUTHORIZATION_MARKER"
          grep -qx 'PRIOR_RUN=30674771423' "$AUTHORIZATION_MARKER"
          grep -qx 'PRIOR_FAILURE=LOCAL_TEST_DOUBLE_ESCAPED_REGEX' "$AUTHORIZATION_MARKER"
          grep -qx 'RESUME_ACCEPTANCE_HEAD=ecc54132e11cf96004859d2483238fe187857dd6' "$AUTHORIZATION_MARKER"
          grep -qx 'HARDENING_MIGRATION=20260731000241' "$AUTHORIZATION_MARKER"
          test "$(git diff --name-only HEAD^ HEAD)" = "$AUTHORIZATION_MARKER"
          echo 'ONE_SHOT_00241_RESUME_V2_AUTHORIZATION=PASS'

      - name: Checkout corrected 00241 acceptance head
        uses: actions/checkout@v4
        with:
          ref: ecc54132e11cf96004859d2483238fe187857dd6
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repository gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CARTERA_020C_EXPECTED_ACCEPTANCE_HEAD"
          git merge-base --is-ancestor "$CARTERA_020C_EXPECTED_SOURCE_HEAD" HEAD
          node --check scripts/ci/cartera-020c-conflict-persistence-hardening-deploy.mjs
          node --check scripts/ci/cartera-020c-github-actions-remote-acceptance.mjs
          node --test tests/cartera-020c-*.mjs
          echo 'CARTERA020C_00241_REPOSITORY_GATE=PASS'

      - name: Verify 00240 and apply 00241
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          mkdir -p artifacts/cartera-020c-remote-acceptance
          node scripts/ci/cartera-020c-conflict-constraint-name-hardening-deploy.mjs \
            | tee artifacts/cartera-020c-remote-acceptance/conflict-constraint-name-hardening-output.log
          grep -q 'MIGRATION_20260731000240=ALREADY_APPLIED_AND_MATCHED' artifacts/cartera-020c-remote-acceptance/conflict-constraint-name-hardening-output.log
          grep -q 'CARTERA020C_CONFLICT_CONSTRAINT_NAME_HARDENING=PASS' artifacts/cartera-020c-remote-acceptance/conflict-constraint-name-hardening-output.log
          node scripts/ci/cartera-020c-conflict-persistence-hardening-deploy.mjs \
            | tee artifacts/cartera-020c-remote-acceptance/conflict-persistence-hardening-output.log
          grep -q 'CARTERA020C_CONFLICT_PERSISTENCE_RECEIPT_HARDENING=PASS' artifacts/cartera-020c-remote-acceptance/conflict-persistence-hardening-output.log

      - name: Resume transactional remote acceptance
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          GITHUB_SHA="$CARTERA_020C_EXPECTED_ACCEPTANCE_HEAD" node scripts/ci/cartera-020c-github-actions-remote-acceptance.mjs \
            | tee artifacts/cartera-020c-remote-acceptance/workflow-output.log

      - name: Verify acceptance markers
        shell: bash
        run: |
          set -euo pipefail
          log=artifacts/cartera-020c-remote-acceptance/workflow-output.log
          for marker in \
            CARTERA_020C_REMOTE_DEPLOYMENT=PASS \
            AUTHORIZATION_DIGEST_COMPATIBILITY=PASS \
            CARTERA_020C_TRANSACTIONAL_ACCEPTANCE=PASS \
            AUTHORIZATION_DIGEST_BINDING=PASS \
            IDENTITY_ORDERED_EXECUTION=PASS \
            IDENTITY_READ_AFTER_WRITE=PASS \
            POLICY_READ_AFTER_WRITE=PASS \
            CHANGED_INPUT_CONFLICT=PASS \
            RETRY_GOVERNANCE=PASS \
            PARALLEL_STATE_VERSION_SERIALIZATION=PASS \
            RLS_CROSS_ADVISOR=PASS \
            DIRECT_WRITES=BLOCKED \
            SANITIZED_STATUS=PASS \
            TEST_FIXTURES_ROLLED_BACK=YES \
            CONCURRENCY_FIXTURES_CLEANED=YES \
            RESIDUAL_FIXTURES=0 \
            CARTERA_020C_REMOTE_ACCEPTANCE=PASS; do
            grep -q "$marker" "$log"
          done

      - name: Upload V2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartera-020c-remote-acceptance-00241-resume-v2
          path: artifacts/cartera-020c-remote-acceptance
          if-no-files-found: warn
          retention-days: 30
