name: One-Shot M05L Cache Key

on:
  push:
    branches:
      - hotfix/material3-shell-cache-key
    paths:
      - .github/workflows/one-shot-m05l-cache-key.yml

permissions:
  contents: write

concurrency:
  group: one-shot-m05l-cache-key
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'Jorgeprdz/ForgeOS'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/material3-shell-cache-key
          fetch-depth: 0

      - name: Replace only the Material 3 app cache key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/static-preview/forge-alive-material3/index.html')
          text = path.read_text(encoding='utf-8')
          old = './app.js?v=ui-m04-shell-008&fix=pipeline-google-calendar-001'
          new = './app.js?v=ui-m05l-shell-route-first-001'
          if text.count(old) != 1:
              raise SystemExit(f'UNEXPECTED_OLD_CACHE_KEY_COUNT:{text.count(old)}')
          if new in text:
              raise SystemExit('NEW_CACHE_KEY_ALREADY_PRESENT')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          grep -Fq './app.js?v=ui-m05l-shell-route-first-001' \
            docs/static-preview/forge-alive-material3/index.html
          test "$(git diff --name-only)" = \
            'docs/static-preview/forge-alive-material3/index.html'
          git diff --check

      - name: Remove one-shot workflow and push result
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-m05l-cache-key.yml
          git config user.name 'forge-ui-hotfix'
          git config user.email 'forge-ui-hotfix@users.noreply.github.com'
          git add docs/static-preview/forge-alive-material3/index.html
          git commit -m 'fix(ui): bust cached shell bootstrap after M05L'
          git push origin HEAD:hotfix/material3-shell-cache-key
