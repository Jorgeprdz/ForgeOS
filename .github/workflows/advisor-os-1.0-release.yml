name: Advisor OS 1.0 Release

on:
  pull_request:
    branches: [main]
    paths:
      - 'release/advisor-os-1.0.0.json'
      - 'docs/releases/ADVISOR_OS_1_0_**'
      - 'docs/evidence/ADVISOR_OS_1_0_**'
      - 'tests/advisor-os-sprint-12-release-test.mjs'
      - 'tests/e2e/advisor-os-1.0-release-public.spec.mjs'
      - 'playwright.advisor-os-1.0-release.config.mjs'
      - '.github/workflows/advisor-os-1.0-release.yml'
  push:
    branches: [main]
    paths:
      - 'release/advisor-os-1.0.0.json'
      - 'docs/releases/ADVISOR_OS_1_0_**'
      - 'docs/evidence/ADVISOR_OS_1_0_**'
      - 'tests/advisor-os-sprint-12-release-test.mjs'
      - 'tests/e2e/advisor-os-1.0-release-public.spec.mjs'
      - 'playwright.advisor-os-1.0-release.config.mjs'
      - '.github/workflows/advisor-os-1.0-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: advisor-os-1.0-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release syntax and manifest
        run: |
          node --check tests/advisor-os-sprint-12-release-test.mjs
          node --check tests/e2e/advisor-os-1.0-release-public.spec.mjs
          node --check playwright.advisor-os-1.0-release.config.mjs
          node --test tests/advisor-os-sprint-12-release-test.mjs

      - name: Benvenu Command Bar and low-friction input
        run: |
          node --test tests/command-os-pack-08-test.mjs
          node --test tests/command-os-pack-09-test.mjs

      - name: Sprint 03 through Sprint 11 contracts
        run: |
          node --test tests/sprint-03-next-action-agenda-test.mjs
          node --test tests/advisor-os-sprint-04-test.mjs
          node --test tests/advisor-os-sprint-05-test.mjs
          node --test tests/advisor-os-sprint-06-test.mjs
          node --test tests/advisor-os-sprint-07-test.mjs
          node --test tests/advisor-os-sprint-08-test.mjs
          node --test tests/advisor-os-sprint-09-test.mjs
          node --test tests/advisor-os-sprint-10-test.mjs
          node --test tests/advisor-os-sprint-11-test.mjs

      - name: Auth session printable and integrated regressions
        run: |
          node --test tests/authenticated-route-guard-test.mjs
          node --test tests/public-auth-required-login-gate-test.mjs
          node --test tests/authenticated-session-controls-test.mjs
          node --test tests/rep-17-unified-runtime-regression-test.mjs
          node --test advisor-os/quotes/tests/quote-printable-productive-route-controller-test.js
          node --test advisor-os/quotes/tests/quote-printable-browser-binding-test.js

      - name: Build canonical Pages candidate
        env:
          FORGE_PAGES_RUNTIME: 'true'
        run: |
          node scripts/build-advisor-presentation-pages-runtime.mjs
          node --test tests/rep-16f-pages-runtime-generator-test.mjs
          node --test tests/pages-public-demo-runtime-closure-test.mjs

      - name: Critical and high defect gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          critical=$(gh api search/issues -f q="repo:${GITHUB_REPOSITORY} is:issue is:open label:critical" --jq '.total_count')
          high=$(gh api search/issues -f q="repo:${GITHUB_REPOSITORY} is:issue is:open label:high" --jq '.total_count')
          echo "CRITICAL_DEFECTS=$critical"
          echo "HIGH_DEFECTS=$high"
          test "$critical" = "0"
          test "$high" = "0"

      - name: Release safety scan
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"version": "1.0.0"' release/advisor-os-1.0.0.json
          grep -q 'ADVISOR_OS_1_0=COMPLETE' docs/evidence/ADVISOR_OS_1_0_RELEASE_ACCEPTANCE_CERTIFICATE.md
          grep -q 'CRITICAL_DEFECTS=0' docs/evidence/ADVISOR_OS_1_0_RELEASE_ACCEPTANCE_CERTIFICATE.md
          grep -q 'HIGH_DEFECTS=0' docs/evidence/ADVISOR_OS_1_0_RELEASE_ACCEPTANCE_CERTIFICATE.md
          grep -q 'UNKNOWN_AS_ZERO=0' docs/evidence/ADVISOR_OS_1_0_RELEASE_ACCEPTANCE_CERTIFICATE.md
          git diff --check

  current-public-candidate:
    if: github.event_name == 'pull_request'
    needs: release-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate current canonical deployment matches release base
        env:
          FORGE_EXPECTED_RELEASE_SHA: 0974378c699b513f4800e6eec2d88acb05a076c4
          FORGE_RELEASE_URL: https://jorgeprdz.github.io/ForgeOS/static-preview/forge-alive/
          FORGE_BUILD_INFO_URL: https://jorgeprdz.github.io/ForgeOS/build-info.json
        run: npx playwright test --config=playwright.advisor-os-1.0-release.config.mjs

  finalize-release:
    if: github.event_name != 'pull_request'
    needs: release-contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout final main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for exact canonical Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          url='https://jorgeprdz.github.io/ForgeOS/build-info.json'
          for attempt in $(seq 1 90); do
            deployed=$(curl -fsSL -H 'Cache-Control: no-cache' "${url}?release=${GITHUB_SHA}-${attempt}" | jq -r '.commitSha // empty' || true)
            echo "attempt=$attempt deployed=$deployed expected=$GITHUB_SHA"
            if [ "$deployed" = "$GITHUB_SHA" ]; then
              exit 0
            fi
            sleep 15
          done
          echo 'Canonical Pages did not publish the release SHA.' >&2
          exit 1

      - name: Canonical public browser acceptance
        env:
          FORGE_EXPECTED_RELEASE_SHA: ${{ github.sha }}
          FORGE_RELEASE_URL: https://jorgeprdz.github.io/ForgeOS/static-preview/forge-alive/
          FORGE_BUILD_INFO_URL: https://jorgeprdz.github.io/ForgeOS/build-info.json
        run: npx playwright test --config=playwright.advisor-os-1.0-release.config.mjs

      - name: Generate final machine certificate
        shell: bash
        run: |
          cat > advisor-os-1.0.0-release-certificate.txt <<EOF
          PRODUCT=ADVISOR_OS
          VERSION=1.0.0
          TAG=advisor-os-v1.0.0
          RELEASE_SHA=${GITHUB_SHA}
          CANONICAL_URL=https://jorgeprdz.github.io/ForgeOS/static-preview/forge-alive/
          CANONICAL_BUILD_SHA=${GITHUB_SHA}
          CRITICAL_DEFECTS=0
          HIGH_DEFECTS=0
          UNAPPROVED_MUTATIONS=0
          UNKNOWN_AS_ZERO=0
          PUBLIC_ASSET_OVERRIDES=0
          ADVISOR_OS_1_0=COMPLETE
          EOF
          sha256sum advisor-os-1.0.0-release-certificate.txt > advisor-os-1.0.0-release-certificate.sha256

      - name: Create immutable tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: advisor-os-v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" "$GITHUB_SHA" -m 'Advisor OS 1.0.0'
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" advisor-os-1.0.0-release-certificate.txt advisor-os-1.0.0-release-certificate.sha256 --clobber
          else
            gh release create "$TAG" \
              --verify-tag \
              --title 'Advisor OS 1.0.0' \
              --notes-file docs/evidence/ADVISOR_OS_1_0_RELEASE_ACCEPTANCE_CERTIFICATE.md \
              advisor-os-1.0.0-release-certificate.txt \
              advisor-os-1.0.0-release-certificate.sha256
          fi

      - name: Upload release certificate artifact
        uses: actions/upload-artifact@v4
        with:
          name: advisor-os-1.0.0-release-certificate
          path: |
            advisor-os-1.0.0-release-certificate.txt
            advisor-os-1.0.0-release-certificate.sha256
          if-no-files-found: error
