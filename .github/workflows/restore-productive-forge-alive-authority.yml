name: Guard Canonical Forge Alive Authority

on:
  pull_request:
    paths:
      - ".github/workflows/restore-productive-forge-alive-authority.yml"
      - "tests/restore-productive-canonical-authority-test.mjs"
      - ".github/workflows/pages.yml"
      - ".github/workflows/pages-beta1-live-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate productive canonical authority contract
        run: node --test tests/restore-productive-canonical-authority-test.mjs
