name: Restore Productive Forge Alive Authority

on:
  pull_request:
    paths:
      - ".github/workflows/restore-productive-forge-alive-authority.yml"
      - "scripts/prepare-productive-canonical-pages.mjs"
      - "tests/restore-productive-canonical-authority-test.mjs"
  workflow_run:
    workflows:
      - "Deploy ForgeOS to GitHub Pages"
    types:
      - completed

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate productive canonical authority contract
        run: node --test tests/restore-productive-canonical-authority-test.mjs

  republish:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Download original Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          artifact_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' \
              | head -n 1
          )"
          if [ -z "$artifact_id" ]; then
            echo "PAGES_ARTIFACT_NOT_FOUND for run ${SOURCE_RUN_ID}"
            exit 1
          fi
          mkdir -p /tmp/forge-pages-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > /tmp/forge-pages-artifact.zip
          unzip -q /tmp/forge-pages-artifact.zip -d /tmp/forge-pages-artifact
          tar_file="$(find /tmp/forge-pages-artifact -type f -name '*.tar' -print -quit)"
          if [ -z "$tar_file" ]; then
            echo "PAGES_TAR_NOT_FOUND in downloaded artifact"
            find /tmp/forge-pages-artifact -maxdepth 3 -type f -print
            exit 1
          fi
          rm -rf _site
          mkdir -p _site
          tar -xf "$tar_file" -C _site

      - name: Restore productive canonical surface
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node scripts/prepare-productive-canonical-pages.mjs \
            _site \
            "${GITHUB_SHA}"

      - name: Validate final canonical artifact
        run: |
          set -euo pipefail
          canonical="_site/static-preview/forge-alive"
          test -f "${canonical}/index.html"
          test -f "${canonical}/productive-authority.json"
          grep -q "Forge Alive Vista Estática" "${canonical}/index.html"
          grep -q "forge-alive-auth-entry-067g17b1.js" "${canonical}/index.html"
          grep -q "phone-shell" "${canonical}/index.html"
          ! grep -q "forge-alive-material3" "${canonical}/index.html"
          ! grep -q "FORGE_CANONICAL_ENTRY_BRIDGE" "${canonical}/index.html"
          node - <<'EOF'
          const fs = require('fs');
          const authority = JSON.parse(
            fs.readFileSync(
              '_site/static-preview/forge-alive/productive-authority.json',
              'utf8',
            ),
          );
          if (authority.authority !== 'FORGE_ALIVE_PRODUCTIVE_CANONICAL') {
            throw new Error('PRODUCTIVE_AUTHORITY_INVALID');
          }
          if (authority.material3Canonical !== false) {
            throw new Error('MATERIAL3_STILL_CANONICAL');
          }
          EOF

      - name: Upload corrected Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy corrected Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
