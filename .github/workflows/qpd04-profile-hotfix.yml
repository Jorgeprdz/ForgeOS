name: QPD-04 Profile Hotfix

on:
  push:
    branches:
      - feature/quote-printable-document-closure
    paths:
      - ".github/workflows/qpd04-profile-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quote-printable-document-closure
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Patch canonical SeguBeca mapping
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("advisor-os/quotes/printable/quote-printable-product-profile.js")
          source = path.read_text()

          anchor = '''  deductible: fieldDefinition(
'''
          insertion = '''  contractorProtectionCoverages: fieldDefinition(
    "contractor_protection_coverages",
    "Protección del contratante",
    [
      candidate("calculation", "contractorProtectionCoverages", AUTHORITIES.CALCULATION),
      candidate("calculation", "optionalCoverages", AUTHORITIES.CALCULATION),
      candidate("acceptedQuote", "optionalCoverages", AUTHORITIES.QUOTE),
      candidate("acceptedQuote", "nativeResult.recommendedCoverages", AUTHORITIES.QUOTE),
      candidate("acceptedQuote", "nativeResult.contractorProtectionCoverages", AUTHORITIES.QUOTE),
      candidate("acceptedQuote", "nativeResult.coverages", AUTHORITIES.QUOTE),
      candidate("productIntelligence", "education.contractor_protection_coverages", AUTHORITIES.PRODUCT),
    ],
  ),
  deductible: fieldDefinition(
'''
          if anchor not in source:
              raise SystemExit("deductible insertion anchor missing")
          source = source.replace(anchor, insertion, 1)

          old = '''      section("contractor_protection", "Protección del contratante", [
        "current_protection_mxn",
        "optional_coverages",
      ]),
'''
          new = '''      section("contractor_protection", "Protección del contratante", [
        "current_protection_mxn",
        "contractor_protection_coverages",
      ]),
'''
          if old not in source:
              raise SystemExit("SeguBeca section anchor missing")
          source = source.replace(old, new, 1)
          path.write_text(source)
          PY

      - name: Validate QPD contracts
        run: |
          node --check advisor-os/quotes/printable/quote-printable-product-profile.js
          node advisor-os/quotes/tests/quote-printable-product-profile-master-test.js
          git diff --check

      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/qpd04-profile-hotfix.yml
          git config user.name "Forge QPD Bot"
          git config user.email "actions@users.noreply.github.com"
          git add advisor-os/quotes/printable/quote-printable-product-profile.js .github/workflows/qpd04-profile-hotfix.yml
          git commit -m "fix(quotes): map SeguBeca contractor protection source"
          git push origin HEAD:feature/quote-printable-document-closure
