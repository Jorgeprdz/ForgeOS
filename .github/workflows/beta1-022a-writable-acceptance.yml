name: BETA1 022A Writable Acceptance

on:
  push:
    branches:
      - audit/beta1-020-productive-workspaces
    paths:
      - .github/workflows/beta1-022a-writable-acceptance.yml
      - scripts/deploy-beta1-022a-migration.mjs
      - scripts/seed-beta1-022a-acceptance-dataset.mjs
      - scripts/verify-beta1-022a-acceptance.mjs
      - supabase/functions/forge-demo-admin/index.ts
      - supabase/migrations/20260803000001_cartera010b_atomic_policy_entry_wrapper.sql
      - tests/beta1-022-policy-persistence-contract-test.mjs
      - tests/beta1-022a-synthetic-dataset-contract-test.mjs
  workflow_dispatch:
    inputs:
      run_id:
        description: Stable evidence RUN_ID (YYYYMMDD_HHMMSS)
        required: true
        type: string
      validated_sha:
        description: Exact SHA; leave empty for original BETA1 022A
        required: false
        default: ''
        type: string
      acceptance_phase:
        description: Remote acceptance route
        required: false
        default: CONTACT_BOOKS_001
        type: choice
        options:
          - CONTACT_BOOKS_001
          - BETA1_022B
          - CARTERA_PIPELINE_IDENTITY_005B_R1

permissions:
  contents: read

concurrency:
  group: beta1-022a-writable-acceptance
  cancel-in-progress: false

jobs:
  validate-seed-and-seal:
    if: github.event_name == 'workflow_dispatch' && inputs.validated_sha == '' && inputs.acceptance_phase != 'CARTERA_PIPELINE_IDENTITY_005B_R1'
    runs-on: ubuntu-24.04
    environment: 067g17a1-remote-acceptance
    env:
      SUPABASE_PROJECT_REF: rmlxigxysujsuwzgoimv
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ADVISOR_A_EMAIL: ${{ secrets.ADVISOR_A_EMAIL }}
      ADVISOR_A_PASSWORD: ${{ secrets.ADVISOR_A_PASSWORD }}
      ADVISOR_B_EMAIL: ${{ secrets.ADVISOR_B_EMAIL }}
      ADVISOR_B_PASSWORD: ${{ secrets.ADVISOR_B_PASSWORD }}
      FORGE_BETA1022A_RUN_ID: ${{ inputs.run_id || '20260803_213631' }}
      FORGE_BETA1022A_EVIDENCE: artifacts/beta1-022a/dataset-seed-report.json
      FORGE_BETA1022A_VERIFY_EVIDENCE: artifacts/beta1-022a/remote-verification.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Local gates
        run: |
          node --check scripts/deploy-beta1-022a-migration.mjs
          node --check scripts/seed-beta1-022a-acceptance-dataset.mjs
          node --check scripts/verify-beta1-022a-acceptance.mjs
          node --test tests/beta1-022-policy-persistence-contract-test.mjs tests/beta1-022a-synthetic-dataset-contract-test.mjs tests/login-integrated-demo-tenants-test.mjs
      - name: Deploy exact additive atomic wrapper
        run: node scripts/deploy-beta1-022a-migration.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Configure one-run demo controller
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "FORGE_DEMO_ADMIN_TOKEN=$token" >> "$GITHUB_ENV"
          supabase secrets set FORGE_DEMO_ADVISOR_A_EMAIL="$ADVISOR_A_EMAIL" FORGE_DEMO_ADVISOR_B_EMAIL="$ADVISOR_B_EMAIL" FORGE_DEMO_ADMIN_TOKEN="$token" --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy forge-demo-admin --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Open controlled synthetic window
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/forge-demo-admin" -H "Content-Type: application/json" -H "x-forge-demo-admin-token: ${FORGE_DEMO_ADMIN_TOKEN}" --data '{"action":"PREPARE"}' > /tmp/prepare.json
          node -e "const p=require('/tmp/prepare.json');if(p.ok!==true||p.accountsUnlocked!==2)throw Error('PREPARE_FAILED')"
          rm -f /tmp/prepare.json
      - name: Seed through authenticated A/B product authorities
        run: node scripts/seed-beta1-022a-acceptance-dataset.mjs
      - name: Seal A/B regardless of prior result
        if: always() && env.FORGE_DEMO_ADMIN_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/forge-demo-admin" -H "Content-Type: application/json" -H "x-forge-demo-admin-token: ${FORGE_DEMO_ADMIN_TOKEN}" --data '{"action":"SEAL"}' > /tmp/seal.json
          node -e "const p=require('/tmp/seal.json');if(p.ok!==true||p.accountsSealed!==2)throw Error('SEAL_FAILED')"
          rm -f /tmp/seal.json
      - name: Verify reload, isolation and read-only seal
        run: node scripts/verify-beta1-022a-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta1-022a-${{ inputs.run_id }}
          path: artifacts/beta1-022a/
          if-no-files-found: error

  contact-books-remote-acceptance:
    if: inputs.validated_sha != '' && inputs.acceptance_phase != 'BETA1_022B' && inputs.acceptance_phase != 'CARTERA_PIPELINE_IDENTITY_005B_R1'
    uses: ./.github/workflows/contact-books-001-remote-acceptance.yml
    with:
      validated_sha: ${{ inputs.validated_sha }}
      run_id: ${{ inputs.run_id }}
    secrets: inherit

  compensation-remote-acceptance:
    if: inputs.validated_sha != '' && inputs.acceptance_phase == 'BETA1_022B'
    uses: ./.github/workflows/beta1-022b-compensation-remote-acceptance.yml
    with:
      validated_sha: ${{ inputs.validated_sha }}
      run_id: ${{ inputs.run_id }}
    secrets: inherit

  cartera-pipeline-identity-005b-r1:
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance_phase == 'CARTERA_PIPELINE_IDENTITY_005B_R1' && github.ref_name == 'accept/cartera-pipeline-identity-productive-005b' && github.actor == 'Jorgeprdz' && inputs.validated_sha == github.sha
    uses: ./.github/workflows/cartera-pipeline-identity-005b-r1.yml
    with:
      run_id: ${{ inputs.run_id }}
    secrets: inherit
