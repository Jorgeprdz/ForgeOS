name: Cartera 050 Current Main Promotion

on:
  pull_request:
    branches:
      - main
    paths:
      - "advisor-os/cartera/cartera-050a-future-radar-service.js"
      - "platform/portfolio-intelligence/cartera-050-business-calendar-date.js"
      - "platform/portfolio-intelligence/cartera-050a-future-radar-projection.js"
      - "platform/portfolio-intelligence/cartera-050c-authority-adapters.js"
      - "platform/portfolio-intelligence/cartera-050d-future-radar-view.js"
      - "supabase/migrations/20260801000280_cartera050_future_radar_helpers.sql"
      - "supabase/migrations/20260801000281_cartera050_future_radar_read.sql"
      - "supabase/migrations/20260814012819_post017e_hotfix001_policy_role_correction_authority.sql"
      - "tests/cartera-050*.mjs"
      - "tests/cartera-radar-truth-hotfix-001-test.mjs"
      - "tests/e2e/cartera-radar-hotfix-001.spec.mjs"
      - "playwright.cartera-radar-hotfix-001.config.mjs"
      - "scripts/ci/cartera-050-current-main-remote-verification.mjs"
      - ".github/workflows/cartera-050-current-main-promotion.yml"
  push:
    branches:
      - main
    paths:
      - "advisor-os/cartera/cartera-050a-future-radar-service.js"
      - "platform/portfolio-intelligence/cartera-050-business-calendar-date.js"
      - "platform/portfolio-intelligence/cartera-050a-future-radar-projection.js"
      - "platform/portfolio-intelligence/cartera-050c-authority-adapters.js"
      - "platform/portfolio-intelligence/cartera-050d-future-radar-view.js"
      - "supabase/migrations/20260801000280_cartera050_future_radar_helpers.sql"
      - "supabase/migrations/20260801000281_cartera050_future_radar_read.sql"
      - "supabase/migrations/20260814012819_post017e_hotfix001_policy_role_correction_authority.sql"
      - "tests/cartera-050*.mjs"
      - "tests/cartera-radar-truth-hotfix-001-test.mjs"
      - "tests/e2e/cartera-radar-hotfix-001.spec.mjs"
      - "playwright.cartera-radar-hotfix-001.config.mjs"
      - "scripts/ci/cartera-050-current-main-remote-verification.mjs"
      - ".github/workflows/cartera-050-current-main-promotion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartera-050-current-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate promoted authority syntax
        run: |
          node --check advisor-os/cartera/cartera-050a-future-radar-service.js
          node --check platform/portfolio-intelligence/cartera-050-business-calendar-date.js
          node --check platform/portfolio-intelligence/cartera-050a-future-radar-projection.js
          node --check platform/portfolio-intelligence/cartera-050c-authority-adapters.js
          node --check platform/portfolio-intelligence/cartera-050d-future-radar-view.js
          node --check playwright.cartera-radar-hotfix-001.config.mjs
          node --check scripts/ci/cartera-050-current-main-remote-verification.mjs

      - name: Cartera 050 authority contracts
        run: |
          node --test tests/cartera-050a-future-radar-projection-test.mjs
          node --test tests/cartera-050a-future-radar-service-test.mjs
          node --test tests/cartera-050c-authority-adapters-test.mjs
          node --test tests/cartera-050d-future-radar-view-test.mjs
          node --test tests/cartera-050ab-sql-contract-test.mjs
          node --test tests/cartera-radar-truth-hotfix-001-test.mjs

      - name: Current main runtime regressions
        run: |
          node --test tests/rep-17-unified-runtime-regression-test.mjs
          node --test tests/ui-m05l-shell-route-first-test.mjs
          node --test tests/ui-m05n-public-config-boot-order-test.mjs
          node --test tests/pipeline-stage-rpc-authority-regression.mjs
          node --test advisor-os/quotes/tests/quote-printable-productive-route-controller-test.js
          node --test advisor-os/quotes/tests/quote-printable-browser-binding-test.js

      - name: Install browser acceptance runtime
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Desktop DeX Mobile Radar acceptance
        run: npx playwright test --config=playwright.cartera-radar-hotfix-001.config.mjs

      - name: Pages runtime remains generatable
        env:
          FORGE_PAGES_RUNTIME: "true"
        run: |
          node scripts/build-advisor-presentation-pages-runtime.mjs
          node --test tests/rep-16f-pages-runtime-generator-test.mjs

      - name: Enforce selective promotion boundary
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.ref == 'integration/cartera-050-current-main'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > /tmp/cartera-050-promotion-files.txt
          cat /tmp/cartera-050-promotion-files.txt
          while IFS= read -r file; do
            case "$file" in
              advisor-os/cartera/cartera-050a-future-radar-service.js|\
              platform/portfolio-intelligence/cartera-050-business-calendar-date.js|\
              platform/portfolio-intelligence/cartera-050a-future-radar-projection.js|\
              platform/portfolio-intelligence/cartera-050c-authority-adapters.js|\
              platform/portfolio-intelligence/cartera-050d-future-radar-view.js|\
              supabase/migrations/20260801000280_cartera050_future_radar_helpers.sql|\
              supabase/migrations/20260801000281_cartera050_future_radar_read.sql|\
              supabase/migrations/20260814012819_post017e_hotfix001_policy_role_correction_authority.sql|\
              tests/cartera-050a-future-radar-projection-test.mjs|\
              tests/cartera-050a-future-radar-service-test.mjs|\
              tests/cartera-050c-authority-adapters-test.mjs|\
              tests/cartera-050d-future-radar-view-test.mjs|\
              tests/cartera-050ab-sql-contract-test.mjs|\
              tests/cartera-radar-truth-hotfix-001-test.mjs|\
              tests/e2e/cartera-radar-hotfix-001.spec.mjs|\
              playwright.cartera-radar-hotfix-001.config.mjs|\
              scripts/ci/cartera-050-current-main-remote-verification.mjs|\
              .github/workflows/cartera-050-current-main-promotion.yml)
                ;;
              *)
                echo "Unexpected promotion path: $file"
                exit 1
                ;;
            esac
          done < /tmp/cartera-050-promotion-files.txt
          ! grep -Eq '^(app\.js|cartera\.js|docs/static-preview/forge-alive-material3/app\.js|docs/static-preview/forge-alive-material3/home-module\.js)$' \
            /tmp/cartera-050-promotion-files.txt
          git diff --check "$BASE_SHA...$HEAD_SHA"

  remote-verify:
    needs: validate
    if: >-
      github.actor == 'Jorgeprdz' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: rmlxigxysujsuwzgoimv
    steps:
      - name: Checkout accepted source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify existing remote Cartera 050 authority
        run: node scripts/ci/cartera-050-current-main-remote-verification.mjs

      - name: Ensure evidence exists
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cartera-050-current-main
          if [ ! -s artifacts/cartera-050-current-main/verification.json ]; then
            printf '%s\n' \
              '{"status":"FAIL","detail":"REMOTE_VERIFICATION_EVIDENCE_NOT_CREATED"}' \
              > artifacts/cartera-050-current-main/verification.json
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartera-050-current-main-verification
          path: artifacts/cartera-050-current-main/verification.json
          if-no-files-found: error
          retention-days: 30
