name: CARTERA 030C + 030D Combined Acceptance

on:
  pull_request:
    branches:
      - feature/cartera-030b-expected-payment-obligation-ledger-calendar
    types:
      - opened

permissions:
  contents: write

concurrency:
  group: cartera-030cd-combined-acceptance
  cancel-in-progress: false

jobs:
  combined-delivery:
    if: >-
      github.repository == 'Jorgeprdz/ForgeOS' &&
      github.event.pull_request.head.repo.full_name == 'Jorgeprdz/ForgeOS' &&
      github.event.pull_request.head.ref == 'feature/cartera-030cd-payment-reconciliation-calendar-product' &&
      github.event.pull_request.base.ref == 'feature/cartera-030b-expected-payment-obligation-ledger-calendar' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: rmlxigxysujsuwzgoimv
      CARTERA_030CD_REMOTE_MUTATION_AUTHORIZED: YES:CARTERA_030CD_REMOTE_MUTATION
      CARTERA_030CD_EXPECTED_SOURCE_HEAD: f8900c7b2e2ff1d73fd5f6c2b54e145af010282b
      CARTERA_030CD_ACCEPTANCE_BRANCH: feature/cartera-030cd-payment-reconciliation-calendar-product

    steps:
      - name: Checkout exact combined branch
        uses: actions/checkout@v4
        with:
          ref: feature/cartera-030cd-payment-reconciliation-calendar-product
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize bounded 030C migration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cartera-030cd-remote-acceptance
          echo 'CARTERA_030CD_WORKFLOW=STARTED' > artifacts/cartera-030cd-remote-acceptance/bootstrap.log
          target=supabase/migrations/20260801000260_cartera030c_confirmed_payment_event_reconciliation.sql
          if [[ -e "$target" ]]; then
            test ! -d .forge-bootstrap
            test "$(wc -c < "$target")" -eq 23188
            grep -q 'forge_cartera030c_record_and_reconcile_confirmed_payment' "$target"
            echo "CARTERA_030CD_ACCEPTANCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            echo 'CARTERA_030C_MIGRATION=ALREADY_MATERIALIZED'
          else
            test -f .forge-bootstrap/m260.00.b64
            test -f .forge-bootstrap/m260.01.b64
            test -f .forge-bootstrap/m260.02.b64
            test -f .forge-bootstrap/m260.03.b64
            cat .forge-bootstrap/m260.00.b64 \
                .forge-bootstrap/m260.01.b64 \
                .forge-bootstrap/m260.02.b64 \
                .forge-bootstrap/m260.03.b64 \
              | base64 --decode > "$target"
            test "$(wc -c < "$target")" -eq 23188
            grep -q 'forge_cartera030c_record_and_reconcile_confirmed_payment' "$target"
            rm -rf .forge-bootstrap
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$target"
            git add -u .forge-bootstrap
            git commit -m 'feat(cartera): materialize 030C confirmed payment migration'
            git push origin HEAD:feature/cartera-030cd-payment-reconciliation-calendar-product
            echo "CARTERA_030CD_ACCEPTANCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            echo 'CARTERA_030C_MIGRATION=MATERIALIZED'
          fi

      - name: Verify combined scope and bounded paths
        shell: bash
        run: |
          set -euo pipefail
          source=f8900c7b2e2ff1d73fd5f6c2b54e145af010282b
          git merge-base --is-ancestor "$source" HEAD
          git diff --check "$source"...HEAD
          mapfile -t changed < <(git diff --name-only "$source"...HEAD)
          printf 'CHANGED_FILE=%s\n' "${changed[@]}"
          allowed='^(app\.js|advisor-os/cartera/cartera-030[cd]-[A-Za-z0-9._-]+\.js|platform/policy-intelligence/calendar/cartera-030d-[A-Za-z0-9._-]+\.js|supabase/migrations/2026080100026[01]_cartera030[cd]_[A-Za-z0-9._-]+\.sql|tests/cartera-030(cd|c|d)-[A-Za-z0-9._-]+\.mjs|scripts/ci/cartera-030cd-[A-Za-z0-9._-]+\.(mjs|sql)|docs/architecture/source-truth/FORGE_CARTERA_030CD_[A-Za-z0-9._-]+\.md|docs/evidence/FORGE_CARTERA_030CD_[A-Za-z0-9._-]+\.md|\.github/workflows/cartera-030cd-[A-Za-z0-9._-]+\.yml)$'
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || { echo "UNAUTHORIZED_030CD_PATH=$path" >&2; exit 1; }
          done
          echo 'SOURCE_ANCESTRY=PASS'
          echo 'BOUNDED_PATHS=PASS'
          echo 'PRODUCT_UI_MUTATION=YES_BOUNDED_TO_CARTERA'
          echo 'ACCOUNT_MUTATION=NOT_AUTHORIZED'

      - name: Run 030C authority gate
        shell: bash
        run: |
          set -euo pipefail
          node --check advisor-os/cartera/cartera-030c-confirmed-payment-reconciliation-service.js
          node --test \
            tests/cartera-030c-confirmed-payment-reconciliation-service-test.mjs \
            tests/cartera-030c-sql-contract-test.mjs
          echo 'CARTERA_030C_AUTHORITY_GATE=PASS'

      - name: Run 030D product gate
        shell: bash
        run: |
          set -euo pipefail
          node --check advisor-os/cartera/cartera-030d-policy-payment-calendar-service.js
          node --check advisor-os/cartera/cartera-030d-policy-payment-calendar-enhancement.js
          node --check platform/policy-intelligence/calendar/cartera-030d-policy-payment-calendar-view.js
          node --check app.js
          node --test \
            tests/cartera-030d-policy-payment-calendar-service-test.mjs \
            tests/cartera-030d-policy-payment-calendar-view-test.mjs \
            tests/cartera-030d-sql-contract-test.mjs \
            tests/cartera-030cd-ui-integration-test.mjs
          echo 'CARTERA_030D_PRODUCT_GATE=PASS'

      - name: Run inherited payment and Cartera gates
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/cartera-030b-*.mjs
          node tests/payment-evidence-packet-test.js
          node tests/payment-event-engine-test.js
          node --test tests/cartera-030a-policy-payment-calendar-scope-test.mjs
          echo 'INHERITED_PAYMENT_AND_CARTERA_GATES=PASS'

      - name: Execute combined remote acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$CARTERA_030CD_REMOTE_MUTATION_AUTHORIZED" = 'YES:CARTERA_030CD_REMOTE_MUTATION'
          test "$SUPABASE_PROJECT_REF" = 'rmlxigxysujsuwzgoimv'
          test -n "$SUPABASE_ACCESS_TOKEN"
          mkdir -p artifacts/cartera-030cd-remote-acceptance
          node --check scripts/ci/cartera-030cd-remote-acceptance.mjs
          node scripts/ci/cartera-030cd-remote-acceptance.mjs \
            | tee artifacts/cartera-030cd-remote-acceptance/workflow-output.log

      - name: Verify complete combined markers
        shell: bash
        run: |
          set -euo pipefail
          log=artifacts/cartera-030cd-remote-acceptance/workflow-output.log
          for marker in \
            CARTERA_030CD_REMOTE_DEPLOYMENT=PASS \
            CARTERA_030CD_CATALOG_VERIFICATION=PASS \
            AUTHORIZATION_DIGEST_COMPATIBILITY=PASS \
            CARTERA_030CD_TRANSACTIONAL_ACCEPTANCE=PASS \
            CONFIRMED_PAYMENT_EVENT_AUTHORITY=PASS \
            DETERMINISTIC_OBLIGATION_RECONCILIATION=PASS \
            CHANGED_EVENT_REPLAY_CONFLICT=PASS \
            SANITIZED_POLICY_PAYMENT_CALENDAR=PASS \
            RLS_CROSS_ADVISOR=PASS \
            DIRECT_WRITES=BLOCKED \
            NO_LAPSE_INFERENCE=PASS \
            TEST_FIXTURES_ROLLED_BACK=YES \
            RESIDUAL_FIXTURES=0 \
            CARTERA_030CD_REMOTE_ACCEPTANCE=PASS \
            CARTERA_030C_COMPLETE=YES \
            CARTERA_030D_COMPLETE=YES \
            CARTERA_030_COMPLETE=YES; do
            grep -q "$marker" "$log"
          done

      - name: Persist combined closure
        shell: bash
        run: |
          set -euo pipefail
          closure=docs/evidence/FORGE_CARTERA_030CD_REMOTE_ACCEPTANCE_CLOSURE_001.md
          cat > "$closure" <<EOF
          # FORGE CARTERA 030C + 030D — REMOTE ACCEPTANCE CLOSURE 001

          \`\`\`text
          STATUS=REMOTE_ACCEPTED
          WORKFLOW_RUN=${GITHUB_RUN_ID}
          WORKFLOW_ATTEMPT=${GITHUB_RUN_ATTEMPT}
          ACCEPTANCE_HEAD=${CARTERA_030CD_ACCEPTANCE_HEAD}
          PROJECT_REF=${SUPABASE_PROJECT_REF}
          MIGRATION_20260801000260=APPLIED_AND_MATCHED
          MIGRATION_20260801000261=APPLIED_AND_MATCHED
          CARTERA_030C_AUTHORITY_GATE=PASS
          CARTERA_030D_PRODUCT_GATE=PASS
          CONFIRMED_PAYMENT_EVENT_AUTHORITY=PASS
          DETERMINISTIC_OBLIGATION_RECONCILIATION=PASS
          SANITIZED_POLICY_PAYMENT_CALENDAR=PASS
          RLS_CROSS_ADVISOR=PASS
          DIRECT_WRITES=BLOCKED
          TEST_FIXTURES_ROLLED_BACK=YES
          RESIDUAL_FIXTURES=0
          PRODUCT_UI_MUTATION=YES_BOUNDED_TO_CARTERA
          ACCOUNT_MUTATION=NOT_AUTHORIZED
          CARTERA_030C_COMPLETE=YES
          CARTERA_030D_COMPLETE=YES
          CARTERA_030_COMPLETE=YES
          \`\`\`
          EOF
          git add "$closure"
          git commit -m 'docs(cartera): close combined 030C and 030D acceptance'
          git push origin HEAD:feature/cartera-030cd-payment-reconciliation-calendar-product
          echo 'CARTERA_030CD_CLOSURE=PERSISTED'

      - name: Upload combined evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartera-030cd-combined-remote-acceptance
          path: artifacts/cartera-030cd-remote-acceptance
          if-no-files-found: error
          retention-days: 30
