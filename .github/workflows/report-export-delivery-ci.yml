name: REP Export Delivery Adapters CI

on:
  push:
    branches:
      - feature/universal-reporting-kernel-foundation
    paths:
      - advisor-os/reporting/export/report-export-contract.mjs
      - advisor-os/reporting/export/json-report-export-adapter.mjs
      - advisor-os/reporting/export/csv-report-export-adapter.mjs
      - advisor-os/reporting/delivery/download-descriptor-delivery-adapter.mjs
      - tests/report-export-delivery-adapters-test.mjs
      - docs/architecture/reporting/REP-11_EXPORT_AND_DELIVERY_ADAPTERS.md
      - .github/workflows/report-export-delivery-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-delivery:
    name: Export and delivery adapters acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify REP-10 closure
        run: |
          grep -Fq             'REP_10_PIPELINE_REPORT_PROVIDER=CLOSED'             docs/architecture/reporting/REP-10_PIPELINE_REPORT_PROVIDER_CLOSURE.md

      - name: Verify Activity foundation
        run: node scripts/ci/verify-activity-foundation-freeze.mjs

      - name: Run export and delivery tests
        run: |
          node --test             --test-reporter=tap             tests/report-export-delivery-adapters-test.mjs             | tee REP11_EXPORT_DELIVERY.tap

          grep -Fq '# tests 55' REP11_EXPORT_DELIVERY.tap
          grep -Fq '# pass 55' REP11_EXPORT_DELIVERY.tap
          grep -Fq '# fail 0' REP11_EXPORT_DELIVERY.tap

      - name: Run domain provider regressions
        run: |
          node --test tests/pipeline-report-provider-test.mjs
          node --test tests/activity-report-provider-test.mjs
          node --test tests/portfolio-report-provider-test.mjs
          node --test tests/commissions-report-provider-test.mjs
          node --test tests/performance-report-provider-test.mjs

      - name: Run reporting regressions
        run: |
          node --test tests/report-comparison-engine-test.mjs
          node --test tests/universal-report-aggregation-runtime-test.mjs
          node --test tests/report-provider-runtime-test.mjs
          node --test tests/universal-period-resolver-test.mjs
          node --test tests/universal-reporting-kernel-test.mjs

      - name: Run Performance surface regression
        run: node --test tests/performance-surface-adapter-test.mjs

      - name: Verify repository hygiene
        run: git diff --check

      - name: Build acceptance evidence
        run: |
          mkdir -p artifacts/reporting

          cat > artifacts/reporting/REP11_ACCEPTANCE.txt <<EOF
          REP_11_EXPORT_AND_DELIVERY_ADAPTERS=IMPLEMENTED
          COMMIT=$GITHUB_SHA
          REMOTE_REP10_CLOSURE=PASS
          REMOTE_ACTIVITY_FREEZE=PASS
          REMOTE_EXPORT_DELIVERY_TEST=PASS
          REMOTE_DOMAIN_PROVIDER_REGRESSION=PASS
          REMOTE_REPORTING_REGRESSION=PASS
          REMOTE_PERFORMANCE_SURFACE_REGRESSION=PASS
          SUPPORTED_EXPORT_FORMATS=JSON,CSV
          RECALCULATION_AUTHORITY=NO
          COMPARISON_AUTHORITY=NO
          FILE_SYSTEM_WRITE=NO
          NETWORK_SEND=NO
          EMAIL_SEND=NO
          EOF

      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: rep-11-export-delivery-adapters-${{ github.sha }}
          path: artifacts/reporting
          if-no-files-found: error
