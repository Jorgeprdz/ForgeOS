name: Dispatch Aura preview to GitHub Pages

on:
  push:
    branches:
      - feature/aura-clean-runtime-productive-pipeline
    paths:
      - docs/static-preview/forge-aura/**
      - .github/workflows/aura-pages-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Pages workflow at Aura branch
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.ref.replace('refs/heads/', '');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pages.yml',
              ref,
            });
            core.info(`Dispatched pages.yml for ${ref}`);
