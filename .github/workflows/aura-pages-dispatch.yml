name: Guard Aura preview from production Pages deployment

on:
  push:
    branches:
      - feature/aura-clean-runtime-productive-pipeline
    paths:
      - docs/static-preview/forge-aura/**
      - .github/workflows/aura-pages-dispatch.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard-production-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm production Pages auto-dispatch is disabled
        run: |
          echo "AURA_PAGES_PRODUCTION_AUTO_DISPATCH=DISABLED"
          echo "PRODUCTION_PAGES_DEPLOYMENT_REQUIRES=EXPLICIT_MAIN_WORKFLOW_DISPATCH"
          echo "MERGE_DOES_NOT_IMPLY_DEPLOY=PASS"
