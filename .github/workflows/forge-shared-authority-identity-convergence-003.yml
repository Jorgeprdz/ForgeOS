name: Forge Shared Authority + Identity Convergence 003

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/static-preview/forge-aura/cartera/**'
      - 'platform/shared-commercial-model/**'
      - 'supabase/migrations/20260731000200_cartera010b_identity_policy_foundation.sql'
      - 'supabase/migrations/20260731000211_cartera010b_identity_resolution_rpc.sql'
      - 'tests/forge-shared-authority-identity-convergence-003.test.mjs'
      - 'docs/architecture/source-truth/FORGE_SHARED_AUTHORITY_AND_IDENTITY_CONVERGENCE_003.md'
      - 'docs/evidence/FORGE_SHARED_AUTHORITY_AND_IDENTITY_CONVERGENCE_003_*.md'
      - '.github/workflows/forge-shared-authority-identity-convergence-003.yml'

permissions:
  contents: read

concurrency:
  group: forge-shared-authority-identity-convergence-003-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authority-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact scope declaration
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^supabase/(functions|migrations)/' && ! printf '%s\n' "$changed" | grep -Eq '^supabase/migrations/(20260731000200_cartera010b_identity_policy_foundation|20260731000211_cartera010b_identity_resolution_rpc)\.sql$'; then
            echo 'UNAUTHORIZED_DATABASE_OR_EDGE_MUTATION=FAIL'
            exit 1
          fi
          echo 'PHASE_003_SCOPE_DIFF=PASS'
      - name: Syntax
        run: |
          node --check docs/static-preview/forge-aura/cartera/cartera-module-v4.js
          node --check docs/static-preview/forge-aura/cartera/cartera-adapter-pages-v10.js
          node --check platform/shared-commercial-model/crs-03-pipeline-person-convergence-contract.js
          node --check platform/shared-commercial-model/crs-08-unified-person-timeline-adapters.js
      - name: Phase 003 contract
        run: node --test tests/forge-shared-authority-identity-convergence-003.test.mjs
      - name: Existing 020C convergence regression
        run: node --test tests/cartera-020c-durable-attach-015.test.mjs
      - name: Existing Aura Cartera regression
        run: node --test tests/aura-cartera-productive-reconciliation.test.mjs
      - name: Relationship intelligence non-regression
        run: node --test tests/fip-pack-01-relationship-intelligence-foundation-test.mjs
      - name: Security boundary declaration
        run: |
          ! grep -RniE 'service_role|SUPABASE_SERVICE_ROLE' docs/static-preview/forge-aura/cartera/cartera-adapter-pages-v10.js
          ! grep -nE '\.(insert|update|delete)[[:space:]]*\(' docs/static-preview/forge-aura/cartera/cartera-adapter-pages-v10.js
          echo 'SERVICE_ROLE_BROWSER=NO'
          echo 'FRONTEND_CANONICAL_TABLE_WRITE=NO'
          echo 'AUTO_IDENTITY_MERGE=NO'
          echo 'SECURITY_ACCEPTANCE=PASS'
