name: Verify Public Pipeline Repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-public-pipeline-a060.yml

permissions:
  contents: read

jobs:
  verify-public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: a060fde0b5b2f38e0912f54f47dc4f141c21e45c
      PUBLIC_ROOT: https://jorgeprdz.github.io/ForgeOS
      PUBLIC_APP: https://jorgeprdz.github.io/ForgeOS/static-preview/forge-alive/
      EVIDENCE_DIR: artifacts/public-pipeline-a060

    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          ref: a060fde0b5b2f38e0912f54f47dc4f141c21e45c
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for exact Pages build
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          matched=0
          for attempt in $(seq 1 60); do
            probe="${PUBLIC_ROOT}/build-info.json?run=${GITHUB_RUN_ID}&attempt=${attempt}"
            if curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$probe" -o "$EVIDENCE_DIR/build-info.json"; then
              deployed_sha="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR+'/build-info.json','utf8'));process.stdout.write(x.commitSha||'')")"
              if [ "$deployed_sha" = "$EXPECTED_SHA" ]; then
                matched=1
                break
              fi
            fi
            sleep 10
          done
          test "$matched" -eq 1
          echo "PUBLIC_BUILD_SHA=$EXPECTED_SHA"

      - name: Audit deployed Pipeline assets
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR/public-assets"
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${PUBLIC_APP}?verify=${GITHUB_RUN_ID}" -o "$EVIDENCE_DIR/public-assets/index.html"
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${PUBLIC_APP}pipeline-module.js?verify=${GITHUB_RUN_ID}" -o "$EVIDENCE_DIR/public-assets/pipeline-module.js"
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${PUBLIC_APP}pipeline-productive-intelligence-adapter.js?verify=${GITHUB_RUN_ID}" -o "$EVIDENCE_DIR/public-assets/pipeline-productive-intelligence-adapter.js"
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${PUBLIC_APP}pipeline-referral-modal.css?verify=${GITHUB_RUN_ID}" -o "$EVIDENCE_DIR/public-assets/pipeline-referral-modal.css"
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${PUBLIC_APP}pipeline-interaction-authority.js?verify=${GITHUB_RUN_ID}" -o "$EVIDENCE_DIR/public-assets/pipeline-interaction-authority.js"

          node - <<'NODE' | tee "$EVIDENCE_DIR/public-assets-audit.log"
          const assert = require('assert');
          const fs = require('fs');
          const base = process.env.EVIDENCE_DIR + '/public-assets';
          const index = fs.readFileSync(`${base}/index.html`, 'utf8');
          const pipeline = fs.readFileSync(`${base}/pipeline-module.js`, 'utf8');
          const adapter = fs.readFileSync(`${base}/pipeline-productive-intelligence-adapter.js`, 'utf8');
          const modalCss = fs.readFileSync(`${base}/pipeline-referral-modal.css`, 'utf8');
          const authority = fs.readFileSync(`${base}/pipeline-interaction-authority.js`, 'utf8');

          assert.ok(index.includes('app.js?v=ui-m04-shell-007&fix=pipeline-mobile-interaction-001'));
          assert.ok(pipeline.includes('pipeline-referral-modal.css?v=ui-m06-referral-004&fix=005'));
          assert.ok(pipeline.includes('pipeline-productive-intelligence-adapter.js?v=material3-productive-002'));
          assert.ok(adapter.includes('reconcileUpdatedProspectState'));
          assert.ok(adapter.includes('PRODUCTIVE_STAGE_PERSISTENCE_MISMATCH'));
          assert.ok(authority.includes('pipelineInteractionAuthority'));
          assert.ok(!/\.pipeline-module__card-actions\s*\{[^}]*display:\s*flex/s.test(modalCss));
          assert.ok(!/\.pipeline-module__card-actions button,\s*\.pipeline-module__card-actions a\s*\{/s.test(modalCss));

          console.log('PUBLIC_PIPELINE_ASSETS=PASS');
          console.log('PUBLIC_LATE_MODAL_GRID_OVERRIDE=ABSENT');
          console.log('PUBLIC_STAGE_MUTATION_AUTHORITY=PASS');
          NODE

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Click buttons and change state using public assets
        shell: bash
        env:
          FORGE_PIPELINE_TEST_BASE_URL: https://jorgeprdz.github.io/ForgeOS/static-preview/forge-alive/
        run: |
          node tests/pipeline-real-interaction-regression.mjs 2>&1 | tee "$EVIDENCE_DIR/public-pipeline-interaction.log"

      - name: Enforce focused public result
        shell: bash
        run: |
          grep -F 'PIPELINE_BUTTON_GEOMETRY_AFTER_INTERACTION=STABLE' "$EVIDENCE_DIR/public-pipeline-interaction.log"
          grep -F 'PIPELINE_CONFIRMED_STAGE_AFTER_DELAY=PERSISTED' "$EVIDENCE_DIR/public-pipeline-interaction.log"
          echo 'PUBLIC_PIPELINE_INTERACTION_SMOKE=PASS'

      - name: Upload public verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-pipeline-a060-${{ github.run_id }}
          path: artifacts/public-pipeline-a060
          if-no-files-found: error
          retention-days: 14
