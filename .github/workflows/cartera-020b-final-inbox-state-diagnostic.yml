name: CARTERA 020B Final Inbox State Diagnostic

on:
  pull_request:
    branches:
      - feature/cartera-020b-persistent-evidence-worker-parser-registry
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartera-020b-final-inbox-state-diagnostic
  cancel-in-progress: true

jobs:
  transactional-final-state-diagnostic:
    if: github.repository == 'Jorgeprdz/ForgeOS'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: rmlxigxysujsuwzgoimv
      CARTERA_020B_REMOTE_MUTATION_AUTHORIZED: YES:CARTERA_020B_REMOTE_MUTATION

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Diagnostic source gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$SUPABASE_PROJECT_REF" = 'rmlxigxysujsuwzgoimv'
          test "$CARTERA_020B_REMOTE_MUTATION_AUTHORIZED" = 'YES:CARTERA_020B_REMOTE_MUTATION'
          node --check scripts/ci/cartera-020b-final-inbox-state-diagnostic.mjs
          node --test tests/cartera-020b-final-inbox-state-diagnostic-test.mjs
          mkdir -p artifacts/cartera-020b-final-inbox-state-diagnostic
          echo 'DIAGNOSTIC_MODE=TRANSACTIONAL_ROLLBACK'

      - name: Execute rollback-only final-state diagnostic
        run: |
          node scripts/ci/cartera-020b-final-inbox-state-diagnostic.mjs \
            | tee artifacts/cartera-020b-final-inbox-state-diagnostic/workflow-output.log

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartera-020b-final-inbox-state-diagnostic
          path: artifacts/cartera-020b-final-inbox-state-diagnostic
          if-no-files-found: error
          retention-days: 14
