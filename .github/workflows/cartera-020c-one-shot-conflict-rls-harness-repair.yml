name: CARTERA 020C One-Shot Conflict RLS Harness Repair

on:
  pull_request:
    branches: [main]
    types: [opened]
    paths:
      - docs/evidence/CARTERA_020C_CONFLICT_RLS_HARNESS_REPAIR_AUTHORIZATION_20260731T1754-0600.md

permissions:
  contents: write

concurrency:
  group: cartera-020c-one-shot-conflict-rls-harness-repair
  cancel-in-progress: false

jobs:
  repair-harness-and-resume:
    if: >-
      github.repository == 'Jorgeprdz/ForgeOS' &&
      github.event.action == 'opened' &&
      github.event.pull_request.head.ref == 'run/cartera-020c-conflict-rls-harness-repair-20260731-1754' &&
      github.event.pull_request.head.sha == '23c994aec59b7a97ce6b52fe1a18190cf391e985' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARTERA_020C_REMOTE_MUTATION_AUTHORIZED: YES:CARTERA_020C_REMOTE_MUTATION
      CARTERA_020C_EXPECTED_SOURCE_HEAD: 0daaccd556659b997f2086e12b09481281d1b019
      CARTERA_020C_EXPECTED_ACCEPTANCE_HEAD: c845852aeba82120a9fb1b3e9510e0c321156879
      CARTERA_020C_ACCEPTANCE_BRANCH: feature/cartera-020c-remote-acceptance
      SUPABASE_PROJECT_REF: rmlxigxysujsuwzgoimv
      AUTHORIZATION_MARKER: docs/evidence/CARTERA_020C_CONFLICT_RLS_HARNESS_REPAIR_AUTHORIZATION_20260731T1754-0600.md

    steps:
      - name: Checkout exact harness repair authorization
        uses: actions/checkout@v4
        with:
          ref: 23c994aec59b7a97ce6b52fe1a18190cf391e985
          fetch-depth: 0

      - name: Validate exact rollback-only harness repair authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_HEAD_REF" = 'run/cartera-020c-conflict-rls-harness-repair-20260731-1754'
          test -f "$AUTHORIZATION_MARKER"
          grep -qx 'USER_AUTHORIZATION=REPAIR_CONFLICT_RLS_HARNESS_AND_RESUME_CARTERA_020C' "$AUTHORIZATION_MARKER"
          grep -qx 'PRIOR_RUN=30673957933' "$AUTHORIZATION_MARKER"
          grep -qx 'PRIOR_JOB=91297258355' "$AUTHORIZATION_MARKER"
          grep -qx 'PRIOR_ARTIFACT=8809770101' "$AUTHORIZATION_MARKER"
          grep -qx 'PRIOR_FAILURE=CARTERA020C_CHANGED_INPUT_CONFLICT_NOT_PERSISTED' "$AUTHORIZATION_MARKER"
          grep -qx 'ACCEPTANCE_HEAD=c845852aeba82120a9fb1b3e9510e0c321156879' "$AUTHORIZATION_MARKER"
          grep -qx 'REPAIR_SCOPE=ROLLBACK_ONLY_TEMPORARY_OWNER_RLS_SELECT' "$AUTHORIZATION_MARKER"
          test "$(git diff --name-only HEAD^ HEAD)" = "$AUTHORIZATION_MARKER"
          echo 'ONE_SHOT_CONFLICT_RLS_HARNESS_REPAIR_AUTHORIZATION=PASS'

      - name: Checkout exact accepted remote branch
        uses: actions/checkout@v4
        with:
          ref: feature/cartera-020c-remote-acceptance
          fetch-depth: 0

      - name: Apply bounded rollback-only RLS verification repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'c845852aeba82120a9fb1b3e9510e0c321156879'
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci/cartera-020c-remote-acceptance.sql')
          text = path.read_text(encoding='utf-8')
          old = """  execute 'reset role';
          select count(*) into row_count
          from public.cartera020c_confirmation_conflicts
          where advisor_id = user_a
            and review_reference = conflict_review_reference
            and conflict_type = 'CHANGED_INPUT_REPLAY';
          if row_count <> 1 then
            raise exception 'CARTERA020C_CHANGED_INPUT_CONFLICT_NOT_PERSISTED';
          end if;
          """
          new = """  execute 'reset role';
          execute 'grant select on public.cartera020c_confirmation_conflicts to authenticated';
          perform set_config('request.jwt.claim.sub', user_a::text, true);
          perform set_config('request.jwt.claim.role', 'authenticated', true);
          execute 'set local role authenticated';
          select count(*) into row_count
          from public.cartera020c_confirmation_conflicts
          where advisor_id = user_a
            and review_reference = conflict_review_reference
            and conflict_type = 'CHANGED_INPUT_REPLAY'
            and conflict_reference = conflict_status ->> 'conflictReference';
          execute 'reset role';
          execute 'revoke select on public.cartera020c_confirmation_conflicts from authenticated';
          if row_count <> 1 then
            raise exception 'CARTERA020C_CHANGED_INPUT_CONFLICT_NOT_PERSISTED:COUNT:%', row_count;
          end if;
          """
          if text.count(old) != 1:
              raise SystemExit(f'UNEXPECTED_CONFLICT_VERIFICATION_BLOCK_COUNT:{text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

          test_path = Path('tests/cartera-020c-conflict-rls-verification-test.mjs')
          test_path.write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const sql = readFileSync(
            new URL('../scripts/ci/cartera-020c-remote-acceptance.sql', import.meta.url),
            'utf8',
          );

          test('conflict persistence is verified as the owning advisor under forced RLS', () => {
            assert.match(sql, /grant select on public\\.cartera020c_confirmation_conflicts to authenticated/);
            assert.match(sql, /set_config\\('request\\.jwt\\.claim\\.sub', user_a::text, true\\)/);
            assert.match(sql, /set local role authenticated/);
            assert.match(sql, /conflict_reference = conflict_status ->> 'conflictReference'/);
            assert.match(sql, /revoke select on public\\.cartera020c_confirmation_conflicts from authenticated/);
          });

          test('temporary conflict read authority is rollback-only and cannot become product authority', () => {
            assert.match(sql, /^begin;/m);
            assert.match(sql, /rollback;\\s*$/);
            const grantIndex = sql.indexOf("grant select on public.cartera020c_confirmation_conflicts to authenticated");
            const revokeIndex = sql.indexOf("revoke select on public.cartera020c_confirmation_conflicts from authenticated");
            assert.ok(grantIndex >= 0 && revokeIndex > grantIndex);
            assert.doesNotMatch(sql, /grant (insert|update|delete) on public\\.cartera020c_confirmation_conflicts/i);
          });
          """, encoding='utf-8')
          PY

          mapfile -t changed < <(git diff --name-only)
          printf 'HARNESS_REPAIR_CHANGED_FILE=%s\n' "${changed[@]}"
          expected=$'scripts/ci/cartera-020c-remote-acceptance.sql\ntests/cartera-020c-conflict-rls-verification-test.mjs'
          test "$(printf '%s\n' "${changed[@]}" | sort)" = "$expected"
          git diff --check
          grep -q '^begin;' scripts/ci/cartera-020c-remote-acceptance.sql
          grep -q '^rollback;' scripts/ci/cartera-020c-remote-acceptance.sql
          echo 'BOUNDED_ROLLBACK_ONLY_RLS_HARNESS_REPAIR=PASS'

      - name: Commit repaired acceptance harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'forge-cartera-remote-acceptance'
          git config user.email 'forge-cartera-remote-acceptance@users.noreply.github.com'
          git add \
            scripts/ci/cartera-020c-remote-acceptance.sql \
            tests/cartera-020c-conflict-rls-verification-test.mjs
          git commit -m 'test(cartera): verify conflict persistence under owner RLS'
          git push origin HEAD:feature/cartera-020c-remote-acceptance
          repaired_head="$(git rev-parse HEAD)"
          echo "CARTERA_020C_EXPECTED_ACCEPTANCE_HEAD=$repaired_head" >> "$GITHUB_ENV"
          echo "REPAIRED_ACCEPTANCE_HEAD=$repaired_head" >> "$GITHUB_ENV"
          echo "REPAIRED_ACCEPTANCE_HEAD=$repaired_head"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repository and RLS harness gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REPAIRED_ACCEPTANCE_HEAD"
          git merge-base --is-ancestor "$CARTERA_020C_EXPECTED_SOURCE_HEAD" HEAD
          node --check scripts/ci/cartera-020c-conflict-constraint-name-hardening-deploy.mjs
          node --check scripts/ci/cartera-020c-github-actions-remote-acceptance.mjs
          node --check tests/cartera-020c-conflict-rls-verification-test.mjs
          node --test tests/cartera-020c-*.mjs
          echo 'CARTERA020C_CONFLICT_RLS_HARNESS_GATE=PASS'

      - name: Verify deployed 00240 remains matched
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          mkdir -p artifacts/cartera-020c-remote-acceptance
          node scripts/ci/cartera-020c-conflict-constraint-name-hardening-deploy.mjs \
            | tee artifacts/cartera-020c-remote-acceptance/conflict-constraint-name-hardening-output.log
          grep -q 'MIGRATION_20260731000240=ALREADY_APPLIED_AND_MATCHED' \
            artifacts/cartera-020c-remote-acceptance/conflict-constraint-name-hardening-output.log
          grep -q 'CARTERA020C_CONFLICT_CONSTRAINT_NAME_HARDENING=PASS' \
            artifacts/cartera-020c-remote-acceptance/conflict-constraint-name-hardening-output.log

      - name: Resume transactional remote acceptance
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          GITHUB_SHA="$REPAIRED_ACCEPTANCE_HEAD" \
            node scripts/ci/cartera-020c-github-actions-remote-acceptance.mjs \
            | tee artifacts/cartera-020c-remote-acceptance/workflow-output.log

      - name: Verify acceptance markers
        shell: bash
        run: |
          set -euo pipefail
          log=artifacts/cartera-020c-remote-acceptance/workflow-output.log
          for marker in \
            CARTERA_020C_REMOTE_DEPLOYMENT=PASS \
            AUTHORIZATION_DIGEST_COMPATIBILITY=PASS \
            CARTERA_020C_TRANSACTIONAL_ACCEPTANCE=PASS \
            AUTHORIZATION_DIGEST_BINDING=PASS \
            IDENTITY_ORDERED_EXECUTION=PASS \
            IDENTITY_READ_AFTER_WRITE=PASS \
            POLICY_READ_AFTER_WRITE=PASS \
            CHANGED_INPUT_CONFLICT=PASS \
            RETRY_GOVERNANCE=PASS \
            PARALLEL_STATE_VERSION_SERIALIZATION=PASS \
            RLS_CROSS_ADVISOR=PASS \
            DIRECT_WRITES=BLOCKED \
            SANITIZED_STATUS=PASS \
            TEST_FIXTURES_ROLLED_BACK=YES \
            CONCURRENCY_FIXTURES_CLEANED=YES \
            RESIDUAL_FIXTURES=0 \
            CARTERA_020C_REMOTE_ACCEPTANCE=PASS; do
            grep -q "$marker" "$log"
          done

      - name: Upload RLS harness repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartera-020c-remote-acceptance-conflict-rls-harness-repair
          path: artifacts/cartera-020c-remote-acceptance
          if-no-files-found: warn
          retention-days: 30
