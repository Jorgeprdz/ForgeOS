    (() => {
      const auraRoot = document.querySelector("[data-aura-app]");
      if (!auraRoot) return;
      auraRoot.addEventListener("change", event => {
        const input = event.target;
        if (!(input instanceof HTMLInputElement)) return;
        if (!input.matches("[data-quotes-file]")) return;
        // The Aura Quotes input is owned by quotes-module.js. Stop the event at
        // the Aura root only after target listeners have run so the legacy
        // document-level PDF interceptor cannot hijack the same selection.
        event.stopPropagation();
      });
    })();
  </script>
