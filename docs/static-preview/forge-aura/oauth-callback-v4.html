<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f5fb">
  <title>Forge · Acceso</title>
  <link rel="stylesheet" href="./aura-tokens.css">
  <link rel="stylesheet" href="./aura-auth.css">
  <script src="./env.js?v=e0d98cba"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2.108.2/dist/umd/supabase.js"></script>
  <script type="module" src="./oauth-callback-v4.js"></script>
</head>
<body>
  <main class="aura-auth-callback" data-oauth-callback data-aura-auth-state="AUTH_LOADING">
    <section class="aura-auth-callback__panel" aria-live="polite" aria-labelledby="oauth-title">
      <div class="aura-auth-brand aura-auth-brand--compact" aria-label="Forge">
        <span class="aura-auth-brand__mark" aria-hidden="true">F</span>
        <strong>Forge</strong>
      </div>
      <div class="aura-auth-callback__status" aria-hidden="true"><span></span></div>
      <h1 id="oauth-title">Completando tu acceso…</h1>
      <p data-oauth-status>Validando tu acceso seguro…</p>
      <a class="aura-auth-return" href="./index.html?route=inicio" data-oauth-return hidden>Volver a Forge</a>
    </section>
  </main>
</body>
</html>
