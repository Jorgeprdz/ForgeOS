<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06101f">
  <title>Forge Alive — Cotizaciones M05E-006</title>
</head>
<body>
  <p style="font-family:system-ui;padding:24px">Cargando Cotizaciones M05E-006…</p>
  <script>
    (async () => {
      const response = await fetch(
        `./index.html?source=quote-calculator-parity-009&ts=${Date.now()}`,
        { cache: "no-store" },
      );
      if (!response.ok) throw new Error(`INDEX_LOAD_FAILED_${response.status}`);
      let html = await response.text();
      html = html.replace(
        /<script\s+type="module"\s+src="\.\/app\.js[^"]*"><\/script>/,
        '<script type="module" src="./app.js?v=quote-calculator-parity-009"><\/script>',
      );
      html = html.replace(
        "</body>",
        `<script>
          document.documentElement.dataset.quoteCalculatorLoader = "M05E-006";
          document.documentElement.dataset.vidaMujerHandoff = "M05E-009";
          const badge = document.createElement("div");
          badge.dataset.quoteCalculatorVersionBadge = "M05E-006";
          badge.textContent = "CALCULADORAS M05E-006";
          badge.style.cssText = "position:fixed;right:12px;bottom:12px;z-index:99999;padding:7px 10px;border:1px solid rgba(255,201,95,.55);border-radius:999px;background:#071426;color:#ffd47a;font:700 11px system-ui;letter-spacing:.08em;box-shadow:0 8px 30px rgba(0,0,0,.35)";
          document.body.append(badge);
        <\/script></body>`,
      );
      document.open();
      document.write(html);
      document.close();
    })().catch((error) => {
      document.body.innerHTML = `<pre role="alert" style="white-space:pre-wrap;padding:24px">${error.message}</pre>`;
    });
  </script>
</body>
</html>
