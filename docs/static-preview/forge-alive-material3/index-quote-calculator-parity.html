<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06101f">
  <title>Forge Alive — Cotizaciones M05E-002</title>
</head>
<body>
  <p style="font-family:system-ui;padding:24px">Cargando Cotizaciones M05E-002…</p>
  <script>
    (async () => {
      const response = await fetch(
        `./index.html?source=quote-calculator-parity-002&ts=${Date.now()}`,
        { cache: "no-store" },
      );
      if (!response.ok) throw new Error(`INDEX_LOAD_FAILED_${response.status}`);
      let html = await response.text();
      html = html.replace(
        /<script\s+type="module"\s+src="\.\/app\.js[^"]*"><\/script>/,
        '<script type="module" src="./app.js?v=quote-calculator-parity-002"><\/script>',
      );
      html = html.replace(
        "</body>",
        '<script>document.documentElement.dataset.quoteCalculatorLoader="M05E-002";<\/script></body>',
      );
      document.open();
      document.write(html);
      document.close();
    })().catch((error) => {
      document.body.innerHTML = `<pre role="alert" style="white-space:pre-wrap;padding:24px">${error.message}</pre>`;
    });
  </script>
</body>
</html>
