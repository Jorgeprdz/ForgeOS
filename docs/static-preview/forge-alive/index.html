<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06101f">
  <meta name="robots" content="noindex">
  <title>ForgeOS</title>
  <script>
    /* FORGE_CANONICAL_ENTRY_BRIDGE_V2 */
    (() => {
      const current = new URL(window.location.href);
      const targetPath = current.pathname.includes('/forge-alive-runtime/')
        ? '../forge-alive/'
        : '../forge-alive-material3/';
      const target = new URL(targetPath, current);

      for (const [key, value] of current.searchParams.entries()) {
        target.searchParams.append(key, value);
      }

      target.searchParams.set('nav', current.searchParams.get('nav') || 'inicio');
      const authReturn = current.searchParams.get('auth_return');
      const cacheAuthority = authReturn
        ? `auth-${authReturn}`
        : current.searchParams.get('v') || 'canonical-entry-20260803';
      target.searchParams.set('v', cacheAuthority);
      target.hash = current.hash;
      window.location.replace(target.href);
    })();
  </script>
</head>
<body>
  <p>Abriendo ForgeOS…</p>
</body>
</html>
